Библия, Синодалното издание, я брои сред „неканоничните“ книги, които се четат за душевна полза; протестантските Библии я нямат. На Запад тя станала известна с латинското име „Еклесиастикус“, което значи „църковна книга“ — книгата на Църквата.\u003c/p>","context":"\u003cp>Пророците са замлъкнали, а Светата земя е под властта на гръцки владетели. Езикът, училищата и обичаите на гърците привличат младите, и мнозина започват да се срамуват от вярата на бащите си. Малко преди гонението, за което ще четеш в книгите Макавейски, един възрастен човек, който е пътувал, чел и се молил много, събира наученото в една книга от 51 глави. Не изнася лекция; говори на младите като баща: „Синко!“. На картата на Писанието той стои до Притчи Соломонови и ги продължава, чак до прага на Новия Завет.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Страхът Господен\u003c/strong> — Той е началото, пълнотата и венецът на премъдростта (глава 1).\u003c/li>\u003cli>\u003cstrong>Почитта към родителите\u003c/strong> — Който почита майка си, е „като оня, който придобива съкровища“ (3:4); грижата за старите родители не се забравя пред Бога (глава 3).\u003c/li>\u003cli>\u003cstrong>Приятелството\u003c/strong> — „Верен приятел — яка защита: който го е намерил, намерил е съкровище“ (6:14).\u003c/li>\u003cli>\u003cstrong>Пазенето на езика и прошката\u003c/strong> — „Прости на ближния си обидата, и тогава, след като се помолиш, ще ти се простят греховете“ (28:2).\u003c/li>\u003cli>\u003cstrong>Похвалата на отците\u003c/strong> — От Енох и Авраам до първосвещеника Симон историята се чете като редица от Божии хора (глави 44–50).\u003c/li>\u003c/ul>","hristos":"\u003cp>В глава 24 Премъдростта говори за себе си: „аз излязох от устата на Всевишния“ (24:3), търсила е покой сред народите, и Създателят ѝ заповядал да разпъне шатрата си в Иаков. Евангелист Иоан казва същото за Сина Божий: „И Словото стана плът, и живя между нас“ (Иоан 1:14). Премъдростта зове хората при себе си и ги храни с плодовете си; Христос казва: „Дойдете при Мене всички отрудени и обременени“ и ги кани да вземат Неговото иго (Матей 11:28-29) — а в края на книгата мъдрецът подканва учениците си да сложат шията си под игото на премъдростта (глава 51). А словото за прошката от глава 28 ще го разпознаеш в молитвата „Отче наш“: „и прости нам дълговете ни, както и ние прощаваме на длъжниците си“ (Матей 6:12).\u003c/p>","parinti":"\u003cp>Отците са използвали тази книга най-вече като книга за поучение в живота. Св. Атанасий Велики, в празничното си послание за книгите на Писанието, я поставя сред онези, които са определени да се четат от новоприходящите във вярата — оттам и латинското име „църковна книга“. Климент Александрийски в „Педагог“ я цитира непрекъснато, когато учи християните как да се държат на трапезата, в разговора и у дома. Св. Иоан Златоуст често привежда думите ѝ в беседите си, най-вече за милостинята, за пазенето на езика и за възпитанието на децата. Тя не е книга на големите спорове, а на всекидневния живот.\u003c/p>","slujbe":"\u003cp>Книгата на Иисус, син Сирахов, не се чете на богослуженията на Църквата: няма да чуеш от нея паремии (откъсите от Стария Завет, които се четат на вечернята). Нейното място винаги е било поучението: в катехизиса, в проповедта и в съвета на духовния отец често ще чуеш думи, които идват оттук — за родителите, за приятелите, за милостинята и за пазенето на езика. Тя е добра книга за четене у дома, по една глава на ден.\u003c/p>","rugaciune":"\u003cp>Господи, Отче и Владико на живота ми, не ме оставяй на волята на помислите ми. Сложи стража на устата ми и Твоя страх в сърцето ми. Научи ме да почитам родителите си, да бъда верен приятел и да прощавам, за да ми бъде простено. И когато пристъпвам да Ти служа, приготви душата ми за изкушението и ме задръж близо до Себе Си. Амин.\u003c/p>"},"q":[{"q":"Кой е превел книгата на гръцки?","o":["Внукът на автора, в Египет","Цар Соломон","Пророк Иеремия"]},{"q":"Какво означава латинското име „Еклесиастикус“, с което книгата станала известна?","o":["Книга на Църквата, за поучение на вярващите","Книга за царете на Израил","Книга за края на света"]}]}},{"n":47,"slug":"1-makaveyska","abbr":"1 Мак","cap":16,"s":"nekanonichni","dk":true,"bg":{"nume":"Първа книга Макавейска","scurt":"Когато един езически цар осквернява храма, свещеникът Мататия и синовете му се изправят да защитят Закона и вярата на бащите.","verset":{"t":"„Не от голямата войска зависи победата във война, но от небето дохожда силата“","r":"1 Макавейска 3:19"},"incepe":"1 Макавейска 1–4","p":{"autor":"\u003cp>Авторът не казва името си. Той е благочестив иудеин от Светата земя, който е познавал добре местата и събитията и е писал на еврейски към края на II век пр. Хр.; блажени Иероним казва, че е виждал книгата още на този език. До нас тя е стигнала на гръцки, в превода на Седемдесетте. Нашата Библия, Синодалното издание, я брои сред „неканоничните“ книги, които се четат за душевна полза; протестантските Библии я нямат. Има 16 глави.\u003c/p>","context":"\u003cp>На картата на Писанието това е мостът между пророците и Евангелието. След Александър Велики Светата земя минава под властта на гръцки царе. Един от тях, Антиох Епифан, решава, че всички народи трябва да имат един закон: забранява обрязването и пазенето на съботата, изгаря книгите на Закона и поставя идол върху жертвеника на храма (167 г. пр. Хр.). В селото Модин старият свещеник Мататия отказва да принесе жертва на идолите и се оттегля в планините с петимата си синове. Иуда, наречен Макавей, очиства храма и го осветява отново; след него воюва Ионатан, а после Симон, в чиито дни народът отново намира свободата си. Книгата обхваща около четиридесет години.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Верността към Закона\u003c/strong> — Мнозина предпочели да умрат, вместо да престъпят светия завет.\u003c/li>\u003cli>\u003cstrong>Ревността за Бога\u003c/strong> — Мататия казва: дори всички народи да се покорят на царя, аз и синовете ми ще вървим в завета на нашите бащи.\u003c/li>\u003cli>\u003cstrong>Надеждата не е в числото\u003c/strong> — Преди битката Иуда пости и се моли с малката си войска.\u003c/li>\u003cli>\u003cstrong>Очищението на храма\u003c/strong> — Оскверненият жертвеник е съграден отново, и радостта трае осем дни (глава 4).\u003c/li>\u003cli>\u003cstrong>Примерът на отците\u003c/strong> — На смъртното си легло Мататия напомня на синовете си Авраам, Иосиф, Давид, Илия, тримата момци и Даниил (2:51-60).\u003c/li>\u003c/ul>","hristos":"\u003cp>Празникът, който Иуда установил за новото освещаване на храма, е онзи, на който намираме Спасителя в Евангелието: „И настана тогава в Иерусалим празник Обновление, и зима беше“, а Иисус ходел в храма, в притвора Соломонов, и казвал: „Аз и Отец едно сме“ (Иоан 10:22-30). Истинският храм вече стоеше сред тях. Два пъти книгата свидетелства, че народът чака верен пророк, който да покаже какво трябва да се направи (1 Макавейска 4:46; 14:41): това очакване намира отговора си в Христос. А свободата, извоювана с меч, трае кратко; Господ ще донесе друга, като казва: „Моето царство не е от тоя свят“ (Иоан 18:36). Когато говори за „мерзостта на запустението“ (Матей 24:15), Той напомня тъкмо онези времена.\u003c/p>","parinti":"\u003cp>За тази книга Отците са писали малко. Блажени Августин в „За Божия град“ казва, че Църквата пази книгите Макавейски заради чудните страдания на някои мъченици, които преди идването на Христос се подвизавали до смърт за Божия Закон. Св. Киприан Картагенски, като укрепява гонените християни, привежда думите на Мататия към синовете му да не се боят от заплахите на грешния човек. Големите похвални слова на св. Григорий Богослов и на св. Иоан Златоуст се отнасят до седемте братя мъченици, с майка им и стареца Елеазар, чието мъченичество разказва Втора книга Макавейска.\u003c/p>","slujbe":"\u003cp>Първа книга Макавейска не се чете на богослуженията на Църквата. В църковния календар на 1 август се почитат светите седем мъченици Макавейски, с майка им Соломония и учителя им Елеазар — но тяхната история ще намериш в следващата книга. Тук четеш рамката на онова гонение и научаваш откъде идва празникът Обновление на храма, за който говори Евангелието от Иоана.\u003c/p>","rugaciune":"\u003cp>Господи, Боже на отците ни, от Тебе идва силата, а не от множеството. Когато светът ми иска да се отрека от Твоя завет, дай ми ревността на Мататия и надеждата на Иуда. Очисти храма на сърцето ми от всичко, с което съм оставил да бъде осквернен, и запали отново в него Своята светлина. Амин.\u003c/p>"},"q":[{"q":"Кой започна съпротивата срещу заповедта на цар Антиох?","o":["Свещеникът Мататия, заедно с петимата си синове","Пророк Даниил","Цар Соломон"]},{"q":"Какво направи Иуда Макавей след първите победи?","o":["Очисти храма в Иерусалим и го освети отново","Съгради нов храм в Египет","Стана цар на мястото на Антиох"]}]}},{"n":48,"slug":"2-makaveyska","abbr":"2 Мак","cap":15,"s":"nekanonichni","dk":true,"bg":{"nume":"Втора книга Макавейска","scurt":"Старецът Елеазар, седем братя и тяхната майка избират смъртта вместо отричането от вярата и изповядват възкресението на мъртвите.","verset":{"t":"„Царят на света ще възкреси за живот вечен нас, умрелите за Неговите закони“","r":"2 Макавейска 7:9"},"incepe":"2 Макавейска 6:18-31 · 7 · 12:38-45","p":{"autor":"\u003cp>Авторът не казва името си. Самият той свидетелства, че е събрал в една книга петте книги на Иасон Киринейски (2 Макавейска 2:24), учен иудеин, чието съчинение не е запазено. Книгата е написана на гръцки, към края на II век пр. Хр. Нашата Библия, Синодалното издание, я брои сред „неканоничните“ книги: четат се за душевна полза, запазени са в превода на Седемдесетте, но ги няма в протестантските Библии.\u003c/p>","context":"\u003cp>Книгата не е продължение на Първа книга Макавейска, а същото време, видяно от друг ъгъл: годините 175–161 пр. Хр. Народът отдавна се е върнал от вавилонския плен, а Светата земя е минала под властта на гръцките царе на Сирия. Цар Антиох IV Епифан иска да угаси вярата на Израил: осквернява храма в Иерусалим, забранява обрязването и пазенето на съботата и принуждава иудеите да ядат от жертвите на идолите. Някои се отричат от вярата. Други понасят мъчения и смърт. После Иуда Макавей събира войска, побеждава и очиства храма. До Рождество на Спасителя остава около век и половина.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Мъченичеството\u003c/strong> — Старецът Елеазар, седемте братя и майка им показват, че е по-добре да умреш, отколкото да се отречеш от Бога.\u003c/li>\u003cli>\u003cstrong>Възкресението на мъртвите\u003c/strong> — Малко места в Стария Завет свидетелстват толкова ясно, колкото глава 7, надеждата, че Бог ще възкреси телата от смъртта.\u003c/li>\u003cli>\u003cstrong>Молитвата за починалите\u003c/strong> — Иуда праща в Иерусалим жертва за падналите войници, за да им се прости грехът (2 Макавейска 12:43-45).\u003c/li>\u003cli>\u003cstrong>Бог, Създател на всичко\u003c/strong> — Майката напомня на синовете си, че Бог е сътворил небето и земята „от нищо“ (2 Макавейска 7:28).\u003c/li>\u003cli>\u003cstrong>Наказанието като вразумяване\u003c/strong> — Страданията на народа не са изоставяне, а възпитание от един Отец, Който иска да го върне (2 Макавейска 6:12-16).\u003c/li>\u003c/ul>","hristos":"\u003cp>Книгата не съдържа конкретно пророчество за Месията, но подготвя сърцето за Него. Мъчениците ѝ умират с надеждата, че Бог ще ги възкреси от мъртвите; във възкръсналия Христос тази надежда получава основа, защото Той е „начатък“ на умрелите (1 Коринтяни 15:20). Посланието до евреите си спомня за тях, без да ги назовава, сред онези, които „бяха измъчени, като не приеха да бъдат освободени, за да получат по-добро възкресение“ (Евреи 11:35). Храмът, който Иуда очисти, се появява и в Евангелието: на празника Обновление, през зимата, Иисус ходи в притвора Соломонов (Иоан 10:22-23) — Той, Който е истинският храм (Иоан 2:19-21). А мъчениците на стария Закон откриват редицата на мъчениците на Църквата, които ще умрат за Христос със същата надежда.\u003c/p>","parinti":"\u003cp>Св. Григорий Богослов произнесъл цяло похвално слово за Макавеите. Той показва, че те заслужават почит от всички, защото са пострадали за отеческия закон преди Страданията Христови — и се пита какво ли не биха направили, ако бяха имали пред очите си примера на Неговата смърт. Св. Иоан Златоуст също им посветил беседи, като хвали най-вече силата на майката, която видяла синовете си да умират един по един и ги насърчавала до края. Блажени Августин казва, че Църквата цени тези книги тъкмо заради страданията на мъчениците.\u003c/p>","slujbe":"\u003cp>Книгата не се чете като паремия на богослуженията, но Църквата почита героите ѝ като светии: на \u003cstrong>1 август\u003c/strong> се почитат светите седем мъченици Макавейски, майка им Соломония и учителят им Елеазар. В същия ден започва Богородичният пост преди Успение на Пресвета Богородица. А грижата на Иуда за падналите отеква във всяко поменаване на починалите: в панихидите, в задушниците и на всяка Божествена литургия, когато свещеникът поменава покойниците.\u003c/p>","rugaciune":"\u003cp>Господи, Царю на света, Който си сътворил всичко от нищо, дай и на мене нещо от силата на Твоите мъченици. Да не се отрека от Тебе нито от страх, нито заради удобството си. Спомни си, Господи, за моите починали и прости греховете им. И всички нас възкреси, в Своето време, за живот вечен. Амин.\u003c/p>"},"q":[{"q":"Какво изповядват седемте братя и майка им пред царя?","o":["Че Бог ще възкреси онези, които умират за Неговите закони","Че храмът никога няма да бъде осквернен","Че цар Антиох скоро ще се покае"]},{"q":"Какво прави Иуда Макавей за войниците си, паднали в битката?","o":["Праща жертва в Иерусалим и се моли да им бъдат простени греховете","Построява им нов храм в Сирия","Забранява на народа да ги поменава"]}]}},{"n":49,"slug":"3-makaveyska","abbr":"3 Мак","cap":7,"s":"nekanonichni","dk":true,"bg":{"nume":"Трета книга Макавейска","scurt":"Иудеите в Александрия, осъдени на смърт от един разгневен цар, са спасени от Бога в мига, когато вече нямаше никакъв изход.","verset":{"t":"„Господи, Господи, Царю на небесата и Владико на всяко създание…“","r":"3 Макавейска 2:2"},"incepe":"3 Макавейска 1–2 · 5–6","p":{"autor":"\u003cp>Авторът е неизвестен: благочестив иудеин от Александрия Египетска, който писал на гръцки, най-вероятно през I век пр. Хр. Името на книгата може да те обърка: в нея не се появява нито един Макавей, а събитията са с около петдесет години по-стари от борбите на Иуда. Поставена е до другите, защото и тя разказва за гонение, понесено заради вярата. Нашата Библия, Синодалното издание, я брои сред „неканоничните“ книги: четат се за душевна полза, запазени са в превода на Седемдесетте, но ги няма в протестантските Библии.\u003c/p>","context":"\u003cp>След Александър Велики много иудеи живеят далеч от Светата земя, най-вече в Александрия, където Писанието е било преведено на гръцки. През 217 г. пр. Хр. египетският цар Птолемей IV Филопатор побеждава при Рафия, идва в Иерусалим и иска да влезе в Светая Светих. Първосвещеникът Симон се моли, и царят пада на земята, без сили. Като се връща в Египет, пълен с гняв, той заповядва иудеите да бъдат преброени, белязани и принудени да се поклонят на идолите; после ги събира на хиподрума, за да бъдат стъпкани от петстотин опиянени слонове. Два пъти заповедта остава неизпълнена. Третия път старият свещеник Елеазар се моли, явяват се два ангела и слоновете се обръщат срещу войската на царя. Птолемей се разкайва и освобождава всички.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Бог не изоставя народа Си\u003c/strong> — Нито в чужда земя, нито когато всичко изглежда изгубено.\u003c/li>\u003cli>\u003cstrong>Силата на молитвата\u003c/strong> — Книгата стои на две големи молитви: на първосвещеника Симон (глава 2) и на свещеника Елеазар (глава 6).\u003c/li>\u003cli>\u003cstrong>Верността в гонението\u003c/strong> — Повечето иудеи предпочитат опасността от смърт пред поклонението на идолите.\u003c/li>\u003cli>\u003cstrong>Светостта на Божия дом\u003c/strong> — Дори царят не може да влезе насила там, където Бог не позволява.\u003c/li>\u003cli>\u003cstrong>Радостта на спасението\u003c/strong> — Мястото, приготвено за смърт, става място на празник и благодарност.\u003c/li>\u003c/ul>","hristos":"\u003cp>Книгата няма конкретно пророчество за Месията, и е честно да го кажем. Но следва един път, който ще разпознаеш. В молитвата си Елеазар напомня на Бога старите избавления: от фараона при Червено море, тримата момци в пещта, Даниил в рова с лъвовете, Иона в утробата на кита (3 Макавейска 6). Тъкмо тези събития за Църквата са образи на Възкресението; Сам Господ дава „личбата на пророк Иона“ като знак за трите дни в гроба (Матей 12:39-40). Един народ, осъден на смърт, без никаква човешка помощ, преминава към живот и празнува: това е, в малък образ, пътят на Пасхата. А Александрия, с гръцкото си Писание, е мястото, където Бог подготвял езика, на който апостолите щели да проповядват Христос.\u003c/p>","parinti":"\u003cp>Тук трябва да се каже истината: Светите Отци не са ни оставили тълкувания на тази книга и почти не я цитират. Намираме я обаче в древни ръкописи на превода на Седемдесетте, а старото правило, наречено 85-о Апостолско правило, споменава три книги Макавейски. Св. Атанасий Велики в едно празнично послание говори — без да назовава тази книга — за писания, които не са в канона, но Отците са определили да ги четат онези, които се приближават към вярата. В този дух я приема Църквата: не като основа на догмата, а като четиво, което назидава, за търпението и за молитвата.\u003c/p>","slujbe":"\u003cp>Трета книга Макавейска не се чете на нито едно богослужение и с нея не е свързан нито един празник. Но в богослуженията отекват избавленията, които си спомня молитвата на Елеазар: песента на Иона и песента на тримата момци са основата на шестата, седмата и осмата песен на канона на утренята, а на Велика събота се четат книгата на Иона и Даниил 3.\u003c/p>","rugaciune":"\u003cp>Господи, Царю на небесата и Владико на цялото творение, Ти изведе тримата момци от пещта и Иона от дълбините. Погледни и към мене, когато вече не виждам никакъв изход. Запази ме верен на Тебе там, където живея, сред хора, които не Те познават, и превърни страха ми в благодарност. Амин.\u003c/p>"},"q":[{"q":"Защо името „Трета книга Макавейска“ може да обърка?","o":["Защото в нея не се появява нито един Макавей, а иудеите в Египет, около петдесет години по-рано","Защото я е написал самият Иуда Макавей","Защото разказва за третата битка на Иуда"]},{"q":"Как се спасяват иудеите, събрани на хиподрума?","o":["След молитвата на Елеазар се явяват ангели и слоновете се обръщат срещу войската на царя","Идва Иуда Макавей с войска от Иерусалим","Иудеите избягват нощем по море"]}]}},{"n":50,"slug":"3-ezdra","abbr":"3 Езд","cap":16,"s":"nekanonichni","dk":true,"bg":{"nume":"Трета книга на Ездра","scurt":"Книгата на виденията: след падането на Иерусалим Ездра пита Бога защо страда Неговият народ, а ангелът Уриил му отговаря с видения за края на времената.","verset":{"t":"„очаквайте вашия Пастир, — Той ще ви даде покой вечен“","r":"3 Ездра 2:34"},"incepe":"3 Ездра 3–4 · 10 · 13–14","p":{"autor":"\u003cp>Книгата носи името на Ездра, свещеника и книжника; в латинския текст той казва, че се нарича и Салатиил. Сърцето ѝ обаче (глави 3–14) е написано много по-късно от един иудейски автор, вероятно към края на I век след Христа, след като римляните разрушили Иерусалим и храма през 70 г.: болката от онази рана той облича в думите на Ездра, който плаче за първото разрушение. Глави 1–2 и 15–16 са добавени от християни. Книгата я няма нито на еврейски, нито в превода на Седемдесетте; запазена е на латински, където се нарича „Четвърта книга на Ездра“. Славянските Библии я приели в превод от латински — Острожката Библия (1581), Елисаветинската, руската Синодална, — и оттам тя влязла в нашата Библия, Синодалното издание, сред неканоничните книги. В тази Карта тя е последната от тях.\u003c/p>","context":"\u003cp>Книгата сама се поставя „на трийсетата година след разорението на града“, във Вавилон (3:1): Ездра гледа опустошения Сион и богатството на Вавилон и се осмелява да говори с Всевишния. Следват седем видения, разделени с пост и молитва. В първите три ангелът Уриил отговаря на въпросите му. В четвъртото една жена плаче за сина си, паднал мъртъв в брачния си чертог, и изведнъж се превръща в град, който се строи: тя е Сион (глави 9–10). В петото от морето излиза орел с дванайсет крила и три глави, а един лъв го изобличава (глави 11–12). В шестото от морето се издига Мъж, пред Чийто глас всичко се топи като восък (глава 13). В седмото Бог говори на Ездра от къпината, както на Моисей, и изгорените свещени книги са написани отново (глава 14).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Въпросът за злото\u003c/strong> — Защо Бог предаде народа Си на езичници, които не са по-добри? Ездра пита дръзко, но пита Бога, в молитва (глава 3).\u003c/li>\u003cli>\u003cstrong>Границата на ума\u003c/strong> — „Иди и претегли тежината на огъня, или измери ми духането на вятъра, или върни ми деня, който вече е изминал“ (4:5).\u003c/li>\u003cli>\u003cstrong>Божията любов е по-голяма от нашата\u003c/strong> — Ангелът пита Ездра дали обича Израил повече от Онзи, Който го е сътворил (5:33).\u003c/li>\u003cli>\u003cstrong>Малцината спасени\u003c/strong> — „Мнозина са сътворени, но малцина ще се спасят“ (8:3); а Ездра не престава да се застъпва за грешниците.\u003c/li>\u003cli>\u003cstrong>Словото, което не изгаря\u003c/strong> — Законът е изгорен, но Бог дава Духа Си и Писанията са написани отново (глава 14).\u003c/li>\u003c/ul>","hristos":"\u003cp>Ездра пита защо страда праведният, и книгата не му дава пълно обяснение: отговорът ще дойде в Едно Лице. Християнските глави го казват ясно: на планината Сион Ездра вижда голямо множество и сред тях величествен Юноша, Който им възлага венци; ангелът му казва: „Сам Син Божий, Когото те са прославяли в тоя век“ (2:47) — същото множество, което вижда св. Иоан в Откровение 7:9. В нашия текст, преведен от латински, Месията е наречен дори по име — „Моят Син Иисус“ (7:28); учените смятат, че името са вписали християнски преписвачи. Лъвът, който изобличава орела, е „Помазаникът, запазен от Всевишния до края“ (12:32), а Мъжът от морето застава на планината Сион, „изваяна без ръце“ (13:36) — образът на камъка от Даниил 2, в който Отците виждат Христос.\u003c/p>","parinti":"\u003cp>Тази книга почти не е тълкувана от Светите Отци: на Изток тя е останала почти непозната, защото я няма в гръцката Библия. Отците обаче са отговаряли на въпроса на Ездра. Св. Василий Велики в беседата си „Че Бог не е виновник на злото“ учи, че злото не е същност, сътворена от Бога, а лишаване от доброто, както тъмнината е отсъствие на светлината; истинското зло е грехът, който зависи от нашата воля, а нещастията Бог ги допуска за наше лечение. А св. Иоан Златоуст в беседите „За непостижимостта на Бога“ напомня, че човешкият ум не може да обхване Божиите пътища — урока, който Уриил дава на Ездра с огъня, вятъра и изминалия ден.\u003c/p>","slujbe":"\u003cp>Трета книга на Ездра не се чете на богослуженията на Православната църква: от нея няма паремии. На Запад обаче думите ѝ от 2:34-35 — за вечния покой и за светлината, която ще свети вечно — станали начало на заупокойната служба: „вечния покой… и светлина вечна“. В опелото и в панихидата ние се молим за същото със свои думи, в „Със светиите упокой“. И още нещо: името на архангел Уриил в Библията го срещаш само в тази книга, а православното предание го нарежда сред седемте архангели, които почитаме на Архангеловден (8 ноември).\u003c/p>","rugaciune":"\u003cp>Господи, Ти знаеш колко пъти съм питал „защо?“, като Ездра. Не ми давай да се затварям в горчивината, а да нося въпросите си при Тебе, в молитва. Научи ме на смирението на ума, който не може да претегли огъня, но може да се довери на Твоята благост. Утеши всички, които плачат като майката на Сион, и дай на нашите починали вечен покой в светлината на Твоето лице. Амин.\u003c/p>"},"q":[{"q":"Как се казва ангелът, който отговаря на въпросите на Ездра?","o":["Уриил","Рафаил","Гавриил"]},{"q":"Какво разбира Ездра, когато плачещата жена изведнъж се превръща в град, който се строи?","o":["Че жената е Сион и че Бог ще утеши и ще съгради отново Своя град","Че Вавилон ще бъде разрушен още същата нощ","Че трябва да напусне Иерусалим завинаги"]}]}},{"n":51,"slug":"matey","abbr":"Мат","cap":28,"s":"evangelia","bg":{"nume":"Евангелие от Матея","scurt":"Иисус Христос е обещаният Месия, Син Давидов и Син Авраамов, в Когото се изпълват Законът и Пророците.","verset":{"t":"„Дойдете при Мене всички отрудени и обременени, и Аз ще ви успокоя“","r":"Матей 11:28"},"incepe":"Матей 1–2 · 5–7 · 26–28","p":{"autor":"\u003cp>Светият апостол и евангелист Матей, наричан още Левий, бил митар в Капернаум — събирал данъци за римската власт, — когато Господ му казал: „върви след Мене“ (Матей 9:9). Той оставил всичко и станал един от дванадесетте апостоли. Според Преданието на Църквата той пише пръв от евангелистите, отначало на езика на евреите, за християните, дошли от юдеите, през първите десетилетия след Възнесението Господне. Неговият символ в иконите е крилатият човек. Църквата го почита на 16 ноември.\u003c/p>","context":"\u003cp>С тази книга се отваря Новият Завет. След векове на очакване, когато гласът на пророците бил замлъкнал, идва Обещаният. Светата земя е под римска власт, в Иерусалим царува Ирод, а народът чака Месия, който да го избави. Матей пише за хора, които познават Закона и Пророците, и им показва, стъпка по стъпка, че Иисус от Назарет е Онзи, за Когото те са предсказвали. Евангелието има 28 глави и събира учението на Господа в пет големи беседи: Проповедта на планината (5–7), изпращането на апостолите (10), притчите за Царството (13), живота на Църквата (18) и беседата за последните времена (24–25). Всичко се изкачва към Кръста и Възкресението.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Царството небесно\u003c/strong> — То се е приближило в Христос и се отваря за онези, които се покайват.\u003c/li>\u003cli>\u003cstrong>Изпълнението на Писанията\u003c/strong> — Матей показва отново и отново, че в Иисус се е сбъднало „реченото от Господа чрез пророка“.\u003c/li>\u003cli>\u003cstrong>Проповедта на планината\u003c/strong> — Блаженствата, „Отче наш“, любовта към враговете: новият закон, написан в сърцето.\u003c/li>\u003cli>\u003cstrong>Църквата\u003c/strong> — Това е единственото Евангелие, в което Господ казва думата „църква“ (Матей 16:18; 18:17).\u003c/li>\u003cli>\u003cstrong>Съдът с мярката на милостта\u003c/strong> — „доколкото сте сторили това на едного от тия Мои най-малки братя, Мене сте го сторили“ (Матей 25:40).\u003c/li>\u003c/ul>","hristos":"\u003cp>Матей показва Христос като Цар и Месия на Израил, в Когото целият Стар Завет намира своята цел. Книгата започва с Неговото родословие: „Син Давидов, Син Авраамов“ (Матей 1:1). Той се ражда от Дева, както предсказал Исаия, и е наречен Емануил, „което ще рече: с нас е Бог“ (Исаия 7:14; Матей 1:23); ражда се във Витлеем, както предсказал Михей (Михей 5:2; Матей 2:6). Като нов Моисей, Той се изкачва на планината и дава съвършения закон, като казва: „не да наруша съм дошъл, а да изпълня“ (Матей 5:17). Влиза в Иерусалим, възседнал осле, според пророчеството на Захария (Захария 9:9). На Кръста изрича началото на Псалом 21 (22 в протестантските Библии). А книгата завършва с обещанието: „ето, Аз съм с вас през всички дни до свършека на света“ (Матей 28:20).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст е тълкувал цялото това Евангелие в деветдесетте си беседи върху Матея, произнесени в Антиохия. Още в началото той казва нещо, което смирява: би трябвало изобщо да нямаме нужда от помощта на писмената, а да живеем толкова чист живот, че благодатта на Духа да ни бъде вместо книги; а понеже сме изгубили тази чистота, нека поне се държим здраво за написаното. В Проповедта на планината той показва, че Господ не премахва Закона, а го води към съвършенство — от делото до самия помисъл. По-късно блажени Теофилакт Охридски, архиепископ на Охридската архиепископия — тълкувател, свързан с българските земи, — събрал накратко тълкуванието на Отците върху Матея.\u003c/p>","slujbe":"\u003cp>Матей се чете на Божествената литургия от Духовден, понеделника след Петдесетница, в продължение на много седмици, до малко след Въздвижение на Светия Кръст. Но го чуваш през цялата година: Блаженствата (Матей 5:3-12) се пеят на неделната литургия и на службата на Светите Страсти, „Отче наш“ (Матей 6:9-13) се казва на всяка служба, а на Кръщение се чете краят на Евангелието (Матей 28:16-20). На Рождество Христово се чете поклонението на мъдреците (Матей 2:1-12), а в Месопустната неделя, неделята за Страшния съд — Матей 25:31-46.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, кротки Царю, Ти, Който призова Матей от митницата, призови и мене от всичко, което ме държи вързан. Научи ме да търся първо Твоето Царство, да Те виждам в гладния и в болния и да идвам при Тебе, когато съм отруден и обременен. Остани с нас през всички дни, до свършека на света. Амин.\u003c/p>"},"q":[{"q":"За кого е писал най-напред свети Матей и какво е искал да покаже?","o":["За християните, дошли от юдеите, като показва, че Иисус е Месията, предсказан от пророците","За римляните, като показва силата на императора","За философите в Атина, като показва мъдростта на елините"]},{"q":"Какво съдържат глави 5–7 от Евангелието от Матея?","o":["Проповедта на планината, с Блаженствата и молитвата „Отче наш“","Страданията и Възкресението на Господа","Рождеството на Господа и поклонението на мъдреците"]}]}},{"n":52,"slug":"mark","abbr":"Марк","cap":16,"s":"evangelia","bg":{"nume":"Евангелие от Марка","scurt":"Най-краткото Евангелие: Синът Божий лекува, изгонва бесове и доброволно върви към Кръста, като слуга на всички.","verset":{"t":"„Защото и Син Човеческий не дойде, за да Му служат, но да послужи и даде душата Си откуп за мнозина.“","r":"Марк 10:45"},"incepe":"Марк 1 · 8:27–9:29 · 14–16","p":{"autor":"\u003cp>Светият евангелист Марко, наричан още Иоан Марко, бил родом от Иерусалим; в къщата на майка му Мария се събирали първите християни за молитва (Деяния 12:12). Той придружавал Павел и Варнава, а после станал близък ученик на свети Петър, който го нарича „син ми Марко“ (1 Петрово 5:13). Според Свещеното Предание той записал в Рим онова, което проповядвал Петър, а след това пасял Църквата в Александрия, където умрял мъченически. Неговият символ в иконите е лъвът. Паметта му се чества на 25 април.\u003c/p>","context":"\u003cp>Евангелието е написано за християни, дошли от езичниците, най-вероятно в Рим, в годините, когато Църквата започвала да бъде гонена. Затова Марко обяснява юдейските обичаи (Марк 7:3-4) и превежда думите, които Господ изрекъл на Своя език: „талита куми“ (5:41), „ефата“ (7:34). То има само 16 глави и бърз ритъм: думата „веднага“ се връща отново и отново. Малко думи, много дела — изцеления, бесове, които бягат, утихналата буря. От средата на книгата (8:27) всичко се обръща към Иерусалим и Кръста. В картата на Писанието това е същата радостна вест, която четеш у Матея, разказана кратко за онези, които не са израсли със Закона Моисеев.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Иисус, Синът Божий\u003c/strong> — Книгата се отваря с това изповедание (1:1) и стига до него под Кръста, от устата на стотника (15:39).\u003c/li>\u003cli>\u003cstrong>Властта над злото\u003c/strong> — Болестите, нечистите духове, морето и смъртта се покоряват на Неговото слово.\u003c/li>\u003cli>\u003cstrong>Пътят на Кръста\u003c/strong> — „който иска да върви след Мене, нека се отрече от себе си, да вземе кръста си и Ме последва“ (Марк 8:34).\u003c/li>\u003cli>\u003cstrong>Вярата, която търси помощ\u003c/strong> — „вярвам, Господи! помогни на неверието ми“ (Марк 9:24).\u003c/li>\u003cli>\u003cstrong>Служението\u003c/strong> — Който иска да бъде пръв, нека бъде на всички слуга (9:35).\u003c/li>\u003c/ul>","hristos":"\u003cp>Марко представя Христос като Сина Божий, Който става слуга и страда за нас. Евангелието започва със самите пророци: Малахия и Исаия предсказали „гласа на викащия в пустинята“, който приготвя пътя Господен (Малахия 3:1; Исаия 40:3; Марк 1:2-3), и този глас е Иоан Предтеча. Онзи, Който дава душата Си „откуп за мнозина“, е страдащият Раб Господен от Исаия 53. На Преображението Моисей и Илия — Законът и Пророците — разговарят с Него (Марк 9:4). Пред първосвещеника Иисус нарича Себе Си Син Човеческий, Който иде на небесните облаци (Марк 14:62), както Го видял Даниил (Даниил 7:13). А на Кръста изрича началото на Псалом 21 (Марк 15:34). Първият, който Го изповядва там, е езичник: „наистина Тоя Човек е бил Син Божий“ (Марк 15:39).\u003c/p>","parinti":"\u003cp>За Марко са ни запазени по-малко древни тълкувания, отколкото за другите Евангелия, защото много от онова, което той пише, се намира и у Матея, и у Лука. Но свидетелството за него е много старо. Св. Ириней Лионски пише, че Марко, ученик и тълкувател на Петър, ни оставил написано онова, което Петър проповядвал. Преди него Папий Иераполски, епископ от втори век, казал, че Марко записал точно, макар и не по ред, онова, което помнел от думите на апостола. По-късно блажени Теофилакт Охридски, архиепископ на Охридската (Българската) архиепископия, тълкувал цялото Евангелие, стих по стих.\u003c/p>","slujbe":"\u003cp>Марко го чуваш най-вече през \u003cstrong>Великия пост\u003c/strong>, на Божествената литургия в съботите и неделите: изцелението на разслабения в Капернаум (втората неделя на Великия пост), Кръстопоклонната неделя („да вземе кръста си“), изцелението на обладаното от бяс момче, третото предсказание за Страданията. От Марко са и второто и третото от единадесетте утринни възкресни Евангелия, които се четат на неделната утреня (Марк 16), както и Евангелието на Неделята на светите жени мироносици. Чете се също в делничните дни, в други периоди от годината.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Сине Божий, Който дойде не за да Ти служат, а за да послужиш, вярвам, Господи! помогни на неверието ми. Укроти бурята в мене, както укроти морето. Дай ми сила всеки ден да вдигам кръста си и да вървя след Тебе, без да бързам да стана пръв. Амин.\u003c/p>"},"q":[{"q":"Чия проповед е записал свети Марко според Свещеното Предание?","o":["На апостол Петър.","На Иоан Предтеча.","На апостол Тома."]},{"q":"Кой изповядва Иисус като Син Божий под Кръста?","o":["Римският стотник.","Понтий Пилат.","Първосвещеникът."]}]}},{"n":53,"slug":"luka","abbr":"Лука","cap":24,"s":"evangelia","bg":{"nume":"Евангелие от Лука","scurt":"Евангелието на милостта: Спасителят на всички търси изгубените — пастири, митари, вдовици, блудния син, разбойника на кръста.","verset":{"t":"„понеже Син Човеческий дойде да подири и да спаси погиналото.“","r":"Лука 19:10"},"incepe":"Лука 1–2 · 15 · 23–24","p":{"autor":"\u003cp>Светият евангелист Лука бил лекар — Павел го нарича „Лука, многообичният лекар“ (Колосяни 4:14) — и според Свещеното Предание бил родом от Антиохия и дошъл във вярата от езичниците. Той придружавал апостол Павел в пътуванията му и останал до него докрай. Написал Евангелието, а после и Деянията на апостолите, посветени и двете на някой си Теофил. Преданието го почита и като първия иконописец на образа на Пресвета Богородица. Неговият символ е телецът. Паметта му: 18 октомври.\u003c/p>","context":"\u003cp>Лука не видял Господа със собствените си очи. Затова проучил всичко грижливо, като слушал онези, които „от самото начало бяха очевидци“ (Лука 1:1-4), и писал за християните, дошли от езичниците, в гръцкоговорящия свят. Като историк, той поставя събитията в тяхното време: Рождеството в дните на кесаря Август, проповедта в петнадесетата година на Тиверий. Само у него намираш Благовещението, Рождеството в яслите и пастирите, праведния Симеон, дванадесетгодишния Иисус в храма; притчите за милосърдния самарянин, за блудния син, за митаря и фарисея; Закхей и пътя към Емаус. То има 24 глави и продължава в Деянията на апостолите.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Милостта Божия\u003c/strong> — Изгубените биват търсени, намерени и приети с радост (глава 15).\u003c/li>\u003cli>\u003cstrong>Спасението за всички\u003c/strong> — Бедни, жени, чужденци, грешници: никой не остава отвън.\u003c/li>\u003cli>\u003cstrong>Молитвата\u003c/strong> — Лука постоянно показва Иисус в молитва: при Кръщението, на планината, на Кръста.\u003c/li>\u003cli>\u003cstrong>Светият Дух и радостта\u003c/strong> — От Благовещението до Възнесението книгата е пълна с химни.\u003c/li>\u003cli>\u003cstrong>Богородица\u003c/strong> — „ето рабинята Господня; нека ми бъде по думата ти“ (Лука 1:38).\u003c/li>\u003c/ul>","hristos":"\u003cp>Лука представя Христос като Спасител на целия свят и Лекар на онези, които са болни от греха. Неговото родословие стига не само до Авраам, а до Адам (Лука 3:38): Той е новият Адам, дошъл за всички хора. В синагогата в Назарет Той чете от Исаия — „Дух Господен е върху Мене“ — и казва: „днес се изпълни това писание, което чухте“ (Исаия 61:1-2; Лука 4:18-21). А на пътя към Емаус, след Възкресението, дава на учениците ключа към цялата Библия: „И като начена от Моисея и от всички пророци, обясняваше им казаното за Него в цялото Писание“ (Лука 24:27). След това Го познали при преломяването на хляба. Това е и твоята карта: Писанието, както го тълкува Христос, и Светото Причастие.\u003c/p>","parinti":"\u003cp>Св. Кирил Александрийски произнесъл дълга поредица беседи върху Лука, а на Запад св. Амвросий Медиолански също тълкувал това Евангелие. Отците четат притчата за милосърдния самарянин като образ на спасението: човекът, който попаднал на разбойници, е Адам и целият човешки род, ранен от греха; самарянинът, който се навежда над него, е Христос; маслото и виното са Неговите лекарства, а гостилницата е Църквата, където раненият бива лекуван до завръщането на Господа. Това тълкуване ще го намериш и у блажени Теофилакт Охридски.\u003c/p>","slujbe":"\u003cp>Лука се чете на Божествената литургия от седмицата след Въздвижение на Светия Кръст до наближаването на Великия пост. Но неговите химни ги чуваш всеки ден: песента на Богородица „душата ми величае Господа“ (Лука 1:46-55) на утреня, молитвата на Симеон „сега отпускаш Твоя раб, Владико“ (Лука 2:29-32) — на църковнославянски „Ныне отпущаеши“ — на вечерня, „слава във висините Богу“ (Лука 2:14) в славословието на утренята, и поздрава на ангела в „Богородице Дево, радвай се, благодатна Марийо“. Неделите на митаря и фарисея и на блудния син, които подготвят Великия пост, също са от Лука.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Лекарю на душите и телата, Който дойде да подириш и да спасиш погиналото, подири и мене. Приеми ме като блудния син; „Боже, бъди милостив към мене грешника“, както митаря. Отвори ума ми да разбирам Писанията и „спомни си за мене, Господи, кога дойдеш в царството Си“. Амин.\u003c/p>"},"q":[{"q":"Какво прави възкръсналият Господ на пътя към Емаус?","o":["Обяснява на учениците, като започва от Моисей и пророците, онова, което е писано за Него.","Заповядва им да се върнат в Галилея.","Дава им нов Закон, написан на каменни плочи."]},{"q":"Коя от тези притчи се намира само у Лука?","o":["Притчата за блудния син.","Притчата за сеяча.","Притчата за талантите."]}]}},{"n":54,"slug":"ioan","abbr":"Иоан","cap":21,"s":"evangelia","bg":{"nume":"Евангелие от Иоана","scurt":"Духовното Евангелие: вечното Слово Божие стана човек и ни дари живот, светлина и любов до край.","verset":{"t":"„И Словото стана плът, и живя между нас“","r":"Иоан 1:14"},"incepe":"Иоан 1 · 6 · 11 · 13–17 · 20","p":{"autor":"\u003cp>Светият апостол и евангелист Иоан, син на Зеведей и брат на Иаков, е „ученикът, когото Иисус обичаше“: онзи, който се облегна на гърдите на Господа на Тайната вечеря, застана до Кръста и прие да се грижи за Богородица (Иоан 19:26-27). Според Свещеното Предание той пише последен от евангелистите, в дълбока старост, в Ефес, към края на първи век. Църквата го нарича „Богослов“, тоест онзи, който говори за Бога. Неговият символ е орелът. Паметта му: 8 май и 26 септември.\u003c/p>","context":"\u003cp>Когато пише Иоан, другите три Евангелия са вече познати и Църквата се е разпространила из целия римски свят. Но се били появили учители, които отричали или че Иисус е истински Бог, или че наистина е станал човек. Иоан не повтаря казаното от другите, а задълбочава. Избира няколко чудеса, които нарича „знамения“ — от сватбата в Кана до възкресението на Лазар, — и дълги беседи: с Никодим, със самарянката, беседата на Тайната вечеря. Казва ясно защо е писал: „А това е написано, за да повярвате, че Иисус е Христос, Син Божий, и като вярвате, да имате живот в Неговото име“ (Иоан 20:31). То има 21 глави.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Словото, Което стана плът\u003c/strong> — Онзи, Който беше от началото у Бога, стана истински човек.\u003c/li>\u003cli>\u003cstrong>Вечният живот\u003c/strong> — Не само след смъртта, а още отсега, чрез вярата, Кръщението и Светото Причастие (глави 3 и 6).\u003c/li>\u003cli>\u003cstrong>„Аз съм“\u003c/strong> — Хлябът на живота, светлината на света, добрият пастир, възкресението и животът, пътят и истината и животът, истинската лоза.\u003c/li>\u003cli>\u003cstrong>Светият Дух, Утешителят\u003c/strong> — Господ Го обещава на учениците на Тайната вечеря (глави 14–16).\u003c/li>\u003cli>\u003cstrong>Заповедта на любовта\u003c/strong> — „да любите един другиго; както Аз ви възлюбих“ (Иоан 13:34).\u003c/li>\u003c/ul>","hristos":"\u003cp>Иоан представя Христос като вечния Син и Слово на Отца, истински Бог, Който стана човек. Евангелието започва със същите думи като Битие — „В начало“, — защото чрез Него всичко е станало. Когато казва „преди Авраам да е бил, Аз съм“ (Иоан 8:58), Иисус изговаря името, открито на Моисей в горящата къпина, което започва със същото „Аз съм“ (Изход 3:14). Иоан Предтеча Го посочва: „ето Агнецът Божий, Който взима върху Си греха на света“ (Иоан 1:29) — пасхалното агне от Изход 12, на което „кост няма да се строши“ (Иоан 19:36). Медната змия, която Моисей издигна, предвещавала Кръста (Иоан 3:14), манната в пустинята — Хляба на живота (Иоан 6), храмът — Неговото тяло (Иоан 2:21). Сам Господ казва за Писанията: „И те са, които свидетелствуват за Мене“ (Иоан 5:39).\u003c/p>","parinti":"\u003cp>Отдавна това Евангелие е наречено „духовно“: другите три показали най-вече делата на Господа, а Иоан, подтикнат от Духа, открил Неговото Божество. Блажени Августин казва, че другите евангелисти вървят с Господа по земята, като до човек, а Иоан се издига като орел над облаците и съзерцава неизменната светлина. Св. Кирил Александрийски написал обширно тълкувание на Иоан, като защитава вярата, че Синът е единосъщен с Отца. А св. Иоан Златоуст в беседите си иска да слушаме тази книга в тишина и с внимание, като глас на някого, който говори от небето.\u003c/p>","slujbe":"\u003cp>Иоан е Евангелието на Великден. На Възкресенската литургия се чете неговото начало — „В начало беше Словото“ (Иоан 1:1-17), — а оттам до Петдесетница се чете ден след ден. С тези думи започва и Апракосът — богослужебното Евангелие, наредено по дните на годината, — и според житието на свети Кирил точно те са първите думи, които светите братя Кирил и Методий превели за славяните: „Искони бе Слово“. От Иоан са и първото и най-дълго от дванадесетте Евангелия на Светите Страсти, на Велики четвъртък вечерта (беседата на Тайната вечеря), Евангелието на Лазаровата събота и последните пет от единадесетте утринни възкресни Евангелия на неделната утреня.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Слово на Отца, Което стана човек и живя между нас, просвети моя мрак. Бъди за мене Хляб на живота, добър Пастир, Път, Истина и Живот. Задръж ме в Себе Си като пръчка в лозата и ме научи да обичам, както Ти ни възлюби, до край. Амин.\u003c/p>"},"q":[{"q":"Как започва Евангелието от Иоана?","o":["С „В начало беше Словото“, което показва, че Христос е предвечен Бог.","С родословието на Иисус, от Авраам до Иосиф.","С проповедта на апостолите в Иерусалим."]},{"q":"Кога се чете Евангелието от Иоана на Божествената литургия?","o":["От Великден до Петдесетница.","В съботите и неделите на Великия пост.","От Петдесетница до Въздвижение на Светия Кръст."]}]}},{"n":55,"slug":"deyania","abbr":"Деян","cap":28,"s":"deyania","bg":{"nume":"Деяния на светите апостоли","scurt":"От Възнесението до Рим: Светият Дух слиза на Петдесетница и Църквата понася Евангелието от Иерусалим към народите.","verset":{"t":"„И постоянствуваха в учението на апостолите, в общуването, в хлеболомението и в молитвите.“","r":"Деяния 2:42"},"incepe":"Деяния 1–2 · 9 · 15 · 17","p":{"autor":"\u003cp>Книгата е написана от светия евангелист Лука, „многообичния лекар“, като продължение на неговото Евангелие, и той я посвещава на същия Теофил (Деяния 1:1). Лука бил спътник на апостол Павел: от глава 16 нататък разказът на места преминава в „ние“ — знак, че е бил там. Книгата завършва с Павел, който живее две години под стража в Рим; затова според Преданието е написана около 63 година. Има 28 глави.\u003c/p>","context":"\u003cp>Деянията обхващат около тридесет години: от Възнесението Господне до пристигането на Павел в Рим. Планът го дава Сам Христос: учениците ще Му бъдат свидетели „в Иерусалим и в цяла Иудея и Самария, и дори до край-земя“ (Деяния 1:8). Така върви и книгата: Петдесетница и първата община в Иерусалим; Стефан, първомъченикът; Филип и етиопският скопец; обръщането на Савел по пътя за Дамаск; кръщението на стотника Корнилий; Антиохия, където учениците за първи път били наречени християни; Апостолският събор в Иерусалим; пътуванията на Павел до Филипи, Солун, Атина, Коринт, Ефес и Рим. В картата на Писанието това е мостът между Евангелията и Посланията: без него нямаше да знаеш кой е Павел и как са се родили църквите, до които той пише.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Светият Дух\u003c/strong> — Той слиза, Той изпраща, Той води; без Него апостолите не правят нито крачка.\u003c/li>\u003cli>\u003cstrong>Църквата\u003c/strong> — Ражда се на Петдесетница и живее от учението, хлеболомението и молитвата.\u003c/li>\u003cli>\u003cstrong>Свидетелството до кръв\u003c/strong> — Стефан, Иаков, веригите на Петър и Павел.\u003c/li>\u003cli>\u003cstrong>Евангелието за всички народи\u003c/strong> — Вратата на вярата се отваря и за езичниците.\u003c/li>\u003cli>\u003cstrong>Общото решение\u003c/strong> — „угодно бе на Светаго Духа и нам“ (Деяния 15:28): основата на съборите на Църквата.\u003c/li>\u003c/ul>","hristos":"\u003cp>Тук виждаш възкръсналия и възнесен Христос, Който продължава да действа чрез Светия Дух в Своята Църква. На Петдесетница Петър показва, че се е изпълнило пророчеството на Иоил — „ще излея от Моя Дух върху всяка плът“ (Иоил 2:28), — и че Давид е говорил за Възкресението в Псалом 15: Бог няма да допусне Своя светия „да види тление“ (Деяния 2:16-32). Стефан разказва целия Стар Завет, от Авраам до Соломон, като път към „Праведника“. Филип тълкува на скопеца Исаия 53 и, като започва оттам, му благовести за Иисус (Деяния 8:32-35). А на Савел Господ казва: „Аз съм Иисус, Когото ти гониш“ (Деяния 9:5): Христос и Неговата Църква са едно.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст тълкувал книгата в поредица беседи, произнесени в Константинопол. Той започва словото си с една тъга: мнозина дори не знаят, че тази книга съществува. После показва колко голяма е ползата от нея: Евангелията са история на онова, което Христос е вършил и говорил, а Деянията — история на онова, което е вършил и говорил „другият Утешител“, Светият Дух. Той отбелязва, че тук виждаме как се изпълнява на дело всичко, което Господ обещал в Евангелията, и че учениците, уплашени преди Страданията, след Петдесетница стават съвсем други хора.\u003c/p>","slujbe":"\u003cp>Деянията се четат като Апостол на Божествената литургия от Великден до Петдесетница, като се започва още от нощта на Възкресението. В деня на Петдесетница се чете слизането на Светия Дух (Деяния 2:1-11), а на Възнесение — началото на книгата. Нейните герои имат своите празници: светият първомъченик и архидякон Стефан на 27 декември, третия ден на Рождество Христово, светите апостоли Петър и Павел на 29 юни, Петровден.\u003c/p>","rugaciune":"\u003cp>Царю Небесни, Утешителю, Душе на истината, Който слезе върху апостолите в огнени езици, дойди и всели се в нас. Направи ни да постоянстваме в учението на апостолите, в хлеболомението и в молитвите. Дай ни дързост да изповядваме Христос с живота си, там, където Ти си ни поставил. Амин.\u003c/p>"},"q":[{"q":"Какво се случва на Петдесетница, в глава 2?","o":["Светият Дух слиза върху апостолите и се ражда Църквата.","Господ се възнася на небето от Елеонската планина.","Павел пристига в Рим."]},{"q":"Какво чува Савел по пътя за Дамаск?","o":["„Аз съм Иисус, Когото ти гониш“.","„Върни се в Иерусалим и съгради отново храма“.","„Остави мрежите си и върви след Мене“."]}]}},{"n":56,"slug":"rimlyani","abbr":"Рим","cap":16,"s":"pavel","bg":{"nume":"Послание до римляни","scurt":"Всички сме съгрешили и всички сме призвани: Павел показва как Бог ни спасява в Христа и какъв е новият живот в Духа.","verset":{"t":"„Ако Бог е за нас, кой ще е против нас?“","r":"Римляни 8:31"},"incepe":"Римляни 5–6 · 8 · 12","p":{"autor":"\u003cp>Посланието е на светия апостол Павел, някогашния гонител, който стана „апостол на езичниците“. Написал го от Коринт, през зимата на 57–58 година, в края на третото си пътуване. Издиктувал го на един ученик, Тертий (Римляни 16:22), и го изпратил по Фива, дякониса при църквата в Кенхрея, пристанището на Коринт (Римляни 16:1). Има 16 глави. То е първо в реда на посланията не защото е най-старото, а защото е най-всеобхватното.\u003c/p>","context":"\u003cp>В картата на Писанието след Евангелията и Деянията идват посланията на апостолите до новородените църкви. Църквата в Рим не била основана от Павел и той още не я бил виждал; искал да мине оттам на път за Испания. В столицата на империята живеели заедно християни, дошли от юдеите, и християни, дошли от езичниците, и всяка страна се изкушавала да гледа другата отвисоко. Павел пише на всички и излага Евангелието по ред: всички са съгрешили (глави 1–3); Бог оправдава човека чрез вярата в Христа (3–5); Кръщението и животът в Духа (6–8); тайната на народа Израилев (9–11); как живее всеки ден един християнин (12–16).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Всички се нуждаят от спасение\u003c/strong> — „всички съгрешиха и са лишени от славата Божия“ (Римляни 3:23).\u003c/li>\u003cli>\u003cstrong>Оправданието чрез вяра\u003c/strong> — Човек не се спасява със собствените си сили; тази вяра е жива и дава плод в дела.\u003c/li>\u003cli>\u003cstrong>Кръщението\u003c/strong> — Погребваме се с Христос в смъртта, за да ходим „в обновен живот“ (Римляни 6:3-4).\u003c/li>\u003cli>\u003cstrong>Животът в Духа\u003c/strong> — Вече не сме роби, а деца, и викаме: „Авва, Отче!“ (Римляни 8:15).\u003c/li>\u003cli>\u003cstrong>Животът като жива жертва\u003c/strong> — Нелицемерна любов, търпение, победа над злото с добро (глава 12).\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието до римляни представя Христос като новия Адам. Чрез един човек грехът влезе в света, а с греха — смъртта; чрез Единия, Иисус Христос, идват за всички благодатта и животът (Римляни 5:12-21). Още в първите редове Павел казва, че Бог от по-напред бе обещал Евангелието „чрез пророците Си, в светите Писания“ (Римляни 1:2). Авраам, който повярва на Бога, и „това му се вмени за оправдание“ (Битие 15:6), е баща на всички вярващи (Римляни 4). Словото на Авакум — „праведният чрез вярата си ще бъде жив“ (Авакум 2:4) — стои в основата на посланието (Римляни 1:17). А за Закона Моисеев Павел казва: „завършък на закона е Христос“ (Римляни 10:4) — тоест неговата цел. Народите са като клони, присадени в добрата маслина на Израил (Римляни 11:17-24).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст тълкувал цялото послание в беседите си върху Посланието до римляни. В уводното си слово признава, че се радва всеки път, когато чуе да се четат посланията на Павел, но и скърби, че мнозина не познават апостола, както трябва; и казва, че от незнанието на Писанията се раждат безброй злини. На глава 6 той показва, че Кръщението е смърт за греха, но че този дар трябва после да се пази с всекидневния живот. Със същия дух Църквата чете цялото послание: спасяващата вяра е, както пак казва Павел, „вярата, която действува чрез любов“ (Галатяни 5:6).\u003c/p>","slujbe":"\u003cp>Посланието до римляни се чете като Апостол на Божествената литургия през първите седмици след Петдесетница. Но един откъс от него го чуваш в най-големите мигове: \u003cstrong>Римляни 6:3-11\u003c/strong> е Апостолът на тайнството Кръщение — „Или не знаете, че всички ние, които се кръстихме в Христа Иисуса, в Неговата смърт се кръстихме?“ — и се чете също на литургията на Велика събота, когато някога се кръщавали онези, които се били подготвяли през целия Велик пост.\u003c/p>","rugaciune":"\u003cp>Господи, Боже наш, Който не пощади Своя Син, а Го отдаде за всички ни, благодаря Ти, че нищо не може да ме отлъчи от любовта Ти в Христа Иисуса. Умъртви в мене стария човек, който бе погребан с Него в Кръщението. Дай ми духа на осиновението, за да Те наричам „Отче“, и ми помогни да побеждавам злото с добро. Амин.\u003c/p>"},"q":[{"q":"Какво казва Павел за Кръщението в глава 6?","o":["Че се погребваме с Христос в смъртта, за да ходим в нов живот.","Че то е само външен знак, без последици.","Че се отнася само до християните, дошли от юдеите."]},{"q":"Как представя Христос Посланието до римляни в глава 5?","o":["Като новия Адам, чрез Когото идват за всички благодатта и животът.","Като нов Моисей, който дава по-строг закон.","Като земен император на Рим."]}]}},{"n":57,"slug":"1-korintyani","abbr":"1 Кор","cap":16,"s":"pavel","bg":{"nume":"Първо послание до коринтяни","scurt":"На една млада църква, разделена и смутена, Павел показва Кръста, тялото Христово, любовта и Възкресението.","verset":{"t":"„А сега остават тия три: вяра, надежда, любов; но по-голяма от тях е любовта.“","r":"1 Коринтяни 13:13"},"incepe":"1 Коринтяни 1–2 · 11:17-34 · 13 · 15","p":{"autor":"\u003cp>Посланието е на светия апостол Павел, който го изпраща заедно с „брат Состен“ (1 Коринтяни 1:1). Написал го от Ефес, по време на третото си пътуване, около 55–57 година; сам казва, че ще остане в Ефес до Петдесетница (1 Коринтяни 16:8). Има 16 глави. Това е писмо на баща: Павел бил основал тази църква и познавал хората ѝ един по един. Затова изобличава без заобикалки, но и утешава, и им напомня, че тялото им е храм на Светия Дух (1 Коринтяни 6:19).\u003c/p>","context":"\u003cp>Коринт бил голям и богат пристанищен град между две морета, прочут с търговията си, но и с разпуснатостта и идолите си. Павел проповядвал там Евангелието година и половина (Деяния 18). След заминаването му пристигнали лоши вести „от домашните на Хлоя“ и едно писмо с въпроси. Християните се били разделили на групи — „аз съм Павлов“, „аз пък — Аполосов“, „аз съм Кифин“ (1:12); един тежък грях се търпял; братя се съдели пред езически съдии; на Господнята вечеря богатите не чакали бедните; духовните дарби били станали повод за гордост; някои казвали, че няма възкресение на мъртвите. Павел отговаря на всичко, едно по едно. В картата на Писанието тук виждаш истинска църква, с истински рани.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Кръстът, мъдрост Божия\u003c/strong> — Безумство за света, сила Божия за онези, които се спасяват (глава 1).\u003c/li>\u003cli>\u003cstrong>Църквата, тяло Христово\u003c/strong> — Много членове, едно тяло; никой не е излишен (глава 12).\u003c/li>\u003cli>\u003cstrong>Светата Евхаристия\u003c/strong> — Павел предава онова, което е приел от Господа, и иска човек да изпитва себе си (1 Коринтяни 11:23-29).\u003c/li>\u003cli>\u003cstrong>Любовта\u003c/strong> — Без нея всяка дарба е нищо (глава 13).\u003c/li>\u003cli>\u003cstrong>Възкресението\u003c/strong> — Ако Христос не е възкръснал, празна е нашата вяра (глава 15).\u003c/li>\u003c/ul>","hristos":"\u003cp>Тук Христос е Разпнатият и Възкръсналият, Главата на тялото, което е Църквата. Павел чете Стария Завет като книга, която говори за Него. Пасхалното агне в Египет: „Христос, Пасхата наша, биде заклан за нас“ (1 Коринтяни 5:7; Изход 12). Преминаването през Червено море е образ на Кръщението, а камъкът, от който пил народът в пустинята — „камъкът беше Христос“ (1 Коринтяни 10:1-4; Изход 17). Най-старото изповедание на вярата стъпва на Писанията: Христос умря за греховете ни и на третия ден възкръсна „според Писанията“ (1 Коринтяни 15:3-4) — същите думи, които казваш в Символа на вярата. Той е последният Адам: „Както в Адама всички умират, тъй и в Христа всички ще оживеят“ (1 Коринтяни 15:22). А викът на пророк Осия става химн на победата: „Де ти е, смърте, жилото? Де ти е, аде, победата?“ (1 Коринтяни 15:55; Осия 13:14).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст тълкувал посланието в беседите си върху Първото послание до коринтяни. Той настоява на единството: който разкъсва Църквата на групи, ранява самото тяло Христово. За Светото Причастие иска да пристъпваме с чиста съвест и със страх, не по навик и не само на големите празници. Неговия глас го чуваш всяка година и в храма: в Огласителното слово на пасхалната нощ свети Иоан повтаря думите на Павел — „Де ти е, смърте, жилото? Де ти е, аде, победата?“ — и възвестява, че Христос възкръсна и животът царува.\u003c/p>","slujbe":"\u003cp>Посланието се чете като Апостол на Божествената литургия през седмиците след Петдесетница, след Посланието до римляни. На \u003cstrong>Велики четвъртък\u003c/strong>, на литургията, се чете предаването на Тайната вечеря (1 Коринтяни 11:23-32), а на утренята на Велика събота — словото за Христос, нашата Пасха (1 Коринтяни 5:6-8). Молитвите преди Светото Причастие отекват с подканата на Павел да не се причастяваме недостойно.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Пасхо наша, Който беше заклан за нас и на третия ден възкръсна според Писанията, изцели разделенията между нас и ни направи едно тяло. Удостои ме да пристъпвам към Твоите свети Тайни, след като изпитам себе си. Дай ми любовта, която е дълготърпелива и никога не отпада. Амин.\u003c/p>"},"q":[{"q":"Кой проблем на коринтската църква изобличава Павел още в началото?","o":["Разделението на групи: „аз съм Павлов“, „аз пък — Аполосов“.","Липсата на храм в града.","Отказа да се приемат езичници за Кръщение."]},{"q":"За какво говори глава 15?","o":["За Възкресението Христово и възкресението на мъртвите.","За дарбата да се говори на езици.","За събирането на помощи за Иерусалим."]}]}},{"n":58,"slug":"2-korintyani","abbr":"2 Кор","cap":13,"s":"pavel","bg":{"nume":"Второ послание до коринтяни","scurt":"Най-личното писмо на апостол Павел: силата Божия се проявява точно в немощта на човека.","verset":{"t":"„стига ти Моята благодат; защото силата Ми се в немощ напълно проявява.“","r":"2 Коринтяни 12:9"},"incepe":"2 Коринтяни 4–5 · 8–9 · 12","p":{"autor":"\u003cp>Посланието е написано от светия апостол Павел, заедно с ученика му Тимотей, около 57 година, от Македония, няколко месеца след първото писмо до коринтяните. Павел сам бил основал църквата в Коринт и я обичал като баща. Това е най-личното от неговите послания: тук той отваря сърцето си, говори за сълзите, опасностите и раните си, но и за утехата, която получава от Бога.\u003c/p>","context":"\u003cp>След първото послание нещата в Коринт не се успокоили напълно. Павел направил едно кратко и мъчително посещение, при което бил оскърбен, а после изпратил писмо „с много сълзи“ (2 Коринтяни 2:4). Междувременно в града пристигнали някакви учители, които се хвалели с дарбите си и злословели апостола, като казвали, че не е истински апостол. Но Тит се върнал от Коринт с добри вести: повечето коринтяни се покаяли. Павел им пише с облекчение, подканя ги да съберат помощ за бедните християни в Иерусалим и защитава служението си — не заради себе си, а за да не изгубят те Евангелието.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Утехата в скърбите\u003c/strong> — Бог ни утешава във всяка скръб, за да можем и ние да утешаваме другите (1:3-4).\u003c/li>\u003cli>\u003cstrong>Съкровището в глинени съдове\u003c/strong> — „Но това съкровище ние носим в глинени съдове“ (4:7): благодатта живее в немощни хора, за да се види, че силата е Божия, а не наша.\u003c/li>\u003cli>\u003cstrong>Примирението\u003c/strong> — Бог ни примири със Себе Си чрез Христа и ни повери служението на примирението (5:18-20).\u003c/li>\u003cli>\u003cstrong>Милостинята с радост\u003c/strong> — „Бог люби оногова, който драговолно дава“ (9:7).\u003c/li>\u003cli>\u003cstrong>Силата в немощта\u003c/strong> — „Жилото в плътта“ не било отнето от Павел, но благодатта му стигала (12:7-10).\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието ни показва Христос като Онзи, Който примирява: „Бог примири света със Себе Си чрез Христа“ (5:19). Безгрешният взе върху Себе Си бремето на нашите грехове (5:21) и, бидейки богат, осиромаша заради нас, та да се обогатим ние чрез Неговата сиромашия (8:9). В глава 3 Павел чете Стария Завет с очите на Църквата: Моисей покривал лицето си с покривало, когато слизал от Синай (Изход 34:29-35), и това покривало се снема само в Христа. Новият завет, предсказан от пророк Иеремия (Иеремия 31:31-33), вече не се пише на каменни плочи, а в сърцата, от Светия Дух. Затова, който е в Христа, той е „нова твар“ (5:17).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст тълкувал цялото послание в беседите си и се спира с възхищение на начина, по който Павел се хвали: не с чудесата, а с бичуванията, корабокрушенията и немощите си. За свети Иоан това е белегът на истинския пастир — на онзи, който страда за стадото си, а не на онзи, който блести. Блажени Теофилакт Охридски, вървейки по неговите стъпки, тълкува милостинята като сеитба: който сее щедро, щедро и ще пожъне (9:6).\u003c/p>","slujbe":"\u003cp>Посланието се чете като Апостол на Божествената литургия в неделите в края на лятото и началото на есента (приблизително от 14-ата до 19-ата неделя след Петдесетница). На празника на светите апостоли Петър и Павел (29 юни) чуваш точно страницата за страданията и откровенията на Павел (11:21–12:9). А на всяка Божествена литургия свещеникът благославя народа с думите на последния стих на посланието: „Благодатта на Господа нашего Иисуса Христа, и любовта на Бога и Отца, и общуването на Светаго Духа да бъдат с всички вас“ (13:13).\u003c/p>","rugaciune":"\u003cp>Господи, Боже на всяка утеха, Ти знаеш колко съм немощен и колко лесно се плаша от слабостите си. Научи ме да не се срамувам от тях, а да ги нося при Тебе, за да се прояви в тях Твоята сила. Примири ме с Тебе и с онези, които съм наранил, и ме направи глинен съд, който пази Твоето съкровище. Амин.\u003c/p>"},"q":[{"q":"Какво отговорил Господ на апостол Павел, когато се молел да му бъде отнето „жилото в плътта“?","o":["„стига ти Моята благодат; защото силата Ми се в немощ напълно проявява“.","Веднага го отнел и го направил здрав.","Заповядал му да не проповядва, докато не оздравее."]},{"q":"Кои думи от това послание казва свещеникът на всяка Божествена литургия?","o":["Благословията „Благодатта на Господа нашего Иисуса Христа, и любовта на Бога и Отца, и общуването на Светаго Духа да бъдат с всички вас“.","Молитвата „Отче наш“.","Песента „Всички, които в Христа се кръстихте“."]}]}},{"n":59,"slug":"galatyani","abbr":"Гал","cap":6,"s":"pavel","bg":{"nume":"Послание до галатяни","scurt":"Писмото на свободата: човек се спасява чрез вярата в Христа, която действа чрез любов, а не чрез наредбите на стария Закон.","verset":{"t":"„и вече не аз живея, а Христос живее в мене.“","r":"Галатяни 2:20"},"incepe":"Галатяни 2:15-21 · 3:23–4:7 · 5","p":{"autor":"\u003cp>Посланието го пише светият апостол Павел „до църквите Галатийски“, в една област в средата на Мала Азия, където сам бил проповядвал Евангелието по време на пътуванията си. Написано е най-вероятно между 54 и 57 година. То е пламенно писмо, написано на един дъх, и накрая Павел взема перото и добавя няколко реда със собствената си ръка (6:11), за да се види колко го е грижа за онези, до които пише.\u003c/p>","context":"\u003cp>След заминаването на Павел в Галатия дошли някакви християни от юдеите, които учели новопокръстените, че вярата в Христа не стига: за да се спасят, трябва да се обрежат и да пазят целия Закон Моисеев. Същите казвали, че Павел не е истински апостол. Галатяните, смутени, започнали да ги слушат. Павел им пише разтревожен като баща: „Чудя се, че тъй скоро преминавате… към друго благовестие“ (1:6). Разказва им как го призовал Сам Христос, как се съгласил в Иерусалим с Петър, Иаков и Иоан, и им показва, че Божият дар не се заслужава, а се приема.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Едно-единствено Евангелие\u003c/strong> — Радостната вест не се променя според вкуса на хората (1:6-9).\u003c/li>\u003cli>\u003cstrong>Вярата, а не делата на Закона\u003c/strong> — Човек се оправдава чрез вяра в Иисуса Христа, а не чрез обрязването и старите наредби (2:16).\u003c/li>\u003cli>\u003cstrong>Осиновението\u003c/strong> — Чрез Светия Дух вече не сме роби, а деца, и викаме към Бога: „Авва, сиреч, Отче!“ (4:6).\u003c/li>\u003cli>\u003cstrong>Свободата, която служи\u003c/strong> — Важното е „вярата, която действува чрез любов“ (5:6).\u003c/li>\u003cli>\u003cstrong>Плодът на Духа\u003c/strong> — „любов, радост, мир, дълготърпение, благост, милосърдие, вяра, кротост, въздържание“ (5:22-23).\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието до галатяни ни показва Христос като изпълнение на обещанието, дадено на Авраам. Бог казал на патриарха, че в неговото потомство ще бъдат благословени всички народи (Битие 12:3; 22:18); Павел показва, че това Семе е Христос (3:16). Законът Моисеев, който дошъл по-късно, бил „възпитател в Христа“ (3:24): като роба, който в древността хващал детето за ръка и го водел при учителя. А „когато се изпълни времето, Бог изпрати Своя Син… Който се роди от жена“ (4:4), за да ни направи Свои деца. На Кръста Христос взе върху Себе Си клетвата, която тежеше над нас (3:13; Второзаконие 21:23). Дори историята на Агар и Сара (4:21-31) се чете като образ на двата завета: на робството и на свободата.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст, в тълкуванието си на това послание, забелязва, че Павел започва без обичайните похвали, с гласа на баща, който се е уплашил за децата си. Той пояснява, че „делата по закона“, които апостолът отстранява, са обрязването, съботите и другите стари наредби, а не добрите дела: истинската вяра винаги ражда любов. А блажени Иероним оставил на Църквата подробно тълкувание на посланието. По стъпките на Отците Църквата чете съвсем конкретно думите „Христос живее в мене“: християнинът не просто следва Христос отвън, а Го носи в себе си, чрез Кръщението и Светото Причастие.\u003c/p>","slujbe":"\u003cp>Един стих от Посланието до галатяни го знаеш наизуст: „всички, които в Христа се кръстихте, в Христа се облякохте“ (3:27) — в храма го чуваш и на църковнославянски: „Елици во Христа крестистеся, во Христа облекостеся“. Пее се при тайнството Кръщение и замества Трисвятата песен („Светий Боже“) на литургията на големите празници: Рождество Христово, Богоявление, Лазарова събота, Велика събота, Великден и Петдесетница. На Рождество Христово Апостолът е Галатяни 4:4-7. На паметите на преподобните се чете страницата за плода на Духа (5:22–6:2), а други откъси се чуват в неделите през есента.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Ти ме облече в Себе Си при Кръщението и ме направи дете на Отца. Не ме оставяй да се върна в робството на греха, нито да се опирам на себе си. Живей Ти в мене, та животът ми да дава плод на любов, радост, мир и кротост, за Твоя слава. Амин.\u003c/p>"},"q":[{"q":"Какво искали от галатяните учителите, дошли след заминаването на Павел?","o":["Да се обрежат и да пазят Закона Моисеев, за да се спасят.","Да престанат изобщо да се молят.","Всички да се преселят в Иерусалим."]},{"q":"Кой стих от Посланието до галатяни се пее при Кръщението и на големите празници?","o":["„всички, които в Христа се кръстихте, в Христа се облякохте“.","„Господ е Пастир мой, от нищо не ще се нуждая“.","„Радвайте се винаги в Господа“."]}]}},{"n":60,"slug":"efesyani","abbr":"Еф","cap":6,"s":"pavel","bg":{"nume":"Послание до ефесяни","scurt":"Великата тайна Божия: всички хора, събрани в едно Тяло — Църквата, чиято Глава е Христос.","verset":{"t":"„един е Господ, една е вярата, едно е кръщението, един е Бог и Отец на всички“","r":"Ефесяни 4:5-6"},"incepe":"Ефесяни 1 · 2 · 4 · 6:10-18","p":{"autor":"\u003cp>Светият апостол Павел пише това послание окован във вериги, по време на затворничеството си в Рим, около 61–63 година; сам нарича себе си „окованик Иисус Христов“ (3:1). Писмото го отнесъл Тихик, верният му ученик (6:21). Макар да е писано в затвора, в него няма нищо тежко: то е спокойно и възвишено като химн, а първите му глави приличат повече на молитва, отколкото на писмо.\u003c/p>","context":"\u003cp>Ефес бил един от най-големите градове на Мала Азия, богато пристанище, прочуто в целия древен свят с храма на богинята Артемида и с магьосничествата си. Павел проповядвал там почти три години (Деяния 19–20) и оставил след себе си жива църква, съставена главно от бивши езичници. Този път не им пише, за да поправи някакъв конкретен смут. Иска да покаже на християните, обкръжени от идоли и от силата на Рим, колко голям е дарът, който са получили. Първите три глави разкриват Божия замисъл; последните три показват как той се живее в Църквата, в дома и в борбата със злото.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Вечният замисъл Божий\u003c/strong> — Избрани сме в Христа, „преди да се свят създаде“ (1:4).\u003c/li>\u003cli>\u003cstrong>Църквата, Тяло Христово\u003c/strong> — Той е Главата, а ние сме членове един на друг (1:22-23; 4:15-16).\u003c/li>\u003cli>\u003cstrong>Единството\u003c/strong> — Юдеи и езичници станаха едно: „Той е нашият мир“ (2:14).\u003c/li>\u003cli>\u003cstrong>Новият човек\u003c/strong> — Съблича се старият живот и се облича новият човек (4:22-24).\u003c/li>\u003cli>\u003cstrong>Бракът и духовната борба\u003c/strong> — Домът на християнина е образ на Църквата (5:21-33), а животът му е борба, в която той облича Божието всеоръжие (6:10-17).\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието до ефесяни ни показва Христос като Онзи, в Когото се събира всичко: волята на Отца е „да съедини всичко небесно и земно под един глава — Христа“ (1:10). Гръцката дума на апостола означава буквално „да събере отново под една глава“ — точно така я превежда и нашата Библия. Христос е краеъгълният камък (2:20), предсказан от псалмопевеца и от Исаия (Псалом 117:22; Исаия 28:16), и върху Него се съгражда истинският храм, Църквата. Неговото Възнесение изпълнява Псалом 67:19: „като се възкачи на височината, плени плен и даде дарове на човеците“ (4:8). А словото от началото на света — двамата „ще бъдат… една плът“ (Битие 2:24) — тук разкрива своята дълбочина: „Тази тайна е велика; но аз говоря за Христа и за църквата“ (5:32). Адам и Ева били още в рая образ на Христос и на Неговата Църква.\u003c/p>","parinti":"\u003cp>Св. Ириней Лионски тръгнал от словото за събирането на всичко под една глава в Христа (1:10), за да покаже, че Спасителят, новият Адам, поема отначало цялата история на човека и я изцелява: там, където Адам падна чрез непослушание, Христос побеждава чрез послушание. Св. Иоан Златоуст, в беседите си върху Посланието до ефесяни, се спира дълго на главата за брака и нарича дома на християнина „малка църква“. Той показва, че мъжът е глава на жената само по начина, по който Христос е Глава на Църквата: като дава живота си за нея, а не като ѝ заповядва.\u003c/p>","slujbe":"\u003cp>Най-известното място е Апостолът на тайнството Брак, при венчанието (Ефесяни 5:20-33), с думите „Тази тайна е велика“. В неделята след Богоявление се чете Ефесяни 4:7-13, за даровете на възнесения Христос. Други откъси се чуват в неделите в края на есента, преди Рождественския пост и в началото му — сред тях словото за духовното всеоръжие (6:10-17) и призивът „стани ти, който спиш“ (5:14).\u003c/p>","rugaciune":"\u003cp>Боже и Отче на нашия Господ Иисус Христос, благодаря Ти, че ме призова в Своята Църква и ме направи член на Тялото на Твоя Син. Просвети очите на сърцето ми, за да позная надеждата, към която си ме призвал. Пази дома ми в мир и ме укрепи в борбата със злото. Амин.\u003c/p>"},"q":[{"q":"С какво сравнява апостол Павел Църквата в Посланието до ефесяни?","o":["С тяло, чиято Глава е Христос.","С войска, водена от римския император.","С храма на богинята Артемида."]},{"q":"При кое тайнство се чете Апостолът от Ефесяни 5, с думите „Тази тайна е велика“?","o":["При тайнството Брак.","При тайнството Елеосвещение.","При тайнството Изповед."]}]}},{"n":61,"slug":"filipyani","abbr":"Фил","cap":4,"s":"pavel","bg":{"nume":"Послание до филипяни","scurt":"Писмото на радостта, изпратено от затвора: който има смиреното мислене на Христос, не губи мира си дори във вериги.","verset":{"t":"„Радвайте се винаги в Господа, и пак ще кажа: радвайте се.“","r":"Филипяни 4:4"},"incepe":"Филипяни 2:1-11 · 3:7-14 · 4:4-13","p":{"autor":"\u003cp>Посланието го пише светият апостол Павел, заедно с Тимотей, от затвора — според Свещеното Предание от Рим, около 62–63 година. Павел още не знае дали ще бъде освободен, или осъден на смърт, и все пак думата, която постоянно се връща в тези четири глави, е „радост“. Той пише „до всички в Христа Иисуса светии, които се намират във Филипи, с епископи и дякони“ (1:1), тоест до една вече добре устроена църква.\u003c/p>","context":"\u003cp>Филипи, град в Македония близо до днешна Кавала, в Северна Гърция, бил първото място в Европа, където Павел проповядвал Евангелието. Там се кръстила Лидия, търговката на багреница, която Църквата почита като първата кръстена в Европа, и там, след една нощ в тъмницата и едно земетресение, се кръстил тъмничарят с целия си дом (Деяния 16). Филипяните останали най-близките приятели на апостола. Когато научили, че е в затвора, му изпратили помощ по Епафродит. Той се разболял тежко, почти до смърт, и когато оздравял, Павел го изпратил обратно с това благодарствено писмо. В него ги подканя също да оставят настрана малките си несъгласия и да бъдат единомислени.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Радостта в Господа\u003c/strong> — Радост, която не зависи от обстоятелствата, а от това, че Христос е близо (4:4-7).\u003c/li>\u003cli>\u003cstrong>Смирението\u003c/strong> — „вие трябва да имате същите мисли, каквито е имал Иисус Христос“ (2:5).\u003c/li>\u003cli>\u003cstrong>Животът е Христос\u003c/strong> — „за мене животът е Христос, а смъртта — придобивка“ (1:21); всички стари придобивки са загуба пред познанието за Него (3:7-8).\u003c/li>\u003cli>\u003cstrong>Пътят към целта\u003c/strong> — Като забравя онова, което е зад него, християнинът тича напред, защото „нашето живелище е на небесата“ (3:13-14.20).\u003c/li>\u003cli>\u003cstrong>Доволството\u003c/strong> — Да умееш да бъдеш и сит, и гладен: „Всичко мога чрез Иисуса Христа, Който ме укрепява“ (4:13).\u003c/li>\u003c/ul>","hristos":"\u003cp>В сърцето на посланието стои един химн за Христос (2:6-11), една от най-възвишените страници на Новия Завет. Синът Божий, макар да бил равен на Отца, „понизи Себе Си, като прие образ на раб“ и стана послушен „дори до смърт, и то смърт кръстна“. Това е обратният път на Адам: той протегнал ръка, за да стане равен на Бога, и паднал; Христос, Който е Бог, слиза по Своя воля и ни издига. Тук се изпълнява пророчеството на Исаия за страдащия Раб Господен (Исаия 53). А словото, което Бог казал чрез същия пророк — че пред Него ще се преклони всяко коляно (Исаия 45:23), — сега се казва за Иисус: Той е Господ.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст, в беседите си върху Посланието до филипяни, използва химна от глава 2, за да покаже правата вяра: Христос е истински Бог, понеже е „в образ Божий“, и истински човек, понеже прие „образ на раб“. Но веднага добавя, че Павел не казва това като урок, а като лекарство против гордостта: ако Владиката се смири, как ще се възгордее рабът? Св. Кирил Александрийски на свой ред учи, че това „понижаване“ не означава, че Синът е престанал да бъде Бог, а че е приел да вземе върху Себе Си всичко наше, освен греха.\u003c/p>","slujbe":"\u003cp>Химнът за смирението на Христос (Филипяни 2:5-11) е Апостолът на Рождество на Пресвета Богородица (Малка Богородица, 8 септември) и на Успение на Пресвета Богородица (Голяма Богородица, 15 август): Църквата почита онази, която със смирение послужи на това снизхождение. На Цветница се чете Филипяни 4:4-9: „Радвайте се винаги в Господа… Господ е близо“. Останалата част от посланието се чува на литургиите в делничните дни.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Който се смири заради мене до смърт кръстна, дари ми Твоето мислене. Изтръгни от сърцето ми гордостта и роптанието и ме научи да се радвам в Тебе и в доброто, и в трудното. Твоят мир, „който надвишава всеки ум“, нека пази сърцето ми и мислите ми. Амин.\u003c/p>"},"q":[{"q":"Откъде пише апостол Павел Посланието до филипяни?","o":["От затвора.","От дома на Лидия, във Филипи.","От един кораб, на път за Иерусалим."]},{"q":"Какво казва за Христос химнът от Филипяни 2?","o":["Че понизи Себе Си, прие образ на раб и стана послушен до смърт кръстна.","Че дойде на света като земен цар, с голяма войска.","Че не е страдал наистина."]}]}},{"n":62,"slug":"kolosyani","abbr":"Кол","cap":4,"s":"pavel","bg":{"nume":"Послание до колосяни","scurt":"Христос е над всичко: чрез Него е създадено всичко и в Него имаме всичко, от което се нуждаем за спасението.","verset":{"t":"„Който е образ на невидимия Бог, роден преди всяка твар“","r":"Колосяни 1:15"},"incepe":"Колосяни 1:9-23 · 2:6-17 · 3:1-17","p":{"autor":"\u003cp>Светият апостол Павел пише това послание, заедно с Тимотей, от затвора в Рим, около 61–63 година, по същото време като Посланието до ефесяни и Посланието до Филимона. Писмото го носят Тихик и Онисим (4:7-9). До Павел тогава е и „Лука, многообичният лекар“ (4:14), евангелистът. Посланието е кратко, само четири глави, но съдържа едно от най-възвишените изповедания за Христос в цялото Писание.\u003c/p>","context":"\u003cp>Колоса бил малък град във Фригия, в Мала Азия, недалеч от Ефес. Църквата там не била основана от Павел, а от неговия ученик Епафрас (1:7); повечето колосяни никога не били виждали апостола лице в лице. Епафрас дошъл в Рим със смесени вести: вярата на колосяните била жива, но между тях се било промъкнало едно странно учение. Някои казвали, че Христос не стига: че трябва още да се пазят празниците и съботите на стария Закон, някои забрани за храни и едно почитане на ангелите (2:16-18). Павел отговаря без много спорове: показва им кой е Христос и всичко останало само застава на мястото си.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Христос над всичко\u003c/strong> — „всичко чрез Него и за Него е създадено“, видимо и невидимо (1:16).\u003c/li>\u003cli>\u003cstrong>Пълнотата\u003c/strong> — „в Него телесно обитава всичката пълнота на Божеството“ (2:9); няма защо да търсим другаде.\u003c/li>\u003cli>\u003cstrong>Кръщението, смърт и възкресение\u003c/strong> — Погребани сме и възкресени заедно с Христос (2:12).\u003c/li>\u003cli>\u003cstrong>Горното\u003c/strong> — „за небесното мислете, а не за земното“ (3:2).\u003c/li>\u003cli>\u003cstrong>Новият човек във всекидневния живот\u003c/strong> — Милосърдие, кротост, прошка и преди всичко любов (3:12-14).\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието до колосяни ни показва Христос като Творец и Господ на целия свят: Той е „образ на невидимия Бог“, чрез Него е създадено всичко, дори ангелите, и Той е „Глава на тялото, сиреч на църквата“ (1:15-18). Онзи, за Когото Битие казва, че създаде света със словото Си, е същият, Който беше разпнат за нас. За Стария Завет Павел казва една ключова дума: п
