<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Картата на Словото — 77-те книги на Библията</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E2654">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Картата на Словото">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2210%22%20fill%3D%22%230E2654%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23D4A14A%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%2214%22%2F%3E%3Cpath%20d%3D%22M24%2014v20M21%2018.5h6M18.5%2023h11M20.5%2028.5l7%202.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-alt:#FEFDFB; --cream:#FBF8F2; --cream-dk:#F5F1EA;
  --card:#FFFFFF; --border:#E3DDD3;
  --navy:#0E2654; --ink:#091A36; --ink-btn:#07183A; --body:#33435D; --muted:#6B778C;
  --gold:#A97D3A; --gold-lt:#C9A562; --gold-bg:rgba(200,165,100,.18); --red:#B3261E;
  --grad-btn:linear-gradient(135deg,#ECCE83 0%,#D4A14A 50%,#B47825 100%);
  --sh-card:0 1px 3px rgba(0,0,0,.08),0 1px 2px -1px rgba(0,0,0,.08);
  --sh-btn:0 14px 30px -12px rgba(149,103,37,.55);
  --top:#0E2654; --top-ink:#FBF8F1;
}
:root[data-night="1"]{
  --bg:#0B1730; --bg-alt:#0E1D3B; --cream:#11234A; --cream-dk:#152A55;
  --card:#11224A; --border:#263B68;
  --navy:#F3E9D2; --ink:#EEF1F7; --body:#C9D2E3; --muted:#93A1BC;
  --gold:#D9B26A; --gold-lt:#C9A562; --gold-bg:rgba(217,178,106,.16); --red:#FF8A80;
  --sh-card:none; --top:#081226;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Poppins,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg-alt);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:84px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1{font-weight:700;font-size:clamp(25px,5.4vw,34px);line-height:1.2;letter-spacing:-.6px;color:var(--navy);text-wrap:balance}
h2{font-weight:700;font-size:19px;line-height:1.3;letter-spacing:-.3px;color:var(--navy)}
h3{font-weight:600;font-size:16px;color:var(--navy)}
p{color:var(--body)}
small{font-size:13px}
.ic{width:20px;height:20px;flex:0 0 20px}
.mark{width:30px;height:30px;color:var(--gold-lt);flex:0 0 30px}
.kick{display:block;font-weight:600;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.center{text-align:center}
.lead{font-size:17px;color:var(--body);margin-top:10px}
.link{display:inline-block;margin-top:12px;font-weight:600;font-size:14px;color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* chrome */
#top{position:sticky;top:0;z-index:20;background:var(--top);color:var(--top-ink);display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.2px;color:#F3E2B8}
.tabs{display:none;gap:4px;margin-left:auto}
.tabs a{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:500;color:rgba(251,248,241,.78)}
.tabs a.on{background:rgba(236,206,131,.16);color:#ECCE83}
.ttools{margin-left:auto;display:flex;gap:6px}
#top .tbtn{border-color:rgba(251,248,241,.25);color:#FBF8F1;background:transparent;padding:7px 10px}
#top .tbtn.on{background:rgba(236,206,131,.2);color:#ECCE83}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--border);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:500;color:var(--muted);border-radius:12px}
#bottom a.on{color:var(--gold);font-weight:600}
#bottom .ic{width:22px;height:22px}
#view{max-width:760px;margin:0 auto;padding:20px 16px 8px}
#view>section,#view>.card,#view>details,#view>.tiles,#view>article{margin-top:22px}
@media(min-width:860px){
  body{padding-bottom:32px}
  #bottom{display:none}
  .tabs{display:flex}
  .ttools{margin-left:8px}
  #view{padding-top:32px}
}

/* piezas */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-card);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad-btn);color:var(--ink-btn);font-weight:700;font-size:15px;
  padding:14px 22px;border-radius:999px;box-shadow:var(--sh-btn);line-height:1.25;text-align:center}
.btn.ghost{background:var(--gold-bg);color:var(--gold);box-shadow:none}
.btn:hover{filter:brightness(1.04)}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:600;color:var(--navy);line-height:1.2}
.tbtn small{font-size:10px}
.tbtn .ic{width:16px;height:16px;flex-basis:16px}
.tbtn.on{background:var(--gold-bg);border-color:var(--gold-lt);color:var(--gold)}
.tbtn.danger{color:var(--red)}
.inp{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;outline:0}
.inp:focus{border-color:var(--gold-lt);box-shadow:0 0 0 3px var(--gold-bg)}
.inp.big{font-size:22px;font-weight:600;text-align:center;margin-top:12px}
textarea.inp{resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--border);background:var(--card);color:var(--navy);font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px}
.chip.on{background:var(--gold-bg);border-color:var(--gold-lt);color:var(--gold)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:1px solid var(--border);color:var(--body);font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--card)}
.pill.gold{border-color:var(--gold-lt);color:var(--gold);background:var(--gold-bg)}
.bar{height:8px;border-radius:999px;background:var(--cream-dk);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--grad-btn);border-radius:999px;transition:width .3s}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.vhead{margin-top:6px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--gold);margin-bottom:10px}
.back .ic{width:16px;height:16px;flex-basis:16px}

/* home */
.hero{display:flex;gap:18px;align-items:center;background:linear-gradient(180deg,var(--card) 0%,var(--cream) 100%)}
.hero-t{flex:1;min-width:0}
.hero-t h1{font-size:clamp(21px,4.6vw,27px)}
.hero-t p{margin:8px 0 14px;font-size:15px}
.hero .btn{font-size:14px;padding:12px 18px}
.ring{position:relative;width:104px;height:104px;flex:0 0 104px}
.ring svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--cream-dk);stroke-width:9}
.ring-fg{fill:none;stroke:#D4A14A;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ring-t b{font-size:20px;color:var(--navy)}
.ring-t span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
@media(max-width:420px){.ring{width:84px;height:84px;flex-basis:84px}.ring-t b{font-size:16px}}
.verse blockquote{font-size:18px;font-weight:600;line-height:1.45;color:var(--navy)}
.verse a{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--gold)}
.today{display:block}
.today b{display:block;color:var(--navy);font-weight:600;line-height:1.35}
.today b.fP{color:var(--red)}
.today small{display:block;margin-top:4px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tiles.big{grid-template-columns:1fr}
@media(min-width:620px){.tiles.big{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-card);padding:16px;min-width:0}
.tile b{color:var(--navy);font-weight:600;line-height:1.3;font-size:15px}
.tile small{color:var(--muted);line-height:1.4}
.tile:hover{border-color:var(--gold-lt)}

/* lista de libros */
.filters{margin-top:16px}
.blist{display:grid;gap:8px;margin-top:12px}
.brow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 12px;min-width:0}
.brow>.ic{color:var(--border);width:16px;height:16px;flex-basis:16px}
.bnum{flex:0 0 34px;height:34px;border-radius:50%;background:var(--gold-bg);color:var(--gold);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.brow.is-read .bnum{background:var(--grad-btn);color:var(--ink-btn)}
.bnum .ic{width:17px;height:17px}
.btxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.btxt b{color:var(--navy);font-weight:600;font-size:15px}
.btxt small{color:var(--muted);margin-top:2px;line-height:1.35}
.bfav{color:#D4A14A;display:flex}.bfav .ic{fill:currentColor;width:16px;height:16px}

/* lector */
.book{font-size:calc(16.5px * var(--fs,1))}
.book .part p,.book .part li,.md p,.md li{font-size:1em;line-height:1.7;color:var(--body)}
.bhead h1{margin-top:2px}
.btools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tbtn.on .ic{fill:currentColor}
.bverse{margin-top:22px;background:var(--cream-dk);border-radius:16px;padding:20px;font-weight:600;font-size:1.08em;line-height:1.45;color:var(--navy);text-align:center}
.bverse cite{display:block;margin-top:8px;font-style:normal;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.part{margin-top:28px}
.part h2{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
.pn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--gold-bg);color:var(--gold);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:0}
.part p+p{margin-top:10px}
.part ul,.md ul,.md ol{margin:6px 0 0 20px;display:grid;gap:8px}
.part strong,.md strong{color:var(--navy);font-weight:600}
.prayer{background:var(--cream-dk);border:1px solid var(--gold-lt);border-radius:16px;padding:20px}
.prayer p{font-style:italic;color:var(--navy)}
.startbox{margin-top:22px;border:1px dashed var(--gold-lt);border-radius:16px;padding:18px;background:var(--card)}
.startbox p b{color:var(--navy);font-size:1.05em}
.startbox small{color:var(--muted);display:block;margin-top:4px}
.quiz,.notes{margin-top:30px}
.q{margin-top:14px}
.q p,.qq{margin-bottom:8px;color:var(--navy)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:11px 14px;margin-top:8px;font-size:.94em;color:var(--body);line-height:1.4}
.opt:hover{border-color:var(--gold-lt)}
.opt.ok{border-color:#2E7D4F;background:rgba(46,125,79,.12);color:var(--ink);font-weight:600}
.opt.ko{border-color:var(--red);background:rgba(179,38,30,.08)}
.notes textarea{margin-top:10px}
.done{margin-top:28px;text-align:center}
.pn-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;border-top:1px solid var(--border);padding-top:18px}
.pn-nav a{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--navy);font-size:14px;max-width:48%;line-height:1.3}
.pn-nav a.r{text-align:right;margin-left:auto}
.pn-nav small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* md */
.md h1{margin-bottom:12px}
.md h2{margin-top:30px;font-size:1.25em}
.md h3{margin-top:24px;font-size:1.06em;color:var(--navy);padding-top:14px;border-top:1px solid var(--border)}
.md p{margin-top:10px}
.md blockquote{margin-top:14px;background:var(--cream-dk);border-left:3px solid var(--gold-lt);border-radius:0 12px 12px 0;padding:14px 16px}
.md blockquote p{margin:0;color:var(--navy);font-style:italic}
.md+.center,.center .btn,.center .tbtn{margin-top:18px}

/* días / acordeones */
details.day{padding:0;overflow:hidden}
details.day+details.day{margin-top:10px !important}
details.day summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
details.day summary>.ic{color:var(--muted);transition:transform .2s}
details.day[open] summary>.ic{transform:rotate(90deg)}
.dnum{flex:0 0 38px;height:38px;border-radius:50%;background:var(--gold-bg);color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:center}
.is-done .dnum{background:var(--grad-btn);color:var(--ink-btn)}
.dt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.dt b{color:var(--navy);font-weight:600}
.dt small{color:var(--muted);margin-top:2px}
details.day .blist,details.day .plist,details.day .cand{padding:0 12px 14px;margin-top:0}
.plist{display:grid;gap:6px}
.prow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;border:1px solid var(--border);cursor:pointer}
.prow input{width:20px;height:20px;margin-top:3px;accent-color:#B47825;flex:0 0 20px}
.pday{flex:0 0 26px;font-weight:700;color:var(--gold);font-size:13px;margin-top:2px}
.prow .btxt{display:block;color:var(--body);font-size:14.5px}
.prow .btxt small{display:block}
.prow.is-read{background:var(--cream)}
.prow.is-read .btxt b{text-decoration:line-through;text-decoration-color:var(--gold-lt)}
.cand{list-style:none;display:grid;gap:10px}
.cand li{display:flex;flex-direction:column;border-left:3px solid var(--gold-lt);padding-left:12px}
.cand b{color:var(--navy);font-weight:600}
.cand span{color:var(--body);font-size:14.5px}

/* rugăciune ghidată */
.steps{margin:16px 0 0 22px;display:grid;gap:12px}
.steps b{color:var(--navy)}
.guided{text-align:center}
.gtext{font-size:17px;margin-top:10px}
.gtime{font-size:54px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;margin:14px 0}
.grow{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* calendar */
.calnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.calnav b{min-width:140px;text-align:center;color:var(--navy)}
.months{margin-top:14px;display:grid;gap:16px}
.month{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;break-inside:avoid}
.month h3{text-align:center;margin-bottom:10px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdh span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.cd{position:relative;display:flex;align-items:center;justify-content:center;height:42px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink);font-style:normal}
.cd.off{visibility:hidden}
.cd.sun{color:var(--red)}
.cd.fast{background:var(--cream-dk)}
.cd.alba{background:repeating-linear-gradient(135deg,var(--cream-dk) 0 4px,transparent 4px 8px)}
.cd.fS{color:var(--gold);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--gold-lt)}
.cd.fP{color:#fff;background:var(--red);font-weight:700}
:root[data-night="1"] .cd.fP{color:#0B1730}
.cd.tdy{outline:2px solid var(--navy);outline-offset:1px}
.flist{list-style:none;margin-top:12px;display:grid;gap:6px;font-size:13.5px}
.flist li{display:flex;gap:10px;color:var(--body);line-height:1.35}
.flist b{flex:0 0 44px;color:var(--navy)}
.flist .fP span{color:var(--red);font-weight:600}
.flist .fS span{color:var(--navy);font-weight:600}
.flist a{color:var(--gold);font-weight:600;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:14px;font-size:13px;color:var(--body)}
.legend span{display:flex;align-items:center;gap:8px}
.legend .cd{width:26px;height:26px;font-size:12px}
.fasts{list-style:none;display:grid;gap:10px;margin:12px 0}
.fasts li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px}
.fasts b{color:var(--navy);font-weight:600}
.fasts span{color:var(--body)}
@media(min-width:700px){.months.all{grid-template-columns:1fr 1fr}}

/* herramientas */
.settings .srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.srow>span:first-child{color:var(--navy);font-weight:500;display:flex;flex-direction:column}
.srow small{color:var(--muted);font-weight:400}
.sbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.settings p{margin-top:12px}
.jitem{margin-top:10px}.jitem p{margin-top:6px;white-space:pre-wrap}
.dict{margin-top:14px;display:grid;gap:10px}
.ditem{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.ditem dt{color:var(--navy);font-weight:600}
.ditem dt em{color:var(--muted);font-weight:400}
.ditem dd{color:var(--body);font-size:14.5px;margin-top:2px}
.tl{list-style:none;margin-top:20px;border-left:2px solid var(--gold-lt);padding-left:20px;display:grid;gap:26px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:#D4A14A;box-shadow:0 0 0 4px var(--bg-alt)}
.tl p{margin-top:6px;font-size:15px}
.psr{margin-top:14px;text-align:center}
.pst{width:100%;border-collapse:collapse;margin:12px 0;font-size:14.5px}
.pst th,.pst td{padding:8px;border-bottom:1px solid var(--border);text-align:center;color:var(--body)}
.pst th{color:var(--navy);font-weight:600}
.diploma{margin-top:20px;border:2px solid var(--gold-lt);outline:1px solid var(--gold-lt);outline-offset:-10px;border-radius:8px;background:var(--bg-alt);padding:44px 28px;text-align:center}
.diploma .mark{width:64px;height:64px;margin:0 auto 12px;display:block}
.diploma h1{margin:6px 0 18px}
.dname{font-size:28px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--gold-lt);display:inline-block;padding:4px 28px;margin:12px 0}
.dverse{margin-top:22px;font-style:italic;color:var(--navy)}
.diploma small{display:block;margin-top:18px;color:var(--muted)}

.cover{text-align:center;padding:48px 16px 8px}
.cover .mark{width:72px;height:72px;margin:0 auto 14px;display:block}
.pbreak{margin-top:48px !important;padding-top:32px;border-top:1px solid var(--border)}
@media print{
  .pbreak{break-before:page;border-top:0;padding-top:0;margin-top:0 !important}
  .cover{padding-top:30vh}
  .part,.prayer,.startbox,.bverse{break-inside:avoid}
  :root{--bg-alt:#fff}
  body{padding:0;background:#fff}
  #top,#bottom,.noprint{display:none !important}
  #view{max-width:none;padding:0}
  .card,.month,.brow{box-shadow:none}
  details.day:not([open]) > *:not(summary){display:block}
  .months.all{grid-template-columns:1fr 1fr}
  .cd.fP{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cd.fast,.prayer,.bverse{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{text-decoration:none}
}

body{font-family:Inter,Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}

"set.reset":"Изтриване на целия напредък","set.resetBtn":"Изтрий","set.resetAsk":"Сигурен ли си, че искаш да изтриеш напредъка, бележките и отметките?","set.note":"Напредъкът и бележките се пазят само на това устройство, в този браузър. Нищо не се изпраща никъде.","mon1":"януари","mon2":"февруари","mon3":"март","mon4":"април","mon5":"май","mon6":"юни","mon7":"юли","mon8":"август","mon9":"септември","mon10":"октомври","mon11":"ноември","mon12":"декември","monN1":"Януари","monN2":"Февруари","monN3":"Март","monN4":"Април","monN5":"Май","monN6":"Юни","monN7":"Юли","monN8":"Август","monN9":"Септември","monN10":"Октомври","monN11":"Ноември","monN12":"Декември","wd0":"неделя","wd1":"понеделник","wd2":"вторник","wd3":"сряда","wd4":"четвъртък","wd5":"петък","wd6":"събота","wds0":"Нд","wds1":"Пн","wds2":"Вт","wds3":"Ср","wds4":"Чт","wds5":"Пт","wds6":"Сб","all.title":"Цялата книга, за разпечатване","all.desc":"Всичките 77 корена един след друг, готови за разпечатване или за запазване като PDF.","all.lead":"Всичките 77 корена, един след друг. Натисни бутона и избери „Запази като PDF“ или своя принтер (излиза добре и във формат A5).","all.btn":"Разпечатай или запази като PDF","all.sub":"77-те книги на Библията, един корен за всяка книга"}},"sections":[{"id":"petoknizhie","bg":"Петокнижие — петте книги на Моисей"},{"id":"istoricheski","bg":"Исторически книги"},{"id":"uchitelni","bg":"Учителни (поетични) книги"},{"id":"golemi-prorotsi","bg":"Големите пророци"},{"id":"malki-prorotsi","bg":"Дванадесетте малки пророци"},{"id":"nekanonichni","bg":"Неканоничните книги"},{"id":"evangelia","bg":"Светите Евангелия"},{"id":"deyania","bg":"Деяния на светите апостоли"},{"id":"pavel","bg":"Послания на апостол Павел"},{"id":"saborni","bg":"Съборни послания"},{"id":"otkrovenie","bg":"Откровение"}],"books":[{"n":1,"slug":"bitie","abbr":"Бит","cap":50,"s":"petoknizhie","bg":{"nume":"Битие","scurt":"Книгата на началата: сътворението на света, грехопадението на човека и обещанието, с което Бог започва да го търси и да го спасява.","verset":{"t":"„В начало Бог сътвори небето и земята.“","r":"Битие 1:1"},"incepe":"Битие 1–3 · 12 · 22 · 37 · 45","p":{"autor":"\u003cp>Според Свещеното Предание на Църквата книга Битие е написана от светия пророк Моисей, около хиляда и петстотин години преди Рождество Христово, по времето на странстването в пустинята. Тя е първата от петте книги на Моисей, които заедно се наричат Петокнижие или Закон. Моисей не е бил очевидец на онова, което разказва: просветен от Светия Дух, той записва това, което Бог му е открил, и онова, което народът е пазил от поколение на поколение за началото на света и за своите праотци.\u003c/p>","context":"\u003cp>Книгата има две части. Първите единайсет глави се отнасят до целия свят: сътворението, рая, грехопадението на Адам и Ева, Каин и Авел, потопа в дните на Ной, Вавилонската кула. Това не е учебник по естествени науки, а отговор на най-дълбоките въпроси: откъде идваме, защо съществуват злото и смъртта, какво иска Бог от нас. От глава 12 нататък разказът се събира около едно-единствено семейство: Авраам, Исаак, Иаков и Иосиф, в Ханаан, а после в Египет. Всичко това се случва преди Закона и преди да съществува народът Израил. Тук започва историята на спасението; книга Изход ще я продължи, тръгвайки от Египет, където завършва Битие.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Светът е добър\u003c/strong> — Всичко, което съществува, Бог е сътворил чрез Своето Слово, и всичко е било „твърде добро“ (Битие 1:31).\u003c/li>\u003cli>\u003cstrong>Човекът — образ Божий\u003c/strong> — Мъжът и жената са създадени „по Наш образ“ и са призвани към подобието, тоест да заприличат на Бога (Битие 1:26).\u003c/li>\u003cli>\u003cstrong>Грехопадението\u003c/strong> — Непослушанието прекъсва връзката с Бога и внася в света смъртта, но не угасява Неговата любов.\u003c/li>\u003cli>\u003cstrong>Обещанието и заветът\u003c/strong> — Бог избира Авраам и му обещава, че чрез неговото потомство ще бъдат благословени всички народи.\u003c/li>\u003cli>\u003cstrong>Промислът\u003c/strong> — Дори злото, което вършат хората, като продаването на Иосиф от братята му, Бог обръща в добро.\u003c/li>\u003c/ul>","hristos":"\u003cp>Веднага след грехопадението Бог обещава, че семето на жената ще поразява змията в главата (Битие 3:15): това е първата радостна вест, която Църквата нарича „Първоевангелие“. Христос е новият Адам, Който със Своето послушание поправя онова, което първият развали с непослушанието си (Римляни 5:19), а Пресвета Богородица е новата Ева. Ноевият ковчег предобразява Църквата и Кръщението (1 Петър 3:20-21). Мелхиседек, който изнася хляб и вино, предвещава свещенството на Христос и Светата Евхаристия (Битие 14:18). Исаак, обичният син, който сам носи дървата за жертвата нагоре по планината (Битие 22), и Иосиф, продаден от братята си и станал техен спасител, са образи на Спасителя. А стълбата на Иаков (Битие 28:12), която свързва небето със земята, разкрива Богородица, чрез Която Господ слезе при нас.\u003c/p>","parinti":"\u003cp>Св. Василий Велики в беседите си върху Шестоднева ни учи да гледаме на света като на книга, която говори за мъдростта на Твореца: от най-малката тревичка до звездите, всичко издига ума ни към Него. Св. Иоан Златоуст в беседите си върху книга Битие настоява на Божието снизхождение: Писанието говори според мярката на нашата немощ, а след грехопадението Господ не изоставя Адам, а го търси и го зове: „Адаме, где си?“ (Битие 3:9). Св. Ириней Лионски показва, че Христос събира в Себе Си цялата история на Адам, за да я изцели от корен.\u003c/p>","slujbe":"\u003cp>Битие се чете на вечернята в делничните дни на Великия пост, от понеделник до петък, на откъси, определени за всеки ден: Църквата ни връща към началото точно когато ни призовава към покаяние. Първата глава звучи на Велика събота, като първа от петнайсетте паримии от Стария Завет, както и в навечерието на Рождество Христово и на Богоявление. Жертвоприношението на Исаак също се чете на Велика събота, а стълбата на Иаков (Битие 28) — на Богородичните празници.\u003c/p>","rugaciune":"\u003cp>Господи, Боже наш, Който сътвори небето и земята и създаде човека по Своя образ, не ме оставяй да се крия от Тебе, както Адам. Потърси и мене и ме повикай по име. Дай ми вярата на Авраам и търпението на Иосиф и обърни в добро онова, което съм развалил. Амин.\u003c/p>"},"q":[{"q":"Какво обещава Бог на Авраам?","o":["Че чрез неговото потомство ще бъдат благословени всички народи на земята.","Че никога повече няма да мине през изпитание.","Че ще построи Иерусалимския храм."]},{"q":"Кога се чете Битие в богослуженията, ден след ден?","o":["На вечернята, в делничните дни на Великия пост.","Всяка неделя, на Божествената литургия.","Само в нощта на Великден."]}]}},{"n":2,"slug":"izhod","abbr":"Изх","cap":40,"s":"petoknizhie","bg":{"nume":"Изход","scurt":"Бог извежда Своя народ от египетското робство, превежда го през морето, дава му Закона на Синай и идва да живее сред него.","verset":{"t":"„Аз съм вечно Съществуващият.“","r":"Изход 3:14"},"incepe":"Изход 1–3 · 12–15 · 19–20 · 32–34","p":{"autor":"\u003cp>Според Преданието на Църквата Изход е втората книга на светия пророк Моисей, написана в годините на пустинята. Този път Моисей разказва онова, което сам е преживял: бебе, извадено от водите на Нил, отгледан в двора на фараона, беглец и овчар в Мадиам, а после човекът, с когото Господ говореше „лице с лице, като да говореше някой с приятеля си“ (Изход 33:11). Името на книгата идва от гръцкия превод на Седемдесетте — древния превод на Стария Завет, който Църквата следва — и казва точно онова, което тя съдържа: един изход.\u003c/p>","context":"\u003cp>Минали са няколкостотин години от времето на Иосиф. Потомците на Иаков са се умножили в Египет и един нов фараон ги превръща в роби и заповядва да убиват момчетата им. Бог чува вика на народа, явява се на Моисей в къпината, която гори и не изгаря, и го изпраща при фараона. Следват десетте наказания, пасхалната нощ, преминаването през Червено море, маната и водата от скалата. В третия месец народът стига до планината Синай: там получава Десетте заповеди и сключва завет с Господа, тоест свещен съюз, запечатан с жертва. Книгата завършва с издигането на скинията на събранието, която се изпълва със славата Божия. Книга Левит ще покаже как се служи на Бога в тази скиния.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Бог чува и избавя\u003c/strong> — Той вижда страданието на робите и слиза да ги освободи; спасението започва от Него.\u003c/li>\u003cli>\u003cstrong>Името Божие\u003c/strong> — „Аз съм вечно Съществуващият“: живият Бог, а не идол, направен от човешки ръце.\u003c/li>\u003cli>\u003cstrong>Пасхата\u003c/strong> — Кръвта на агнето по стълбовете на вратите и преминаването от робство към свобода.\u003c/li>\u003cli>\u003cstrong>Заветът и заповедите\u003c/strong> — Законът не е ярем, а пътят на един народ, който вече е свободен.\u003c/li>\u003cli>\u003cstrong>Скинията\u003c/strong> — Бог не остава далеч: Той иска да живее сред Своя народ.\u003c/li>\u003c/ul>","hristos":"\u003cp>Апостол Павел го казва ясно: „Христос, Пасхата наша, биде заклан за нас“ (1 Коринтяни 5:7). Непорочното агне, на което нито една кост не бива строшена (Изход 12:46; Иоан 19:36), е образ на Агнеца Божий. Преминаването през Червено море предобразява Кръщението (1 Коринтяни 10:1-2): влизаме във водата роби и излизаме свободни. Маната е сянка на живия Хляб, слязъл от небето (Иоан 6:48-51), а за скалата, от която бликна вода, Апостолът казва: „а камъкът беше Христос“ (1 Коринтяни 10:4). Моисей, посредникът, който се моли с вдигнати ръце, предвещава истинския Посредник. Къпината, която гори, без да изгаря, разкрива Пресвета Богородица, която носи в утробата си Бога и остана Дева. А самата дума „Пасха“ означава „преминаване“: преминаването на Христос, и нашето заедно с Него, от смъртта към живота.\u003c/p>","parinti":"\u003cp>Св. Григорий Нисийски в съчинението си „За живота на Моисей“ чете Изход като пътя на всяка душа: излизането от страстите, преминаването през водата, изкачването на планината, където човекът винаги върви напред към Бога и никога не се насища от Него. Той вижда в горящата къпина тайната на Девата. Св. Иоан Златоуст в огласителните си беседи към готвещите се за Кръщение напомня, че ангелът погубител отминал къщите, белязани с кръвта на агнето, и показва, че врагът бяга много повече, когато види върху устните на вярващите Кръвта Христова. Св. Кирил Александрийски също тълкува пасхалното агне като образ на кръстната Жертва.\u003c/p>","slujbe":"\u003cp>Изход се чете на вечернята през Страстната седмица. На Велика събота звучат наредбата за Пасхата (Изход 12) и преминаването през Червено море, което завършва с песента на Моисей: „да възпея Господа, защото се славно прослави“ (Изход 15:1). Песента на Моисей (Изход 15) е първата от деветте библейски песни на канона на утренята: затова първата песен на каноните толкова често напомня за морето и за фараона. Горящата къпина се възпява в химните на Богородичните празници и особено на Благовещение.\u003c/p>","rugaciune":"\u003cp>Господи, вечно Съществуващий, Който чу вика на Своя народ и го преведе през морето като по суша, изведи и мене от робството на моите грехове. Бъди ми огнен стълб в моите нощи и ме храни в пустинята с живия Хляб. Научи ме да пазя Твоите заповеди като свободен човек, а не като роб. Амин.\u003c/p>"},"q":[{"q":"Какво предобразява преминаването през Червено море според апостол Павел?","o":["Кръщението.","Края на света.","Построяването на храма."]},{"q":"Кого разкрива къпината, която гореше и не изгаряше?","o":["Пресвета Богородица, която носи в себе си Бога и остана Дева.","Коравото сърце на фараона.","Ревността на пророк Илия."]}]}},{"n":3,"slug":"levit","abbr":"Лев","cap":27,"s":"petoknizhie","bg":{"nume":"Левит","scurt":"Книгата на светостта: как един грешен народ се приближава до светия Бог — с жертва, с очищение и с любов към ближния.","verset":{"t":"„Бъдете свети, защото Аз, Господ, Бог ваш, съм свет.“","r":"Левит 19:2"},"incepe":"Левит 16 · 19 · 23 · 26","p":{"autor":"\u003cp>Според Преданието на Църквата Левит е третата книга на светия пророк Моисей. Името ѝ идва от левитите, коляното на Левий, определено да служи в скинията на събранието; от него произхождали Аарон и свещениците. Книгата съдържа почти само думи на Господа към Моисей, в подножието на Синай, в краткото време между издигането на скинията и тръгването на народа. Тя е, в известен смисъл, богослужебната книга на древния Израил: наредби, а не разкази.\u003c/p>","context":"\u003cp>В края на книга Изход славата Господня изпълни скинията. Сега възниква въпросът: как може един немощен и грешен народ да живее със светия Бог посред стана си? Левит отговаря стъпка по стъпка. Първо жертвите: всесъжението, мирната жертва, жертвата за грях. После посвещаването на Аарон и синовете му за свещеници. Следват наредбите за чисто и нечисто, Денят на Очищението (глава 16), когато първосвещеникът влизал веднъж в годината в Светая Светих, и „законът за светостта“, с годишните празници и годината на покой за земята. Много наредби ни изглеждат чужди; те били училище, в което Бог възпитавал Своя народ. Книга Числа ще продължи пътя през пустинята.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Светостта\u003c/strong> — Бог е свят и призовава Своя народ да Му заприлича в целия си живот, а не само в богослужението.\u003c/li>\u003cli>\u003cstrong>Жертвата\u003c/strong> — Грехът е тежко нещо и помирението с Бога се заплаща с живот, а не с думи.\u003c/li>\u003cli>\u003cstrong>Свещенството\u003c/strong> — Никой не се приближава до светинята сам, а чрез служителите, които Бог е определил.\u003c/li>\u003cli>\u003cstrong>Чисто и нечисто\u003c/strong> — Народът се учи да различава, ден след ден, какво го приближава до Господа и какво го отдалечава от Него.\u003c/li>\u003cli>\u003cstrong>Любовта към ближния\u003c/strong> — Заповедта „обичай ближния си като себе си“ (Левит 19:18) е в самото сърце на тази книга.\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието до евреите е ключът към Левит: Законът е имал само „сянката на бъдещите блага“ (Евреи 10:1), и кръвта на козли и телци не е могла да заличи греховете. Христос е едновременно Първосвещеникът и Жертвата: Той влезе „веднъж завинаги в светилището“ не с чужда кръв, а „със Своята кръв“ (Евреи 9:12). Денят на Очищението се изпълва на Велики петък, когато храмовата завеса се раздира и пътят към Отца се отваря (Матей 27:51). Непорочното агне, принасяно сутрин и вечер, предвещава Онзи, за Когото Иоан Кръстител казва: „ето Агнецът Божии, Който взима върху Си греха на света“ (Иоан 1:29). Затова Църквата вече не принася жертви от животни: в Божествената литургия се принася безкръвната жертва и вярващите се причастяват със самото Тяло и Кръв Господни.\u003c/p>","parinti":"\u003cp>Св. Кирил Александрийски посвещава цяло съчинение, „За поклонението и служението в дух и истина“, на наредбите на Закона: той показва, че всяка жертва и всеки празник на древния Израил е сянка, която намира своето тяло в Христос и в живота на Църквата. Блажени Теодорит Кирски в тълкуванията си върху книгите на Моисей казва, че Бог допуснал жертвите от снизхождение: народът току-що бил излязъл измежду идолите на Египет и трябвало да се отучи, стъпка по стъпка, от тяхното почитане. Ориген, църковен писател, има беседи върху Левит, в които търси духовния смисъл на жертвите.\u003c/p>","slujbe":"\u003cp>Левит не се чете последователно в богослуженията на Църквата. Ще го чуеш рядко: на вечернята на 1 септември, началото на църковната година (Индикта), се чете от глава 26, а паримията на Сретение Господне напомня наредбата за очищението на майката след раждане (Левит 12), която Пресвета Богородица спази. Оттам идва и обичаят на четиридесетия ден майката да донася бебето в храма, за да получи молитвите на четиридесетия ден. Много по-често го чуваш изпълнен — в Апостола, от Посланието до евреите.\u003c/p>","rugaciune":"\u003cp>Господи, святи Боже, Който ни призова да бъдем свети, както Ти си свят, очисти ме от всяка скверна на плътта и на духа. Ти, вечният Първосвещеник, Който принесе Себе Си в жертва за нас, удостой ме да пристъпвам със страх и с любов към Твоите свети Тайни и да обичам ближния си като себе си. Амин.\u003c/p>"},"q":[{"q":"Коя книга на Новия Завет е ключът към жертвите в Левит?","o":["Посланието до евреите.","Посланието до Филимона.","Откровението."]},{"q":"Каква заповед за ближния има в Левит 19:18?","o":["Да обичаш ближния си като себе си.","Да не говориш с хора от друг народ.","Да раздадеш цялото си имане на левитите."]}]}},{"n":4,"slug":"chisla","abbr":"Чис","cap":36,"s":"petoknizhie","bg":{"nume":"Числа","scurt":"Четиридесет години в пустинята: един народ, който ропти, и един Бог, Който не го изоставя, а го възпитава за обетованата земя.","verset":{"t":"„Да те благослови Господ и да те опази!“","r":"Числа 6:24"},"incepe":"Числа 6:22-27 · 11–14 · 20–24","p":{"autor":"\u003cp>Според Преданието на Църквата Числа е четвъртата книга на светия пророк Моисей. Името си е получила от двете преброявания на народа: едното на Синай, в началото на пътя, и другото в Моавските полета, в неговия край, след почти четиридесет години. Между тях едно цяло поколение умира в пустинята и друго израства. Моисей пише като свидетел и като баща на народа: той самият ходатайства, уморява се, сгрешава и бива изобличен от Господа.\u003c/p>","context":"\u003cp>Народът тръгва от Синай, подреден като военен стан, със скинията в средата. Пътят до Ханаан би отнел няколко седмици. Но започва роптанието: за храната на Египет, против Моисей, против маната. На границата на земята дванайсет съгледвачи донасят вести; десет от тях всяват страх в народа и само Иисус Навин и Халев вярват на обещанието. Народът отказва да влезе и Господ определя четиридесет години скитане, докато израсне ново поколение. Следват бунтът на Корей, Аароновият жезъл, който напъпи, водата от скалата, змиите и медната змия, а после Валаам — гадателят, когото повикали да прокълне Израил, а Бог го заставил да го благослови. Книгата завършва на Иордан, на прага на земята; там Моисей ще говори във Второзаконие.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Пустинята като училище\u003c/strong> — Между робството и обещанието има дълъг път, по който Бог възпитава Своя народ.\u003c/li>\u003cli>\u003cstrong>Роптанието\u003c/strong> — Неверието и недоволството превръщат един кратък път в скитане от четиридесет години.\u003c/li>\u003cli>\u003cstrong>Ходатайството\u003c/strong> — Моисей отново и отново застава между народа и справедливия гняв и се моли за онези, които го хулят.\u003c/li>\u003cli>\u003cstrong>Верността на Бога\u003c/strong> — Хората се променят, обещанието остава: децата на падналите ще влязат в земята.\u003c/li>\u003cli>\u003cstrong>Благословението\u003c/strong> — Никой не може да прокълне онзи, когото Господ е благословил.\u003c/li>\u003c/ul>","hristos":"\u003cp>Сам Господ ни дава ключа: „И както Моисей издигна змията в пустинята, тъй трябва да се издигне Син Човеческий“ (Иоан 3:14). Ухапаните от змиите поглеждали към медната змия и оставали живи (Числа 21:8-9); ние поглеждаме към разпнатия Христос и се изцеляваме от ухапването на греха. Валаам пророкува: „Изгрява звезда от Иакова“ (Числа 24:17) — и мъдреците ще последват една звезда до Витлеем. Сухият жезъл на Аарон, който напъпи за една нощ (Числа 17), предобразява Девата, която роди без мъжко семе. Скалата, която беше ударена и даде вода, е Христос (1 Коринтяни 10:4). А апостол Павел ни казва, че всичко това е било написано „за поука нам“ (1 Коринтяни 10:11).\u003c/p>","parinti":"\u003cp>Св. Иустин Мъченик в „Диалог с юдеина Трифон“ показва, че медната змия не е била идол, а знак на Кръста, и че звездата на Валаам е предвещавала Христос. Св. Григорий Нисийски в „За живота на Моисей“ вижда в гроздето, което съгледвачите донесли, окачено на прът, образ на Страданията, а в онези, които се боят от великаните — помислите, които ни спират при изкачването. Ориген, църковен писател, чете стоянките в пустинята като стъпалата, по които душата върви към Бога. Всички те ни учат на едно и също: пустинята на Израил е и нашият път.\u003c/p>","slujbe":"\u003cp>От книга Числа се четат две важни паримии. В навечерието на Рождество Христово звучи пророчеството на Валаам за звездата от Иакова (Числа 24). На вечернята на Петдесетница се чете откъсът за седемдесетте старейшини, върху които почива Духът (Числа 11) — предвестие за Слизането на Светия Дух. Медната змия и Аароновият жезъл отекват в химните на Честния Кръст и на Богородица. А благословението от глава 6 ще ти напомни благословията, която получаваш от свещеника.\u003c/p>","rugaciune":"\u003cp>Господи, Който носи Своя народ четиридесет години в пустинята и не го отхвърли заради роптанието му, прости моето недоволство и моето маловерие. Когато ме ухапе грехът, вдигни очите ми към Твоя Кръст. Благослови ме и ме опази, озари ме със светлото Си лице и ми дай мир. Амин.\u003c/p>"},"q":[{"q":"Защо Израил се скита четиридесет години в пустинята?","o":["Защото народът не повярва на обещанието и отказа да влезе в земята.","Защото Моисей сбърка пътя.","Защото фараонът го преследваше през цялото това време."]},{"q":"Какво предобразява медната змия, която Моисей издигна?","o":["Христос, издигнат на Кръста.","Вавилонската кула.","Идолите на Египет."]}]}},{"n":5,"slug":"vtorozakonie","abbr":"Втор","cap":34,"s":"petoknizhie","bg":{"nume":"Второзаконие","scurt":"Заветът на Моисей: на прага на обетованата земя той отново напомня Закона и призовава народа да обича Бога с цялото си сърце.","verset":{"t":"„Слушай, Израилю: Господ, Бог наш, е Господ един.“","r":"Второзаконие 6:4"},"incepe":"Второзаконие 4–8 · 30 · 32 · 34","p":{"autor":"\u003cp>Според Преданието на Църквата Второзаконие е петата и последна книга на светия пророк Моисей. Името, което идва от Седемдесетте, се разбира веднага: „втори закон“ — не нов закон, а Законът, изговорен за втори път, пред едно ново поколение. Моисей го изрича в последните седмици от живота си, на сто и двайсет години. Последната глава, която разказва за смъртта му, според Преданието е добавена от Иисус Навин, неговия приемник.\u003c/p>","context":"\u003cp>Минали са четиридесет години от излизането от Египет. Онези, които видяха чудесата при Червено море, са измрели в пустинята; в Моавските полета, срещу Иордан, стоят децата им, готови да преминат в Ханаан. Моисей знае, че самият той няма да влезе. Затова книгата е изтъкана от слова, като думите на баща, който се сбогува: първо им напомня пътя и Господния промисъл; после им повтаря Десетте заповеди и наредбите за живота в новата земя; накрая поставя пред тях благословението и проклятието. Завършва с една песен, благославя колената и умира на планината Нево, гледайки отдалеч обещаната земя. Книгата Иисус Навин ще покаже обещанието изпълнено.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Един-единствен Господ\u003c/strong> — Израил няма друг Бог и не дели сърцето си с идолите на народите.\u003c/li>\u003cli>\u003cstrong>Любовта\u003c/strong> — Първата заповед не иска само страх, а любов: с цялото сърце, с цялата душа и с цялата сила.\u003c/li>\u003cli>\u003cstrong>Помни\u003c/strong> — Забравата за Божиите благодеяния е началото на падението; затова Законът се предава на децата, у дома и по пътя.\u003c/li>\u003cli>\u003cstrong>Изборът\u003c/strong> — Моисей поставя пред народа живота и смъртта и го подканя: „Избери живота“ (Второзаконие 30:19).\u003c/li>\u003cli>\u003cstrong>Грижата за слабия\u003c/strong> — Вдовицата, сирачето и пришълецът са под закрилата на Господа.\u003c/li>\u003c/ul>","hristos":"\u003cp>Моисей обещава: „Господ, Бог твой, ще ти издигне Пророк изсред тебе, от твоите братя, като мене — Него слушайте“ (Второзаконие 18:15). Апостол Петър показва, че този Пророк е Христос (Деяния 3:22). Сам Спасителят обичаше тази книга: в пустинята Той победи дявола три пъти само с думи от Второзаконие (Матей 4:1-10), а когато Го попитаха коя е най-голямата заповед, отговори със „Слушай, Израилю“ (Марк 12:29-30). Моисей остава отвъд Иордан и в земята народът влиза с Иисус Навин, който носи същото име като Иисус Христос: Законът ни довежда до границата, но само Христос ни превежда отвъд. А проклятието над обесения на дърво (Второзаконие 21:23) Господ взе върху Себе Си на Кръста, за да ни изкупи: „Христос ни изкупи от клетвата на закона“ (Галатяни 3:13).\u003c/p>","parinti":"\u003cp>Св. Василий Велики има прочута беседа върху един-единствен призив от Второзаконие, както звучи в превода на Седемдесетте: „Внимавай в себе си“ (Второзаконие 15:9). Той показва, че вниманието към собствената душа, към помислите и движенията на сърцето, е началото на духовния живот. Св. Ириней Лионски учи, че заповедите не са отменени от Христос, а изпълнени и задълбочени: Законът е бил детеводител, който ни е довел до Него. Блажени Теодорит Кирски, тълкувайки книгата, подчертава, че Моисей не дава друг Закон, а го повтаря с бащина любов пред онези, които не са били на Синай.\u003c/p>","slujbe":"\u003cp>Песента на Моисей от глава 32 е втората от деветте библейски песни на канона на утренята. Понеже е строга, изобличителна песен, тя се пее само през Великия пост; затова през останалата част от годината каноните преминават от първата песен направо към третата. Паримии от Второзаконие се четат на вечернята в неделите на светите отци от Вселенските събори. И я чуваш всеки път, когато Евангелието напомня голямата заповед за любовта.\u003c/p>","rugaciune":"\u003cp>Господи, Боже наш, единствен Господи, научи ме да Те обичам с цялото си сърце, с цялата си душа и с цялата си сила. Не ме оставяй да забравям Твоите благодеяния, когато ми е добре. Положи словата Си в сърцето ми и в дома ми и ми помагай всеки ден да избирам живота. Амин.\u003c/p>"},"q":[{"q":"Какво означава името „Второзаконие“?","o":["„Втори закон“, тоест Законът, изговорен отново пред едно ново поколение.","„Книгата на преброяванията“.","„Излизането от Египет“."]},{"q":"С какво победи Христос дявола в пустинята?","o":["С думи от Второзаконие.","С чудо пред множеството.","С помощта на Моисей и Илия."]}]}},{"n":6,"slug":"iisus-navin","abbr":"Нав","cap":24,"s":"istoricheski","bg":{"nume":"Иисус Навин","scurt":"Бог изпълнява обещанието Си: с Иисус Навин народът преминава Иордан, получава земята и е призован да избере на Кого ще служи.","verset":{"t":"„Пък аз и домът ми ще служим Господу, понеже Той е свет.“","r":"Иисус Навин 24:15"},"incepe":"Иисус Навин 1–6 · 23–24","p":{"autor":"\u003cp>Според Преданието на Църквата книгата е написана от самия Иисус, син Навинов, от Ефремовото коляно; последните редове, за неговата смърт, са добавени от други. Иисус е бил от младостта си помощник на Моисей: придружавал го е на Синай, бил е един от двамата верни съгледвачи и е бил поставен за негов приемник чрез възлагане на ръце. Отначало се казвал Осия; Моисей му дал името Иисус (Числа 13:17), което означава „Господ спасява“.\u003c/p>","context":"\u003cp>Моисей е умрял и народът стои на брега на Иордан. Книгата има три части. Първо, влизането: Иордан се разделя пред ковчега на завета, народът минава като по суша, а стените на Иерихон падат при звука на тръбите и вика на народа. После, подялбата: всяко коляно получава своя дял, с граници, изброени село по село — глави, сухи за четене, но всяко име казва, че обещанието, дадено на Авраам, се е изпълнило. Накрая, сбогуването: Иисус, вече стар, събира народа в Сихем и подновява завета. Войните в книгата са сурови; Отците са ги чели най-вече като образ на нашата борба с греха, с който не сключваме мир. След Иисус Навин идва размирното време на съдиите.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Верността на Бога\u003c/strong> — Не остана неизпълнена ни една от добрите думи, които Господ беше казал на дома Израилев (Иисус Навин 21:45).\u003c/li>\u003cli>\u003cstrong>Смелостта, която ражда послушанието\u003c/strong> — „Бъди твърд и храбър“ (Иисус Навин 1:9) не значи да се уповаваш на себе си, а на Онзи, Който върви с теб.\u003c/li>\u003cli>\u003cstrong>Победата е дар\u003c/strong> — Иерихон пада с вяра, а не със силата на оръжието.\u003c/li>\u003cli>\u003cstrong>Наследството\u003c/strong> — Всеки получава своя дял; никой не е забравен.\u003c/li>\u003cli>\u003cstrong>Изборът\u003c/strong> — Дадената земя не замества вярата: народът трябва отново да избере на Кого служи.\u003c/li>\u003c/ul>","hristos":"\u003cp>Както виждаш още от заглавието, Иисус Навин и Иисус Христос носят едно и също име. Отците видели тук тайна: Моисей, тоест Законът, довежда народа до границата, но в наследството го въвежда Иисус. Преминаването през Иордан с ковчега начело предвещава Кръщението на Господа в същата река и нашето кръщение. Дванайсетте камъка, извадени от коритото на реката (Иисус Навин 4), напомнят за дванайсетте апостоли. Раав, грешната жена от Иерихон, бива спасена с целия си дом заради червеното въже, което привързала на прозореца (Иисус Навин 2:18): знак на Кръвта Христова, чрез която се спасяват и онези, които идват от езичниците; тя дори влиза в родословието на Спасителя (Матей 1:5). А покоят, който даде Иисус Навин, не беше последният: Посланието до евреите казва, че за Божия народ остава друг покой — онзи, който носи Христос (Евреи 4:8-9).\u003c/p>","parinti":"\u003cp>Св. Иустин Мъченик, а след него и св. Кирил Иерусалимски в огласителните си слова, отбелязват, че приемникът на Моисей е носил името Иисус и че именно чрез него, а не чрез Моисей, народът е получил наследството: знак, който Бог е поставил в историята много векове по-рано. Св. Ириней Лионски вижда в червеното въже на Раав знака на Страданията, чрез които се изкупват вярващите. Ориген, църковен писател, оставя беседи върху книгата, в които завладените градове са страстите в нас, които Иисус побеждава, ако Му позволим да ни води.\u003c/p>","slujbe":"\u003cp>От книгата се четат няколко паримии. На Богоявление звучи преминаването през Иордан (Иисус Навин 3). На Велика събота се чете първата Пасха, празнувана в обетованата земя, и явяването на Вожда на Господнята войска (Иисус Навин 5:10-15); същото явяване четем и на 8 ноември, на Архангеловден, Събора на светите архангели Михаил и Гавриил. Праведният Иисус Навин се почита в църковния календар на 1 септември.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Който укрепи Своя раб Иисус Навин и раздели водите на Иордан пред Своя народ, бъди и с мене, където и да ида. Срути стените, които грехът е издигнал в сърцето ми, и ми дай сила да избера днес: аз и домът ми да служим на Тебе. Амин.\u003c/p>"},"q":[{"q":"Каква е връзката между името на Иисус Навин и името на Иисус Христос?","o":["Това е едно и също име, което означава „Господ спасява“.","Нямат никаква връзка.","Едното означава „закон“, а другото — „благодат“."]},{"q":"Как беше спасена Раав, когато падна Иерихон?","o":["Чрез червеното въже на прозореца, знак на Кръвта Христова.","Скри се в ковчега на завета.","Избяга в Египет преди битката."]}]}},{"n":7,"slug":"sadii","abbr":"Съд","cap":21,"s":"istoricheski","bg":{"nume":"Съдии Израилеви","scurt":"Времето без цар: народът пада, вика към Бога и Той му праща избавители — Девора, Гедеон, Самсон — отново и отново.","verset":{"t":"„В ония дни Израил нямаше цар: всеки правеше това, което му се струваше за право.“","r":"Съдии 21:25"},"incepe":"Съдии 2 · 4–7 · 13–16","p":{"autor":"\u003cp>Книгата не назовава своя автор. Според едно древно предание, което Църквата също е запазила, тя е написана от пророк Самуил, последния съдия, в началото на царската епоха; затова отново и отново се повтаря изразът: в ония дни Израил нямаше цар. „Съдиите“ не са хора от съдилищата, а водачи, които Бог издига в час на опасност, за да избавят народа и после да го управляват. Книгата изброява дванайсет.\u003c/p>","context":"\u003cp>Иисус Навин е умрял и поколението, което е видяло чудесата, е отминало. Колената живеят пръснати сред ханаанците, без цар и без общо управление; скинията се намира в Силом. Книгата обхваща няколкостотин години и се върти в един повтарящ се кръг: народът забравя Господа и служи на идолите; Господ го оставя в ръцете на враговете; народът вика; Господ се смилява и издига съдия; земята има мир, докато съдията умре — и всичко започва отначало. Всеки път падението е по-дълбоко, а последните глави са едни от най-мрачните в Писанието. Книгата Рут и Първа книга Царства ще покажат как Бог подготвя, насред този мрак, един цар.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Кръгът на падението\u003c/strong> — Грях, робство, вик, избавление: историята на Израил много прилича на историята на нашата душа.\u003c/li>\u003cli>\u003cstrong>Дълготърпението на Бога\u003c/strong> — Той отговаря всеки път, когато народът вика, макар да знае, че пак ще падне.\u003c/li>\u003cli>\u003cstrong>Силата в немощта\u003c/strong> — Господ избира малкия: Гедеон побеждава с триста мъже, а не с десетки хиляди.\u003c/li>\u003cli>\u003cstrong>Опасността от смесването\u003c/strong> — Идолите на съседите не влизат със сила, а с навика.\u003c/li>\u003cli>\u003cstrong>Без Бога всеки е закон за себе си\u003c/strong> — Когато всеки прави каквото му се струва право, плаща слабият.\u003c/li>\u003c/ul>","hristos":"\u003cp>Съдиите са истински избавители, но безсилни: всеки умира и народът пак пада. Цялата книга вика за един Избавител, Който няма вече да умре и ще изцели сърцето, а не само границите. Руното на Гедеон, върху което росата пада безшумно, докато земята наоколо остава суха (Съдии 6:36-40), е за Църквата образ на Въплъщението: Словото слезе в утробата на Девата тихо, „като дъжд върху руно“, както пее Псалмът в превода на Седемдесетте (Псалом 71:6). Самсон, чието раждане ангел възвести на една безплодна жена и който бе посветен на Господа от утробата на майка си (Съдии 13), побеждава повече със смъртта си, с разперени ръце между стълбовете (Съдии 16:29-30): една сянка, с всичките си падения, на Онзи, Който със смъртта Си победи смъртта. Посланието до евреите изброява Гедеон, Варак, Самсон и Иефтай сред онези, които са победили с вяра (Евреи 11:32).\u003c/p>","parinti":"\u003cp>За книгата Съдии Отците са писали по-малко, отколкото за други книги, но нейните образи са им били скъпи. Блажени Теодорит Кирски я тълкува накратко във въпросите си върху първите книги на Писанието и показва, че Бог е допускал скръбта като лекарство, за да върне Своя народ при Себе Си. Св. Амвросий Медиолански вижда в росата върху руното на Гедеон небесния дар, който слезе първо върху Израил, а после върху цялата земя. А за Самсон Отците отбелязват, че силата му не е била в косата, а в Божия дар, който той изгуби, когато предаде сърцето си в ръцете на Далида.\u003c/p>","slujbe":"\u003cp>Съдии не се чете последователно в богослуженията на Църквата. Една паримия обаче ще чуваш всяка година: на Богоявление, сред паримиите на празничната вечерня, е руното на Гедеон (Съдии 6:36-40). Същото оросено руно се връща в Богородичните химни, където Девата се оприличава на руното, върху което слезе небесната роса. А Апостолът в неделята преди Рождество Христово напомня за съдиите сред праведниците на вярата (Евреи 11).\u003c/p>","rugaciune":"\u003cp>Дълготърпеливи Господи, Който толкова пъти чу вика на Своя народ и му прати избавители, чуй и мене, който падам все в едни и същи грехове. Разкъсай кръга на моите падения. Бъди Ти Царят на моето сърце, за да не правя вече онова, което на мене ми се струва право, а Твоята воля. Амин.\u003c/p>"},"q":[{"q":"Какъв кръг се повтаря в книгата Съдии?","o":["Народът пада, попада в робство, вика към Господа и получава избавител.","Народът строи храма, разрушава го и пак го строи.","Народът ходи в Египет и се връща всяка година."]},{"q":"Какво предобразява росата върху руното на Гедеон?","o":["Въплъщението на Господа от Дева Мария.","Потопа от времето на Ной.","Преминаването през Червено море."]}]}},{"n":8,"slug":"rut","abbr":"Рут","cap":4,"s":"istoricheski","bg":{"nume":"Рут","scurt":"Една чужденка, вдовица, вярна на свекърва си и на Бога на Израил, става прабаба на цар Давид и прародителка на Христос.","verset":{"t":"„Твоят народ ще бъде мой народ, и твоят Бог — мой Бог.“","r":"Рут 1:16"},"incepe":"Рут 1–4 (цялата книга, за една вечер)","p":{"autor":"\u003cp>Книгата не назовава своя автор; едно древно предание я свързва с пророк Самуил. Написана е в царската епоха, тъй като завършва с родословието на Давид. Има само четири глави и се чете за около четвърт час. Тя е една от малкото книги на Писанието, които носят името на жена — и при това на чужденка, моавка, от народ, с който Израил не е бил в добри отношения.\u003c/p>","context":"\u003cp>Историята се случва в дните на съдиите, тоест в размирното време на предишната книга. Поради глад един човек от Витлеем, Елимелех, заминава за Моав с жена си Ноемин и двамата си сина, Махлон и Хилеон. Там тримата мъже умират. Ноемин, останала без нищо, се връща в родния си край, а снаха ѝ, моавката Рут, не иска да я остави. Като стигат във Витлеем по време на жътвата, Рут събира класове след жетварите, както Законът позволявал на бедните, и попада на нивата на Вооз, роднина на свекъра ѝ. Вооз я закриля, после, като изпълнява дълга на най-близкия роднина, я откупва според Закона и я взема за жена. Синът им, Овид, ще стане дядо на Давид. След мрака на Съдии книгата е като глътка въздух: Бог действа тихо, сред обикновени хора.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Верността\u003c/strong> — Рут остава до една стара и бедна жена, без никаква изгода за себе си; любовта ѝ не прави сметки.\u003c/li>\u003cli>\u003cstrong>Бог приема чужденеца\u003c/strong> — Една моавка влиза чрез вярата в Божия народ.\u003c/li>\u003cli>\u003cstrong>Скритият промисъл\u003c/strong> — Нито чудо, нито ангел: само една нива, една жътва и добри хора, чрез които действа Господ.\u003c/li>\u003cli>\u003cstrong>Откупването\u003c/strong> — Близкият роднина, изкупителят, поема върху себе си дълга и съгражда отново един паднал дом.\u003c/li>\u003cli>\u003cstrong>От празнотата към пълнотата\u003c/strong> — Ноемин се връща огорчена, с празни ръце, и завършва с бебе в обятията си.\u003c/li>\u003c/ul>","hristos":"\u003cp>Евангелието от Матея започва с родословието на Спасителя и споменава Рут по име: „Вооз роди Овида от Рут“ (Матей 1:5). Христос пожела да има сред Своите праотци една чужденка, за да покаже, че е дошъл за всички народи. Всичко се случва във Витлеем, чието име означава „дом на хляба“ и където след векове ще се роди Хлябът на живота, слязъл от небето. Вооз, роднината, който откупва, изкупителят, е образ на Христос: Той стана наш сродник чрез Въплъщението, за да може да ни изкупи, и ни прие при Себе Си, бедни и чужди, каквито бяхме. Рут предобразява Църквата, събрана от езичниците, която оставя идолите и своята земя и казва: „твоят Бог — мой Бог“. А тя моли Вооз да простре „крилото си“ над нея (Рут 3:9) — знак на закрила, както Господ покрива Своята Църква.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст, тълкувайки родословието на Спасителя в Евангелието от Матея, се спира на Рут: тя била чужденка и бедна, и все пак Вооз не я презрял. Така и Христос прие Църквата, чужда и лишена от всичко; и както Рут първо остави бащиния си дом и своя род, така и Църквата остави старите си навици. Блажени Теодорит Кирски, който също е тълкувал книгата, казва, че тя е написана преди всичко заради Господа Христа, Който по плът произхожда от Рут, и възхвалява както вярата на снахата, така и целомъдрието на Вооз.\u003c/p>","slujbe":"\u003cp>Книгата Рут не се чете в богослуженията на Православната църква. Рут обаче я чуваш по име веднъж в годината, в неделята преди Рождество Христово, когато на Божествената литургия се чете Евангелието с родословието на Христос (Матей 1). В тази неделя и в Неделята на светите праотци Църквата почита всички праведници, от които Господ се роди по плът; сред тях е и Рут, заедно с Вооз.\u003c/p>","rugaciune":"\u003cp>Господи, Който прие чужденката Рут под Своите криле и я направи прародителка на Своя Син, приеми и мене, който идвам при Тебе беден. Дай ми вярно сърце, което не изоставя своите в час на изпитание. Действай и в моите обикновени дни, дори когато аз не го виждам. Амин.\u003c/p>"},"q":[{"q":"От кой народ беше Рут?","o":["Беше моавка, тоест чужденка за народа на Израил.","Беше от Левиевото коляно.","Беше египтянка, от дома на фараона."]},{"q":"Къде се споменава Рут в Новия Завет?","o":["В родословието на Иисус Христос, в началото на Евангелието от Матея.","В Откровението.","В Посланието до Филимона."]}]}},{"n":9,"slug":"1-tsarstva","abbr":"1 Цар","cap":31,"s":"istoricheski","bg":{"nume":"Първа книга Царства","scurt":"От съдиите към царете: пророк Самуил, отхвърленият Саул и Давид — овчарят, когото Бог избра заради сърцето му, а не заради вида му.","verset":{"t":"„Човек гледа на лице, а Господ гледа на сърце.“","r":"1 Царства 16:7"},"incepe":"1 Царства 1–3 · 8 · 16–17 · 24","p":{"autor":"\u003cp>В православната Библия четирите книги Царства следват разделението на Седемдесетте; в западните Библии, които следват еврейския текст, първите две се наричат Първа и Втора книга на Самуил. Според Преданието началото на книгата е написал пророк Самуил, а след смъртта му (глава 25) са продължили пророците Натан и Гад, както напомня 1 Паралипоменон 29:29. Събитията се случват около хиляда години преди Рождество Христово.\u003c/p>","context":"\u003cp>Намираме се в края на времето на съдиите. В скинията в Силом свещеникът Илий е остарял, а синовете му оскверняват жертвите. Една безплодна жена, Ана, се моли със сълзи и получава син, Самуил, когото посвещава на Господа; детето чува Божия глас в нощта и става пророк и съдия. Народът иска цар, както другите народи; Самуил помазва Саул, висок и хубав, който започва добре, но не слуша Господа и бива отхвърлен. Тогава Бог праща Самуил във Витлеем, да помаже най-малкия от синовете на Иесей: Давид, овчаря. Следват победата над Голиат, приятелството с Ионатан, завистта на Саул и годините на Давидовото скитане. Книгата завършва със смъртта на Саул; втората книга ще покаже Давид като цар.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Молитвата от дълбините\u003c/strong> — Ана излива душата си пред Господа и бива чута.\u003c/li>\u003cli>\u003cstrong>Послушанието\u003c/strong> — „Послушанието е по-добро от жертва“ (1 Царства 15:22): Саул губи царството не от слабост, а от непослушание.\u003c/li>\u003cli>\u003cstrong>Бог гледа сърцето\u003c/strong> — Избраникът е най-малкият, забравен при овцете, а не хубавият му брат.\u003c/li>\u003cli>\u003cstrong>Истинският Цар\u003c/strong> — Като искаше цар като народите, народът отхвърляше Господа; а Той му дава цар, без да го изостави.\u003c/li>\u003cli>\u003cstrong>Да не въздаваш сам справедливост\u003c/strong> — Давид два пъти пощадява Саул, макар да го държи в ръцете си.\u003c/li>\u003c/ul>","hristos":"\u003cp>„Христос“ е гръцка дума и означава „Помазаник“, а в тази книга се явяват първите царе, помазани с елей: помазването на Давид, върху когото почива Духът Господен (1 Царства 16:13), предвещава истинския Христос, върху Когото Духът слиза на Иордан. Давид се ражда във Витлеем, овчар е, братята му го пренебрегват, преследват го без вина, прощава на врага си: във всичко той предобразява Христос, Когото Евангелието нарича „Син Давидов“. Двубоят с Голиат (1 Царства 17) е образ на Господнята победа над дявола: един-единствен се бори за целия народ и отсича главата на врага с неговия собствен меч — както Христос със смъртта Си победи смъртта. Песента на Ана (1 Царства 2:1-10) завършва с думи за Господния помазаник и е като по-голяма сестра на песента на Богородица: „Душата ми величае Господа“ (Лука 1:46-55).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст е произнесъл няколко беседи за Ана: представя я като пример за упорита молитва, която се извършва със сърцето, без много думи, и като майка, която отглежда детето си за Бога. Има и беседи за Давид и Саул, в които хвали това, че Давид пощадил Саул в пещерата, повече от победата над Голиат: там Давид победил един великан, а тук победил своя гняв. Блажени Августин в съчинението си „За Божия град“ тълкува песента на Ана като пророчество за Христос и за Църквата.\u003c/p>","slujbe":"\u003cp>Песента на Ана (1 Царства 2) е третата от деветте библейски песни на канона на утренята; затова в третата песен каноните често говорят за безплодната, която ражда, и за утвърждаването на сърцето в Господа. Светият пророк Самуил се почита на 20 август. Давид Църквата почита в неделята след Рождество Христово, заедно с праведния Иосиф Обручник и св. апостол Иаков, брат Господен, а гласа му чува във всяко богослужение — в псалмите.\u003c/p>","rugaciune":"\u003cp>Господи, Който гледаш сърцето, а не лицето, Който чу молитвата на Ана и повика по име детето Самуил, дай и на мене да казвам: „Говори, Господи, понеже Твоят раб слуша.“ Научи ме на послушанието, което Ти е по-угодно от жертвата, и на кротостта на Давид към онези, които ме обиждат. Амин.\u003c/p>"},"q":[{"q":"Как се наричат Първа и Втора книга Царства в западните Библии?","o":["Първа и Втора книга на Самуил.","Първа и Втора книга Паралипоменон.","Първа и Втора книга Макавейска."]},{"q":"Защо Саул беше отхвърлен като цар?","o":["Защото не послуша словото Господне.","Защото беше твърде млад.","Защото загуби битката с Голиат."]}]}},{"n":10,"slug":"2-tsarstva","abbr":"2 Цар","cap":24,"s":"istoricheski","bg":{"nume":"Втора книга Царства","scurt":"Царуването на Давид: славата, падението и покаянието на един цар, на когото Бог обещава вечен престол.","verset":{"t":"„Съгреших пред Господа.“","r":"2 Царства 12:13"},"incepe":"2 Царства 5–7 · 11–12 · 15 · 18","p":{"autor":"\u003cp>В западните Библии Втора книга Царства се нарича Втора книга на Самуил. Според Преданието тя е написана от пророците Натан и Гад, които са живели близо до Давид и са му говорили от името на Господа (1 Паралипоменон 29:29). Обхваща четиридесетте години от царуването на Давид, около хиляда години преди Рождество Христово. Написана е с рядка откровеност: най-обичаният цар на Израил се вижда и в славата, и в срама си.\u003c/p>","context":"\u003cp>Саул е умрял. Давид е помазан за цар първо над Иуда, в Хеврон, а после над целия Израил. Превзема Иерусалим, прави го своя столица и пренася там ковчега на завета, като играе от радост пред него. Иска да построи дом на Господа, но пророк Натан му носи друга вест: Господ ще съгради дом на Давид, тоест род от царе, и един негов потомък ще царува довека. В средата на книгата идва падението: Давид взема Вирсавия, жената на Урия, и праща Урия на смърт. Натан го изобличава, Давид се покайва и бива простен, но последиците остават: смъртта на детето, смутовете в дома му, бунтът и смъртта на сина му Авесалом. Трета книга Царства започва със старостта на Давид и възкачването на Соломон на престола.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Обещанието към Давид\u003c/strong> — Един негов потомък ще има престол, който няма да се поклати довека.\u003c/li>\u003cli>\u003cstrong>Грехът на великия\u003c/strong> — Нито царят, нито избраникът стои над заповедите.\u003c/li>\u003cli>\u003cstrong>Покаянието\u003c/strong> — Давид не се оправдава: казва „съгреших“ и бива простен.\u003c/li>\u003cli>\u003cstrong>Прошката не заличава последиците\u003c/strong> — Простеният грях все пак оставя рани в дома на Давид.\u003c/li>\u003cli>\u003cstrong>Смирението в скръбта\u003c/strong> — Като бяга от Авесалом, Давид приема обидата, без да отмъщава.\u003c/li>\u003c/ul>","hristos":"\u003cp>Обещанието в глава 7 е едно от най-големите в Стария Завет: Бог казва на Давид, че ще въздигне неговото потомство и ще утвърди престола му довека (2 Царства 7:12-16). Соломон го изпълни само отчасти; изцяло го изпълнява Христос. Затова архангел Гавриил казва на Девата: „ще Му даде Господ Бог престола на отца Му Давида… и царството Му не ще има край“ (Лука 1:32-33). Затова слепците и множествата викат към Иисус: „Сине Давидов“. Ковчегът, пренесен с радост в Иерусалим (2 Царства 6), предобразява Пресвета Богородица, одушевения кивот. А Давид, който се изкачва с плач на Елеонската планина, предаден от своя съветник Ахитофел (2 Царства 15:30-31), е сянка на Господа в нощта на Гетсимания, предаден от Своя ученик.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст често се връща в беседите си за покаянието към Давид и Натан: щом царят каза „съгреших“, чу, че Господ е снел греха му. Толкова бързо Бог отговаря на изповедта; затова никой не бива да се отчайва, колкото и тежко да е паднал. Св. Амвросий Медиолански написва апология на Давид, в която показва, че величието му не е в това, че не е паднал, а в начина, по който се е изправил. Св. Андрей Критски във Великия покаен канон поставя пред душата падението и сълзите на Давид като подбуда за покаяние.\u003c/p>","slujbe":"\u003cp>От тази книга обикновено не се четат паримии, но плода ѝ чуваш почти във всяко богослужение: Псалом 50, „Помилуй ме, Боже“ (в протестантските Библии Псалом 51), е молитвата на Давид след изобличението на Натан. През Великия пост Великият покаен канон на св. Андрей Критски напомня неговото падение и покаяние. А светият пророк и цар Давид се почита в неделята след Рождество Христово.\u003c/p>","rugaciune":"\u003cp>Помилуй ме, Боже, по голямата Си милост. Ти, Който вдигна Давид от падението му, дай и на мене смелост да казвам без увъртания: съгреших. Сърце чисто създай в мене, Боже, и не ме отхвърляй от лицето Си. Направи ме да очаквам с надежда Царството на Сина Давидов, което няма да има край. Амин.\u003c/p>"},"q":[{"q":"Какво обещава Бог на Давид чрез пророк Натан?","o":["Че един негов потомък ще има вечен престол.","Че самият той ще построи храма.","Че никога повече няма да има врагове."]},{"q":"Кой псалом се роди от покаянието на Давид?","o":["Псалом 50, „Помилуй ме, Боже“.","Псалом 22, „Господ е Пастир мой“.","Псалом 103, с който започва вечернята."]}]}},{"n":11,"slug":"3-tsarstva","abbr":"3 Цар","cap":22,"s":"istoricheski","bg":{"nume":"Трета книга Царства","scurt":"От славата на Соломон до разделянето на царството на две и огъня на пророк Илия: какво става, когато сърцето се раздвои.","verset":{"t":"„След огъня — лъх от тих вятър, и там е Господ.“","r":"3 Царства 19:12"},"incepe":"3 Царства 3 · 8 · 17–19","p":{"autor":"\u003cp>Книгата не назовава своя автор. Едно древно предание я свързва с пророк Иеремия, а сегашният ѝ вид е завършен по времето на вавилонския плен, през шести век пр. Хр., въз основа на летописите от двора на царете. При Седемдесетте — древния гръцки превод на Стария Завет, който Църквата следва — четирите книги Царства вървят заедно; затова твоята Библия я нарича „трета“, докато други Библии я наричат Първа книга на царете. Тя разказва около сто и двайсет години, от смъртта на Давид до времето след Илия.\u003c/p>","context":"\u003cp>Дотук Давид обедини народа в едно-единствено царство. Сега синът му Соломон царува в мир, иска от Бога мъдрост и построява Иерусалимския храм, около 960 г. пр. Хр. Но на старини сърцето му се отклонява към чужди богове. След смъртта му царството се разцепва на две: на север Израил, с десет колена и по-късно със столица Самария; на юг Иуда, с Иерусалим и Давидовия дом. На север цар Иеровоам поставя златни телци, а Ахав и Иезавел въвеждат почитането на Ваал. Тогава Бог изпраща Илия Тесвитец. В Четвърта книга Царства следват неговият ученик Елисей и падането на двете царства.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Мъдростта като дар\u003c/strong> — Соломон не иска богатство, а разумно сърце, и получава всичко.\u003c/li>\u003cli>\u003cstrong>Храмът\u003c/strong> — Бог, Когото небесата не могат да поберат, благоволява да живее сред Своя народ.\u003c/li>\u003cli>\u003cstrong>Раздвоеното сърце\u003c/strong> — Падението на Соломон показва, че и най-мъдрият човек не устоява без вярност.\u003c/li>\u003cli>\u003cstrong>Живият Бог и идолите\u003c/strong> — На Кармил Илия пита народа: „още ли ще куцате на две колена?“ (3 Царства 18:21).\u003c/li>\u003cli>\u003cstrong>Тихият глас\u003c/strong> — Бог се явява на Илия не в бурята, а в лъх от тих вятър.\u003c/li>\u003c/ul>","hristos":"\u003cp>Соломон, син на Давид и цар на мира, е сянка на Онзи, Който щеше да дойде. Казва го Сам Спасителят: Южната царица дошла от края на земята, за да чуе мъдростта Соломонова, „а ето, тук има повече от Соломона“ (Матей 12:42). Каменният храм предвещава тялото на Христос, истинското място, където Бог обитава сред хората (Иоан 2:19-21). А Илия върви пред Господа: възкресяването на сина на вдовицата от Сарепта (3 Царства 17) предвещава победата над смъртта, и Христос напомня за тази чужденка, за да покаже, че благодатта се простира над всички народи (Лука 4:25-26). Четиридесетте дни пост на Илия по пътя към Хорив сочат към поста на Господа в пустинята. А на Тавор, при Преображението, Илия стои до Христос заедно с Моисей (Матей 17:3).\u003c/p>","parinti":"\u003cp>Св. Василий Велики в беседите си за поста дава за пример Илия: като постил четиридесет дни, пророкът бил удостоен да види Бога на Хорив, доколкото е възможно за човек. Св. Иоан Златоуст често се връща към вдовицата от Сарепта и я хвали, защото дала от малкото, което имала, показвайки, че милостинята не се мери с ръката, а със сърцето. А апостол Иаков ни приближава до пророка: Илия бил човек като нас, по природа подобен на нас (Иаков 5:17), и все пак молитвата му затвори и отвори небето. Затова Отците четат тази книга като училище на упоритата молитва и на чистата ревност.\u003c/p>","slujbe":"\u003cp>На празника на светия пророк Илия, на Илинден, 20 юли, паримиите на вечернята са от тази книга (глави 17–19). На Богоявление се чете жертвата на Илия на Кармил, онази, която била полята с вода (3 Царства 18). На Велика събота, сред петнайсетте паримии, чуваш възкресяването на сина на вдовицата от Сарепта (3 Царства 17). А на Въведение Богородично се чете освещаването на Соломоновия храм (3 Царства 8), защото Девата е живият храм на Бога.\u003c/p>","rugaciune":"\u003cp>Господи, Боже на Илия, Който не си в бурята, а в тихия лъх, донеси тишина в сърцето ми, за да Те чуя. Дай ми, както на Соломон, разумно сърце, за да различавам доброто от злото, и не оставяй сърцето ми да се раздвои между Тебе и идолите на времето. Храни ме в моята суша, както нахрани Своя пророк. Амин.\u003c/p>"},"q":[{"q":"Какво поиска Соломон от Бога в началото на своето царуване?","o":["Разумно сърце, за да различава доброто от злото.","Богатство и дълъг живот.","Победа над враговете си."]},{"q":"Как се яви Бог на Илия на планината Хорив?","o":["В лъх от тих вятър.","В голям земетръс.","В огън, който изгаряше всичко."]}]}},{"n":12,"slug":"4-tsarstva","abbr":"4 Цар","cap":25,"s":"istoricheski","bg":{"nume":"Четвърта книга Царства","scurt":"Илия е възнесен на небето, Елисей наследява неговия дух, а двете царства падат едно след друго: Божията милост не угасва дори в плена.","verset":{"t":"„Не бой се, защото ония, които са с нас, са повече от ония, които са с тях.“","r":"4 Царства 6:16"},"incepe":"4 Царства 2 · 4–5 · 17 · 22–23","p":{"autor":"\u003cp>Както и предишната книга, с която първоначално е била едно цяло съчинение, Четвърта книга Царства не назовава своя автор; едно древно предание я приписва на пророк Иеремия. Тя е завършена във вавилонския плен, през шести век пр. Хр., от някой, който е погледнал на историята с очите на пророк и е искал да отговори на един болезнен въпрос: защо загубихме своята земя? В други Библии се нарича Втора книга на царете. Обхваща почти триста години.\u003c/p>","context":"\u003cp>Книгата започва с възнасянето на Илия на небето с огнена колесница и с чудесата на неговия ученик Елисей. После проследява един по един царете на двете царства. Царете на север вървят от лошо към по-лошо, докато през 722 г. пр. Хр. асирийците превземат Самария и отвеждат десетте колена в плен. Иуда издържа още малко повече от век, крепен от верни царе като Езекия и Иосия, които очистват храма и отново намират книгата на Закона. Но през 586 г. Навуходоносор, царят на Вавилон, изгаря Иерусалим и храма и отвежда народа в плен. Пророците Исаия и Иеремия са живели точно в тези времена. Завръщането ще намериш в Първа книга на Ездра и в книгата Неемия.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Духът, който се наследява\u003c/strong> — Елисей иска двойна мярка от духа на Илия и благодатта преминава от духовния баща към ученика.\u003c/li>\u003cli>\u003cstrong>Милостта към малките и към чужденците\u003c/strong> — Една бедна вдовица, една майка от Сонам и Нееман сириецът получават еднаква помощ.\u003c/li>\u003cli>\u003cstrong>Дълготърпението на Бога\u003c/strong> — Векове наред Той праща пророци, преди да допусне наказанието.\u003c/li>\u003cli>\u003cstrong>Пленът като последица от отстъплението\u003c/strong> — Земята се губи не от слабостта на войската, а от изоставянето на завета.\u003c/li>\u003cli>\u003cstrong>Надеждата, която остава\u003c/strong> — Книгата завършва с юдейския цар, изведен от тъмницата: светилникът на Давид не е угаснал.\u003c/li>\u003c/ul>","hristos":"\u003cp>Възнасянето на Илия и кожухът, който той оставя на Елисей (4 Царства 2), предвещават Възнесението Господне и слизането на Светия Дух върху учениците. Чудесата на Елисей са като скица на Евангелието: той умножава хлябовете за сто души (4 Царства 4:42-44), възкресява сина на сонамката, очиства прокажен. Сам Христос напомня за Нееман сириеца, който се очисти в Иордан (Лука 4:27), и Църквата вижда в това къпане образ на Кръщението. Дори след смъртта си Елисей дава живот: един мъртвец, който се докоснал до костите му, оживял (4 Царства 13:21) — знак на животворната смърт на Господа и основа на почитането на светите мощи. А падането на Иерусалим показва, че никой земен цар не е могъл да спаси народа: очаквал се е Царят, Чието царство „не ще има край“ (Лука 1:33).\u003c/p>","parinti":"\u003cp>Св. Кирил Иерусалимски в своите огласителни слова привежда чудото с костите на Елисей като доказателство, че в телата на светиите остава сила на благодатта, и като свидетелство за възкресението на мъртвите. Св. Ириней Лионски вижда в желязото на брадвата, което изплува от водата, когато в нея е хвърлено едно дърво (4 Царства 6), образ на Кръста: чрез дървото ни бе върнато онова, което бяхме изгубили. Св. Амвросий Медиолански, говорейки на новопокръстените, им напомня за Нееман: не водата сама очиства, а Божията благодат, която действа чрез нея. Така Отците четат тази книга: под историята на царете — тайнствата на Църквата.\u003c/p>","slujbe":"\u003cp>На Богоявление, сред паримиите на вечернята, чуваш как Елисей разделя Иордан с кожуха на Илия (4 Царства 2) и как Нееман се очиства от проказата (4 Царства 5). На Велика събота се чете възкресяването на сина на сонамката (4 Царства 4). На Илинден, 20 юли, последната паримия разказва възнасянето на пророка на небето. Светият пророк Елисей се почита на 14 юни.\u003c/p>","rugaciune":"\u003cp>Господи, Който отвори очите на слугата на Елисей, за да види Твоите войнства, отвори и очите на моето сърце, когато ме обземе страх. Измий ме, както Нееман, от проказата на моите грехове. Не ме оставяй да Те изоставя и, ако съм отишъл далеч от Тебе, върни ме от моя плен. Амин.\u003c/p>"},"q":[{"q":"Какво поиска Елисей от Илия, преди той да бъде възнесен на небето?","o":["Двойно да бъде върху него духът на Илия.","Огнената колесница и огнените коне.","Да стане цар на Израил."]},{"q":"Какво се случи с Иерусалим през 586 г. пр. Хр.?","o":["Навуходоносор го изгори и народът беше отведен във вавилонски плен.","Асирийците го превзеха заедно със Самария.","Беше украсен с нов храм."]}]}},{"n":13,"slug":"1-paralipomenon","abbr":"1 Пар","cap":29,"s":"istoricheski","bg":{"nume":"Първа книга Паралипоменон","scurt":"Историята на Израил, разказана отново — от Адам до Давид, с поглед, обърнат към храма и към богослужението на Бога.","verset":{"t":"„Славете Господа, защото милостта Му е вовеки.“","r":"1 Паралипоменон 16:34"},"incepe":"1 Паралипоменон 15–17 · 28–29","p":{"autor":"\u003cp>Името „Паралипоменон“ е гръцка дума и значи „пропуснатото“ — неща, които книгите Царства не са разказали. В други Библии книгата се нарича 1 Летописи. Според Преданието я е написал свещеникът и книжник Ездра след завръщането от вавилонския плен, през пети век пр. Хр. Отначало две
