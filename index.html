една Църква или до ученик. Новият Завет има 21 послания, от които 14 са на апостол Павел."},{"t":"\u003cstrong>Предобраз (прообраз)\u003c/strong>","d":"Лице, предмет или събитие от Стария Завет, което предварително сочи към Христос и към Църквата: пасхалното агне, манната, Иона в утробата на кита."},{"t":"\u003cstrong>Притча\u003c/strong>","d":"Кратък разказ, взет от всекидневния живот, с който Христос разкрива тайна на Царството: сеячът, блудният син, милосърдният самарянин."},{"t":"\u003cstrong>Прокимен\u003c/strong>","d":"Стих от псалмите, който се пее преди четенето на Апостола или на паримиите на вечернята, като подготовка за слушането на Писанието."},{"t":"\u003cstrong>Пророк\u003c/strong>","d":"Човек, избран от Бога, за да говори на народа от Негово име: призовава към покаяние, изобличава неправдата и предвъзвестява идването на Месията."},{"t":"\u003cstrong>Псалом\u003c/strong>","d":"Химн-молитва от Псалтира, книгата на 150-те псалма (и на още един, 151-ви), повечето на цар Давид. Православната Библия ги номерира според Септуагинта, затова числото може да е с едно по-малко, отколкото в други Библии."},{"t":"\u003cstrong>Саваот\u003c/strong>","d":"Еврейска дума, която означава „на силите“, „на войнствата“. „Господ Саваот“ е Господарят на небесните сили, Вседържителят; така Го възпяваме на всяка Божествена литургия: „Свят, свят, свят Господ Саваот“."},{"t":"\u003cstrong>Садукей\u003c/strong>","d":"Член на юдейска група, свързана със свещенството на храма. Садукеите не вярваха във възкресението на мъртвите, нито в ангелите."},{"t":"\u003cstrong>Самарянин\u003c/strong>","d":"Жител на Самария, от смесен народ, с който юдеите нямаха общение. И все пак един самарянин е примерът за милосърдие в Евангелието (Лука 10:25-37)."},{"t":"\u003cstrong>Свети Отци\u003c/strong>","d":"Великите учители и пастири на Църквата — като св. Василий Велики, св. Иоан Златоуст или св. Атанасий Велики — които изтълкуваха Свещеното Писание и защитиха правата вяра."},{"t":"\u003cstrong>Свещено Предание\u003c/strong>","d":"Всичко, което Църквата прие от Христос и апостолите и запази живо със Светия Дух: вярата, богослуженията, Тайнствата, учението на Отците. В неговата светлина се чете и Свещеното Писание."},{"t":"\u003cstrong>Септуагинта (Превод на Седемдесетте)\u003c/strong>","d":"Преводът на Стария Завет от еврейски на гръцки, направен в Александрия два-три века преди Христа; според преданието — от седемдесет и двама мъдреци. От него е преведена славянската Библия, а нашето Синодално издание пази по него неканоничните книги и номерацията на псалмите."},{"t":"\u003cstrong>Син Човечески\u003c/strong>","d":"Името, което Христос най-често дава на Себе Си в Евангелията. Идва от видението на пророк Даниил (Даниил 7:13-14) и показва, че Той е истински човек и същевременно Съдията, който ще дойде в слава."},{"t":"\u003cstrong>Синагога\u003c/strong>","d":"Домът за събиране на юдеите, където всяка събота се четеше и тълкуваше Законът. Христос и апостолите често проповядваха в синагогите."},{"t":"\u003cstrong>Сион\u003c/strong>","d":"Хълмът на Иерусалим, където се намираше градът на Давид. В псалмите и песнопенията името стига да означава целия Иерусалим, а после и Църквата."},{"t":"\u003cstrong>Скиния\u003c/strong>","d":"Мястото за богослужение, което Моисей направи в пустинята по Божия заповед и което можеше да се разглобява и пренася от място на място. Играеше ролята на храм до времето на Соломон."},{"t":"\u003cstrong>Словото (Логос)\u003c/strong>","d":"Името, което евангелист Иоан дава на Божия Син в началото на своето Евангелие: „В начало беше Словото“. Словото е Синът, който отвека е при Отца и който стана човек заради нас."},{"t":"\u003cstrong>Спасение\u003c/strong>","d":"Избавлението на човека от греха и смъртта и съединяването му с Бога, подарено чрез Христос. Извършва се през целия живот, в Църквата, с благодатта, вярата и добрите дела."},{"t":"\u003cstrong>Съборно послание\u003c/strong>","d":"Едно от седемте послания (на Иаков, две на Петър, три на Иоан и на Иуда), отправени не към една-единствена община, а към цялата Църква. „Съборно“ тук означава „общо“, „за всички“."},{"t":"\u003cstrong>Събота\u003c/strong>","d":"Седмият ден: ден за почивка, посветен на Бога, според заповедта на Закона. Християните празнуват неделята — деня на Възкресението."},{"t":"\u003cstrong>Съдия\u003c/strong>","d":"Вожд, издигнат от Бога, за да избави народа от враговете, в епохата преди царете. Най-известните са Девора, Гедеон, Самсон и Самуил."},{"t":"\u003cstrong>Триод (Постен триод)\u003c/strong>","d":"Богослужебната книга — и периодът — който започва три седмици преди Великия пост, с Неделята на митаря и фарисея, и стига до Велика събота. Това е периодът с най-много четива от Стария Завет."},{"t":"\u003cstrong>Утреня\u003c/strong>","d":"Утринното богослужение на Църквата. Включва шестопсалмието, катизми, канона и, в неделя, едно от единадесетте възкресни евангелия."},{"t":"\u003cstrong>Фарисей\u003c/strong>","d":"Член на юдейска група с голяма ревност за спазването на Закона и преданията. Христос изобличава фарисеите не за ревността, а за лицемерието и гордостта."},{"t":"\u003cstrong>Херувими и серафими\u003c/strong>","d":"Ангелски чинове, които са най-близо до Божия престол. Изображения на херувими пазеха Ковчега, а серафимите вижда пророк Исаия да пеят „Свят, свят, свят“ (Исаия 6:2-3)."},{"t":"\u003cstrong>Храм (Иерусалимският)\u003c/strong>","d":"Домът Божий в Иерусалим, единственото място, където се принасяха жертви. Построен от Соломон, разрушен от вавилонците и издигнат отново след плена, беше унищожен от римляните през 70 г. сл. Хр."},{"t":"\u003cstrong>Царство Божие\u003c/strong>","d":"Сърцевината на Христовата проповед: животът, в който Бог царува над всичко. Започва още тук, в сърцето на вярващия и в Църквата, и ще се разкрие напълно при Второто пришествие."},{"t":"\u003cstrong>Часове\u003c/strong>","d":"Четири кратки богослужения (първи, трети, шести и девети час), съставени предимно от псалми, които освещават часовете на деня. Великите (Царските) часове чуваш в навечерието на Рождество Христово и Богоявление и на Велики петък."},{"t":"\u003cstrong>Шестопсалмие\u003c/strong>","d":"Шестте псалма (3, 37, 62, 87, 102, 142), с които започва утренята. Четат се в тишина и умиление, като глас на душата, която очаква в нощта светлината на Христос."}]},"crono":{"bg":[{"titlu":"Сътворението на света и грехопадението на човека","ani":"в началото","html":"\u003cp>Бог сътворява света от любов и създава човека по Свой образ. Но Адам и Ева послушват змията и изгубват рая; следват Каин и Авел, потопът в дните на Ной и Вавилонската кула. Още в деня на грехопадението Бог обещава, че потомък на жената ще смаже главата на змията (Битие 3:15) — първата добра вест, която Църквата чете като обещание за Христос. Оттук започва цялата история на спасението.\u003c/p>","carti":["bitie"]},{"titlu":"Патриарсите: Авраам, Исаак и Иаков","ani":"ок. 2000–1700 г. пр. Хр.","html":"\u003cp>Бог призовава Авраам от неговата земя и му обещава, че чрез потомъка му ще бъдат благословени всички народи на земята. Обещанието преминава към Исаак, после към Иаков и дванадесетте му синове; Иосиф, продаден от братята си, накрая спасява семейството си от глада в Египет. В епохата на патриарсите обикновено се поставя и търпението на праведния Иов. От този избран род ще се роди по плът Спасителят.\u003c/p>","carti":["bitie","iov"]},{"titlu":"Изходът от Египет и Законът на Синай","ani":"ок. 1450–1400 г. пр. Хр.","html":"\u003cp>Потомците на Иаков стават роби в Египет. Бог изпраща Моисей, извежда ги през Червено море в нощта на Пасхата и сключва с тях завет на планината Синай, като им дава Закона и скинията на свидетелството. Следват четиридесет години в пустинята, с манна от небето и вода от скалата. Пасхалният агнец, манната и медната змия са предобрази на Христос, а преминаването през морето — образ на Кръщението. Датите са според традиционното изчисление.\u003c/p>","carti":["izhod","levit","chisla","vtorozakonie"]},{"titlu":"Обетованата земя и епохата на съдиите","ani":"ок. 1400–1050 г. пр. Хр.","html":"\u003cp>С Иисус Навин народът преминава Иордан и получава земята, която Бог беше обещал на отците. Следват няколко бурни века: Израил забравя Бога, попада в ръцете на враговете си, вика към Него, и Господ издига съдии — Девора, Гедеон, Самсон, — които го освобождават. По същото време се разиграва и историята на Рут, чужденката от Моав, която стана прабаба на цар Давид. Ясно се вижда колко търпелив е Бог и колко много народът се нуждае от истински Цар.\u003c/p>","carti":["iisus-navin","sadii","rut"]},{"titlu":"Единното царство: Саул, Давид и Соломон","ani":"ок. 1050–930 г. пр. Хр.","html":"\u003cp>Пророк Самуил помазва за цар Саул, а после Давид, овчаря от Витлеем. Давид прави Иерусалим царски град и получава обещанието, че престолът му ще остане довека — обещание, което се изпълнява в Христос, Когото Евангелията наричат Син Давидов. Синът му Соломон построява храма. От тази епоха произхождат, според Преданието на Църквата, повечето псалми и книгите на мъдростта, които носят името на Соломон.\u003c/p>","carti":["1-tsarstva","2-tsarstva","3-tsarstva","1-paralipomenon","2-paralipomenon","psaltir","pritchi","eklisiast","pesen-na-pesnite"]},{"titlu":"Разделеното царство и гласът на пророците","ani":"ок. 930–722 г. пр. Хр.","html":"\u003cp>След смъртта на Соломон царството се разцепва на две: Израил на север, със столица Самария, и Иуда на юг, с Иерусалим. Много царе се подхлъзват в идолопоклонство, и Бог изпраща пророци: Илия и Елисей, после Амос, Осия, Иоил, Иона, Михей и Исаия, които призовават към покаяние и предизвестяват Месията, роден от Дева, във Витлеем. През 722 г. пр. Хр. асирийците превземат Самария и отвеждат в плен северното царство.\u003c/p>","carti":["3-tsarstva","4-tsarstva","2-paralipomenon","isaia","osia","amos","mihey","ioil","iona"]},{"titlu":"Последните царе на Иуда","ani":"ок. 722–586 г. пр. Хр.","html":"\u003cp>Царството на Иуда устоява още почти век и половина. Благочестиви царе като Езекия и Иосия очистват храма; други, като Манасия, изпълват страната с идоли — а Църквата пази молитвата на неговото покаяние, в края на Втора книга Паралипоменон. Наум, Софония, Авакум и преди всичко Иеремия предизвестяват съда, но и един нов завет, написан в сърцата. Сред отведените по-рано в Асирия живее праведният Товит. През 586 г. пр. Хр. вавилонците разрушават Иерусалим и храма.\u003c/p>","carti":["4-tsarstva","2-paralipomenon","ieremia","naum","avakum","sofonia","tovit"]},{"titlu":"Вавилонският плен","ani":"ок. 586–538 г. пр. Хр.","html":"\u003cp>Народът е отведен във Вавилон, далеч от храма. Иеремия оплаква опустошения град, а Авдий изобличава Едом, който се зарадва на падането му. Сред пленниците Иезекиил вижда сухите кости да оживяват, а Даниил и тримата отроци остават верни в огнената пещ и в рова с лъвовете; оттук идват и историята на Сусана, песента на тримата отроци и книгата на Варух. Във Вавилон, тридесет години след разрушаването на града, се поставя и Трета книга на Ездра с нейните видения — макар да е написана много по-късно, към края на първи век сл. Хр. Пленът учи народа, че Бог е близо навсякъде, и подготвя надеждата за възкресението.\u003c/p>","carti":["plach-ieremiev","avdiy","iezekiil","daniil","varuh","poslanie-na-ieremia","3-ezdra"]},{"titlu":"Завръщането от плена и вторият храм","ani":"ок. 538–430 г. пр. Хр.","html":"\u003cp>Персийският цар Кир позволява на иудеите да се върнат в родината. Зоровавел построява отново храма, насърчаван от пророците Агей и Захария; Ездра връща народа към Закона, а Неемия издига стените на Иерусалим. Далеч, в персийския двор, Естир спасява народа си от изтребление; след завръщането от плена поставя своята история и книгата на Иудит. Малахия, последният от пророците на Стария Завет, предизвестява Предтечата на Господа. После гласът на пророчеството замлъква, и народът чака.\u003c/p>","carti":["1-ezdra","neemia","estir","agey","zaharia","malahia","2-ezdra","iudit"]},{"titlu":"Между двата Завета: гръцкото владичество и Макавеите","ani":"ок. 430–1 г. пр. Хр.","html":"\u003cp>След Александър Велики гръцкият език и гръцките нрави се разпространяват навсякъде. В Александрия Писанието е преведено на гръцки — преводът на Седемдесетте, Библията, която ще използва Църквата и от която по-късно св. св. Кирил и Методий ще преведат Словото на славянски език. Когато цар Антиох Епифан осквернява храма и забранява Закона, братята Макавеи въстават, а мъчениците умират, изповядвайки възкресението. По същото време се пишат книги на мъдростта, като тази на Иисус, син Сирахов, и онази, която носи името на Соломон. Към края идват римляните, и светът е готов за идването на Христос.\u003c/p>","carti":["1-makaveyska","2-makaveyska","3-makaveyska","sirah","premadrost-solomonova"]},{"titlu":"Въплъщението, Разпятието и Възкресението на Господа","ani":"ок. 1–33 г. сл. Хр.","html":"\u003cp>Когато идва пълнотата на времето, Синът Божий става човек от Дева Мария, във Витлеем. След кръщението, което приема от Иоан, Иисус Христос проповядва Царството, изцелява, прощава грехове и избира дванадесет апостоли. Доброволно е разпнат на Голгота, в дните на Понтий Пилат, на третия ден възкръсва, а четиридесет дни по-късно се възнася на небесата. Тук е сърцето на цялото Писание: всичко, което беше обещано, се изпълнява в Него.\u003c/p>","carti":["matey","mark","luka","ioan"]},{"titlu":"Петдесетница и Иерусалимската църква","ani":"ок. 33–48 г. сл. Хр.","html":"\u003cp>Петдесет дни след Възкресението Светият Дух слиза над апостолите и Църквата се явява на света. Петър проповядва, хиляди хора се кръщават, а архидякон Стефан става първият мъченик. Савел, гонителят, е призован от Христос по пътя за Дамаск и става апостол Павел; чрез стотника Корнилий Евангелието преминава и към езичниците. Иаков, брат Господен, пастирства общината в Иерусалим. Обещанието, дадено на Авраам, започва да обгръща всички народи.\u003c/p>","carti":["deyania","iakov"]},{"titlu":"Пътуванията на апостол Павел и посланията до църквите","ani":"ок. 48–67 г. сл. Хр.","html":"\u003cp>Павел прекосява Мала Азия, Македония и Гърция, като основава църкви във Филипи, Солун, Коринт и Ефес. Апостолският събор в Иерусалим решава, че езичниците не трябва да носят игото на Моисеевия закон. От пътуванията и от оковите апостолът пише своите послания; пише и Петър, до онези, които са изпитвани от гонението. Според Преданието и двамата приемат мъченическа смърт в Рим, по времето на император Нерон. Така Евангелието стигна от Иерусалим до сърцето на империята — и оттам към всички народи.\u003c/p>","carti":["deyania","rimlyani","1-korintyani","2-korintyani","galatyani","efesyani","filipyani","kolosyani","1-soluntsi","2-soluntsi","1-timotey","2-timotey","tit","filimon","evrei","1-petar","2-petar"]},{"titlu":"Краят на апостолската епоха и очакването на Второто пришествие","ani":"ок. 67–100 г. сл. Хр. и до днес","html":"\u003cp>През 70 г. сл. Хр. римляните разрушават Иерусалимския храм. Св. Иоан, последният от апостолите, пише своите послания, а на остров Патмос получава откровението за победата на Агнеца; Иуда призовава към борба за вярата, предадена на светиите веднъж завинаги. Векове по-късно св. св. Кирил и Методий превеждат Словото на славянски език, а учениците им — св. Климент и св. Наум Охридски — го донасят в българските земи. Оттогава Църквата живее от Свещеното Писание и от светите Тайнства и очаква, както казва Символът на вярата, Второто пришествие на Господа, възкресението на мъртвите и живота в бъдещия век.\u003c/p>","carti":["1-ioan","2-ioan","3-ioan","iuda","otkrovenie"]}]},"cand":{"bg":[{"titlu":"Когато те е страх","refs":[{"ref":"Псалом 90","text":"Псалмът на онзи, който се приютява под покрова на Всевишния: нито страхът на нощта, нито опасността на деня го побеждават."},{"ref":"Псалом 26","text":"Господ е твоя светлина и твое спасение; псалмопевецът се пита от кого изобщо би могъл да се бои."},{"ref":"Исаия 41:10","text":"Бог ти казва да не се боиш, защото е с теб, укрепва те и те поддържа с десницата Си."},{"ref":"Марк 4:35-41","text":"Христос укротява бурята в морето и пита учениците защо са толкова страхливи."}]},{"titlu":"Когато ти е тъжно","refs":[{"ref":"Псалом 41","text":"Една наскърбена душа говори сама на себе си и се подканя да се уповава на Бога, както жадната кошута търси водния поток."},{"ref":"Плач Иеремиев 3:22-26","text":"Сред развалините пророкът си спомня, че милостите на Господа не са свършили и се обновяват всяка сутрин."},{"ref":"Матей 5:1-12","text":"Блаженствата: Христос нарича блажени онези, които плачат, защото те ще се утешат."},{"ref":"Иоан 16:20-22","text":"Обещанието на Господа, че скръбта ще се превърне в радост, и тази радост никой няма да отнеме; ако тъгата продължава дълго, сподели я и с духовника си."}]},{"titlu":"Когато загубиш близък човек","refs":[{"ref":"Иоан 11:17-44","text":"Христос плаче пред гроба на приятеля Си Лазар и казва, че Той е възкресението и животът."},{"ref":"1 Солуняни 4:13-18","text":"Апостолът, който се чете на опелото: да не скърбим като онези, които нямат надежда."},{"ref":"Премъдрост Соломонова 3:1-9","text":"Душите на праведните са в Божията ръка и тяхното отминаване само изглежда като гибел."},{"ref":"Откровение 21:1-4","text":"Обещанието, че Бог ще изтрие всяка сълза и смърт няма да има вече; в болката си не оставай сам, говори с духовника си."}]},{"titlu":"Когато боледуваш","refs":[{"ref":"Псалом 6","text":"Молитвата на отпадналия човек, който моли за милост и изцеление и знае, че Господ е чул плача му."},{"ref":"Марк 2:1-12","text":"Паралитикът, когото носят четирима приятели: Христос първо му прощава греховете, а после го вдига от постелята."},{"ref":"Иаков 5:13-16","text":"Болният нека повика презвитерите на Църквата, за да се помолят и да го помажат с елей: основата на тайнството Елеосвещение."},{"ref":"Сирах 38:1-14","text":"Почитай лекаря, защото и него Господ е отредил, а в болестта се моли и не бъди нехаен."}]},{"titlu":"Когато ти е самотно","refs":[{"ref":"Псалом 138","text":"Бог те познава изцяло и няма място, където да не е с теб."},{"ref":"3 Царства 19:9-18","text":"Илия мисли, че е останал сам, но Бог му говори в тих повей и му показва, че има още седем хиляди верни."},{"ref":"Исаия 49:14-16","text":"Дори една майка да забравеше детето си, Господ не те забравя: написал те е на дланите Си."},{"ref":"Матей 28:16-20","text":"Последните думи на Евангелието от Матея: Христос е с нас през всички дни, до свършека на света."}]},{"titlu":"Когато сгрешиш и те мъчи вината","refs":[{"ref":"Псалом 50","text":"Покайният псалом на Давид: моли за милост, чисто сърце и прав, обновен дух."},{"ref":"Лука 15:11-32","text":"Притчата за блудния син: бащата тича да посрещне онзи, който се връща."},{"ref":"1 Иоан 1:8-9","text":"Ако изповядваме греховете си, Бог е верен и праведен, за да ни ги прости."},{"ref":"Молитва на Манасия (в края на 2 Паралипоменон)","text":"Молитвата на един цар, който много е съгрешил и прекланя коленете на сърцето си; чете се на Великото повечерие."}]},{"titlu":"Когато вече не можеш да простиш","refs":[{"ref":"Битие 45:1-15","text":"Иосиф се открива на братята, които го продадоха, и им прощава със сълзи."},{"ref":"Матей 18:21-35","text":"Петър пита колко пъти да прощава, а Христос отговаря с притчата за немилостивия длъжник."},{"ref":"Ефесяни 4:31-32","text":"Подканата да отхвърлим горчивината и да си прощаваме един на друг, както Бог ни прости в Христа."},{"ref":"Сирах 28:1-7","text":"Който таи гняв към ближния, не може да иска изцеление от Господа; прости, и ще ти бъде простено."}]},{"titlu":"Когато се тревожиш за утрешния ден","refs":[{"ref":"Матей 6:25-34","text":"Птиците небесни и полските кринове: Отец знае от какво се нуждаеш; търси първом Царството."},{"ref":"Псалом 22","text":"„Господ е Пастир мой, от нищо не ще се нуждая“: Господ е твоят Пастир и нищо няма да ти липсва, дори в долината на смъртната сянка."},{"ref":"Филипяни 4:6-7","text":"Кажи на Бога прошенията си, с благодарност, и Неговият мир ще запази сърцето ти."},{"ref":"1 Петър 5:6-7","text":"Възложи на Него всичките си грижи, защото Той се грижи за теб."}]},{"titlu":"Когато трябва да вземеш решение","refs":[{"ref":"3 Царства 3:5-14","text":"Младият Соломон не иска богатство, а разумно сърце, за да различава доброто от злото."},{"ref":"Притчи 3:5-6","text":"Уповавай се на Господа с цялото си сърце и не се облягай на своя разум; Той ще изправи пътищата ти."},{"ref":"Псалом 118:105","text":"Божието слово е светило за нозете и светлина за пътеката."},{"ref":"Иаков 1:5-8","text":"На когото не достига мъдрост, нека я иска от Бога, с вяра и без колебание; за големите решения потърси и съвета на духовника си."}]},{"titlu":"Когато чувстваш умора","refs":[{"ref":"3 Царства 19:4-8","text":"Илия, изтощен, заспива под едно дърво в пустинята; ангелът го буди и му дава хляб и вода за пътя."},{"ref":"Псалом 61","text":"Само в Бога намира душата своя покой: от Него идват спасението и опората."},{"ref":"Исаия 40:28-31","text":"Бог не се уморява, а онези, които се надяват на Него, подновяват силата си и се издигат като орли."},{"ref":"Матей 11:28-30","text":"Христос призовава при Себе Си всички отрудени и обременени и им обещава покой."}]},{"titlu":"Когато искаш да благодариш","refs":[{"ref":"Псалом 102","text":"„Благославяй, душо моя, Господа“: благославяй Господа и не забравяй нито едно от Неговите благодеяния."},{"ref":"Товит 13","text":"Благодарствената молитва на стария Товит, след като Бог му върна светлината и радостта."},{"ref":"Лука 17:11-19","text":"Десет прокажени се изцеляват, но само един, самарянин, се връща да благодари."},{"ref":"1 Солуняни 5:16-18","text":"Подканата винаги да се радваме, непрестанно да се молим и за всичко да благодарим."}]},{"titlu":"Когато се молиш за децата си","refs":[{"ref":"1 Царства 1:9-28","text":"Ана излива душата си пред Господа, получава син, Самуил, и Му го посвещава за целия му живот."},{"ref":"Второзаконие 6:4-9","text":"Думите на Господа да бъдат в сърцето ти и да ги говориш на децата си у дома и на път, вечер и сутрин."},{"ref":"Товит 4","text":"Съветите на един баща към сина му: да помни Господа през всичките си дни, да бъде милостив и справедлив."},{"ref":"Марк 10:13-16","text":"Христос взема децата в прегръдките Си и ги благославя: на такива като тях принадлежи Царството."}]},{"titlu":"Когато се готвиш за изповед","refs":[{"ref":"Псалом 31","text":"Блаженството на простения: докато мълчеше, повяхваше; когато изповяда греха си, беше освободен."},{"ref":"Исаия 1:16-18","text":"Призивът да се умием и очистим: греховете, червени като багреница, могат да станат бели като сняг."},{"ref":"Лука 18:9-14","text":"Митарят и фарисеят: кратката молитва на онзи, който се бие в гърдите, е тази, която бива приета."},{"ref":"Иоан 20:19-23","text":"Възкръсналият Христос духва върху апостолите и им дава властта да прощават грехове."}]},{"titlu":"Когато се готвиш за свето Причастие","refs":[{"ref":"Псалом 33","text":"„Вкусете и вижте, колко благ е Господ“: призивът да вкусиш и да видиш колко е благ Господ; пее се по време на причастяването на Преждеосвещената литургия."},{"ref":"Лука 22:14-20","text":"Тайната вечеря: Христос преломява хляба и подава чашата, казвайки, че това са Неговото Тяло и Неговата Кръв."},{"ref":"Иоан 6:48-58","text":"Словото за Хляба на живота: който яде Неговото Тяло и пие Неговата Кръв, има живот вечен."},{"ref":"1 Коринтяни 11:23-29","text":"Апостол Павел припомня онова, което е приел от Господа, и иска от всекиго да изпитва себе си, преди да пристъпи към Чашата."}]},{"titlu":"Когато постиш","refs":[{"ref":"Исаия 58:1-12","text":"Постът, който е угоден на Бога: да развържеш оковите на неправдата и да разделиш хляба си с гладния."},{"ref":"Иоил 2:12-17","text":"Призивът да се върнем при Господа с цялото си сърце, като раздираме сърцата си, а не дрехите."},{"ref":"Иона 3","text":"Градът Ниневия пости, от царя до най-малкия, и Бог се смилява над него."},{"ref":"Матей 6:16-18","text":"Пости без намръщено лице, тайно, пред Отца, Който вижда в скришно."}]},{"titlu":"Когато идва Рождество Христово","refs":[{"ref":"Исаия 9:2-7","text":"Народът, който ходи в тъмнина, вижда голяма светлина: Младенец ни се роди, Князът на мира."},{"ref":"Михей 5:2-5","text":"Пророчеството за Витлеем, малкия град, от който ще излезе Владетелят на Израил."},{"ref":"Лука 2:1-20","text":"Рождението на Господа: яслите, пастирите и песента на ангелите."},{"ref":"Матей 2:1-12","text":"Мъдреците от Изток следват звездата и се покланят на Младенеца; това е Евангелието на Божествената литургия на Рождество."}]},{"titlu":"Когато идва Великден","refs":[{"ref":"Изход 12:1-14","text":"Пасхалното агне и нощта на излизането от Египет, предобраз на Христовата Пасха."},{"ref":"Матей 28:1-10","text":"Мироносиците намират гроба празен и чуват от ангела, че Христос е възкръснал."},{"ref":"Лука 24:13-35","text":"Пътят към Емаус: Възкръсналият обяснява на учениците Писанията и бива познат при преломяването на хляба."},{"ref":"1 Коринтяни 15:12-26","text":"Христос възкръсна като начатък на починалите, а последният враг, смъртта, ще бъде унищожен."}]},{"titlu":"Когато започваш деня","refs":[{"ref":"Псалом 5","text":"Утринната молитва на псалмопевеца, който знае, че Господ чува гласа му от ранни зори."},{"ref":"Псалом 62","text":"Жадната душа търси Бога от ранни зори; един от шестте псалома на Шестопсалмието, на утренята."},{"ref":"Марк 1:35-39","text":"Христос става много преди разсъмване и се моли на пусто място."},{"ref":"Колосяни 3:12-17","text":"Облечи се в доброта и търпение и върши всичко, с дума или с дело, в името на Господа Иисуса."}]},{"titlu":"Когато се готвиш за сън","refs":[{"ref":"Псалом 4","text":"С мир лягаш и заспиваш, защото само Господ те прави да живееш без страх."},{"ref":"Псалом 140","text":"„Да се възнесе молитвата ми като тамян пред Твоето лице“: молитвата да се издига като тамян, а въздигането на ръцете – като вечерна жертва; пее се на вечернята."},{"ref":"Лука 2:25-32","text":"Молитвата на праведния Симеон, „Сега отпускаш“: може да си отиде с мир, защото видя спасението; чете се в края на вечернята."},{"ref":"Ефесяни 4:26-27","text":"Слънцето да не залязва над гнева ти: помири се, преди да заспиш."}]},{"titlu":"Когато се съмняваш","refs":[{"ref":"Псалом 72","text":"Псалмопевецът признава, че малко остана да се подхлъзнат стъпките му, докато не влезе в Божието светилище и разбра."},{"ref":"Матей 14:22-33","text":"Петър тръгва да ходи по водата, уплашва се от вятъра и започва да потъва; Христос му протяга ръка."},{"ref":"Марк 9:14-29","text":"Бащата на болното дете извиква, че вярва, и моли за помощ в неверието си."},{"ref":"Иоан 20:24-29","text":"Тома не вярва, ако не види, а Христос не го отпраща, но го кани да докосне раните Му; въпросите си можеш да занесеш, без срам, при духовника си."}]},{"titlu":"Когато те напада изкушение","refs":[{"ref":"Сирах 2:1-6","text":"Който иска да служи на Господа, нека приготви душата си за изпитание, защото златото се изпитва в огън."},{"ref":"Матей 4:1-11","text":"Христос пости четиридесет дни в пустинята и отблъсква трите изкушения със словото на Писанието."},{"ref":"1 Коринтяни 10:12-13","text":"Бог е верен: не допуска да бъдеш изкушаван над силите ти и дава, заедно с изкушението, и изхода."},{"ref":"Иаков 1:12-15","text":"Блажен е, който претърпява изкушение; то не идва от Бога, а от похотта, която увлича човека."}]},{"titlu":"Когато искаш да укрепиш брака си","refs":[{"ref":"Товит 8","text":"Товия и Сара започват живота си заедно с молитва, като молят за Божията милост и за благодатта да остареят заедно."},{"ref":"Иоан 2:1-11","text":"Сватбата в Кана Галилейска, където Христос превръща водата във вино; това е Евангелието на тайнството Брак."},{"ref":"1 Коринтяни 13:4-7","text":"Любовта е дълготърпелива, пълна с благост, не търси своето и на всичко се надява."},{"ref":"Ефесяни 5:21-33","text":"Апостолът на венчанието: съпрузите да се обичат, както Христос обикна Църквата и предаде Себе Си за нея."}]},{"titlu":"Когато ти е трудно на работа","refs":[{"ref":"Псалом 126","text":"Ако Господ не съгради къщата, напразно се трудят онези, които я градят."},{"ref":"Еклисиаст 3:9-13","text":"Да се радваш на плода на труда си е дар от Бога."},{"ref":"Матей 25:14-30","text":"Притчата за талантите: всеки получава според силата си и е призован да работи с онова, което му е дадено."},{"ref":"Колосяни 3:23-24","text":"Каквото и да вършиш, върши го от сърце, като за Господа, а не като за човеци."}]},{"titlu":"Когато имаш нужда от надежда","refs":[{"ref":"Псалом 120","text":"Повдигаш очи към планините: помощта идва от Господа, Който не дреме и те пази."},{"ref":"Иезекиил 37:1-14","text":"Полето със сухите кости оживява чрез словото на Господа: нищо не е прекалено мъртво за Него."},{"ref":"Римляни 8:28-39","text":"Нито смърт, нито живот, нищо от онова, което съществува, не може да ни отлъчи от Божията любов."},{"ref":"Евреи 6:17-20","text":"Надеждата е котва на душата, здрава и непоклатима, закрепена за Христа."}]}]},"cal":{"fixe":[{"m":1,"d":1,"r":"P","bg":"Обрезание Господне · Св. Василий Велики (Васильовден, Нова година)"},{"m":1,"d":5,"r":"M","bg":"Навечерие на Богоявление (ден на строг пост)"},{"m":1,"d":6,"r":"P","carte":"matey","bg":"Богоявление (Йордановден) · Велик водосвет"},{"m":1,"d":7,"r":"S","bg":"Събор на св. Иоан Кръстител (Ивановден)"},{"m":1,"d":17,"r":"S","bg":"Св. Антоний Велики (Антоновден)"},{"m":1,"d":18,"r":"S","bg":"Св. Атанасий Велики и св. Кирил Александрийски (Атанасовден)"},{"m":1,"d":20,"r":"S","bg":"Св. Евтимий, патриарх Търновски"},{"m":1,"d":30,"r":"S","bg":"Св. Трима светители: Василий Велики, Григорий Богослов и Иоан Златоуст"},{"m":2,"d":2,"r":"P","carte":"luka","bg":"Сретение Господне"},{"m":2,"d":10,"r":"S","bg":"Св. свещеномъченик Харалампий"},{"m":3,"d":9,"r":"S","bg":"Св. 40 мъченици Севастийски (Младенци)"},{"m":3,"d":25,"r":"P","carte":"luka","bg":"Благовещение на Пресвета Богородица"},{"m":5,"d":6,"r":"S","bg":"Св. великомъченик Георги Победоносец (Гергьовден)"},{"m":5,"d":11,"r":"S","bg":"Св. св. рав /* plural: base → base, base+'s' (2-4 / plural), base+'s5' (5+ en checo) */
function cnt(n, base) {

/* ============================================================ calendario */
function mkDate(y, m, d) { return new Date(y, m - 1, d, 12); }

  var m = Math.floor((d + e + 114) / 31), day = ((d + e + 114) % 31) + 1;

}

/* domingos móviles del calendario católico */
function nextSundayAfter(dt) { return addDays(dt, 7 - dt.getDay()); }

function fname(f) { return f._t ? t(f._t) : L(f); }

function dayInfo(dt) {
  var y = dt.getFullYear(), m = dt.getMonth() + 1, d = dt.getDate(), wd = dt.getDay();
  var off = diffDays(dt, pascha(y));
  var feasts = [];
  D.cal.mobile.forEach(function (f) { if (f.o === off) feasts.push(f); });
  D.cal.fixe.forEach(function (f) { if (f.m === m && f.d === d) feasts.push(f); });
  if (CATH) {
    if (sameDay(dt, advent1(y))) feasts.push({ r: 'M', _t: 'cal.advent1' });
    if (sameDay(dt, kristKral(y))) feasts.push({ r: 'P', _t: 'cal.kristakrale' });
    if (sameDay(dt, krestPane(y))) feasts.push({ r: 'S', _t: 'cal.krest' });
    if (sameDay(dt, svataRodina(y))) feasts.push({ r: 'S', _t: 'cal.svaterodiny' });
    var period;
    if (off >= -46 && off <= -4) period = 'postni';
    else if (off >= -3 && off <= -1) period = 'triduum';
    else if (off >= 0 && off <= 49) period = 'velikonocni';
    else if ((m === 12 && d >= 25) || (m === 1 && diffDays(dt, krestPane(y)) <= 0)) period = 'vanoce';
    else if (m >= 11 && diffDays(dt, advent1(y)) >= 0 && !(m === 12 && d >= 25)) period = 'advent';
    else period = 'mezidobi';
    var solemn = feasts.some(function (f) { return f.r === 'P'; }) || (off >= 1 && off <= 7);
    var fast = null;
    if (off === -46 || off === -2) fast = 'postPrisny';
    else if (wd === 5 && !solemn) fast = 'patek';
    return { off: off, feasts: feasts, fast: fast, period: period, alba: false, harti: false };
  }
  var fast = null, period = null;
  if (off >= -48 && off <= -7) period = 'postMare';
  else if (off >= -6 && off <= -1) period = 'saptPatimi';
  else if (off >= 57 && (m < 6 || (m === 6 && d <= 28))) period = 'postApostoli';
  else if (m === 8 && d <= 14) period = 'postAdormire';
  else if ((m === 11 && d >= 15) || (m === 12 && d <= 24)) period = 'postNastere';
  var free = (m === 12 && d >= 25) || (m === 1 && d <= 4) || (m === 1 && d === 6) ||
    (off >= -69 && off <= -64) || (off >= 1 && off <= 6) || (off >= 50 && off <= 56);
  var alba = off >= -55 && off <= -49;

  else if ((m === 1 && d === 5) || (m === 8 && d === 29) || (m === 9 && d === 14)) fast = 'ziPost';
  else if ((wd === 3 || wd === 5) && !free && !alba) fast = 'ziPost';
  return { off: off, feasts: feasts, fast: fast, period: period, alba: alba, harti: free && (wd === 3 || wd === 5) };

function lxxToHeb(n) {

}
function hebToLxx(n) {

function psResult() {
  var n = parseInt(psN, 10);
  if (!n) return '';
  if (n === 151 && psDir === 'lxx') return '<div class="card psr"><p>' + t('ps.151') + '</p></div>';
  var r = psDir === 'lxx' ? lxxToHeb(n) : hebToLxx(n);
  if (!r) return '<div class="card psr"><p>' + t('ps.bad') + '</p></div>';
  return '<div class="card psr"><span class="kick">' + (psDir === 'lxx' ? t('ps.inHeb') : t('ps.inLxx')) + '</span><h2>' + t('ps.psalm') + ' ' + r + '</h2>' +
    '<p class="muted">' + (psDir === 'lxx' ? t('ps.expl1', n, r) : t('ps.expl2', n, r)) + '</p></div>';
}
V.psalmi = function () {
  function chip(d, lab) { return '<button class="chip' + (psDir === d ? ' on' : '') + '" data-act="psDir" data-d="' + d + '">' + lab + '</button>'; }
  var chips = CATH ? chip('heb', t('ps.fromHeb')) + chip('lxx', t('ps.fromLxx')) : chip('lxx', t('ps.fromLxx')) + chip('heb', t('ps.fromHeb'));
  return back('#/unelte', t('nav.tools')) + head(t('tool'), t('ps.title'), t('ps.lead')) +
    '<div class="chips">' + chips + '</div>' +
    '<input type="number" min="1" max="151" class="inp big" data-inp="psN" placeholder="' + t('ps.ph') + '" value="' + esc(psN) + '"><div id="psOut">' + psResult() + '</div>' +
    '<section class="card"><h2>' + t('ps.tableT') + '</h2><table class="pst"><tr><th>' + t('ps.colLxx') + '</th><th>' + t('ps.colHeb') + '</th></tr>' +
    [['1–8', '1–8'], ['9', '9–10'], ['10–112', '11–113'], ['113', '114–115'], ['114–115', '116'], ['116–145', '117–146'], ['146–147', '147'], ['148–150', '148–150'], ['151', '—']].map(function (r) {
      return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    }).join('') + '</table><p class="muted small">' + t('ps.known') + '</p></section>';
};

V.diploma = function () {
  var n = readCount(), done = n >= B.length;
  var h = back('#/unelte', t('nav.tools'));
  if (!done) {
    return h + head(t('tool'), t('dip.title'), t('dip.lock', B.length - n)) + bar(n / B.length) +
      '<p class="muted center">' + t('route.progress', n, B.length) + '</p><div class="center"><a class="btn" href="#/carte/' + nextBook().slug + '">' + t('home.continue') + '</a></div>';
  }
  var last = 0; B.forEach(function (b) { if (S.read[b.slug] > last) last = S.read[b.slug]; });
  var dt = new Date(last || Date.now());
  h += '<div class="noprint">' + head(t('tool'), t('dip.title'), t('dip.lead')) +
    '<input class="inp" data-inp="name" placeholder="' + t('dip.namePh') + '" value="' + esc(S.name || '') + '"></div>' +
    '<div class="diploma">' + MARK + '<span class="kick">' + esc(BRAND) + '</span><h1>' + t('dip.h') + '</h1><p>' + t('dip.p1') + '</p>' +
    '<div class="dname" id="dName">' + esc(S.name || t('dip.nameDef')) + '</div><p>' + t('dip.p2') + '</p>' +
    '<p class="dverse">' + t('dip.verse') + '</p><small>' + fmtDate(dt, true) + '</small></div>' +
    '<div class="center noprint"><button class="btn" data-act="print">' + IC.print + t('print') + '</button></div>';
  return h;
};

/* ============================================================ voz */
function langVoice() {
  try {
    var vs = window.speechSynthesis.getVoices();
    for (var i = 0; i < vs.length; i++) if (vs[i].lang && vs[i].lang.toLowerCase().indexOf(LANG) === 0) return vs[i];
  } catch (e) {}
  return null;
}
function canSpeak() { return 'speechSynthesis' in window && !!langVoice(); }
var speaking = false;
function speakStop() { try { window.speechSynthesis.cancel(); } catch (e) {} speaking = false; }
function speakBook(slug) {
  var b = bySlug[slug], l = L(b), tmp = document.createElement('div'), parts = [l.nume + '.'];
  PARTS.concat(['rugaciune']).forEach(function (p) { tmp.innerHTML = l.p[p] || ''; parts.push(t('part.' + p) + '. ' + tmp.textContent); });
  speakStop(); speaking = true;
  parts.forEach(function (txt, i) {
    var u = new SpeechSynthesisUtterance(txt);
    u.voice = langVoice(); u.lang = u.voice ? u.voice.lang : (CFG.voice || LANG); u.rate = 0.95;
    if (i === parts.length - 1) u.onend = function () { speaking = false; var el = $('#speakBtn'); if (el) el.innerHTML = IC.play + t('book.listen'); };
    window.speechSynthesis.speak(u);
  });
}

/* ============================================================ router y chrome */
var ROUTES = [
  [/^\/?$/, 'home', 'home'], [/^\/harta$/, 'harta', 'map'], [/^\/carte\/([\w-]+)$/, 'carte', 'map'], [/^\/traseu$/, 'traseu', 'route'],
  [/^\/bonus$/, 'bonus', 'bonus'], [/^\/bonus\/plan$/, 'plan', 'bonus'], [/^\/bonus\/rugaciune$/, 'rugaciune', 'bonus'],
  [/^\/bonus\/rugaciune-ghidata$/, 'ghidata', 'bonus'], [/^\/bonus\/calendar$/, 'calendar', 'bonus'], [/^\/bonus\/liturghie$/, 'liturghie', 'bonus'],
  [/^\/ghid$/, 'ghid', 'home'], [/^\/14-carti$/, 'x14', 'bonus'], [/^\/unelte$/, 'unelte', 'tools'], [/^\/unelte\/jurnal$/, 'jurnal', 'tools'],
  [/^\/unelte\/test$/, 'test', 'tools'], [/^\/unelte\/dictionar$/, 'dictionar', 'tools'], [/^\/unelte\/cronologie$/, 'cronologie', 'tools'],
  [/^\/unelte\/cand$/, 'cand', 'tools'], [/^\/unelte\/psalmi$/, 'psalmi', 'tools'], [/^\/unelte\/diploma$/, 'diploma', 'tools'], [/^\/unelte\/tot$/, 'tot', 'tools']
];
var curTab = 'home', lastHash = null;
function tabs() {
  return [['home', '#/', IC.home, t('nav.home')], ['map', '#/harta', IC.map, t('nav.map')], ['route', '#/traseu', IC.route, t('nav.route')],
    ['bonus', '#/bonus', IC.gift, t('nav.bonus')], ['tools', '#/unelte', IC.tools, t('nav.tools')]].map(function (x) {
    return '<a href="' + x[1] + '"' + (curTab === x[0] ? ' class="on" aria-current="page"' : '') + '>' + x[2] + '<span>' + x[3] + '</span></a>';
  }).join('');
}
function chrome() {
  var L0 = D.langs[0], L0U = (CFG.langLabel || L0).toUpperCase();
  $('#top').innerHTML = '<a class="brand" href="#/">' + MARK + '<span>' + esc(BRAND) + '</span></a><nav class="tabs">' + tabs() + '</nav><div class="ttools">' +
    (D.langs.length > 1 ? '<button class="tbtn lang" data-act="lang">' + (LANG === L0 ? L0U + ' → ES' : 'ES → ' + L0U) + '</button>' : '') +
    '<button class="tbtn' + (S.night ? ' on' : '') + '" data-act="night" aria-label="' + t('set.night') + '">' + IC.moon + '</button></div>';
  $('#bottom').innerHTML = tabs();
  document.documentElement.setAttribute('data-night', S.night ? '1' : '0');
  document.documentElement.lang = LANG;
}
function render(keepScroll) {
  var hash = location.hash.replace(/^#/, '') || '/', view = 'home', arg = null;
  curTab = 'home';
  for (var i = 0; i < ROUTES.length; i++) {
    var m = hash.match(ROUTES[i][0]);
    if (m) { view = ROUTES[i][1]; curTab = ROUTES[i][2]; arg = m[1]; break; }
  }
  if (hash !== lastHash) { speakStop(); if (view !== 'ghidata') { gStop(); G.i = -1; } if (view !== 'test') T = null; }
  chrome();
  $('#view').innerHTML = V[view](arg);
  $('#view').className = 'v-' + view;
  if (hash !== lastHash && !keepScroll) window.scrollTo(0, 0);
  lastHash = hash;
}

/* ============================================================ acciones */
function download(name, text, type) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
var ACT = {
  read: function (el) { var s = el.dataset.slug; if (S.read[s]) delete S.read[s]; else S.read[s] = Date.now(); save(); render(true); },
  fav: function (el) { var s = el.dataset.slug; if (S.fav[s]) delete S.fav[s]; else S.fav[s] = 1; save(); render(true); },
  font: function () { S.font = (S.font + 1) % 4; save(); render(true); },
  night: function () { S.night = !S.night; save(); render(true); },
  print: function () { window.print(); },
  lang: function () { LANG = LANG === D.langs[0] ? D.langs[1] : D.langs[0]; quizOrder = {}; T = null; render(true); },
  speak: function (el) {
    if (speaking) { speakStop(); el.innerHTML = IC.play + t('book.listen'); }
    else { speakBook(el.dataset.slug); el.innerHTML = IC.stop + t('book.stop'); }
  },
  opt: function (el) {
    var box = el.closest('.q'); if (box.dataset.done) return; box.dataset.done = 1;
    Array.prototype.forEach.call(box.querySelectorAll('.opt'), function (o) { if (o.dataset.ok === '1') o.classList.add('ok'); o.disabled = true; });
    if (el.dataset.ok !== '1') el.classList.add('ko');
  },
  mapF: function (el) { mapF = el.dataset.f; render(true); },
  gStart: function () { G.i = 0; G.paused = false; G.left = L(D.pasi)[0].min * 60; gStop(); G.timer = setInterval(gTick, 1000); render(true); },
  gNext: function () {
    G.i++; var P = L(D.pasi); gStop(); G.paused = false;
    if (G.i < P.length) { G.left = P[G.i].min * 60; G.timer = setInterval(gTick, 1000); }
    render(true); window.scrollTo(0, 0);
  },
  gPause: function () { G.paused = !G.paused; if (!G.paused && !G.timer && G.left > 0) G.timer = setInterval(gTick, 1000); render(true); },
  gQuit: function () { gStop(); G.i = -1; render(true); },
  calPrev: function () { if (calAll) calY--; else { calM--; if (calM < 1) { calM = 12; calY--; } } render(true); },
  calNext: function () { if (calAll) calY++; else { calM++; if (calM > 12) { calM = 1; calY++; } } render(true); },
  calAll: function () { calAll = !calAll; render(true); },
  calToday: function () { var n = new Date(); calY = n.getFullYear(); calM = n.getMonth() + 1; calAll = false; render(true); },
  tStart: function (el) { testStart(el.dataset.s); render(true); window.scrollTo(0, 0); },
  tAns: function (el) { if (T.ans != null) return; T.ans = +el.dataset.o; if (T.ans === 0) T.score++; render(true); },
  tNext: function () {
    T.i++; T.ans = null;
    if (T.i >= T.qs.length && (S.best == null || T.score > S.best)) { S.best = T.score; save(); }
    render(true);
  },
  tReset: function () { T = null; render(true); },
  psDir: function (el) { psDir = el.dataset.d; render(true); },
  export: function () { download(FILE + '-progres.json', JSON.stringify(S), 'application/json'); },
  reset: function () { if (confirm(t('set.resetAsk'))) { S = Object.assign({}, DEF, { read: {}, fav: {}, notes: {}, plan: {} }); save(); render(true); } },
  jExport: function () {
    var out = BRAND + ' — ' + t('jur.title') + '\n\n';
    if (S.free) out += S.free + '\n\n';
    B.forEach(function (b) { if (S.notes[b.slug]) out += b.n + '. ' + L(b).nume + '\n' + S.notes[b.slug] + '\n\n'; });
    download(FILE + '-jurnal.txt', out);
  }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el); }
});
document.addEventListener('input', function (e) {
  var el = e.target, k = el.dataset && el.dataset.inp;
  if (!k) return;
  if (k === 'note') { S.notes[el.dataset.slug] = el.value; if (!el.value) delete S.notes[el.dataset.slug]; save(); }
  else if (k === 'free') { S.free = el.value; save(); }
  else if (k === 'name') { S.name = el.value; save(); var d = $('#dName'); if (d) d.textContent = el.value || t('dip.nameDef'); }
  else if (k === 'mapQ') { mapQ = el.value; $('#mapList').innerHTML = mapList(); }
  else if (k === 'dictQ') { dictQ = el.value; $('#dictList').innerHTML = dictList(); }
  else if (k === 'psN') { psN = el.value; $('#psOut').innerHTML = psResult(); }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.chk === 'plan') {
    if (el.checked) S.plan[el.dataset.n] = 1; else delete S.plan[el.dataset.n];
    save(); el.closest('.prow').classList.toggle('is-read', el.checked);
  }
  if (el.dataset && el.dataset.file === 'import' && el.files && el.files[0]) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result);
        if (!o || typeof o !== 'object' || typeof o.read !== 'object') throw 0;
        S = Object.assign({}, DEF, o); save(); render(true); alert(t('set.importOk'));
      } catch (err) { alert(t('set.importBad')); }
    };
    fr.readAsText(el.files[0]);
  }
});
window.addEventListener('hashchange', function () { render(false); });
if ('speechSynthesis' in window) { try { window.speechSynthesis.onvoiceschanged = function () { if (curTab === 'map' && /carte/.test(location.hash) && !$('#speakBtn') && canSpeak()) render(true); }; } catch (e) {} }
render(false);
})();

</script>
</body>
