разниците, новолунията и съботите на Закона са „сянка на бъдещето, а тялото е Христос“ (2:17). Сянката предвещава някого, който идва; когато той пристигне, не оставаш в сянката. Обрязването намира изпълнението си в Кръщението (2:11-12), а ръкописанието на нашите дългове бе приковано на Кръста (2:14).\u003c/p>","parinti":"\u003cp>Еретикът Арий използвал думите на 1:15 — на гръцки „първороден на всяка твар“ — за да каже, че Синът е творение. Св. Атанасий Велики му отговорил, че Павел не Го нарича „първосъздаден“, а „първороден“, и веднага добавя, че чрез Него е създадено всичко: Онзи, чрез Когото всичко е станало, не може Сам да бъде едно от творенията. По-късно св. Иоан Дамаскин, като защитавал светите икони, тръгнал от същия стих: Синът е образът, естественият образ на Отца, и понеже стана човек и се яви пред очите ни, можем да Го изобразяваме.\u003c/p>","slujbe":"\u003cp>В Неделята на светите праотци, две седмици преди Рождество Христово, Апостолът е Колосяни 3:4-11, за събличането на стария човек. На 1 януари, празника на Обрезание Господне и Васильовден, паметта на св. Василий Велики, се чете Колосяни 2:8-12, за „неръкотворното обрязване“. Други откъси се чуват в неделите около Рождество Христово, а останалата част от посланието — на литургиите в делничните дни.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, образ на невидимия Отец, чрез Тебе е създадено всичко и в Тебе всичко се държи. Прости ми, че често Те поставям на последно място. Издигни ума ми към горното, съблечи ме от стария човек и ме облечи в милосърдие, кротост и любов. Амин.\u003c/p>"},"q":[{"q":"Каква заблуда смущавала християните в Колоса?","o":["Вярвали, че Христос не стига и че са нужни още наредби на стария Закон и почитане на ангелите.","Казвали, че вече не трябва да работят, понеже е дошъл краят на света.","Искали да се върнат в храма на богинята Артемида."]},{"q":"Какво казва апостол Павел за празниците и съботите на стария Закон?","o":["Че са сянка на бъдещето, а тялото е Христос.","Че трябва да се пазят буквално от всички християни.","Че никога не са имали никакъв смисъл."]}]}},{"n":63,"slug":"1-soluntsi","abbr":"1 Сол","cap":5,"s":"pavel","bg":{"nume":"Първо послание до солунци","scurt":"Писмо на насърчение до една млада и гонена църква: Господ идва, а починалите не са изгубени.","verset":{"t":"„Непрестанно се молете. За всичко благодарете“","r":"1 Солунци 5:17-18"},"incepe":"1 Солунци 1 · 4:13–5:24","p":{"autor":"\u003cp>Посланието го пише светият апостол Павел, заедно със Силуан и Тимотей, от Коринт, около 50–51 година. То е един от най-старите текстове на Новия Завет: когато го четеш, чуваш гласа на Църквата по-малко от двадесет години след Възкресението Господне. Павел пише на хора, кръстени само преди няколко месеца, с нежността на баща; сам се сравнява с кърмачка, която се грижи нежно за децата си (2:7).\u003c/p>","context":"\u003cp>Солун (Тесалоника), столица на римската провинция Македония, бил голямо и оживено пристанище — същият град, в който осем века по-късно ще се родят светите братя Кирил и Методий. Павел стигнал там, като идвал от Филипи, и проповядвал в синагогата три съботи подред (Деяния 17:1-10). Повярвали някои юдеи и много елини, но избухнали безредици и апостолът бил принуден да избяга нощем, набързо. Разделен от учениците си, той не намирал покой и изпратил обратно Тимотей. Той се върнал с добри вести: солунци стоят твърдо във вярата, макар да са гонени. Но имат един въпрос, който ги боли: някои от техните близки са умрели — дали те ще имат дял в идването на Господа?\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Вяра, любов, надежда\u003c/strong> — Трите добродетели, с които посланието започва и завършва (1:3; 5:8).\u003c/li>\u003cli>\u003cstrong>Освещението\u003c/strong> — „Тази е волята Божия: да бъдете осветени“ (4:3), тоест чист живот, в тялото и в душата.\u003c/li>\u003cli>\u003cstrong>Възкресението на починалите\u003c/strong> — Да не скърбим „както и другите, които нямат надежда“ (4:13).\u003c/li>\u003cli>\u003cstrong>Бодърстването\u003c/strong> — Денят Господен идва „както крадец нощя“; християнинът живее буден, като дете на светлината (5:2-6).\u003c/li>\u003cli>\u003cstrong>Непрестанната молитва\u003c/strong> — Радост, молитва и благодарност във всичко (5:16-18).\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието ни показва Христос като Господ, Който идва. Всяка глава завършва с мисълта за Неговото идване. Пророците на Стария Завет — Иоил, Амос, Софония — възвестили „деня Господен“, деня, в който Сам Бог ще дойде да съди и да спаси. Павел показва, че този ден е денят на Христос: Онзи, Който умря и възкръсна, ще слезе от небето и мъртвите ще възкръснат (4:14-16). Облаците, на които ще бъдем грабнати, „за да срещнем Господа във въздуха“, напомнят видението на пророк Даниил, който видял Сина Човечески да идва на небесните облаци (Даниил 7:13). А целта на всичко не е каква да е награда, а Самият Той: „и така винаги с Господа ще бъдем“ (4:17).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст, като тълкува словото за починалите, показва, че Павел не забранява сълзите, а отчаянието: християнинът плаче като човек, който изпраща любим човек на път, а не като човек, който го е изгубил завинаги. Затова Църквата нарича смъртта „успение“, заспиване. Подканата „непрестанно се молете“ я приели много сериозно отците от пустинята и отците на „Добротолюбие“: от нея се родила кратката молитва, която се казва с ума и със сърцето — „Господи Иисусе Христе, Сине Божий, помилуй мене грешния“, — и която всеки може да каже, навсякъде.\u003c/p>","slujbe":"\u003cp>Страницата за починалите (1 Солунци 4:13-17) е Апостолът на опелото и се чете и на панихидите: може би си я чул на погребението на някой твой близък. Думите ѝ на надежда Църквата ги казва точно в мига на раздялата. Останалата част от посланието се чете като Апостол на литургиите в делничните дни, към края на есента.\u003c/p>","rugaciune":"\u003cp>Господи, Който умря и възкръсна за нас, укрепи надеждата ми, когато се разделям с моите близки. Помени моите починали в Твоето царство. Научи ме да се моля непрестанно, да Ти благодаря за всичко и да Те чакам буден, като дете на светлината. Амин.\u003c/p>"},"q":[{"q":"Кой въпрос измъчвал християните в Солун?","o":["Дали онези от тях, които са починали, ще имат дял в идването на Господа.","Дали е позволено да плащат данъци на императора.","Дали трябва да се обрежат."]},{"q":"На коя служба се чете страницата за починалите от 1 Солунци 4:13-17?","o":["На опелото.","При тайнството Брак.","При тайнството Кръщение."]}]}},{"n":64,"slug":"2-soluntsi","abbr":"2 Сол","cap":3,"s":"pavel","bg":{"nume":"Второ послание до солунци","scurt":"Краят на света не го чакаме със страх и със скръстени ръце, а с търпение, тих труд и твърдост във вярата.","verset":{"t":"„И тъй, братя, стойте и дръжте преданията, които научихте било чрез наше слово, било чрез наше послание.“","r":"2 Солунци 2:15"},"incepe":"2 Солунци 2 · 3:6-16","p":{"autor":"\u003cp>Посланието го пише светият апостол Павел, заедно със Силуан и Тимотей, пак от Коринт, малко време след първото, около 51–52 година. Има само три глави. Накрая апостолът подписва със своята ръка и казва, че това е белегът му във всяко послание (3:17) — подробност, която показва, че още тогава обикаляли писма, които несправедливо му приписвали.\u003c/p>","context":"\u003cp>Първото послание било утешило солунци, но в църквата им се появил нов смут. Някои разпространявали — може би и с едно фалшиво писмо, — че денят Господен „настъпва вече“, че вече е дошъл (2:2). Хората се уплашили, а някои си направили погрешен извод: щом краят е пред вратата, защо да работим? Оставили работата си и живеели на гърба на другите, като си пъхали носа в работите на всички. Междувременно гоненията не били спрели. Павел пише, за да ги успокои: първо трябва да станат някои неща, а дотогава всеки да яде своя хляб, като работи тихо.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Търпението в гоненията\u003c/strong> — Болката заради вярата не е знак, че Бог е забравил, и Неговият съд е справедлив (1:4-7).\u003c/li>\u003cli>\u003cstrong>Да не се оставим да ни измамят\u003c/strong> — Преди деня Господен идват отстъплението и „човекът на греха“, когото Преданието нарича Антихрист (2:3-4).\u003c/li>\u003cli>\u003cstrong>Свещеното Предание\u003c/strong> — Вярата се пази, като се държи онова, което апостолите предадоха „било чрез слово, било чрез послание“ (2:15).\u003c/li>\u003cli>\u003cstrong>Честният труд\u003c/strong> — „който не иска да се труди, не бива и да яде“ (3:10).\u003c/li>\u003cli>\u003cstrong>Доброто без умора\u003c/strong> — „не падайте духом, кога вършите добро“ (3:13).\u003c/li>\u003c/ul>","hristos":"\u003cp>Това послание ни показва Христос като справедлив Съдия и Победител над злото. Колкото и голяма да изглежда силата на „човека на греха“, тя свършва в един миг: Господ Иисус ще го убие „с дъха на устата Си“ и ще го изтреби с блясъка на Своето пришествие (2:8). Павел използва тук думите на пророк Исаия за Отрасъла от корена Иесеев, Който с дъха на устните Си ще убие нечестивеца (Исаия 11:4). А пророк Даниил видял един надменен цар да се надига против Бога, но властта му бива отнета и дадена на Сина Човечески (Даниил 7). Книгата значи не ни зове да се боим от Антихриста, а да чакаме Христос, Който е „Господ на мира“ (3:16).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст, като тълкува стиха за преданията, показва, че апостолите не оставили всичко написано, а много предали устно, и че и едното, и другото е еднакво достоверно. Св. Василий Велики, в съчинението си „За Светия Дух“, дава примери за това неписано предание: кръстния знак, молитвата, обърнати към изток, думите на призоваването при освещаването на Светите Дарове. Св. Кирил Иерусалимски, в своите Огласителни слова, говори за Антихриста, като тръгва от глава 2, и подканя онези, които се готвят за Кръщение, да се утвърдят навреме във вярата.\u003c/p>","slujbe":"\u003cp>Понеже е кратко, посланието няма откъс, свързан с голям празник: чете се като Апостол на литургиите в делничните дни, към края на есента. Но неговото ехо го чуваш на всяка литургия, в Символа на вярата, когато изповядваш, че Христос ще дойде пак със слава да съди живи и мъртви и че Неговото царство няма да има край. И всеки път, когато Църквата говори за Свещеното Предание, тя се опира на стих 2:15.\u003c/p>","rugaciune":"\u003cp>Господи на мира, дай ми Твоя мир винаги и всякак. Пази ме от заблудата и от напразния страх. Насочи сърцето ми към Твоята любов и към търпението Христово, за да държа непоклатимо вярата, която приехме от светите апостоли, и да не падам духом, когато върша добро. Амин.\u003c/p>"},"q":[{"q":"Каква грешка направили някои християни в Солун, като вярвали, че е дошъл краят на света?","o":["Престанали да работят и живеели на гърба на другите.","Продавали къщите си и заминавали за Рим.","Връщали се към Закона Моисеев."]},{"q":"Към какво подканя апостол Павел в 2 Солунци 2:15?","o":["Да държим преданията, които сме приели от апостолите, било чрез слово, било чрез послание.","Да изчисляваме внимателно годината, в която ще дойде краят на света.","Да четем само написаното и нищо друго."]}]}},{"n":65,"slug":"1-timotey","abbr":"1 Тим","cap":6,"s":"pavel","bg":{"nume":"Първо послание до Тимотея","scurt":"Съветите на един духовен отец към млад епископ: как се пази вярата и как се подрежда животът на Църквата.","verset":{"t":"„Христос Иисус дойде в света да спаси грешниците, от които пръв съм аз.“","r":"1 Тимотей 1:15"},"incepe":"1 Тимотей 1:12-17 · 2:1-7 · 3 · 6:6-16","p":{"autor":"\u003cp>Посланието е написано от светия апостол Павел до Тимотей, „истинско по вяра чедо“ (1:2). Според Свещеното Предание Павел го е написал около 64–65 г., от Македония, след като е бил освободен от първото си затворничество в Рим. Тимотей е от Листра, син на баща елин и на вярваща майка иудейка, и години наред придружава Апостола. Заедно с Второто послание до Тимотея и Посланието до Тита то спада към т. нар. „пастирски“ послания, защото са отправени към пастири на Църквата.\u003c/p>","context":"\u003cp>Павел е оставил Тимотей в Ефес, за да се грижи за тамошната Църква (1:3); Преданието го почита като първия епископ на Ефес. Задачата не е лесна. Тимотей е млад, стеснителен и с крехко здраве (4:12; 5:23), а в града са се появили учители, които се губят в „басни и безкрайни родословия“ (1:4) и смущават вярващите. Църквата расте и има нужда от ред: кой може да стане епископ, презвитер или дякон, как се извършва общата молитва, как се полагат грижи за вдовиците, как трябва да се държат богатите. Павел му пише, за да го подкрепи и да му даде в ръцете ясен пътеводител.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Здравото учение\u003c/strong> — Вярата, която сме приели, се пази от басни и от празнословие (1:3-7; 6:20).\u003c/li>\u003cli>\u003cstrong>Молитвата за всички човеци\u003c/strong> — И за царете, и за всички, които са на власт, защото Бог иска всички да се спасят (2:1-4).\u003c/li>\u003cli>\u003cstrong>Служителите на Църквата\u003c/strong> — Какъв трябва да бъде епископът и какъв дяконът: чист живот, кротост, добре подреден дом (3:1-13).\u003c/li>\u003cli>\u003cstrong>Благочестието със задоволство\u003c/strong> — „Корен на всички злини е сребролюбието“ (6:6-10).\u003c/li>\u003cli>\u003cstrong>Добрият подвиг на вярата\u003c/strong> — Младият пастир е призван да бъде образец в слово, в поведение и в любов (4:12; 6:12).\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието ни показва Христос като единствения Ходатай: „Защото един е Бог, един и Ходатай между Бога и човеци — Човекът Христос Иисус“ (2:5). В Стария Завет Моисей стоял между Бога и народа, а свещениците принасяли жертви за греховете; всичко това сочело към Онзи, Който „отдаде Себе Си откуп за всички“ (2:6). Обещанието, дадено на Авраам, че в неговото потомство ще се благословят всички народи, сега се изпълнява: спасението е за всички. В трета глава Павел привежда кратък химн на първата Църква: „Бог се яви в плът… проповядван биде на народи… възнесе се в слава“ (3:16). Това е великата „тайна на благочестието“, която пази Църквата — „стълб и крепило на истината“ (3:15).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст в беседите си върху това послание се удивлява на смирението на Павел: след толкова трудове той пак нарича себе си „пръв“ между грешниците — и не казва „бях“, а „съм“. Същият Отец в съчинението си „За свещенството“ тръгва от изискванията, които Павел поставя тук към епископа, за да покаже колко висока и страшна е тази служба. Св. Григорий Богослов изпитал същото: след ръкоположението си избягал за кратко в уединение и после написал цяло слово за тежестта на свещенството. Така Отците ни учат да се молим за нашите свещеници, а не да ги съдим.\u003c/p>","slujbe":"\u003cp>Думите от 1 Тимотей 1:15 ги казваш ти самият преди Светото Причастие: молитвата „Вярвам, Господи, и изповядвам…“ изповядва Христос, дошъл в света да спаси грешниците, „от които пръв съм аз“. Призивът да се молим за управляващите, „за да прекарваме тих и мирен живот“ (2:2), се чува в ектениите и в молитвите на Божествената литургия. На 1 септември, в началото на индикта, тоест на църковната година, Апостолът е 1 Тимотей 2:1-7. Други откъси се четат в неделите през зимата, преди Триода.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Който дойде в света да спасиш грешниците, от които пръв съм аз, помилуй ме. Пази Твоята Църква в правата вяра. Дарувай на нашите епископи и свещеници мъдрост, чистота и търпение, а на мене — сърце, доволно от малкото, и ревност за добрия подвиг. Амин.\u003c/p>"},"q":[{"q":"Къде апостол Павел оставя Тимотей да се грижи за Църквата?","o":["В Ефес.","В Иерусалим.","На остров Крит."]},{"q":"Къде казваш ти самият думите „да спаси грешниците, от които пръв съм аз“?","o":["В молитвата преди Светото Причастие.","В песента „Които в Христа се кръстихте“.","В началото на вечернята."]}]}},{"n":66,"slug":"2-timotey","abbr":"2 Тим","cap":4,"s":"pavel","bg":{"nume":"Второ послание до Тимотея","scurt":"Завещанието на апостол Павел: последните му думи, написани в окови, малко преди мъченичеството му.","verset":{"t":"„С добрия подвиг се подвизах, пътя свърших, вярата опазих.“","r":"2 Тимотей 4:7"},"incepe":"2 Тимотей 1 · 2:1-13 · 3:10–4:8","p":{"autor":"\u003cp>Това е последното послание на светия апостол Павел. Според Свещеното Предание той го е написал в Рим, по време на второто си затворничество, около 66–67 г., малко преди да бъде обезглавен при гонението на император Нерон. Пише на Тимотей, „възлюбено чедо“ (1:2), епископа на Ефес. Това вече не е писмо с наставления, а завещание: един духовен отец, който знае, че си отива, и оставя на ученика си най-скъпото, което има.\u003c/p>","context":"\u003cp>Този път Павел не живее в нает дом, както при първото затворничество, а е в окови „като злодеец“ (2:9). Наближава зима и той моли да му донесат фелона, оставен в Троада, книгите и най-вече кожените свитъци (4:13). Мнозина са го изоставили; при първата му защита никой не е застанал до него. „Само Лука е с мене“ (4:10-11). В църквите се умножават лъжеучителите, а Тимотей, стеснителен по природа, би могъл да се обезсърчи. Павел го вика да дойде бързо, а дотогава отново разпалва смелостта му: дарът, получен чрез ръковъзлагането, трябва да остане жив (1:6).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Смелостта на изповедта\u003c/strong> — „Бог не ни е дал дух на боязливост, а дух на сила, любов и целомъдрие“ (1:7).\u003c/li>\u003cli>\u003cstrong>Добрият залог\u003c/strong> — Вярата се пази и се предава на верни човеци, от поколение на поколение (1:14; 2:2).\u003c/li>\u003cli>\u003cstrong>Воинът, атлетът, земеделецът\u003c/strong> — Три образа на християнското търпение (2:3-6).\u003c/li>\u003cli>\u003cstrong>Свещеното Писание\u003c/strong> — „Всичкото Писание е боговдъхновено и полезно“ (3:16).\u003c/li>\u003cli>\u003cstrong>Венецът на правдата\u003c/strong> — В края на подвига го очаква Господ, „Праведният Съдия“ (4:8).\u003c/li>\u003c/ul>","hristos":"\u003cp>Пред лицето на смъртта Павел оставя на ученика си един-единствен призив, кратък като изповед на вярата: „Помни Господа Иисуса Христа от семето Давидово, Който възкръсна от мъртвите“ (2:8). В тези няколко думи се побира цялото Писание: Христос е Потомъкът, Когото Бог обещал на Давид, чийто престол остава навеки (2 Царства 7:12-16), и Той е Възкръсналият, Който „унищожи смъртта и извади наяве живот и нетление“ (1:10). Павел напомня на Тимотей, че от детинство знае свещените Писания — тоест Стария Завет — и че те могат да го направят мъдър за спасение „чрез вярата в Христа Иисуса“ (3:15). Значи Законът и пророците се четат с поглед, обърнат към Него. И накрая Христос е Съдията на живи и мъртви (4:1), Който дава венеца.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст, който обичал Павел повече от всеки друг светец, се пита в беседите си как Апостолът на смирението може да каже за себе си: „С добрия подвиг се подвизах“. И отговаря: той не се хвали, а утешава ученика си — като баща, който преди смъртта си казва на детето си да не плаче, защото е живял както трябва и отива да си почине. Тръгвайки от думите за Писанието (3:16), същият Отец настойчиво подканва и миряните, не само монасите, да четат Свещеното Писание у дома, защото то е храна и лекарство за душата.\u003c/p>","slujbe":"\u003cp>В Неделята на митаря и фарисея, с която започва Триодът, Апостолът е 2 Тимотей 3:10-15. В Неделята пред Богоявление се чете 2 Тимотей 4:5-8, с думите „С добрия подвиг се подвизах“. А в паметта на великите мъченици — например на св. великомъченик Димитрий Солунски, на Димитровден (26 октомври), един от най-обичаните празници в България, — чуваш 2 Тимотей 2:1-10: „И тъй, чедо мое, усилвай се в благодатта… като добър воин Иисус Христов“.\u003c/p>","rugaciune":"\u003cp>Господи, Праведни Съдия, Ти застана до Твоя раб Павел, когато всички го изоставиха. Застани и до мене в часа на самотата и на страха. Разпали в мене дара, който получих при Кръщението, дай ми дух на сила, любов и целомъдрие, за да опазя вярата до край. Амин.\u003c/p>"},"q":[{"q":"При какви обстоятелства апостол Павел пише Второто послание до Тимотея?","o":["В окови, в Рим, малко преди мъченичеството си.","По време на първото си мисионерско пътуване.","Докато е гост в дома на Лидия, във Филипи."]},{"q":"Какво казва апостол Павел за Свещеното Писание в 2 Тимотей 3:16?","o":["Че всичкото Писание е боговдъхновено и полезно.","Че Старият Завет вече не трябва да се чете.","Че Писанието е само за епископи и свещеници."]}]}},{"n":67,"slug":"tit","abbr":"Тит","cap":3,"s":"pavel","bg":{"nume":"Послание до Тита","scurt":"Три глави за един епископ, комуто е поверено да подреди една нова Църква: Божията благодат ни спасява и ни учи да живеем праведно.","verset":{"t":"„Защото се яви Божията благодат, спасителна за всички човеци.“","r":"Тит 2:11"},"incepe":"Тит 2:11-14 · 3:1-8 · след това цялото послание от началото","p":{"autor":"\u003cp>Посланието е написано от светия апостол Павел до Тит, „истинско по общата вяра чедо“ (1:4). Според Свещеното Предание то е написано около 64–65 г., по същото време като Първото послание до Тимотея. Тит бил елин по произход, доведен до вярата от Павел, и станал негов незаменим помощник: тъкмо той довел до добър край помирението с Коринтската църква. Преданието го почита като първия епископ на остров Крит; Църквата чества паметта му на 25 август.\u003c/p>","context":"\u003cp>Павел проповядвал Евангелието на Крит и, когато тръгвал, оставил там Тит, „за да довършиш несвършеното и да поставиш по всички градове презвитери“ (1:5). Това била току-що поникнала Църква, без постоянни пастири; а древните имали лошо мнение за жителите на острова — Павел дори привежда думите на един техен поет, който ги обвинява в лъжа и леност (1:12). Освен това някакви учители „между обрязаните“ смущавали цели домове с басни и човешки заповеди, заради печалба (1:10-14). Тит трябва да въведе ред и Павел му пише с малко думи как: с достойни пастири, със здраво учение и с добри дела.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Достойни пастири\u003c/strong> — Епископът трябва да бъде безукорен, гостоприемен, целомъдрен, да се държи о истинското слово (1:6-9).\u003c/li>\u003cli>\u003cstrong>Здравото учение\u003c/strong> — Правата вяра се вижда в живота на всекиго: старци, млади, жени, роби (2:1-10).\u003c/li>\u003cli>\u003cstrong>Благодатта, която възпитава\u003c/strong> — Благодатта не само прощава, но и ни възпитава, за да живеем „целомъдрено, праведно и благочестиво“ (2:12).\u003c/li>\u003cli>\u003cstrong>Банята на възраждането\u003c/strong> — Чрез Кръщението Бог ни спаси по Своята милост, а не поради нашите дела (3:5).\u003c/li>\u003cli>\u003cstrong>Ревността за добри дела\u003c/strong> — Повярвалите да бъдат първи в добрите дела (3:8).\u003c/li>\u003c/ul>","hristos":"\u003cp>Посланието до Тита ни показва Христос като явяването на Бога в света. Два пъти Павел употребява глагола „яви се“ — същия корен, от който в нашия език идва и името на празника Богоявление: спасителната благодат се яви на всички човеци (2:11) и „се яви благостта и човеколюбието на нашия Спасител, Бога“ (3:4). Христос открито е наречен „великият Бог и Спасител наш“ (2:13). Той даде Себе Си, за да ни очисти и да Му бъдем „народ избран“ (2:14): думата, която Бог казал на Израил при Синай — „ще бъдете Мой избран народ измежду всички народи“ (Изход 19:5), — сега преминава към Църквата, събрана от всички народи. А „банята на възраждането и обновата от Духа Светаго“ (3:5) изпълнява пророчеството на Иезекиил за чистата вода и за новия дух (Иезекиил 36:25-27).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст в беседите си върху това послание набляга на думата, че благодатта ни „учи“ и възпитава: Бог не се задоволил да ни прости миналото, а ни води и за бъдещето; затова благодатта е и прошка, и училище на новия живот. Същият Отец показва, че Павел иска от епископа преди всичко чист живот, защото паството гледа поведението на пастира повече, отколкото думите му. А блажени Иероним оставил тълкувание на Посланието до Тита, високо ценено в Западната църква.\u003c/p>","slujbe":"\u003cp>Сърцевината на посланието я чуваш на Богоявление (6 януари), когато Апостолът е Тит 2:11-14 и 3:4-7: на празника на Явяването Господне Църквата чете точно думите „яви се Божията благодат“ и „банята на възраждането“. В неделите, когато се почитат светите Отци на Вселенските събори — през юли и през октомври, — се чете Тит 3:8-15. Останалата част от посланието се чува на литургиите в делничните дни.\u003c/p>","rugaciune":"\u003cp>Боже, наш Спасителю, благодаря Ти, че Твоята благост и Твоето човеколюбие се явиха и за мене, в банята на светото Кръщение. Не по моите дела, а по Своята милост Ти ме спаси. Научи ме чрез Твоята благодат да живея целомъдрено, праведно и благочестиво и ме направи ревностен за добри дела. Амин.\u003c/p>"},"q":[{"q":"Защо апостол Павел оставя Тит на Крит?","o":["За да довърши несвършеното и да постави презвитери по всички градове.","За да събере пари за пътуването до Рим.","За да построи нов храм."]},{"q":"На кой празник се чете като Апостол Тит 2:11-14 и 3:4-7?","o":["На Богоявление, 6 януари.","На Успение Богородично.","На Връбница."]}]}},{"n":68,"slug":"filimon","abbr":"Филим","cap":1,"s":"pavel","bg":{"nume":"Послание до Филимона","scurt":"Писмо от една страница: Павел моли за прошка за един избягал роб и показва как Евангелието прави роба брат.","verset":{"t":"„Не вече като роб, а по-горе от роб, като брат възлюбен.“","r":"Филимон 16"},"incepe":"Филимон 1-25 (цялото послание, само една глава) · след това Колосяни 4:7-9","p":{"autor":"\u003cp>Посланието е написано от светия апостол Павел заедно с ученика му Тимотей, около 61–63 г., когато Апостолът бил в окови в Рим заради Христос. То е най-краткото от неговите послания: една-единствена глава, двадесет и пет стиха. Тръгнало е към своя адресат заедно с Посланието до колосяни, което носел Тихик, а с Тихик пътувал и самият човек, за когото става дума в писмото: Онисим (Колосяни 4:7-9).\u003c/p>","context":"\u003cp>Филимон бил заможен християнин от Колоси, в Мала Азия, когото самият Павел довел до вярата. В дома му се събирала църквата на града; посланието поздравява и Апфия, и Архип. Онисим, неговият роб, бил избягал — както изглежда, оставяйки след себе си и някаква щета — и стигнал до Рим. Там срещнал Павел, повярвал и се кръстил. По римския закон избягалият роб можел да бъде наказан жестоко. Павел нито го крие, нито заповядва: изпраща го обратно при господаря му, с писмо, в което моли. На картата на Писанието се намираме след Деянията на светите апостоли: Евангелието е влязло в домовете на хората и започва отвътре да променя начина, по който те се отнасят един към друг.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Прошката\u003c/strong> — Павел моли Филимон да приеме онзи, който го е онеправдал, така, както би приел самия Апостол.\u003c/li>\u003cli>\u003cstrong>Братството в Христа\u003c/strong> — Кръщението не преобръща за една нощ порядките на света, но прави роба и господаря братя пред една и съща Чаша.\u003c/li>\u003cli>\u003cstrong>Застъпничеството\u003c/strong> — Павел застава между двамата и поема върху себе си дълга на виновния.\u003c/li>\u003cli>\u003cstrong>Доброто, сторено доброволно\u003c/strong> — Апостолът би могъл да заповяда, но предпочита да помоли, за да не бъде доброто принудително.\u003c/li>\u003cli>\u003cstrong>Човекът, когото благодатта променя\u003c/strong> — Онисим, чието име означава „полезен“, става наистина полезен едва след като познава Христос: „някога беше непотребен за тебе, а сега е потребен“ (11).\u003c/li>\u003c/ul>","hristos":"\u003cp>В това малко писмо се вижда като на икона онова, което Христос направи за нас. Павел пише: ако с нещо те е обидил или ти е длъжен, „мини това на моя сметка“ (Филимон 18). Така постъпи Спасителят: пое върху Себе Си нашия дълг и ни върна при Отца — не като избягали роби, а като деца. Самият Той „понизи Себе Си, като прие образ на раб“ (Филипяни 2:7), за да станат робите братя. Още старият Закон искал милост за избягалия роб (Второзаконие 23:15-16); в Христа освобождението става пълно: „няма роб, ни свободник… защото всички вие едно сте в Христа Иисуса“ (Галатяни 3:28).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст тълкува посланието в беседите си и показва защо Църквата е запазила писмо толкова кратко и толкова лично: от него се учим да не се отчайваме за никого. Щом един избягал роб е станал духовно чедо на Апостола, никой човек не е загубен. Той се удивлява и на смирението на Павел, който, макар да има дръзновение да заповяда, моли за един роб като за собственото си дете. Блажени Иероним, който също го тълкува, го защитава срещу онези, които го смятали за твърде незначително, за да бъде в Свещеното Писание. Според Свещеното Предание Онисим също станал служител на Евангелието и загинал мъченически.\u003c/p>","slujbe":"\u003cp>Посланието се чете като Апостол на Божествената литургия през годината, в поредицата на посланията на апостол Павел. Църквата почита светите апостоли Филимон, Архип и Апфия на 22 ноември и на 19 февруари, а светия апостол Онисим — на 15 февруари. Всеки път, когато преди Светото Причастие искаш прошка и сам прощаваш, ти живееш самото сърце на това послание.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Ти пое върху Себе Си моя дълг и ме върна при Отца — не като роб, а като дете. Научи ме да прощавам, както ми е простено, да приемам обратно онзи, който ме е обидил, и да виждам във всеки човек брат, за когото Ти даде живота Си. Амин.\u003c/p>"},"q":[{"q":"Кой е Онисим?","o":["Избягалият роб на Филимон, който повярвал и се кръстил при Павел, в Рим.","Римски стотник, който пазел Павел.","Ученик на апостол Петър от Иерусалим."]},{"q":"Какво моли Павел от Филимон?","o":["Да приеме Онисим като възлюбен брат и да запише щетата на сметката на Павел.","Да накаже Онисим според римския закон.","Да изпрати Онисим с дарове в Иерусалим."]}]}},{"n":69,"slug":"evrei","abbr":"Евр","cap":13,"s":"pavel","bg":{"nume":"Послание до евреите","scurt":"Христос е вечният Първосвещеник: всичко, което в стария Закон е било сянка — храм, свещенство, жертви, — намира в Него своето изпълнение.","verset":{"t":"„Иисус Христос е същият вчера, и днес, и вовеки.“","r":"Евреи 13:8"},"incepe":"Евреи 1–2 · 4:14–5:10 · 11 · 12:1-2","p":{"autor":"\u003cp>Според Свещеното Предание посланието е на светия апостол Павел. Текстът не носи името му в началото и древните забелязали, че стилът се различава от другите послания; православният Изток обаче винаги го е приемал като послание на Павел. Написано е, по всичко личи, от Италия (13:24), около 63–65 г., преди разрушаването на Иерусалимския храм (през 70 г.), защото говори за жертвите като за нещо, което още се принася.\u003c/p>","context":"\u003cp>Посланието е отправено към християни, дошли от иудеите, най-вероятно от Светата земя. Те били търпели подигравки и ограбване на имотите си (10:32-34), а сега се уморявали. Изкушавала ги мисълта за връщане: храмът още стоял в целия си блясък, със свещениците и с всекидневните жертви, а събранието на християните изглеждало бедно и гонено. Апостолът им пише „увещателно слово“ (13:22), повече проповед, отколкото писмо: нямате причина да се връщате към сянката, щом сте получили светлината. На картата на Писанието Посланието до евреите е мостът между двата Завета: книгата, която те учи да четеш Левит, скинията на свидетелството и свещенството на Аарон с поглед, обърнат към Христос.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Христос по-горе от всички\u003c/strong> — Синът е по-велик от ангелите, от Моисей, от Иисус Навин и от Аарон.\u003c/li>\u003cli>\u003cstrong>Милостивият Първосвещеник\u003c/strong> — Изкушен е във всичко като нас, освен в грях; затова може да ни съчувства в нашите немощи (4:15).\u003c/li>\u003cli>\u003cstrong>Жертвата, принесена веднъж\u003c/strong> — Христос не се принася отново всяка година; Неговата кръв ни очисти „веднъж завинаги“ (9:12; 10:10).\u003c/li>\u003cli>\u003cstrong>Новият завет\u003c/strong> — Изпълнява се пророчеството на Иеремия: законът, написан в сърцата (Иеремия 31:31-34; Евреи 8:8-12).\u003c/li>\u003cli>\u003cstrong>Вярата и търпението\u003c/strong> — Единадесета глава изброява праведниците на Стария Завет, „големия облак свидетели“ (12:1), който ни насърчава да изминем попрището до край.\u003c/li>\u003c/ul>","hristos":"\u003cp>Никоя друга книга не свързва толкова тясно Стария Завет с Христос. \u003cstrong>Мелхиседек\u003c/strong>, царят-свещеник, който посреща Авраам с хляб и вино (Битие 14:18-20), е образ на Неговото свещенство: „Ти си свещеник навеки по чина Мелхиседеков“ (Псалом 109:4). \u003cstrong>Денят на очищението\u003c/strong> (Левит 16), когато първосвещеникът влизал веднъж в годината в Светая Светих с чужда кръв, сочел към Онзи, Който влезе веднъж завинаги със Своята кръв — не в ръкотворно светилище, а в самото небе (Евреи 9:11-12, 24). Завесата е Неговата плът (10:20). Законът имал само „сянката на бъдещите блага“ (10:1); тялото, тоест истината, е Христос. Затова Апостолът ни призовава да тичаме, „имайки пред очи началника и завършителя на вярата — Иисуса“ (12:2).\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст в беседите си върху Посланието до евреите изяснява въпрос, който си задава всеки вярващ: щом Христос е бил принесен веднъж, защо ние принасяме жертва всеки ден? И отговаря, че не принасяме друга жертва, а винаги същата: Божествената литургия е възпоменание и явяване на единствената жертва, а не нейно повторение. Св. Кирил Александрийски показва, че Божият Син стана Първосвещеник, когато стана човек: като Бог Той приема жертвата заедно с Отца и Духа, а като човек я принася за нас.\u003c/p>","slujbe":"\u003cp>От Посланието до евреите се чете Апостолът в съботите и неделите на Великия пост. Единадесета глава, с паметта на праведниците, се чува в Неделята на Православието, в Неделята на всички светии и в Неделята пред Рождество Христово. В паметите на светите йерарси отекват думите „Помнете вашите наставници“ (13:7). А на всяка литургия свещеникът се моли тайно с мисълта на това послание: че Христос е и Онзи, Който принася, и Онзи, Който бива принасян.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, велики наш Първосвещениче, Който премина небесата и все пак познаваш нашите немощи, удостой ни да пристъпваме с дръзновение към престола на благодатта. Укрепи отпадналите ни колене, задръж погледа ни обърнат към Тебе и ни отведи заедно с всичките Твои праведници в бъдещия град, който търсим. Амин.\u003c/p>"},"q":[{"q":"С чие свещенство се сравнява свещенството на Христос в Посланието до евреите?","o":["С това на Мелхиседек, царя-свещеник, който посрещнал Авраам с хляб и вино.","С това на Аарон, брата на Моисей.","С това на свещениците в Соломоновия храм."]},{"q":"Колко пъти Христос е принесъл Себе Си в жертва?","o":["Веднъж, завинаги.","Веднъж в годината, както първосвещеникът в Деня на очищението.","Всеки ден, както жертвите в храма."]}]}},{"n":70,"slug":"iakov","abbr":"Иак","cap":5,"s":"saborni","bg":{"nume":"Съборно послание на апостол Иаков","scurt":"Истинската вяра се вижда: в делата, в обуздания език, в грижата за бедния и в молитвата за болния.","verset":{"t":"„Защото, както тялото без дух е мъртво, тъй и вярата без дела е мъртва.“","r":"Иаков 2:26"},"incepe":"Иаков 1 · 2:14-26 · 3:1-12 · 5:13-20","p":{"autor":"\u003cp>Според Свещеното Предание посланието е на светия апостол Иаков, брат Господен — сродник на Спасителя по плът, наречен още „Праведни“. Той бил първият епископ на Иерусалим и председателствал Апостолския събор (Деяния 15). Загинал мъченически около 62 г., а с името му е свързана една от най-древните литургии. Посланието е написано преди тази година и е първото от седемте „съборни“ послания — тоест отправени към цялата Църква, а не към един-единствен град.\u003c/p>","context":"\u003cp>Иаков пише „до дванайсетте колена, които живеят пръснато“ (1:1): до християни от иудеите, разпръснати по света след гонението в Иерусалим. Повечето били бедни хора, потискани от богатите и изпитвани по много начини. Сред тях се била промъкнала и опасност отвътре: вяра само на думи. В събранието богатия го слагали отпред, а бедния го оставяли да стои прав (2:1-4); езикът съдел и осъждал; молитвата се смесвала с препирни. Иаков им говори кратко, с образи от всекидневния живот — огледалото, юздата на коня, кормилото на кораба, земеделеца, който чака дъжда. На картата на Писанието, след като Павел е показал, че спасението е дар, Иаков показва как живее онзи, който е получил дара.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Вярата, която действа\u003c/strong> — Вяра, която не се вижда в делата, е като тяло без дихание.\u003c/li>\u003cli>\u003cstrong>Търпението в изкушенията\u003c/strong> — Изпитанията, понесени с надежда, правят човека цялостен, като Иов (1:2-4; 5:11).\u003c/li>\u003cli>\u003cstrong>Юздата на езика\u003c/strong> — Езикът е малък член, но може да запали голям огън (3:5-6).\u003c/li>\u003cli>\u003cstrong>Грижата за бедния\u003c/strong> — Чисто благочестие е да се грижиш за сираци и вдовици и да не правиш лицеприятие (1:27; 2:1).\u003c/li>\u003cli>\u003cstrong>Молитвата и изцелението\u003c/strong> — Болният вика презвитерите църковни и молитвата на вярата го изцерява (5:14-15).\u003c/li>\u003c/ul>","hristos":"\u003cp>Иаков рядко споменава името на Господа, но посланието е изпълнено с Неговия глас. Почти всеки съвет е ехо от Проповедта на планината (Матей 5–7): да бъдем изпълнители на словото, а не само слушатели; да не се кълнем; да не съдим брата си. Христос тук е Господ на славата (2:1), Съдията, Който „стои пред вратата“ (5:9), и Онзи, Чието пришествие очакваме с търпението на земеделеца (5:7-8). Праведниците на Стария Завет — Авраам, Раав, Иов, Илия — са дадени за пример на вярващите в Него, а Моисеевият закон се изпълнява в „царския закон“ на любовта: „възлюби ближния си като себе си“ (Левит 19:18; Иаков 2:8). Мъдростта, която поискал Соломон, сега е „мъдростта, която иде отгоре“ (3:17).\u003c/p>","parinti":"\u003cp>Някои помислили, че Иаков противоречи на Павел. Блажени Августин показва, че двамата апостоли казват едно и също нещо от две страни: Павел говори за делата, които предшестват вярата, с които никой не се спасява без Христос; Иаков — за делата, които следват вярата и показват, че тя е жива. Св. Максим Изповедник, тълкувайки думите „голяма сила има усърдната молитва на праведника“ (5:16), казва, че молитвата на светиите наистина ни помага, когато и онзи, който я иска, положи добро начало на поправяне. Не се молим един за друг, за да се избавим от труда, а за да се подкрепим в него.\u003c/p>","slujbe":"\u003cp>На Иаков 5:14-15 се основава \u003cstrong>тайнството Маслосвет (Елеосвещение)\u003c/strong>: презвитерите църковни, помазването с елей, молитвата на вярата, изцелението и опрощаването на греховете. Първият от седемте Апостола в чинопоследованието на Маслосвета е тъкмо Иаков 5:10-16. В края на всяка литургия, в заамвонната молитва, чуваш: „Всяко добро даяние и всеки съвършен дар иде отгоре“ (1:17). Светият апостол Иаков, брат Господен, се чества на 23 октомври.\u003c/p>","rugaciune":"\u003cp>Отче на светлините, от Когото слиза всеки съвършен дар, дай ми мъдростта, която иде отгоре: чиста, мирна, снизходителна и пълна с милосърдие. Постави стража на устата ми, направи ме изпълнител на Твоето слово, а не само слушател, и вдигни, Господи, болните, за които се моли Твоята Църква. Амин.\u003c/p>"},"q":[{"q":"Каква е вярата без дела според свети Иаков?","o":["Мъртва, като тяло без дух.","Достатъчна за спасението.","По-чиста от вярата, която е съпроводена с дела."]},{"q":"Кое тайнство се основава на Иаков 5:14-15?","o":["Маслосветът (Елеосвещението).","Бракът.","Свещенството."]}]}},{"n":71,"slug":"1-petar","abbr":"1 Петр","cap":5,"s":"saborni","bg":{"nume":"Първо съборно послание на апостол Петър","scurt":"Писмото на живата надежда: Петър укрепява гонените християни, „пришълци и странници“ по пътя към небесното наследство.","verset":{"t":"„Всичките си грижи Нему възложете, защото Той се грижи за вас.“","r":"1 Петър 5:7"},"incepe":"1 Петър 1 · 2:1-10 · 2:21-25 · 5","p":{"autor":"\u003cp>Посланието е на светия апостол Петър, рибаря от Галилея, когото Господ призвал пръв и на когото след Възкресението три пъти казал: „Паси Моите овци“. Той пише от „Вавилон“ (5:13) — име, с което първите християни наричали Рим, — около 63–64 г., малко преди гонението на Нерон. В писането му помогнал Силуан, „верният брат“ (5:12), а до него бил Марко, бъдещият евангелист.\u003c/p>","context":"\u003cp>Петър пише на християните, пръснати по Понт, Галатия, Кападокия, Асия и Витиния (1:1), области в Мала Азия. Повечето били дошли от езичниците. Откакто се кръстили, вече не участвали в гуляите и в старите обичаи, а съседите им се чудели и ги корели (4:4). Това още не било гонение, организирано от императора, а подигравки, подозрения, несправедливост — „огненото изкушение“ на изпитанието (4:12). Апостолът не им обещава, че скръбта скоро ще отмине. Казва им кои са: избрани от Бога, „пришълци и странници“ (2:11) на тази земя, с отечество, което не тлее. На картата на Писанието Църквата, родена в Деянията на апостолите, сега се учи да търпи, без да се ожесточава.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Живата надежда\u003c/strong> — Чрез възкресението на Христос сме възродени за нетленно наследство (1:3-4).\u003c/li>\u003cli>\u003cstrong>Святостта на живота\u003c/strong> — „Бъдете свети, понеже Аз съм свет“ (1:16), думи, взети от Левит.\u003c/li>\u003cli>\u003cstrong>Страданието, понесено с кротост\u003c/strong> — Който страда заради доброто, върви по стъпките на Христос (2:21).\u003c/li>\u003cli>\u003cstrong>Божият народ\u003c/strong> — Кръстените са „род избран, царствено свещенство, народ свет“ (2:9).\u003c/li>\u003cli>\u003cstrong>Смирение и бдителност\u003c/strong> — Пастирите да пасат с охота, а всички да бъдат трезвени, защото противникът обикаля „като рикащ лъв“ (5:8).\u003c/li>\u003c/ul>","hristos":"\u003cp>Петър, който е видял Страданията, представя Христос с думите на пророците. Той е \u003cstrong>Агнецът\u003c/strong>, „непорочен и чист“ (1:19), към Когото сочело пасхалното агне от Изход 12. Той е \u003cstrong>страдащият Раб\u003c/strong> от Исаия: грях не сторил, когато Го хулели, не отвръщал с хула, и „чрез Неговата рана се изцерихте“ (2:22-25; Исаия 53). Той е \u003cstrong>краеъгълният Камък\u003c/strong>, Когото отхвърлиха зидарите (2:6-7; Псалом 117:22; Исаия 28:16). Ноевият ковчег, в който осем души се избавили чрез водата, предобразява Кръщението (3:20-21). И самият Петър ни казва, че Христос слязъл и проповядвал „и на духовете, които бяха в тъмница“ (3:19): дори смъртта не остана извън Неговата милост. Накрая Той е „Пастиреначалникът“ (5:4).\u003c/p>","parinti":"\u003cp>Св. Иоан Дамаскин, като обобщава учението на Църквата, показва, че обожената душа на Господа слезе в ада, за да изгрее светлината и на онези, които бяха там, както бе изгряла на онези, които бяха на земята; това проповядва Петър в трета глава и това виждаш изобразено на иконата на Възкресението. Св. Кирил Иерусалимски започвал тайноводствените си поучения към новопросветените с думите на Петър за бдителността и за противника, който прилича на лъв. А „царственото свещенство“ Отците го разбират като призвание на всеки кръстен да принася живота си в жертва на Бога, без това да отменя свещенството, което се дава чрез ръкоположение.\u003c/p>","slujbe":"\u003cp>От Първото послание на Петър се чете Апостолът на делничните литургии през седмиците преди Великия пост. На вечернята на празника на светите апостоли Петър и Павел (29 юни) на мястото на старозаветните четива се четат три откъса от това послание. А в пасхалната нощ иконата на Слизането в ада поставя пред очите ти думите от 1 Петър 3:19.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Пастирю и Пазителю на нашите души, Който понесе хулата, без да отвръщаш с хула, на Тебе възлагам всичките си грижи. Пази ме буден в часа на изкушението, научи ме да търпя с кротост и опази жива надеждата ми до деня на Твоето явяване. Амин.\u003c/p>"},"q":[{"q":"Как нарича Петър християните в този свят?","o":["Пришълци и странници.","Господари на земята.","Роби на императора."]},{"q":"Откъде пише Петър, когато казва „Вавилон“?","o":["От Рим.","От Иерусалим.","От Антиохия."]}]}},{"n":72,"slug":"2-petar","abbr":"2 Петр","cap":3,"s":"saborni","bg":{"nume":"Второ съборно послание на апостол Петър","scurt":"Завещанието на Петър: растете в благодатта, пазете се от лъжеучителите и очаквайте с търпение деня Господен.","verset":{"t":"„Растете в благодат и познаване на Господа нашего и Спасителя Иисуса Христа.“","r":"2 Петър 3:18"},"incepe":"2 Петър 1 · 3","p":{"autor":"\u003cp>Посланието е на светия апостол Петър, написано в Рим около 66–67 г., малко преди мъченичеството му. Той сам казва, че знае от Господа, че скоро ще остави „хижата“ на тялото си (1:14). Затова посланието звучи като завещание: последните думи на един баща към децата му. Древната Църква го приела малко по-късно от първото, но разпознала в него гласа на Петър.\u003c/p>","context":"\u003cp>Петър пише на същите християни като в първото послание: „Това е вече второ послание, що ви пиша, възлюбени“ (3:1). Опасността обаче се е променила. Тогава идвала отвън, от онези, които ги хулели; сега идва отвътре. Появили се лъжеучители (2:1), които обещават свобода, а самите те са „роби на развалата“ (2:19), и присмехулници, които питат: къде е обещанието за Неговото пришествие? Всичко си стои така, както от началото (3:4). Петър отговаря от два извора: от онова, което е видял с очите си на планината, и от словото на пророците. На картата на Писанието апостолите наближават края на пътя си и предават вярата на Църквата, за да бъде запазена цяла.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Участници в божественото естество\u003c/strong> — Бог ни е дарувал обещания, чрез които ставаме „участници в божественото естество“ (1:4).\u003c/li>\u003cli>\u003cstrong>Стълбата на добродетелите\u003c/strong> — Към вярата се прибавят добродетел, знание, въздържание, търпение, благочестие, братолюбие и любов (1:5-7).\u003c/li>\u003cli>\u003cstrong>Боговдъхновеното Писание\u003c/strong> — Пророците са говорили, „от Дух Светий просветявани“, затова пророчеството не се тълкува по преценката на всеки (1:20-21).\u003c/li>\u003cli>\u003cstrong>Лъжеучителите\u003c/strong> — Познават се по живота си: користолюбие, разпътство, презрение към всичко свято.\u003c/li>\u003cli>\u003cstrong>Денят Господен\u003c/strong> — Ще дойде „както крадец“; закъснението му е Божието дълготърпение, защото Бог иска всички да се обърнат към покаяние (3:9-10).\u003c/li>\u003c/ul>","hristos":"\u003cp>Петър представя Христос в славата Му. Не сме ви проповядвали „хитро измислени басни“, казва той, а станахме „очевидци на Неговото величие“ на святата планина, когато прозвуча гласът на Отца: „Този е Моят възлюбен Син, в Когото е Моето благоволение“ (1:16-18). \u003cstrong>Преображението\u003c/strong> е за Апостола залог за Второто пришествие: славата, която тогава видял, ще се яви на всички. Словото на пророците е като светило, което свети на тъмно място, докле „зорница изгрее в сърцата ви“ (1:19) — Христос, звездата, предсказана още в Числа 24:17. Ной, спасен от потопа, и Лот, изведен от Содом, показват, че Господ знае как да избавя Своите (2:5-9). А новото небе и новата земя (3:13) изпълняват обещанието от Исаия 65:17.\u003c/p>","parinti":"\u003cp>Думите „участници в божественото естество“ стоят в основата на православното учение за обожението. Св. Атанасий Велики често ги употребява и ги обобщава така: Божият Син стана човек, за да бъде обожен човекът. Св. Максим Изповедник обяснява, че човекът не става Бог по природа, а участва в Божия живот по благодат, като остава творение. А предупреждението, че в посланията на Павел има „места мъчни за разбиране“, които някои изопачават (3:16), Отците го смятат за правило на четенето: Писанието се чете в Църквата и заедно с Църквата.\u003c/p>","slujbe":"\u003cp>На празника Преображение Господне (6 август) Апостолът на Божествената литургия е 2 Петър 1:10-19: свидетелството на онзи, който е бил на планината. Посланието се чете и в делничните дни през седмиците преди Великия пост. И всеки път, когато в Символа на вярата казваш „и пак ще дойде със слава“, изповядваш точно надеждата, която Петър защитава тук.\u003c/p>","rugaciune":"\u003cp>Господи, Който си дълготърпелив и не искаш никой да погине, дай ми време за покаяние и не ме оставяй да го пропилея. Прибави към вярата ми добродетел, търпение и любов и ме просвети със славата, която показа на учениците на планината, за да очаквам с мир деня на Твоето пришествие. Амин.\u003c/p>"},"q":[{"q":"На кое събитие от живота на Господа е бил свидетел Петър, както казва в първа глава?","o":["На Преображението, на святата планина.","На сватбата в Кана Галилейска.","На възкресяването на Лазар."]},{"q":"Защо изглежда, че Господ закъснява да дойде?","o":["Защото е дълготърпелив и иска всички да се обърнат към покаяние.","Защото е забравил обещанието Си.","Защото светът никога няма да има край."]}]}},{"n":73,"slug":"1-ioan","abbr":"1 Иоан","cap":5,"s":"saborni","bg":{"nume":"Първо съборно послание на апостол Иоан","scurt":"Любимият ученик показва как се познава истинската вяра: по любовта към братята и по изповедта, че Христос е дошъл в плът.","verset":{"t":"„Бог е любов, и който пребъдва в любовта, пребъдва в Бога, и Бог — в него.“","r":"1 Иоан 4:16"},"incepe":"1 Иоан 1 · 2:1-11 · 4:7-21","p":{"autor":"\u003cp>Посланието е на светия апостол и евангелист Иоан, „ученика, когото Иисус обичаше“, който на Тайната вечеря се облегна на гърдите на Господа и застана до Кръста. Според Свещеното Предание той го е написал в дълбока старост, в Ефес, към края на първия век, близо до времето, когато написал и Евангелието. Говори като баща: нарича читателите си „чеда“ и „възлюбени“.\u003c/p>","context":"\u003cp>В църквите на Мала Азия се появили хора, които се хвалели с някакво висше знание. Казвали, че Божият Син не е приел истинска плът, че самите те вече нямат грях и че не се нуждаят от заповеди; на по-простите братя гледали отвисоко. Накрая се откъснали от Църквата: „Те излязоха от нас, но не бяха наши“ (2:19). Иоан ги нарича „антихристи“, тоест противници на Христос, и дава на вярващите ясни признаци, за да различават истината. На картата на Писанието последният жив апостол пази вярата, която е видял с очите си: което сме чули, което сме видели, което ръцете ни са попипали — това ви възвестяваме (1:1-3).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Бог е светлина\u003c/strong> — Който казва, че има общение с Него, а ходи в тъмнината, мами себе си (1:5-6).\u003c/li>\u003cli>\u003cstrong>Изповядването на греховете\u003c/strong> — Ако кажем, че нямаме грях, себе си мамим; ако изповядваме греховете си, Той е верен и праведен да ни прости (1:8-9).\u003c/li>\u003cli>\u003cstrong>Любовта към братята\u003c/strong> — Който не обича брата си, когото е видял, не може да обича Бога, Когото не е видял (4:20).\u003c/li>\u003cli>\u003cstrong>Христос е дошъл в плът\u003c/strong> — Духът, който изповядва въплъщението, е от Бога; който не го изповядва, не е (4:2-3).\u003c/li>\u003cli>\u003cstrong>Чеда Божии\u003c/strong> — Още сега сме Негови чеда и когато Той се яви, ще бъдем подобни Нему (3:1-2).\u003c/li>\u003c/ul>","hristos":"\u003cp>Иоан представя Христос като \u003cstrong>Словото на живота\u003c/strong>, станало видимо и осезаемо: не идея, а Бог, дошъл в плът. Той е нашият \u003cstrong>Ходатай\u003c/strong> пред Отца, „Иисус Христос Праведникът“ — в гръцкия текст тук стои думата „Параклит“, същата, с която Господ нарича Светия Дух Утешител, — и \u003cstrong>омилостивение\u003c/strong> за нашите грехове и за греховете на целия свят (2:1-2). Тук се изпълняват жертвите за грях от Левит: „кръвта на Иисуса Христа, Неговия Син, ни очистя от всеки грях“ (1:7). Историята на Каин, който убил брат си (Битие 4), се обръща: Христос положи душата Си за нас, и ние сме длъжни да полагаме душите си за братята (3:12, 16). Заповедта за любовта към ближния, стара още от времето на Моисей (Левит 19:18), става „нова заповед“, защото сега има мярката на Кръста.\u003c/p>","parinti":"\u003cp>Блажени Августин тълкувал посланието в беседи пред народа и го смята от началото до края за химн на любовта; от него е останал призивът всяко дело да извира от корена на любовта, защото от този корен не може да поникне нищо друго освен добро. Св. Максим Изповедник в „Глави за любовта“ върви по стъпките на Иоан: който обича Бога, не може да не обича всеки човек като себе си. А св. Ириней Лионски се опира на това послание срещу онези, които разделяли Иисус от Христос и отричали, че Божият Син е приел истинска плът.\u003c/p>","slujbe":"\u003cp>От Първото послание на Иоан се чете Апостолът на празниците на св. Иоан Богослов (8 май и 26 септември) и в делничните дни през седмиците преди Великия пост. На всяка литургия, преди Символа на вярата, чуваш призива: „Да възлюбим един другиго, за да изповядваме единомислено“. Това е точно редът на това послание: първо любовта, после изповедта на правата вяра.\u003c/p>","rugaciune":"\u003cp>Боже, Който си любов и светлина и в Когото няма никаква тъмнина, очисти ме с кръвта на Твоя Син от всеки грях, който изповядвам. Научи ме да обичам брата, когото виждам, не с думи, а с дело и с истина, за да пребъдвам аз в Тебе и Ти в мене. Амин.\u003c/p>"},"q":[{"q":"По какъв признак, според Първото послание на Иоан, се вижда, че някой обича Бога?","o":["По това, че обича брата си.","По познаването на скрити тайни.","По това, че казва, че няма никакъв грях."]},{"q":"Какво отричали лъжеучителите, срещу които пише Иоан?","o":["Че Иисус Христос наистина е дошъл в плът.","Че Моисей е получил Закона на Синай.","Че Иерусалимският храм трябва да бъде съграден отново."]}]}},{"n":74,"slug":"2-ioan","abbr":"2 Иоан","cap":1,"s":"saborni","bg":{"nume":"Второ съборно послание на апостол Иоан","scurt":"Кратка бележка до „избраната госпожа“: пребъдвайте в истината и в любовта и не отваряйте дома си за онези, които развалят вярата.","verset":{"t":"„А любовта се състои в това, да постъпваме по Неговите заповеди.“","r":"2 Иоан 6"},"incepe":"2 Иоан 1-13 (цялото послание, само една глава) · след това 1 Иоан 4:1-6","p":{"autor":"\u003cp>Според Свещеното Предание посланието е на светия апостол и евангелист Иоан, написано в Ефес към края на първия век, по същото време като първото му послание. Апостолът не казва името си: нарича себе си просто „старецът“ — в гръцкия текст „презвитер“, същата дума, с която и днес наричаме свещеника (а съпругата му — презвитера), — така, както го познавали всички в Мала Азия. Посланието има само тринадесет стиха — колкото се побирали на един папирусов лист.\u003c/p>","context":"\u003cp>Писмото е изпратено „до избраната госпожа и нейните чеда“ (1). Много тълкуватели виждат тук църквата на някой град в Мала Азия, наречена така от почит, а в нейните „чеда“ — вярващите; други виждат една знатна християнка, в чийто дом се събирала църквата. Както и да е, опасността е същата като в първото послание: странстващи учители, които чукали от врата на врата и не изповядвали, че Иисус Христос е дошъл в плът (7). Тогава християните приемали с радост проповедниците на Евангелието; тъкмо от това гостоприемство се възползвали прелъстниците. На картата на Писанието се намираме в последните години на апостолската епоха: сега вярата трябва да бъде опазена във всеки дом.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Истината и любовта вървят заедно\u003c/strong> — Иоан обича вярващите „истински“, в истината; едното без другото се разваля.\u003c/li>\u003cli>\u003cstrong>Да обичаш означава да слушаш\u003c/strong> — Да обичам означава да постъпвам по Божиите заповеди (6).\u003c/li>\u003cli>\u003cstrong>Христос е дошъл в плът\u003c/strong> — Който отрича въплъщението, е „прелъстник и антихрист“ (7).\u003c/li>\u003cli>\u003cstrong>Пребъдването в учението\u003c/strong> — Който пребъдва в Христовото учение, „той има и Отца, и Сина“ (9).\u003c/li>\u003cli>\u003cstrong>Пазенето на дома\u003c/strong> — Който носи друго учение, не бива да бъде приеман като учител, нито подкрепян в делото си (10-11).\u003c/li>\u003c/ul>","hristos":"\u003cp>С малко думи Иоан изповядва цялата същност на вярата: Иисус Христос е „Синът на Отца“ (3) и наистина е дошъл в плът. Това били възвестили пророците: че Сам Бог ще дойде и ще се засели сред Своя народ, Емануил, което ще рече „с нас е Бог“ (Исаия 7:14; Матей 1:23). Който отделя Христос от плътта Му, губи всичко: и Кръста, и Възкресението, и Светото Причастие. Заповедта, „която имаме отначало“ (5), е заповедта на любовта, която Законът бил изрекъл (Левит 19:18) и която Христос изпълни докрай. А грижата на Иоан народът да не приема лъжеучители продължава грижата на Моисей във Второзаконие 13.\u003c/p>","parinti":"\u003cp>Св. Ириней Лионски, ученик на св. Поликарп Смирненски — който бил познавал Иоан, — използва думите на това послание срещу еретиците на своето време: на тях да не се дава дори поздравът, който означава съдействие. Той разказва, по думите на Поликарп, че апостол Иоан излязъл бързо от една обществена баня в Ефес, когато научил, че вътре е еретикът Керинт. Отците не виждат тук липса на любов към човека — за заблудения Църквата се моли, — а грижа на заблудата да не се дава дом, амвон и опора.\u003c/p>","slujbe":"\u003cp>Понеже е толкова кратко, посланието се чува рядко: чете се като Апостол в един от делничните дни преди Великия пост. Неговия дух обаче го срещаш на всяка литургия, когато Църквата казва Символа на вярата и изповядва Божия Син, Който „се въплъти от Духа Светаго и Дева Мария и стана човек“. Св. Иоан Богослов се чества на 8 май и на 26 септември.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Сине на Отца, Който дойде в плът за нашето спасение, пази моя дом в истината и в любовта. Опази ме от всяко учение, чуждо на Твоята Църква, и ми дай да постъпвам по Твоите заповеди, за да бъде радостта ни пълна. Амин.\u003c/p>"},"q":[{"q":"Какво означава любовта според Второто послание на Иоан?","o":["Да постъпваме по Божиите заповеди.","Да приемаме всяко учение, за да не огорчим никого.","Да избягваме всички хора."]},{"q":"Какво не изповядвали прелъстниците, за които говори Иоан?","o":["Че Иисус Христос е дошъл в плът.","Че има ангели.","Че трябва да се спазва постът."]}]}},{"n":75,"slug":"3-ioan","abbr":"3 Иоан","cap":1,"s":"saborni","bg":{"nume":"Трето съборно послание на апостол Иоан","scurt":"Кратка бележка до Гаий: похвала за онзи, който приема проповедниците на Евангелието, и изобличение за онзи, който иска да бъде пръв.","verset":{"t":"„За мене няма по-голяма радост от тая — да чувам, че моите чеда ходят в истината.“","r":"3 Иоан 4"},"incepe":"3 Иоан (цялото послание, само една глава) · след това Матей 25:31-40","p":{"autor":"\u003cp>Според Свещеното Предание посланието е на светия апостол и евангелист Иоан, написано в Ефес към края на първия век. Както и във второто послание, Апостолът нарича себе си само „старецът“. Това е най-кратката книга на Новия Завет по брой думи и единственото от посланията на Иоан, изпратено до конкретен човек, с неговото име: Гаий.\u003c/p>","context":"\u003cp>През първия век Евангелието се разнасяло от град на град от странстващи братя, които тръгвали „за Неговото име“, без да вземат нещо от езичниците (7). Те живеели от гостоприемството на християните. Посланието ни показва трима души от една църква в Мала Азия. \u003cstrong>Гаий\u003c/strong> приема тези братя с любов, макар да са му непознати. \u003cstrong>Диотреф\u003c/strong>, „който обича да първенствува“ (9), не ги приема, пречи и на другите да ги приемат и злослови дори Апостола. \u003cstrong>Димитрий\u003c/strong>, най-вероятно онзи, който донесъл писмото, има добро свидетелство от всички. На картата на Писанието, ако второто послание казваше на кого да не отваряш вратата, третото казва на кого да я отвориш широко.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Ходенето в истината\u003c/strong> — Най-голямата радост на един духовен отец е да вижда чедата си да живеят според истината.\u003c/li>\u003cli>\u003cstrong>Гостоприемството\u003c/strong> — Който приема служителите на Евангелието, става „спомощник на истината“ (8).\u003c/li>\u003cli>\u003cstrong>Властолюбието\u003c/strong> — Желанието да бъдеш пръв смущава Църквата и откъсва човека от братята.\u003c/li>\u003cli>\u003cstrong>Подражаването на доброто\u003c/strong> — „Не подражавай на злото, а на доброто“; който прави добро, от Бога е (11).\u003c/li>\u003cli>\u003cstrong>Доброто свидетелство\u003c/strong> — Човек се познава по онова, което казват за него братята и самата истина.\u003c/li>\u003c/ul>","hristos":"\u003cp>Името на Христос не се споменава в посланието, но всичко става „за Неговото име“ (7). Той е Истината, в която ходи Гаий: „Аз съм пътят и истината и животът“ (Иоан 14:6). Той е и Онзи, Когото приемаме във всеки странник: „странник бях, и Ме прибрахте“ (Матей 25:35). Авраам, който приел трима пътници при дъба Мамврийски и така приел Самия Бог (Битие 18), намира тук своите потомци. А Диотреф, който иска първото място, е точната противоположност на Господа, Който „не дойде, за да Му служат, но да послужи“ (Марк 10:45) и уми нозете на учениците.\u003c/p>","parinti":"\u003cp>Трябва да го кажем открито: това послание е било малко тълкувано от Светите Отци, защото е кратко и лично. Учението му обаче го намираш на всяка крачка в техните съчинения. Св. Иоан Златоуст, говорейки за Авраам, показва, че гостоприемството е велико нещо, защото в госта приемаме Христос, и че не бива да разпитваме твърде строго онзи, който чука на вратата. А за страстта на Диотреф пустинните Отци учат, че властолюбието е от страстите, които най-трудно виждаме в себе си; Църквата ни учи да искаме избавление от него в молитвата на св. Ефрем Сирин.\u003c/p>","slujbe":"\u003cp>Посланието се чете като Апостол в един от делничните дни преди Великия пост. После, през целия Велики пост, на всяка делнична служба казваме с поклони молитвата на св. Ефрем Сирин, в която молим Господа и Владиката на нашия живот да не ни дава дух на леност, униние, властолюбие и празнословие — точно болестта на Диотреф. Св. Иоан Богослов се чества на 8 май и на 26 септември.\u003c/p>","rugaciune":"\u003cp>Господи, наша Истина и наш Живот, дай ми да ходя в истината и да правя добро, без да търся първото място. Отвори дома и сърцето ми за онези, които се трудят за Твоето име, и ме избави от духа на властолюбието, за да стана и аз спомощник на истината. Амин.\u003c/p>"},"q":[{"q":"Защо Иоан хвали Гаий?","o":["Защото приема с любов странстващите братя, които проповядват Евангелието.","Защото построил голяма църква в Ефес.","Защото изгонил Димитрий от града."]},{"q":"В какво е грешката на Диотреф?","o":["Искал да бъде пръв и не приемал братята.","Раздавал прекалено много милостиня.","Постил повече от другите."]}]}},{"n":76,"slug":"iuda","abbr":"Иуда","cap":1,"s":"saborni","bg":{"nume":"Съборно послание на апостол Иуда","scurt":"Кратък и пламенен призив: подвизавайте се за вярата, веднъж завинаги предадена на светиите, и пазете себе си в Божията любов.","verset":{"t":"„Запазвайте себе си в любов Божия, очаквайки милост от Господа нашего Иисуса Христа, за вечен живот.“","r":"Иуда 21"},"incepe":"Иуда 1-25 (цялото послание, само една глава) · след това 2 Петър 2","p":{"autor":"\u003cp>Авторът нарича себе си „Иуда, раб на Иисуса Христа, а брат на Иакова“ (1). Според Свещеното Предание това е светият апостол Иуда, наричан и Тадей, сродник на Господа по плът, брат на свети Иаков, първия епископ на Иерусалим — а не Иуда Искариотски, предателят. От смирение той не се хвали с родството, а нарича себе си раб. Посланието е написано най-вероятно между 65 и 80 г. и има само една глава.\u003c/p>","context":"\u003cp>Иуда искал да пише на вярващите за общото спасение, но бил принуден да смени тона (3): в Църквата „са се вмъкнали“ хора, които обръщали Божията благодат в разпътство и се отричали от Христос, единствения Владика (4). Живеели необуздано, роптаели, презирали всеки ред и без срам участвали в братските трапези на християните, „вечерите на любовта“ (12). Посланието много прилича на втората глава от Второто послание на Петър: двамата апостоли имат пред себе си една и съща опасност. Иуда споменава и два разказа от древното предание на иудеите, познати на читателите му: спора на архангел Михаил с дявола за тялото на Моисей и едно пророчество на Енох. На картата на Писанието това е последното послание, прагът преди Откровението.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Подвигът за вярата\u003c/strong> — Да се подвизаваме „за вярата, веднъж завинаги предадена на светиите“: вярата се пази, не се измисля отново (3).\u003c/li>\u003cli>\u003cstrong>Благодатта не е позволение за грях\u003c/strong> — Който прави Божията милост оправдание за страстите си, се отрича от Христос.\u003c/li>\u003cli>\u003cstrong>Примерите за съда\u003c/strong> — Онези, които излезли от Египет и не повярвали, падналите ангели, Содом и Гомор, Каин, Валаам и Корей.\u003c/li>\u003cli>\u003cstrong>Съграждането върху вярата\u003c/strong> — Молитва в Духа Светаго, пребъдване в Божията любов, очакване на милостта на Христос (20-21).\u003c/li>\u003cli>\u003cstrong>Милостта към колебаещите се\u003c/strong> — Към едни да бъдем милостиви с разсъждение, а други да спасяваме, като ги изтръгваме от огъня (22-23).\u003c/li>\u003c/ul>","hristos":"\u003cp>За Иуда Христос е единственият Владика и Господ; заблудените се отричат „от едничкия Владика Бога и Господа нашего Иисуса Христа“ (4). Събитията от Стария Завет, които изброява — изходът от Египет, наказанието на Содом, бунтът на Корей (Числа 16), — не са стари истории: Господ, Който тогава спасил народа, е Същият, Който съди и спасява сега. Той е Онзи, за Когото е възвестено, че ще дойде с десетки хиляди Свои светии, за да извърши съд (14-15). И Той може да ни запази „от прегрешения“ и да ни постави пред славата Си „непорочни в радост“ (24). В призива на стихове 20-21 е цялата Света Троица: Светият Дух, любовта на Бог Отец, милостта на Господа нашего Иисуса Христа.\u003c/p>","parinti":"\u003cp>Посланието е било малко тълкувано, но е ценено отрано. Ориген, църковен писател, казва за него, че има малко стихове, но е изпълнено с думите на небесната благодат. Блажени Иероним открито споменава, че някои в древността се колебаели да го приемат заради споменаването на Енох, но че старинността му и употребата му в църквите му дали авторитет сред Свещените Писания. Отците се учат от него на нещо съществено: вярата не е наша, за да я променяме според времената; ние я приемаме, пазим я и я предаваме цяла.\u003c/p>","slujbe":"\u003cp>Посланието се чете като Апостол в седмицата преди Великия пост — Сирната седмица, когато Църквата ни подготвя за покаянието. Светият апостол Иуда, сродникът Господен, се чества на 19 юни. Краят на посланието — „на Едничкия премъдър Бог, наш Спасител… слава и величие, сила и власт“ (25) — звучи като възгласите, с които свещеникът завършва молитвите в богослуженията.\u003c/p>","rugaciune":"\u003cp>Господи, Който можеш да ме запазиш от прегрешения и да ме поставиш непорочен пред славата Си, задръж ме във вярата, която си предал на Твоите светии. Съгради ме чрез молитвата в Духа Светаго, запази ме в Твоята любов и ми дай милост към онези, които се колебаят. На Тебе слава, сега и винаги, и во веки веков. Амин.\u003c/p>"},"q":[{"q":"За какво Иуда призовава вярващите да се подвизават?","o":["За вярата, веднъж завинаги предадена на светиите.","За първенството в града.","За повторното съграждане на Иерусалимския храм."]},{"q":"Кой е авторът на посланието според Свещеното Предание?","o":["Светият апостол Иуда, сродник на Господа и брат на Иаков.","Иуда Искариотски.","Иуда Макавей."]}]}},{"n":77,"slug":"otkrovenie","abbr":"Откр","cap":22,"s":"otkrovenie","bg":{"nume":"Откровение на свети Иоан Богослов","scurt":"Откровението от Патмос: отвъд гоненията и зверовете, закланият Агнец е победил и прави всичко ново.","verset":{"t":"„Да, ида скоро! Амин, да, дойди, Господи Иисусе!“","r":"Откровение 22:20"},"incepe":"Откровение 1 · 2–3 · 4–5 · 21–22","p":{"autor":"\u003cp>Според Свещеното Предание книгата е на светия апостол и евангелист Иоан, наричан още Богослов. Той получил тези видения на остров Патмос, в Егейско море, където бил заточен „заради словото Божие“ (1:9), към края на царуването на император Домициан, около 95 г. — както свидетелства св. Ириней Лионски. И до днес поклонниците влизат там в Пещерата на Откровението. Някои църкви на Изтока приели книгата по-късно от другите; оттогава тя затваря Новия Завет и цялото Свещено Писание.\u003c/p>","context":"\u003cp>Християните в Мала Азия били гонени: искали от тях да принасят жертва на императора като на бог и който не се подчинявал, губел службата си, свободата си или живота си. Иоан пише първо на седем църкви — в Ефес, Смирна, Пергам, Тиатир, Сарди, Филаделфия и Лаодикия, — като хвали и изобличава всяка според състоянието ѝ. После пред него се отваря небето. „Откровение“ означава „разкриване“: не книга, която гадае бъдещето, а вдигане на завесата от онова, което се случва. Книгата говори с образи, взети от Даниил, Иезекиил, Захария и Изход, а числата ѝ са символи: седем означава пълнота, дванадесет — Божия народ. На картата на Писанието тук кръгът се затваря: Библията започва в градина, където дървото на живота е загубено (Битие 2–3), и завършва в град, където дървото на живота е дадено отново (Откровение 22:2).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Христос победи\u003c/strong> — Историята не е в ръцете на звяра, а на Агнеца, единствения достоен да разгъне запечатаната книга (5:5-9).\u003c/li>\u003cli>\u003cstrong>Верността до край\u003c/strong> — „Бъди верен до смърт, и ще ти дам венеца на живота“ (2:10).\u003c/li>\u003cli>\u003cstrong>Небесното богослужение\u003c/strong> — Ангелите и светиите стоят пред престола и без почивка възклицават: „свет, свет, свет е Господ Бог Вседържител“ (4:8).\u003c/li>\u003cli>\u003cstrong>Съдът над злото\u003c/strong> — Гордият Вавилон пада; злото има голяма сила, но преброено време.\u003c/li>\u003cli>\u003cstrong>Новото небе и новата земя\u003c/strong> — Бог ще живее с хората и ще отрие всяка сълза от очите им (21:3-4).\u003c/li>\u003c/ul>","hristos":"\u003cp>Откровението още от първия си ред е „Откровение на Иисуса Христа“ (1:1) и в него се събират всички образи на Стария Завет. Той е \u003cstrong>Синът Човеческий\u003c/strong>, Когото видял Даниил (Даниил 7:13; Откровение 1:13), „първият и последният“ (Исаия 44:6; Откровение 1:17). Той е \u003cstrong>Агнецът, като заклан\u003c/strong> — и все пак жив (5:6), към Когото сочели пасхалното агне (Изход 12) и агнецът, воден на заколение, от Исаия 53. Той е \u003cstrong>лъвът от Иудиното коляно\u003c/strong> и коренът Давидов (5:5; Битие 49:9; Исаия 11:1). Той е \u003cstrong>Словото Божие\u003c/strong>, Царят на царете (19:13, 16), и \u003cstrong>Женихът\u003c/strong>, Който очаква Своята Църква, „стъкмена като невеста“ (21:2). В новия Иерусалим се изпълняват реката от видението на Иезекиил (Иезекиил 47) и скинията в пустинята: „ето скинията на Бога с човеците“ (21:3). Той е Алфа и Омега, началото и краят.\u003c/p>","parinti":"\u003cp>Класическото тълкувание на Изтока е на св. Андрей Кесарийски, от Кападокия. Той чете книгата трезвено: хилядата години от двадесета глава не са бъдещо земно царство, а времето на Църквата — от въплъщението на Христос до края; а в жената, облечена в слънце, вижда преди всичко Църквата, макар други да са виждали в нея и Пресвета Богородица. Св. Ириней Лионски, говорейки за числото на звяра, съветва да не бързаме да гадаем имена: по-сигурно е да чакаме изпълнението на пророчеството. Самият Господ каза, че деня и часа никой не знае (Матей 24:36). Затова чети книгата без страх и без пресмятания, а в трудните места питай своя духовен отец.\u003c/p>","slujbe":"\u003cp>Трябва да го кажем открито: Откровението е единствената книга от Новия Завет, която \u003cstrong>не се чете на Божествената литургия\u003c/strong> и няма четива в годишния богослужебен ред. И все пак цялата литургия е негов образ. Светият престол, в който са положени мощи на мъченици, напомня душите на закланите, които Иоан видял под жертвеника (6:9). Тамянът се издига, както молитвите на светиите (8:3-4). Хлябът, приготвен на Проскомидията, се нарича Агнец. Пеем „Свят, свят, свят“ заедно с небесните сили, а от купола на храма ни гледа Христос Вседържител. Св. Иоан Богослов се чества на 8 май и на 26 септември.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Алфа и Омега, Агнецо, заклан и жив во веки веков, благодарим Ти, че ни преведе през всичките седемдесет и седем книги на Твоето слово, от първата градина до горния град. Запази ни верни до край, отрий сълзите ни и впиши имената ни в книгата на живота. Да, дойди, Господи Иисусе! Амин.\u003c/p>"},"q":[{"q":"Какво означава думата „откровение“?","o":["Разкриване.","Краят на света.","Наказание."]},{"q":"Чете ли се Откровението на Божествената литургия в Православната църква?","o":["Не, но самата литургия е образ на небесното богослужение, което то описва.","Да, всяка неделя на Великия пост.","Да, в пасхалната нощ."]}]}}],"plan":{"bg":{"titlu":"План за четене за 90 дни","intro":"\u003cp>Този план те води за 90 дни през цялата история на спасението: от „В начало Бог сътвори небето и земята“ до новото небе и новата земя от Откровението. Не прочиташ цялото Свещено Писание, а частите, които държат нишката, и минаваш през всички раздели на православната Библия от 77 книги: законоположителните, историческите, учителните и пророческите книги, неканоничните книги (сред тях и Трета книга на Ездра) и целия Нов Завет. Всеки ден имаш обикновено от една до три глави, тоест 10–15 минути. Прекръсти се, чети без бързане от православната си Библия и спри за малко на мисълта за деня. Ако искаш, отвори първо корена на книгата в Картата. Имената на книгите следват Синодалното издание: четирите книги Царства са Първа и Втора книга на Самуил и Първа и Втора книга на царете в други преводи, а псалмите са номерирани по Седемдесетте, както ги пее Църквата, затова в протестантските Библии номерът им обикновено е с едно по-голям. Изпусна ли ден или седмица? Не започвай отначало и не се обвинявай: продължи оттам, докъдето си стигнал. Планът е опора, не товар.\u003c/p>","etape":[{"titlu":"Етап 1 — В началото (дни 1–7)","desc":"Бог създава света добър, човекът пада, и Господ отваря с Авраам пътя на обещанието.","zile":[{"n":1,"ref":"Битие 1–2","titlu":"Бог сътворява света","gand":"Какво се променя в деня ти, ако приемеш сериозно, че си създаден по образ Божий?"},{"n":2,"ref":"Битие 3–4","titlu":"Грехопадението и първото обещание","gand":"В самия час на падението Бог търси човека: „Адаме, где си?“ (Битие 3:9)"},{"n":3,"ref":"Битие 6–8","titlu":"Ной и ковчегът","gand":"Светите Отци виждат в ковчега образ на Църквата: къде търсиш ти убежище, когато дойдат големите води?"},{"n":4,"ref":"Битие 12 и 15","titlu":"Призванието на Авраам","gand":"Авраам тръгва, без да знае накъде отива: какво те моли Бог да оставиш зад себе си?"},{"n":5,"ref":"Битие 18 и 22","titlu":"Дъбът Мамврийски и жертвоприношението на Исаак","gand":"Бащата, който не пожалва сина си, и овенът, принесен вместо него, отдалече предвещават Голготската Жертва."},{"n":6,"ref":"Битие 28 и 32","titlu":"Стълбата на Иаков","gand":"Църквата вижда в стълбата, която свързва небето със земята, образ на Богородица."},{"n":7,"ref":"Битие 45 и 50","titlu":"Иосиф прощава на братята си","gand":"Кое зло в живота ти Бог е обърнал в добро, както в живота на Иосиф?"}]},{"titlu":"Етап 2 — Изходът от робството и Законът (дни 8–15)","desc":"Бог извежда народа Си от Египет, дава му Закона и го води през пустинята.","zile":[{"n":8,"ref":"Изход 2–3","titlu":"Моисей и горящата къпина","gand":"Къпината, която гори, без да изгаря, е за Църквата образ на Богородица."},{"n":9,"ref":"Изход 12","titlu":"Пасхалната нощ","gand":"Кръвта на агнето по вратите на домовете сочи към Христос, Агнеца Божий."},{"n":10,"ref":"Изход 14–15","titlu":"Преминаването през Червено море","gand":"Песента на Моисей, „да възпея Господа, защото се славно прослави“ (Изход 15:1), е първата от библейските песни на утренята: за какво избавление имаш ти да благодариш?"},{"n":11,"ref":"Изход 19–20","titlu":"Десетте заповеди","gand":"Заповедите не са ограда, а пътят на един току-що освободен народ: коя от тях те изобличава днес?"},{"n":12,"ref":"Изход 32–33","titlu":"Златният телец и застъпничеството на Моисей","gand":"Моисей се моли за онези, които съгрешиха: ти за кого се молиш?"},{"n":13,"ref":"Левит 16 и 19","titlu":"Денят на очистването и призивът към святост","gand":"„Бъдете свети, защото Аз, Господ, Бог ваш, съм свет“ (Левит 19:2): как изглежда светостта в един обикновен ден?"},{"n":14,"ref":"Числа 13–14 и 21","titlu":"Пустинята и медната змия","gand":"Змията, която Моисей издигна, предвещава Кръста (Иоан 3:14): накъде обръщаш поглед, когато те ухапе отчаянието?"},{"n":15,"ref":"Второзаконие 6 и 30","titlu":"„Слушай, Израилю“","gand":"Моисей поставя пред народа живота и смъртта и го призовава да избере живота."}]},{"titlu":"Етап 3 — Обетованата земя и цар Давид (дни 16–22)","desc":"Народът влиза в земята, пада и отново се изправя, и получава цар по Божието сърце.","zile":[{"n":16,"ref":"Иисус Навин 1, 3 и 6","titlu":"Преминаването на Иордан и Иерихон","gand":"Господ иска от Иисус Навин сила и смелост, защото Сам върви с него: къде ти е нужен този призив?"},{"n":17,"ref":"Съдии 6–7","titlu":"Гедеон","gand":"Бог побеждава с триста мъже, не с голяма войска: силата Му се показва в нашето малко."},{"n":18,"ref":"Рут 1–4","titlu":"Рут, верната чужденка","gand":"Четири кратки глави: една чужденка става прабаба на Давид и влиза в родословието на Спасителя (Матей 1:5)."},{"n":19,"ref":"Първа книга Царства 1–3","titlu":"Анна и призванието на Самуил","gand":"Момчето Самуил отговаря на Бога: говори, Господи, защото Твоят раб слуша (1 Царства 3:10). Колко място има тишината в молитвата ти?"},{"n":20,"ref":"Първа книга Царства 16–17","titlu":"Давид, пастирът, помазан за цар","gand":"Човек гледа лицето, а Бог гледа сърцето (1 Царства 16:7)."},{"n":21,"ref":"Втора книга Царства 7 и Псалом 22","titlu":"Обещанието към Давид","gand":"Бог обещава на Давид потомък, чието царство няма да има край, и Църквата Го разпознава в Христос."},{"n":22,"ref":"Втора книга Царства 11–12 и Псалом 50","titlu":"Падението и покаянието на Давид","gand":"Петдесетият псалом, „Помилуй ме, Боже“, се роди от един изповядан грях: прочети го днес като своя молитва."}]},{"titlu":"Етап 4 — Храмът, пророк Илия и падането на Иерусалим (дни 23–26)","desc":"Царството разцъфтява, разделя се на две и се отдалечава от Бога, до вавилонския плен.","zile":[{"n":23,"ref":"Трета книга Царства 3 и 8","titlu":"Соломон и Храмът","gand":"Соломон не иска богатство, а сърце, което умее да различава: ти какво би поискал?"},{"n":24,"ref":"Трета книга Царства 17–19","titlu":"Пророк Илия","gand":"На Хорив Господ не идва нито във вихъра, нито в земетресението, нито в огъня, а в тихия полъх на вятъра (3 Царства 19:12)."},{"n":25,"ref":"Втора книга Паралипоменон 33 и Молитвата на Манасия","titlu":"Покаянието на Манасия","gand":"Един от най-лошите царе на Иуда се смирява и е приет, а молитвата му, поместена в края на книгата, се чете на великото повечерие."},{"n":26,"ref":"Четвърта книга Царства 25 и Плач Иеремиев 3","titlu":"Падането на Иерусалим","gand":"Сред развалините пророкът изповядва, че милосърдието на Господа не е пресекнало."}]},{"titlu":"Етап 5 — Псалмите и учителните книги (дни 27–36)","desc":"Молитвата и мъдростта на Израил, с които Църквата се моли и до днес.","zile":[{"n":27,"ref":"Псалми 1, 8 и 18","titlu":"Двата пътя и славата на творението","gand":"„Блажен е оня човек…“ отваря Псалтира: по кой път вървиш ти?"},{"n":28,"ref":"Псалми 26, 41 и 62","titlu":"Копнежът по Бога","gand":"Избери само един стих от тези псалми и го носи със себе си през целия ден."},{"n":29,"ref":"Псалми 90, 102 и 138","titlu":"Под покрова на Всевишния","gand":"Псалом 102, „Благославяй, душо моя, Господа“, се чете всяка с
