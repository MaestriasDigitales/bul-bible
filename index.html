те книги Паралипоменон са били една. Авторът има пред себе си по-старите книги и записките на пророците и пише за един малък народ, който се е върнал в земята си и се пита кой е вече той.\u003c/p>","context":"\u003cp>Завърналите се от Вавилон вече нямат цар, нито блясъка на старите времена. Имат обаче храм, току-що издигнат отново, и един въпрос: още ли сме народът Божий? Книгата им отговаря първо с девет глави родословия — редици от имена от Адам до самите тях, — за да намери всеки своето място в историята. После разказва за царуването на Давид, което познаваш от Първа и Втора книга Царства, но от друг ъгъл: на преден план не стоят войните и паданията му, а начинът, по който той донесе ковчега в Иерусалим, нареди свещениците, левитите и певците и приготви всичко за храма, който Соломон щеше да построи. Продължението е във Втора книга Паралипоменон.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Корените\u003c/strong> — Родословията казват, че Бог не забравя нито един човек и че историята има обща нишка.\u003c/li>\u003cli>\u003cstrong>Обещанието към Давид\u003c/strong> — Бог му обещава потомък, чийто престол ще пребъде вовеки.\u003c/li>\u003cli>\u003cstrong>Богослужението и пеенето\u003c/strong> — Давид определя певци и псалми: славословието на Бога е първото дело на народа.\u003c/li>\u003cli>\u003cstrong>Щедростта от сърце\u003c/strong> — За храма народът дарява с радост, а Давид изповядва, че всичко принадлежи на Бога.\u003c/li>\u003cli>\u003cstrong>Мястото на храма\u003c/strong> — Там, където Давид се кае и принася жертва, на гумното на иевусееца Орна, ще бъде издигнат жертвеникът.\u003c/li>\u003c/ul>","hristos":"\u003cp>Родословията, които започват от Адам, са пътят, по който ще тръгнат и Евангелията: Матей слиза от Авраам и Давид до Христос (Матей 1), а Лука се изкачва от Христос до Адам (Лука 3). Сърцето на книгата е обещанието от 17-а глава: Бог ще въздигне на Давид потомък, ще му бъде Баща, и престолът му ще бъде утвърден навеки (1 Паралипоменон 17:11-14). Соломон го изпълни само отчасти; цялото го чуваме при Благовещението: „и ще Му даде Господ Бог престола на отца Му Давида“ (Лука 1:32). Давид, пастирът, който стана цар, е образ на Христос — Цар и Пастир. А ковчега, който се изкачва с песни към града, песнопенията на Църквата разбраха като образ на Богородица, която носи в себе Си Бога.\u003c/p>","parinti":"\u003cp>За тази книга Отците са написали малко и е добре да го знаеш. Блажени Иероним обаче казва в едно свое писмо, че без Паралипоменон никой не може да се похвали, че познава Писанието, защото в имената и в техните връзки се разрешават много въпроси от другите книги. Блажени Теодорит Кирски обяснява в едно съчинение с въпроси и отговори трудните места от книгите Царства и Паралипоменон. А св. Иоан Златоуст, когато говори за Давид, винаги изтъква неговата кротост и смирение като пример за всички — същите черти, които осветява и тази книга.\u003c/p>","slujbe":"\u003cp>Книгата обикновено не се чете сред четивата на богослуженията. И все пак я чуваш много пъти, без да знаеш. Думите „защото милостта Му е вовеки“, стихът, който левитите на Давид пееха пред ковчега, са припевът на Псалом 135, който се пее на полиелея, на утренята в празниците. А изповедта на Давид, че всичко е от Бога и че от Неговото Му даваме (1 Паралипоменон 29:14), отеква в сърцето на Божествената литургия: „Твоя от Твоих Тебе приносяще“ — Твоето от Твоите Тебе принасяме. Светия пророк Давид Църквата почита в неделята след Рождество Христово.\u003c/p>","rugaciune":"\u003cp>Господи, Боже на нашите отци, Ти знаеш името на всеки човек и не забравяш никого. Твое е всичко, и от Твоето Ти принасям и аз своето малко. Дай ми сърце на певец, като на Давид, за да Те славя и в радост, и в скръб, защото Ти си благ и милостта Ти е вовеки. Амин.\u003c/p>"},"q":[{"q":"Какво значи думата „Паралипоменон“?","o":["„Пропуснатото“, тоест неща, които не са разказани в книгите Царства.","„Книга на песните“.","„Втори закон“."]},{"q":"Какво обеща Бог на Давид в 17-а глава?","o":["Потомък, чийто престол ще бъде утвърден навеки.","Че самият Давид ще построи храма.","Че никога вече няма да има война."]}]}},{"n":14,"slug":"2-paralipomenon","abbr":"2 Пар","cap":36,"s":"istoricheski","bg":{"nume":"Втора книга Паралипоменон","scurt":"От Соломоновия храм до вавилонския плен: историята на Иудейското царство, прочетена като призив за завръщане — с Молитвата на Манасия.","verset":{"t":"„Господ е с вас, когато сте вие с Него; и ако Го търсите, ще Го намерите.“","r":"2 Паралипоменон 15:2"},"incepe":"2 Паралипоменон 5–7 · 20 · 29–30 · 33 · и Молитвата на Манасия","p":{"autor":"\u003cp>Според Преданието книгата е написал свещеникът Ездра след завръщането от плена, през пети век пр. Хр., като продължение на Първа книга Паралипоменон. В други Библии се нарича 2 Летописи. Последните ѝ стихове са почти същите като първите стихове на книгата на Ездра — знак, че двете съчинения вървят ръка за ръка. Авторът разказва отново времето на Трета и Четвърта книга Царства, но избира другояче: интересуват го храмът, молитвата и покаянието.\u003c/p>","context":"\u003cp>Книгата обхваща повече от четиристотин години: от Соломон, който строи и освещава храма, до опожаряването му от вавилонците през 586 г. пр. Хр. След разделянето на царството авторът почти напълно оставя настрана северното царство и следи само Иудея, където царува домът Давидов. Царете минават пред теб като на съд: Аса, Иосафат, Езекия и Иосия търсят Господа и страната се обновява; други Го изоставят и страната рухва. Най-лошият от всички, Манасия, е отведен във Вавилон в окови, смирява се и получава прошка. Книгата не свършва сред развалините: последните стихове донасят указа на Кир, персийския цар, народът да се върне и да съгради отново храма.\u003c/p>\u003cp>Преданието е запазило и самата молитва на Манасия във веригите, за която книгата казва, че е записана (2 Паралипоменон 33:18-19). В Синодалното издание тя не се брои за отделна книга: отпечатана е веднага след последната глава на Втора книга Паралипоменон, под заглавие „Молитва на иудейския цар Манасия, когато е бил в плен във Вавилон“, с бележка, че е преведена от гръцки и че в еврейския текст я няма. Кратка е — около една страница. Започва със славословие към Бога, Който е сътворил небето и земята, изповядва без заобикалки „Съгреших, Господи, съгреших“, казва, че греховете му са повече от морския пясък, и коленичи: „И сега прекланям колената на сърцето си и Те моля за благост.“\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Храмът, сърцето на народа\u003c/strong> — Когато богослужението на Бога е на мястото си, целият живот влиза в ред.\u003c/li>\u003cli>\u003cstrong>Търсенето на Бога\u003c/strong> — Думата, която се връща отново и отново: който търси Господа, Го намира.\u003c/li>\u003cli>\u003cstrong>Молитвата в опасност\u003c/strong> — Иосафат, обкръжен от врагове, пости, моли се и изпраща певците пред войската.\u003c/li>\u003cli>\u003cstrong>Покаянието, което променя всичко\u003c/strong> — Манасия показва, че никое падение не е твърде дълбоко за Божията милост.\u003c/li>\u003cli>\u003cstrong>Покаянието като дар\u003c/strong> — В молитвата си Манасия казва, че Сам Бог е отредил покаяние за грешниците: то е врата, не наказание.\u003c/li>\u003cli>\u003cstrong>Обновлението\u003c/strong> — Езекия и Иосия отварят отново храма и пак празнуват Пасха.\u003c/li>\u003c/ul>","hristos":"\u003cp>При освещаването на храма славата Господня изпълва дома, така че свещениците не могат да влязат (2 Паралипоменон 7:1-2). Тази слава ще се яви напълно, когато „Словото стана плът, и живя между нас“ (Иоан 1:14); Христос казва за Себе Си: „тук е Оня, Който е по-голям от храма“ (Матей 12:6). Пророк Захария, син на свещеника Иодай, убит с камъни в двора на храма (2 Паралипоменон 24:20-22), е споменат от Спасителя в края на дългата редица праведници, които са били убити (Матей 23:35) — редица, която Той Сам ще затвори на Кръста. Пасхата на Езекия, на която са поканени и тези от заблудения север, предвещава новата Пасха, отворена за всички. Манасия казва, че Бог не е отредил покаяние за праведните — Авраам, Исаак и Иаков, — а за него, грешника; векове по-късно Христос ще каже почти същото: „не съм дошъл да призова праведници, а грешници към покаяние“ (Лука 5:32). И името на Манасия е записано в родословието на Спасителя (Матей 1:10). Накрая указът на Кир, който освобождава пленниците, е сянка на освобождението от робството на греха и смъртта (Лука 4:18).\u003c/p>","parinti":"\u003cp>От всички лица в книгата Отците най-много са се спирали на Манасия. Св. Иоан Златоуст в словата си за покаянието го поставя за пример на отчаяните: щом един цар, който напълни Иерусалим с идоли и кръв, е бил приет отново, никой няма право да каже, че за него вече е късно. Св. Андрей Критски го припомня във Великия канон и подканва душата, която е натрупала греховете на Манасия, да подражава и на неговото покаяние. Самата молитва е запазена и в древните църковни наредби, наречени Апостолски постановления — знак, че християните са я чели още от първите векове. Блажени Теодорит Кирски, като обяснява трудните места на книгата, я чете като поука за Божия промисъл, който наказва, за да върне човека.\u003c/p>","slujbe":"\u003cp>Книгата обикновено не се чете сред четивата на богослуженията. Най-ясният ѝ отзвук е Молитвата на Манасия, която се чете цялата на \u003cstrong>Великото повечерие\u003c/strong> — вечерната служба през Великия пост, — след Псалом 50 и Псалом 101; през първата седмица на поста на същото повечерие се чете и Великият канон на св. Андрей Критски. Ако отидеш една вечер през поста в храма, ще я познаеш. А стихът, който пееха левитите, когато славата изпълни храма — „че Той е благ, че милостта Му е вовеки“ (2 Паралипоменон 5:13), — се чува на полиелея, в Псалом 135.\u003c/p>","rugaciune":"\u003cp>Господи, Който се оставяш да Те намерят онези, които Те търсят, не ме оставяй, когато аз Те оставям. Съгреших, Господи, съгреших; дай ми смирението на Манасия, за да се връщам от всяко отдалечаване, и вярата на Иосафат, за да Те славя, преди да видя победата. Направи сърцето ми дом за молитва, който Твоята слава да изпълва. Амин.\u003c/p>"},"q":[{"q":"Кое от двете царства следи книгата?","o":["Иудейското царство, където царуваше домът Давидов.","Северното царство със столица Самария.","Вавилонското царство."]},{"q":"Какво стана с цар Манасия, след като го отведоха в окови във Вавилон?","o":["Смири се, помоли се и Бог му прости.","Умря в плен, без да се покае.","Завладя Вавилон."]},{"q":"На коя служба се чете Молитвата на Манасия?","o":["На Великото повечерие, през Великия пост.","На Божествената литургия в нощта на Великден.","На последованието на венчанието."]}]}},{"n":15,"slug":"1-ezdra","abbr":"1 Езд","cap":10,"s":"istoricheski","bg":{"nume":"Първа книга на Ездра","scurt":"Завръщането от вавилонския плен: един малък народ издига отново жертвеника, храма и, преди всичко, послушанието към Божието слово.","verset":{"t":"„Ездра бе разположил сърцето си да изучава закона Господен, да го изпълнява и да учи в Израиля на закон и правда.“","r":"1 Ездра 7:10"},"incepe":"1 Ездра 1 · 3 · 7 · 9","p":{"autor":"\u003cp>Книгата носи името на Ездра, свещеник от рода на Аарон и книжник, вещ в закона Моисеев, когото Преданието смята и за неин автор. Живял е през пети век пр. Хр., под властта на персите. Част от книгата е написана в първо лице, като свидетелство. В Синодалното издание тя се нарича „Първа книга на Ездра“, защото сред неканоничните книги има още две, които носят неговото име — Втора и Трета книга на Ездра; ще ги намериш по-нататък в Картата. В древния гръцки превод на Седемдесетте книгата на Ездра е включвала и книгата на Неемия.\u003c/p>","context":"\u003cp>Втора книга Паралипоменон завърши с изгорения Иерусалим и с народа във Вавилон. След около седемдесет години — както беше предрекъл пророк Иеремия — персите завладяват Вавилон, и цар Кир заповядва през 538 г. пр. Хр. иудеите да се върнат в земята си. Книгата има две части. В първата (глави 1–6) една първа вълна завърнали се, водени от Зоровавел и първосвещеника Иисус, издига жертвеника, а после, с много пречки от съседите, и храма, който е осветен през 515 г. Пророците Агей и Захария ги ободряват. Във втората част (глави 7–10), почти шестдесет години по-късно, пристига Ездра с втора вълна, за да научи народа на Закона.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Бог държи на думата Си\u003c/strong> — Пленът имаше край, както Той го беше обещал чрез пророците.\u003c/li>\u003cli>\u003cstrong>Първо жертвеникът\u003c/strong> — Завърналите се принасят жертва, преди да имат стени или здрави къщи.\u003c/li>\u003cli>\u003cstrong>Сълзи и радост\u003c/strong> — При основите на новия храм старците плачат за стария, а младите възклицават от радост.\u003c/li>\u003cli>\u003cstrong>Божието слово в средата\u003c/strong> — Ездра не носи войска, а Закона, и го преподава.\u003c/li>\u003cli>\u003cstrong>Покаяние за целия народ\u003c/strong> — Ездра се моли, като казва „нашите грехове“, а не „техните грехове“.\u003c/li>\u003c/ul>","hristos":"\u003cp>Завръщането от Вавилон е образ на делото на Христос: Той идва „да проповядвам на пленените освобождение“ (Лука 4:18) и ни извежда от робството на греха и смъртта, като ни връща у дома, при Отца. Зоровавел, потомък на Давид и водач на завърналите се, е в родословието на Спасителя по плът (Матей 1:12-13): нишката на обещанието не се скъса дори в плена. Отново съграденият храм е по-беден от Соломоновия, но пророк Агей обещава, че славата му ще бъде по-голяма (Агей 2:9) — и така стана, защото в него влезе Сам Христос. Ездра, свещеник, който учи на Закона и се моли, като поема върху себе си греховете на народа, предвещава великия Първосвещеник, Който понесе нашите грехове (Евреи 4:14).\u003c/p>","parinti":"\u003cp>Отците малко са тълкували тази книга; единственото пълно древно тълкувание е на преподобни Беда Достопочтени, на Запад, който вижда в изграждането на храма отново съграждането на Църквата от живи камъни. Отците на Изтока говорят най-вече за самия Ездра. Св. Ириней Лионски напомня, че след плена Бог вдъхновил свещеника Ездра да подреди отново словата на предишните пророци и да даде пак на народа Моисеевия Закон. Затова Преданието го почита като онзи, който е запазил и събрал Писанията: човекът, чрез когото народът отново намери своята Книга.\u003c/p>","slujbe":"\u003cp>Книгата на Ездра не се чете на богослуженията. Духът ѝ обаче го срещаш всеки път, когато се освещава храм: същата радост на един народ, който издига място за молитва. И го срещаш през Великия пост, когато Църквата ни учи да се молим като Ездра, като изповядваме не чуждите грехове, а своите. Стихът, който се пееше при основите на храма — „защото е благ, защото милостта Му към Израиля е довека“ (1 Ездра 3:11), — отеква на полиелея, в Псалом 135.\u003c/p>","rugaciune":"\u003cp>Господи, Който върна народа Си от плена, върни и мене от всичките ми отдалечавания. Помогни ми първо да издигам жертвеника на молитвата, а после всичко останало. Приготви сърцето ми, както сърцето на Ездра, да търси Твоето слово, да го изпълнява и едва след това да го казва на другите. Амин.\u003c/p>"},"q":[{"q":"Кой даде заповедта, благодарение на която иудеите можаха да се върнат от Вавилон?","o":["Кир, персийският цар.","Навуходоносор, вавилонският цар.","Цар Соломон."]},{"q":"Какво издигнаха най-напред завърналите се в Иерусалим?","o":["Жертвеника, на който принасяха жертва.","Стените на града.","Дворец за Зоровавел."]}]}},{"n":16,"slug":"neemia","abbr":"Неем","cap":13,"s":"istoricheski","bg":{"nume":"Неемия","scurt":"Един царски виночерпец оставя двореца и за 52 дни съгражда отново стените на Иерусалим — с молитва, труд и бдителност.","verset":{"t":"„Не тъжете, защото радостта пред Господа е подкрепа за вас.“","r":"Неемия 8:10"},"incepe":"Неемия 1–2 · 4 · 8–9","p":{"autor":"\u003cp>Книгата е в по-голямата си част разказ на самия Неемия, написан в първо лице, като дневник, пълен с кратки молитви. Неемия е иудеин, роден в плена, виночерпец — довереник — на персийския цар Артаксеркс в престолния град Суза. Преданието го смята за автор на книгата, в която е работил и Ездра. Събитията започват през 445 г. пр. Хр. В древността книгата е била свързана с книгата на Ездра, а в гръцкия превод на Седемдесетте е част от нея; в Синодалното издание стои отделно, веднага след Първа книга на Ездра.\u003c/p>","context":"\u003cp>Минали са почти сто години от завръщането от Вавилон. Храмът е съграден отново, но Иерусалим е останал без стени, с изгорени порти, за подигравка на съседите. Когато научава това, Неемия плаче, пости, моли се и иска от царя позволение да замине. Като пристига в Иерусалим като управител, той оглежда стените нощем, разпределя работата между семействата и въпреки подигравките и заплахите на Санавалат и на другите врагове стената е завършена за петдесет и два дни. След това идва по-трудното дело: съграждането на народа. Ездра чете Закона на площада от сутринта до пладне; народът плаче, кае се и подновява завета. С Неемия завършва историята, която разказват каноничните книги на Стария Завет; пророк Малахия е живял приблизително по същото време.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Молитвата преди делото\u003c/strong> — Неемия се моли месеци, преди да поиска нещо от царя, и още веднъж, накратко, в мига на молбата.\u003c/li>\u003cli>\u003cstrong>Работата заедно\u003c/strong> — Всяко семейство гради частта от стената, която е срещу дома му.\u003c/li>\u003cli>\u003cstrong>Трудът и бдителността\u003c/strong> — С едната ръка вършат работа, а с другата държат оръжие.\u003c/li>\u003cli>\u003cstrong>Справедливостта към бедните\u003c/strong> — Неемия спира лихварството и не взема онова, което му се полага като управител.\u003c/li>\u003cli>\u003cstrong>Словото, което съгражда\u003c/strong> — Стените пазят града, но Законът, когато се чете и разбира, прави от една тълпа народ.\u003c/li>\u003c/ul>","hristos":"\u003cp>Неемия оставя почестите на царския двор, за да сподели позора на братята си и да им съгради отново града. В него прозира Онзи, Който, „бидейки в образ Божий“, понизи Себе Си, „като прие образ на раб“ (Филипяни 2:6-7), за да възстанови нашата съборена природа. Христос е истинският Строител: „ще съградя църквата Си, и портите адови няма да ѝ надделеят“ (Матей 16:18). Неемия очиства храма от онези, които го бяха превърнали в склад и място за търговия (Неемия 13), както ще направи Господ с бича от върви (Иоан 2:15). Четенето на Закона с тълкуване в 8-а глава предвещава деня, когато Сам Христос ще изтълкува на учениците Писанията (Лука 24:27). А съграденият отново град е сянка на новия Иерусалим, който слиза от небето (Откровение 21:2).\u003c/p>","parinti":"\u003cp>И тази книга е малко тълкувана в древността, и е честно да го кажем. Преподобни Беда Достопочтени, който я тълкува заедно с Ездра, вижда в Неемия образа на истинския пастир: онзи, който съгражда отново душите, съборени от греха, и ги пази от враговете. В духа на подвижниците Отци образът на строителите, които работят с едната ръка и държат копие с другата, се чете така: животът на християнина е вършене на доброто и трезвение — тоест пазене на ума — срещу лошите помисли. А кратките молитви на Неемия, които се издигат към небето посред работата, отговарят на тяхното учение за честата и кратка молитва.\u003c/p>","slujbe":"\u003cp>Книгата на Неемия не се чете на богослуженията. Но сцената от 8-а глава ще ти се стори позната: когато Ездра отваря книгата, целият народ се изправя, а на благословията отговаря „Амин“. Така стоим и ние на Божествената литургия, когато чуваме: „Премъдрост, прости! Да чуем светото Евангелие“ — „прости“ тук значи „изправени“. А дългата покаянна молитва от 9-а глава, която разказва цялата история на спасението, прилича на големите благодарствени молитви на Църквата.\u003c/p>","rugaciune":"\u003cp>Господи, Боже небесний, Който пазиш завет и милост, погледни съборените стени на душата ми. Дай ми ревността на Неемия: да се моля, преди да започна работа, да работя без страх и да бдя без гордост. И радостта пред Тебе нека бъде моя подкрепа. Амин.\u003c/p>"},"q":[{"q":"Каква служба имаше Неемия в двора на цар Артаксеркс?","o":["Беше царски виночерпец.","Беше военачалник.","Беше свещеник в храма."]},{"q":"За колко дни беше съградена отново стената на Иерусалим?","o":["За петдесет и два дни.","За седем години.","За четиридесет дни."]}]}},{"n":17,"slug":"estir","abbr":"Ест","cap":10,"s":"istoricheski","bg":{"nume":"Естир","scurt":"Едно сираче, станало царица, излага живота си на опасност и с пост и молитва спасява цял народ от унищожение.","verset":{"t":"„И кой знае, дали не за такова време си достигнала царско достойнство?“","r":"Естир 4:14"},"incepe":"Естир 2–4 · 7","p":{"autor":"\u003cp>Книгата не назовава автора си. Едно старо предание я свързва с Мардохей, роднина и духовен баща на Естир, за когото книгата казва, че описал събитията и ги изпратил на иудеите. Те стават през пети век пр. Хр. в град Суза, при един персийски цар, когото твоята Библия, следвайки гръцкия превод на Седемдесетте, нарича Артаксеркс. Гръцкият текст, който следва Православната църква, е по-богат от еврейския: съдържа и молитвите на Мардохей и на Естир. В Синодалното издание тези части са преведени от гръцки и са вмъкнати в разказа.\u003c/p>","context":"\u003cp>Не всички иудеи се върнаха в Иерусалим със Зоровавел, Ездра и Неемия. Мнозина останаха пръснати из Персийската империя, която се простираше от Индия до Етиопия. Книгата Естир разказва тяхната история. Царят отстранява царица Астин и избира на нейно място Естир, младо иудейско сираче, което не беше открило произхода си. В двора сановникът Аман, наранен в гордостта си, защото Мардохей не му се покланя, издейства указ, според който всички иудеи в империята трябва да бъдат избити в един-единствен ден, определен чрез жребий. Естир пости три дни, влиза неповикана при царя — нещо, което се наказваше със смърт, — и обръща решението. От това спасение се роди иудейският празник Пурим, „празникът на жребиите“.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Скритият Божи промисъл\u003c/strong> — Нищо не прилича на чудо, и все пак всяко „съвпадение“ застава на мястото си.\u003c/li>\u003cli>\u003cstrong>Смелостта в точния час\u003c/strong> — Естир разбира, че мястото, до което е стигнала, е отговорност, а не случайност.\u003c/li>\u003cli>\u003cstrong>Пост и молитва пред опасността\u003c/strong> — Преди да говори с царя, тя говори с Бога.\u003c/li>\u003cli>\u003cstrong>Гордостта, която сама се срутва\u003c/strong> — Аман свършва на бесилото, което беше приготвил за Мардохей.\u003c/li>\u003cli>\u003cstrong>Скръбта, която става радост\u003c/strong> — Денят, определен за унищожение, става ден на празник.\u003c/li>\u003c/ul>","hristos":"\u003cp>Името на Христос не се появява, но образът Му прозира. Естир излага живота си на опасност за своя народ и се застъпва за него пред царя; Христос, „един и Ходатай между Бога и човеци“ (1 Тимотей 2:5), не само рискува, а дава живота Си и винаги е жив, за да ходатайства за нас (Евреи 7:25). Аман пада в ямата, която сам е изкопал: така чрез Кръста дяволът беше победен със собственото си оръжие, смъртта (Колосяни 2:14-15). Денят на смъртта, превърнат в ден на радост, предвещава Възкресението. Християнското Предание видя в Естир, царицата, която се моли за своите, и сянка на Богородица, нашата Застъпница пред Царя. А народът, спасен от унищожение, е родът, от който по плът щеше да се роди Спасителят.\u003c/p>","parinti":"\u003cp>Отците не са оставили пълни тълкувания на тази книга, но я привеждат като пример. Св. Климент Римски, един от първите приемници на апостолите, пише в посланието си до коринтяните, че Естир, съвършена във вярата, сама се изложила на опасност, за да спаси народа на Израил, и че с пост и смирение молела Бога, а Той, като видял смирението на душата ѝ, избавил народа. На същата страница я поставя до Иудит, сред жените, които Божията благодат укрепила да извършат мъжествени дела. За него Естир е доказателство, че Бог върши велики дела чрез онези, които изглеждат слаби.\u003c/p>","slujbe":"\u003cp>Книгата Естир не се чете на богослуженията на Църквата. Нейната молитва обаче, от гръцкия текст — молитвата на човек, който е сам и няма друг помощник освен Бога, — много прилича на покаянните молитви на Великия пост. В Синодалното издание я намираш в 4-а глава: „помогни на мене, която съм сама и нямам помощник, освен Тебе!“ А праведниците на Стария Завет, мъже и жени, се почитат заедно в Неделята на светите праотци, преди Рождество Христово. Ако искаш да научиш повече, попитай свещеника в своя храм.\u003c/p>","rugaciune":"\u003cp>Господи, Царю на всичко, Който действаш скрито дори когато не Те виждаме, ела ми на помощ, защото нямам друг помощник освен Тебе. Дай ми смелостта на Естир в точния час и ме научи да постя и да се моля, преди да говоря. Превърни нашата скръб в радост. Амин.\u003c/p>"},"q":[{"q":"Какво направи Естир, преди да влезе неповикана при царя?","o":["Пости три дни и се моли заедно със своя народ.","Събра войска.","Избяга от Суза."]},{"q":"Как свърши Аман, врагът на иудеите?","o":["На бесилото, което беше приготвил за Мардохей.","Стана цар на мястото на Артаксеркс.","Беше простен и изпратен у дома си."]}]}},{"n":18,"slug":"iov","abbr":"Иов","cap":42,"s":"uchitelni","bg":{"nume":"Иов","scurt":"Един праведен човек губи всичко и пита Бога „защо?“ — книгата, която не обяснява страданието, а ти показва Бога в него.","verset":{"t":"„Господ даде, Господ и взе; (както беше угодно Господу, тъй и стана) да бъде благословено името Господне!“","r":"Иов 1:21"},"incepe":"Иов 1–3 · 19 · 38–42","p":{"autor":"\u003cp>Книгата не назовава автора си; едно старо предание я свързва с Моисей, а други — с някой по-късен мъдрец. Самият Иов изглежда е живял в епохата на патриарсите, близо до времето на Авраам, в земята Уц, на изток от обетованата земя: той сам принася жертви като глава на семейството, без свещеници и без храм. Не принадлежи към народа на Израил — и тъкмо затова книгата му говори на всеки човек. С Иов започва редицата на поетичните, учителни книги на Стария Завет.\u003c/p>","context":"\u003cp>Дотук Писанието ти разказа историята на един народ. Сега то спира при един-единствен човек и при един-единствен въпрос: защо страда праведникът? Началото и краят са в проза; средата е дълга поема. Иов, богат и непорочен човек, губи за един ден имота си и десетте си деца, а после и здравето си. Дяволът беше поискал позволение да го изпита, като твърдеше, че Иов обича Бога само заради даровете Му. Трима приятели идват да го утешат и накрая започват да го обвиняват: щом страдаш, значи си съгрешил. Иов не приема лесния им отговор; оплаква се, вика, но не се отделя от Бога. Накрая Сам Господ му проговаря из бурята, и Иов слага ръка на устата си и замлъква.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Вярата без отплата\u003c/strong> — Иов показва, че човек може да обича Бога, дори когато вече не получава нищо.\u003c/li>\u003cli>\u003cstrong>Страданието не винаги е наказание\u003c/strong> — Приятелите, които съдят прибързано, са изобличени от Бога.\u003c/li>\u003cli>\u003cstrong>Дързостта на оплакването\u003c/strong> — Иов не се преструва; оплакването му, когато е изречено пред Бога, също е молитва.\u003c/li>\u003cli>\u003cstrong>Тайната, която надминава ума\u003c/strong> — Бог не му дава обяснение, а открива Себе Си, и това е достатъчно.\u003c/li>\u003cli>\u003cstrong>Търпението, което вижда края\u003c/strong> — „Слушали сте за търпението на Иова“ (Иаков 5:11).\u003c/li>\u003c/ul>","hristos":"\u003cp>Иов е най-ясният образ на Праведника, Който страда без вина. Изоставен от приятелите, осмиван, седнал на пепелището вън от града, той предвещава Христос, Безгрешния, Който пострада вън от портата (Евреи 13:12). Иов копнее за някой, който да застане между него и Бога и да сложи ръката си върху двамата: „Помежду ни няма посредник, който би сложил ръката си на нас двама ни“ (Иов 9:33) — и отговорът е Христос, Ходатаят (1 Тимотей 2:5). От дълбините на болката той изповядва: „Но аз зная, Изкупителят ми е жив“ (Иов 19:25) — едно от най-светлите предвестия на възкресението в Стария Завет. Но разликата е голяма: Иов страда, без да иска и без да знае защо; Христос отива доброволно към Страданието, заради нас. Затова Църквата чете тази книга тъкмо през Страстната седмица.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст споменава Иов безброй пъти и го представя като подвижник на търпението: той победи дявола не с чудеса, а с благодарност, като каза „да бъде благословено името Господне“ тъкмо когато беше изгубил всичко. И добавя нещо, на което си струва да обърнеш внимание: Иов издържа преди Закона и преди благодатта, без пред очите си да има примера на други; колко повече можем ние, които имаме Кръста Христов. На Запад св. Григорий Двоеслов тълкува цялата книга и вижда в Иов образа на Христос и на страдащата Църква. От тях се учим да не използваме тази книга, за да обясняваме страданието на другия, а за да застанем до него.\u003c/p>","slujbe":"\u003cp>През Страстната седмица, от понеделник до петък, на вечернята се чете от книгата на Иов: началото ѝ, изпитанията му, а на Велики петък — краят. Така слушаш за страдащия праведник тъкмо в дните на Страданията Господни. Църквата почита светия и праведен Иов на 6 май. А думите му „да бъде благословено името Господне“ ги пееш в края на всяка Божествена литургия, във вида, в който ги има Псалом 112:2: „Да бъде благословено името Господне отсега и довека.“\u003c/p>","rugaciune":"\u003cp>Господи, Който проговори на Иов из бурята, не се отдалечавай от мене в деня на скръбта. Когато не разбирам, дай ми да не се отделям от Тебе; когато се оплаквам, приеми оплакването ми като молитва. Научи ме да казвам и при дар, и при загуба: да бъде благословено Твоето име. Зная, че Изкупителят ми е жив. Амин.\u003c/p>"},"q":[{"q":"Какво твърдяха тримата приятели на Иов?","o":["Че страданието му е наказание за някакъв грях.","Че Бог не съществува.","Че Иов трябва да замине за друга страна."]},{"q":"Кога се чете книгата на Иов на богослуженията?","o":["На вечернята през Страстната седмица.","На литургията в нощта на Великден.","На утренята на Петдесетница."]}]}},{"n":19,"slug":"psaltir","abbr":"Пс","cap":151,"s":"uchitelni","bg":{"nume":"Псалтир","scurt":"Молитвената книга на Църквата: 150 псалма, в които намираш думи за всяко състояние — славословие, сълзи, страх, благодарност.","verset":{"t":"„Господ е Пастир мой, от нищо не ще се нуждая.“","r":"Псалом 22:1"},"incepe":"Псалом 1 · 22 · 50 · 90 · 102","p":{"autor":"\u003cp>Повечето псалми са на светия пророк и цар Давид, който е живял хиляда години преди Христос; затова Преданието нарича цялата книга „Давидов Псалтир“. Други носят името на Асаф, на синовете Кореови, на Соломон, а Псалом 89 е молитва на Моисей. Те са били събирани през вековете, чак до след завръщането от плена. Православният Псалтир има 150 псалма и още един, 151-ви, за двубоя на Давид с Голиат; в Синодалното издание той е отпечатан след Псалом 150 с бележка, че е преведен от гръцки, защото в еврейския текст го няма.\u003c/p>","context":"\u003cp>Псалмите не разказват историята; те я пеят и я оплакват. В тях намираш цялата Библия дотук, превърната в молитва: сътворението на света, излизането от Египет, греха и покаянието на Давид, опожаряването на Иерусалим, тъгата на пленниците край реките вавилонски. Пеели са ги в храма, с гусли и кимвали, и у дома, в уединение. Една практическа бележка, за да не се объркваш: твоята Библия номерира псалмите по гръцкия превод на Седемдесетте. От Псалом 10 до 146 номерът обикновено е с единица по-малък, отколкото в протестантските Библии: „Господ е Пастир мой“ е Псалом 22 (в тях — 23), а „Помилуй ме, Боже“ е Псалом 50 (в тях — 51). За богослуженията Псалтирът е разделен на двадесет части, наречени катизми. Псалтирът е и сред първите книги, които светите братя Кирил и Методий преведоха на славянски език, за да може народът да се моли с него на своя език.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Двата пътя\u003c/strong> — Псалом 1 открива книгата с избора между пътя на праведните и пътя на грешниците.\u003c/li>\u003cli>\u003cstrong>Покаянието\u003c/strong> — Псалом 50 е викът на Давид след падението и молитвата на всеки, който иска да се върне.\u003c/li>\u003cli>\u003cstrong>Упованието\u003c/strong> — „Господ е Пастир мой“ (Псалом 22); „Който живее под покрива на Всевишния“ (Псалом 90).\u003c/li>\u003cli>\u003cstrong>Славословието\u003c/strong> — Цялото творение е призовано да благославя Господа, чак до последния стих: „Всичко, що диша, да хвали Господа!“\u003c/li>\u003cli>\u003cstrong>Оплакването, изречено пред Бога\u003c/strong> — Псалмите не крият страха, гнева или самотата, а ги принасят пред Него.\u003c/li>\u003c/ul>","hristos":"\u003cp>След Възкресението Господ казва на учениците, че трябва да се изпълни всичко, писано за Него „в Закона Моисеев и у пророците и в псалмите“ (Лука 24:44). На Кръста Той се моли с думите на Псалом 21 (22 в протестантските Библии): „Боже Мой, Боже Мой! Защо си Ме оставил?“ (Матей 27:46) — същият псалом, който говори за пробитите ръце и нозе и за дрехите, разделени чрез жребий. Псалом 2 предвещава Сина: „Син Мой си Ти; Аз днес Те родих“. Псалом 15 предвещава Възкресението: Божият светия няма да види тление (Деяния 2:27). Псалом 109, „Рече Господ Господу моему: седи от дясната Ми страна“, Сам Христос тълкува за Себе Си (Матей 22:44). И „камъкът, който отхвърлиха зидарите“ от Псалом 117 е Той. Затова Църквата казва псалмите с гласа на Христос и заедно с Него.\u003c/p>","parinti":"\u003cp>Св. Атанасий Велики в Посланието до Маркелин казва, че Псалтирът е като огледало: другите книги ти показват какво да правиш, а псалмите ти слагат думите в устата, така че ги казваш като свои и виждаш в тях движенията на душата си. Св. Василий Велики в беседата си върху Псалом 1 го оприличава на обща съкровищница с добри поуки, където всеки намира лекарството, което му подхожда, и казва, че псалмът носи тишина на душите и помирява скараните. Псалмите са тълкували подробно и св. Иоан Златоуст, блажени Августин и блажени Теодорит Кирски.\u003c/p>","slujbe":"\u003cp>Няма православно богослужение без псалми. По устава целият Псалтир се чете всяка седмица, разделен на двадесетте катизми, на вечернята и на утренята, а през Великия пост — два пъти седмично. Псалом 103, предначинателният, открива вечернята; шестте псалма на Шестопсалмието (3, 37, 62, 87, 102, 142) откриват утренята; Псалом 50 чуваш почти на всяка служба. На Божествената литургия антифоните са стихове от псалми; в неделя обикновено се пеят Псалом 102 („Благославяй, душо моя, Господа“) и Псалом 145 („Душо моя, хвали Господа!“), т.нар. изобразителни антифони. По традиция Псалтирът се чете и край починалите.\u003c/p>","rugaciune":"\u003cp>Господи, Пастирю мой, Който не ме оставяш да се нуждая от нищо, научи ме да се моля с думите на Твоя раб Давид. Помилуй ме, Боже, по голямата Си милост, сърце чисто създай в мене и не ме отхвърляй от лицето Си. Господи, отвори устните ми, и устата ми ще възвестят Твоята хвала, сега и през целия ми живот. Амин.\u003c/p>"},"q":[{"q":"По каква номерация се броят псалмите в православната Библия?","o":["По номерацията на Седемдесетте, древния гръцки превод.","По номерацията на протестантските Библии.","По реда, в който се пеят на литургията."]},{"q":"Кой псалом съдържа думите, които Спасителят каза на Кръста: „Боже Мой, Боже Мой! Защо си Ме оставил?“","o":["Псалом 21.","Псалом 50.","Псалом 103."]}]}},{"n":20,"slug":"pritchi","abbr":"Притч","cap":31,"s":"uchitelni","bg":{"nume":"Притчи Соломонови","scurt":"Мъдростта на всекидневния живот, в кратки думи: как да говориш, да работиш, да обичаш и да се боиш от Бога.","verset":{"t":"„Начало на мъдростта е страхът Господен.“","r":"Притчи 1:7"},"incepe":"Притчи 1–4 · 8–9 · 31","p":{"autor":"\u003cp>По-голямата част от книгата идва от цар Соломон, сина на Давид, който царува през десети век пр. Хр. и за когото Писанието казва, че е изрекъл три хиляди притчи, както разказва Трета книга Царства. Самата книга показва, че е събирана постепенно: част от притчите са събрали хората на цар Езекия, два века по-късно, а в края стоят думите на Агур и на цар Лемуил. Книгата започва с думите „Притчи на Соломона, син Давидов, цар израилски“, затова в Църквата се нарича „Притчи Соломонови“.\u003c/p>","context":"\u003cp>След Иов и Псалтира оставаш сред учителните книги. Ако псалмите те учат да говориш с Бога, Притчите те учат да живееш с хората. Книгата се е родила в мирните години на Соломон, когато в Иерусалим се събирала мъдростта и младите се възпитавали за живота. Затова първите девет глави са слово на баща към сина му: „Слушай, синко, поуката на баща си“. Следват стотици кратки изречения, по два реда всяко, лесни за запомняне, за езика, труда, парите, приятелите, гнева, брака, възпитанието на децата. Книгата завършва с похвалата на добродетелната жена. Това не са сигурни обещания, а наблюдения над живота под Божия поглед: така обикновено вървят нещата за онзи, който ходи право.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Страхът Божий\u003c/strong> — Не ужас, а благоговение, изпълнено с любов пред Него; оттук започва всяка мъдрост.\u003c/li>\u003cli>\u003cstrong>Двата пътя\u003c/strong> — Мъдростта и безумието са представени като две жени, които канят човека на трапезата си.\u003c/li>\u003cli>\u003cstrong>Пазенето на езика\u003c/strong> — „Кротък отговор гняв отвръща“, а който пази устата си, пази душата си.\u003c/li>\u003cli>\u003cstrong>Трудолюбие и справедливост\u003c/strong> — „Иди при мравката, ленивецо“; неверните везни са мерзост пред Господа.\u003c/li>\u003cli>\u003cstrong>Изобличението от любов\u003c/strong> — Господ наказва онзи, когото обича, както баща — сина си.\u003c/li>\u003c/ul>","hristos":"\u003cp>В Притчите Премъдростта не е само качество, а говори като Личност: тя е била при Бога, преди да съществува светът, и се е радвала пред Него, когато Той е основавал небесата (Притчи 8:22-31). Църквата разпознава тук Сина Божий, Христос, „Божия сила и Божия премъдрост“ (1 Коринтяни 1:24), чрез Когото всичко е станало (Иоан 1:3). Девета глава отива още по-далеч: „Премъдростта си съгради дом“, приготви трапеза и кани: „дойдете, яжте хляба ми и пийте виното, което съм размесила“ (Притчи 9:1-5). Домът е тялото, което Синът прие от Дева Мария, а трапезата е Светото Причастие. А думите за наказанието от Господа (Притчи 3:11-12) се повтарят в Посланието до евреите (Евреи 12:5-6), за да ни покажат, че сме Негови деца.\u003c/p>","parinti":"\u003cp>Св. Атанасий Велики защити божеството на Христос тъкмо върху един стих от тази книга. В гръцкия текст на Седемдесетте, който четяха Отците, Премъдростта казва, че Господ я е създал като начало на пътищата Си (Притчи 8:22; в Синодалното издание: „Господ ме имаше за начало на Своя път“). Арианите твърдяха от това, че Синът е творение. Св. Атанасий Велики показва в словата си против арианите, че тук става дума за въплъщението на Сина заради нас, а не за предвечното Му раждане от Отца. Св. Василий Велики в беседата си върху началото на Притчите казва, че тази книга е учение за нравите, поправяне на страстите и пътеводител за целия живот. За Отците Притчите са първото стъпало: който иска да се изкачи нависоко, започва от доброто дело.\u003c/p>","slujbe":"\u003cp>През Великия пост, от понеделник до петък, на вечернята по ред се чете от Притчите, заедно с Битие: Църквата ни праща в училището на мъдростта тъкмо във времето на покаянието. На Богородичните празници едно от четивата е „Премъдростта си съгради дом“ (Притчи 9), защото Девата е домът, в който се всели Христос. Стихове от Притчите чуваш и в четивата на паметите на светиите, например: „Споменът за праведника ще пребъде благословен“ (Притчи 10:7).\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Премъдрост на Отца, Който съгради Своя дом сред нас и ни каниш на Своята трапеза, дай ми Твоя чист страх, началото на мъдростта. Постави стража на устата ми, направи ме трудолюбив и справедлив в малкото и ме научи да приемам Твоето наказание като Твое дете. Амин.\u003c/p>"},"q":[{"q":"Кое е, според Притчите, началото на мъдростта?","o":["Страхът Господен.","Богатството и дългият живот.","Четенето на много книги."]},{"q":"Кого разпознава Църквата в Премъдростта, която „си съгради дом“ и приготви трапеза?","o":["Христос, Сина Божий, Който се въплъти и ни кани на Светото Причастие.","Южната царица.","Цар Езекия."]}]}},{"n":21,"slug":"eklisiast","abbr":"Екл","cap":12,"s":"uchitelni","bg":{"nume":"Еклисиаст","scurt":"Един мъдър цар е опитал всичко и изповядва: без Бога всичко е суета.","verset":{"t":"„Бой се от Бога и пази Неговите заповеди.“","r":"Еклисиаст 12:13"},"incepe":"Еклисиаст 1–3 · 12","p":{"autor":"\u003cp>Според Преданието на Църквата книгата е на цар Соломон, сина на Давид, който царува в Иерусалим през десети век пр. Хр. Тя започва с думите „Думи на Еклисиаста, син Давидов, цар иерусалимски“. „Еклисиаст“ е гръцка дума: така се нарича онзи, който говори пред събранието на народа — проповедникът. Светите Отци чуват тук гласа на Соломон в старостта му: на човека, който е имал мъдрост, богатство и слава като никой друг и който, след като е паднал, гледа назад с яснота и с покаяние.\u003c/p>","context":"\u003cp>Намираме се в златния век на Израил. Давид е основал царството, а Соломон е построил Иерусалимския храм; има мир, златото тече, корабите донасят богатства от далечни страни. Тъкмо сред това изобилие се надига въпросът на книгата: „Каква полза за човека от всичките му трудове, с които се труди под слънцето?“ Соломон е опитал всичко — знанието, удоволствията, големите дела, градините, имотите — и казва честно какво е намерил. В Писанието Еклисиаст стои между Притчите и Песен на песните. След Соломон царството ще се раздели на две и ще дойдат пророците; книгата остава свидетелство, че и най-блестящото време не може да насити сърцето на човека.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Суетата\u003c/strong> — Всичко, което е само „под слънцето“, без Бога, отминава като пара и не изпълва сърцето.\u003c/li>\u003cli>\u003cstrong>Времето за всичко\u003c/strong> — „Всичко си има време“: има време да се родиш и време да умреш, и всички времена са в Божията ръка (Еклисиаст 3:1-8).\u003c/li>\u003cli>\u003cstrong>Смъртта\u003c/strong> — Богатият и бедният, мъдрият и глупавият стигат до един и същ гроб; затова животът трябва да се претегля другояче.\u003c/li>\u003cli>\u003cstrong>Радостта като дар\u003c/strong> — Хлябът, трудът и близките са Божии дарове, за да ги приемаме с благодарност, а не за да ги правим идоли.\u003c/li>\u003cli>\u003cstrong>Страхът Божий\u003c/strong> — Краят на книгата: бой се от Бога и пази Неговите заповеди.\u003c/li>\u003c/ul>","hristos":"\u003cp>Еклисиаст поставя въпроса, на който отговаря само Христос. Соломон вижда, че смъртта поглъща всичко и че „кривото не може да стане право“ (Еклисиаст 1:15). Спасителят идва тъкмо тук и казва за Себе Си: „тук има повече от Соломона“ (Матей 12:42). Разказва притчата за богаташа, чиято нива се беше обилно родила (Лука 12:16-21), и пита: „каква полза за човека, ако придобие цял свят, а повреди на душата си?“ (Марк 8:36). Апостол Павел показва, че творението е подчинено на суетата, но с надежда (Римляни 8:20), и че откакто Христос възкръсна, нашият труд вече не е напразен в Господа (1 Коринтяни 15:58). Книгата казва, че думите на мъдреците са „дадени от единия Пастир“ (Еклисиаст 12:11); Църквата разпознава в Него Христос, Добрия Пастир.\u003c/p>","parinti":"\u003cp>Св. Григорий Нисийски е произнесъл поредица беседи върху Еклисиаст. Той показва, че „суетата“ не означава, че светът, сътворен от Бога, е лош, а че е временен: който прилепи сърцето си към него, остава с празни ръце. Той, следвайки едно по-старо учение, вижда в трите книги на Соломон стълба: Притчите учат човека да живее право, Еклисиаст го откъсва от временното, а Песен на песните го води към единението с Бога. И св. Григорий Чудотворец тълкува книгата, като я преразказва на език, разбираем за християните от неговото време.\u003c/p>","slujbe":"\u003cp>Еклисиаст не се чете като четиво на богослуженията на Църквата. Чуваш го обаче по дух в последованието на погребението: самогласните стихири на св. Иоан Дамаскин казват, че всичко човешко е суета, щом не остава след смъртта — богатството не остава, славата не слиза с нас в гроба. Същото трезвение намираш през Великия пост, във Великия канон на св. Андрей Критски, който припомня падналия Соломон и зове душата към покаяние.\u003c/p>","rugaciune":"\u003cp>Господи, Боже наш, Ти знаеш колко тичаме след неща, които отминават като пара. Научи ни да броим дните си и да приемаме с благодарност хляба, труда и нашите близки като Твои дарове. Откъсни сърцето ни от суетата и го съедини с Тебе, Който пребъдваш вовеки. Дай ни Твоя добър страх и пазенето на Твоите заповеди. Амин.\u003c/p>"},"q":[{"q":"Какво значи „суета“ в Еклисиаст?","o":["Че всичко, което е само „под слънцето“, без Бога, е временно и не изпълва сърцето.","Че светът, сътворен от Бога, е лош.","Че няма смисъл да работиш и да се радваш."]},{"q":"Как завършва книгата?","o":["Бой се от Бога и пази Неговите заповеди.","Яж и пий, защото така или иначе ще умреш.","Събери колкото можеш повече мъдрост и имот."]}]}},{"n":22,"slug":"pesen-na-pesnite","abbr":"Песн","cap":8,"s":"uchitelni","bg":{"nume":"Песен на песните","scurt":"Най-красивата песен за любовта в Писанието: младоженецът и невестата, Бог и душата, която Го търси.","verset":{"t":"„Моят възлюбен принадлежи на мене, аз пък – нему.“","r":"Песен на песните 2:16"},"incepe":"Песен на песните 1–2 · 5 · 8","p":{"autor":"\u003cp>Според Преданието на Църквата книгата е на цар Соломон, сина на Давид, от десети век пр. Хр.; още заглавието ѝ в Синодалното издание казва: „Песен на песните, от Соломона“. Заглавието значи „най-хубавата от песните“, както „Светая Светих“ значи най-светото място. Кратка книга е, от осем глави, написана като поема, в която говорят един след друг младоженецът, невестата и един хор — „дъщерите иерусалимски“.\u003c/p>","context":"\u003cp>Книгата се е родила в мирното време на Соломон и е пълна с пейзажите на Светата земя: цъфнали лозя, кринове, стада, кедрите ливански, пролетта, която идва след дъждовете. Тя не разказва за войни и не дава заповеди; тя пее любовта между един младоженец и неговата невеста. Народът на Израил от самото начало я разбира като песен за любовта между Бога и Неговия народ, защото и пророците — Осия, Исаия, Иеремия, Иезекиил — говорят за завета, тоест за връзката на Бога с народа, като за брак. Старите църковни писатели напомнят, че евреите са я давали да се чете само на зрели хора. В Писанието тя идва след Еклисиаст: след като сърцето се откъсне от суетата, то може да се научи на любов.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Любовта между младоженеца и невестата\u003c/strong> — Чистата любов между мъж и жена е Божий дар и образ на една по-голяма любов.\u003c/li>\u003cli>\u003cstrong>Търсенето\u003c/strong> — Невестата губи възлюбения си, търси го нощем из града и не се успокоява, докато не го намери (глави 3 и 5).\u003c/li>\u003cli>\u003cstrong>Красотата\u003c/strong> — Младоженецът вижда невестата цяла хубава и без недостатък: „Цяла си хубава, моя мила, и петно няма на тебе!“ (Песен на песните 4:7); така Бог вижда душата, очистена от Неговата благодат.\u003c/li>\u003cli>\u003cstrong>Любовта, силна като смъртта\u003c/strong> — „Любовта е силна като смърт“: големи води не могат да я угасят и цялото богатство на дома не може да я купи (Песен на песните 8:6-7).\u003c/li>\u003cli>\u003cstrong>Градината\u003c/strong> — Раят, изгубен в Битие, се отваря отново там, където човекът обича Бога.\u003c/li>\u003c/ul>","hristos":"\u003cp>Православният ключ към книгата е този: Младоженецът е Христос, а невестата е Църквата и в нея — всяка душа. Св. Иоан Предтеча го казва ясно: „Който има невеста, младоженец е“ (Иоан 3:29), а Спасителят нарича Себе Си Младоженец (Матей 9:15). Апостол Павел показва, че Христос възлюби Църквата и предаде Себе Си за нея, и нарича това „тайна велика“ (Ефесяни 5:25-32). Писанието завършва със сватбата на Агнеца (Откровение 19:7). Възлюбеният, който чука нощем на вратата (Песен на песните 5:2), се чува отново в думите на Господа: „Ето, стоя пред вратата и хлопам“ (Откровение 3:20). А любовта, „силна като смърт“, показа цялата си мяра на Кръста, където Младоженецът даде живота Си за Своята невеста.\u003c/p>","parinti":"\u003cp>Св. Григорий Нисийски тълкува книгата в поредица беседи. Той я чете като изкачване на душата към Бога: колкото повече невестата намира Младоженеца, толкова повече Го желае, защото Бог е безкраен и копнежът по Него никога не свършва. Преди него Ориген, църковен писател, показва, че Младоженецът е Христос, а невестата — Църквата и душата. Блажени Теодорит Кирски също защитава духовния смисъл на книгата. Отците искат тя да се чете с чисто сърце, след Притчите и Еклисиаст; ако нещо те смущава, попитай своя духовен отец.\u003c/p>","slujbe":"\u003cp>Песен на песните не се чете като четиво на богослуженията. Чуваш я обаче в песнопенията на Църквата. Богородица се възпява с образи, взети оттук: „затворена градина“ и „запечатан извор“ (Песен на песните 4:12), всехубавата и непорочната. През Страстната седмица, на утрените, които се служат вечерта на Цветница и в Страстния понеделник и вторник, Църквата възпява Христос като Младоженец: „Се, Жених грядет в полунощи“ (Ето, Младоженецът идва в полунощ) и „Чертог Твой вижду, Спасе мой, украшенный“ (Виждам Твоя украсен чертог, Спасителю мой).\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, Младоженец на нашите души, Ти ни възлюби с любов, по-силна от смъртта. Когато Те губим поради нашата леност, не ни оставяй без Тебе; направи ни да Те търсим, докато Те намерим. Очисти сърцето ни, за да бъде Твое, и облечи душата ни в сватбена дреха за Твоя чертог. Амин.\u003c/p>"},"q":[{"q":"Кои са Младоженецът и невестата според тълкуванието на Църквата?","o":["Младоженецът е Христос, а невестата е Църквата и всяка душа.","Двама царе на древния Израил.","Един ангел и един пророк."]},{"q":"Къде чуваш отзвука на Песен на песните през Страстната седмица?","o":["На утрените на Младоженеца, когато се пее „Се, Жених грядет в полунощи“.","В четивата на Велика събота.","В Псалом 50, който се чете на утренята."]}]}},{"n":23,"slug":"isaia","abbr":"Ис","cap":66,"s":"golemi-prorotsi","bg":{"nume":"Исаия","scurt":"Пророкът, който видя Господа на престола и предвести седем века по-рано Девата, Младенеца и Кръста.","verset":{"t":"„Ето, Девицата ще зачене и ще роди Син, и ще Му нарекат името Емануил.“","r":"Исаия 7:14"},"incepe":"Исаия 6 · 9 · 11 · 53","p":{"autor":"\u003cp>Исаия, син на Амос (друг, не пророк Амос), е живял в Иерусалим през осми век пр. Хр. и е пророкувал в дните на царете Озия, Иоатам, Ахаз и Езекия. Бил е образован човек, близък до царския двор. Според Преданието на Църквата цялата книга, с нейните 66 глави, е негова, а пророкът е загинал мъченически, прерязан с трион, по времето на цар Манасия. Името му значи „Господ спасява“.\u003c/p>","context":"\u003cp>След Соломон царството се раздели на две: Израил на север и Иудея на юг, с Иерусалим. По времето на Исаия се издига Асирия, голямата сила на тогавашния свят. През 722 г. пада Самария и северното царство изчезва; по-късно войската на Сенахирим обсажда Иерусалим, и градът е спасен чудесно след молитвата на цар Езекия (Исаия 36–37). Пророкът изобличава един народ, който пази богослужението, но тъпче справедливостта. После погледът му отива по-далеч: вижда вавилонския плен, който щеше да дойде повече от век по-късно, и завръщането от него. От 40-а глава книгата става утеха: „Утешавайте, утешавайте Моя народ“ (Исаия 40:1).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Светостта на Бога\u003c/strong> — Серафимите викат „свет, свет, свет“, а човекът вижда своята нечистота и бива очистен (глава 6).\u003c/li>\u003cli>\u003cstrong>Вярата, а не съюзите\u003c/strong> — Иудея е призвана да се опре на Господа, а не на Египет или на Асирия.\u003c/li>\u003cli>\u003cstrong>Остатъкът\u003c/strong> — Колкото и тежък да е съдът, Бог пази един верен остатък, от който покълва спасението.\u003c/li>\u003cli>\u003cstrong>Месията\u003c/strong> — Емануил, Младенецът, Клонът от корена на Иесей, страдащият Раб Господен.\u003c/li>\u003cli>\u003cstrong>Утехата\u003c/strong> — Прошка за народа, светлина за всички народи, ново небе и нова земя.\u003c/li>\u003c/ul>","hristos":"\u003cp>Никоя книга на Стария Завет не говори толкова ясно за Христос. Исаия предвещава раждането от Дева (7:14), което Евангелието показва изпълнено в Пресвета Богородица (Матей 1:22-23). Той вижда Младенеца, Който е „Бог крепък“ и „Княз на мира“ (9:6), и Клона от корена на Иесей, върху Когото почива Духът Господен (11:1-2). Чува „гласа на викащия в пустинята“ (40:3), тоест св. Иоан Предтеча. В 53-а глава той стои, би казал човек, в подножието на Кръста: Рабът Господен „взе върху Си нашите немощи и понесе нашите недъзи“ (53:4), Той понася нашите грехове и „чрез Неговите рани ние се изцелихме“ (53:5). В синагогата в Назарет Спасителят чете от Исаия 61 и казва, че това Писание се е изпълнило (Лука 4:16-21). А от Исаия 53 тръгва апостол Филип, когато кръщава етиопския скопец (Деяния 8:26-38).\u003c/p>","parinti":"\u003cp>Блажени Иероним казва, че Исаия би трябвало да се нарича по-скоро евангелист, отколкото пророк, толкова ясно е описал тайните на Христос и на Църквата; затова и до днес мнозина го наричат „старозаветния евангелист“. Св. Иоан Златоуст тълкува видението от 6-а глава и показва с какъв трепет стоят серафимите пред Бога, за да се научим и ние как да стоим в храма. Св. Кирил Александрийски, който тълкува цялата книга, вижда в горящия въглен, който докосва устните на пророка, образ на Христос, Който ни очиства от греховете.\u003c/p>","slujbe":"\u003cp>Исаия го чуваш по-често от всеки друг пророк. През Великия пост се чете всеки ден на Шестия час; неговите четива предвещават Рождество Христово и Богоявление. На Великото повечерие се пее „С нами Бог“ — „С нас е Бог“ (Исаия 8–9). Петата песен на канона на утренята е от Исаия 26. На всяка Божествена литургия пееш заедно със серафимите „Свет, свет, свет е Господ Саваот“, а в тайнството Венчание се пее „Исаие, ликуй“ — „Исаия, ликувай“. Светия пророк Исаия се почита на 9 май.\u003c/p>","rugaciune":"\u003cp>Свети Господи, Когото серафимите възпяват непрестанно, а ние сме хора с нечисти устни. Докосни ни с въглена на Твоето божество и заличи беззаконията ни. Ти, Който понесе нашите болки и чрез Чиито рани се изцелихме, утеши Твоя народ и ни направи да ходим в Твоята светлина. Амин.\u003c/p>"},"q":[{"q":"Какво предвещава Исаия в 7-а глава, 14-и стих?","o":["Че Девата ще роди Син, Който ще се нарече Емануил.","Че Иерусалимският храм ще бъде съграден отново.","Че Моисей ще получи Закона на планината Синай."]},{"q":"Кого открива 53-а глава със страдащия Раб Господен?","o":["Христос, Който понесе нашите грехове на Кръста.","Цар Езекия, който беше спасен от асирийците.","Самия пророк Исаия в младостта му."]}]}},{"n":24,"slug":"ieremia","abbr":"Иер","cap":52,"s":"golemi-prorotsi","bg":{"nume":"Иеремия","scurt":"Пророкът, който оплака падането на Иерусалим и предвести нов завет, написан от Бога в сърцата.","verset":{"t":"„Ето, настъпват дни, казва Господ, и ще сключа с дома Израилев и с дома Иудин нов завет.“","r":"Иеремия 31:31"},"incepe":"Иеремия 1 · 7 · 18 · 31","p":{"autor":"\u003cp>Иеремия, син на Хелкия, е от свещенически род от Анатот, село близо до Иерусалим. Бог го призова млад, в тринадесетата година на цар Иосия (около 627 г. пр. Хр.), и той пророкува повече от четиридесет години, чак до след падането на Иерусалим. Думите му записва неговият ученик Варух. Според Преданието на Църквата бил отведен насила в Египет и там умрял, убит с камъни от сънародниците си. Една практическа бележка: в Синодалното издание главите на Иеремия следват реда на еврейския текст, както в повечето съвременни Библии; в древния гръцки превод на Седемдесетте след 25-а глава редът е друг. Затова, ако четеш тълкувание на Отците, може да срещнеш новия завет като 38-а глава — у тебе той е в 31-ва.\u003c/p>","context":"\u003cp>Северното царство отдавна беше паднало; беше останала само Иудея, с Иерусалим и храма. Цар Иосия се опита да очисти вярата, но наследниците му се върнаха към идолите и неправдата. Междувременно се издигаше Вавилон на Навуходоносор. Иеремия казваше нещо, което никой не искаше да чуе: храмът няма да ви опази, ако не промените живота си (глава 7). Смятаха го за предател: биха го, сложиха го в клада — дървени окови, хвърлиха го в яма с тиня, а цар Иоаким изгори свитъка с пророчествата му. През 586 г. градът падна, храмът изгоря и народът беше отведен в плен. Но пророкът беше предрекъл и края на плена, след седемдесет години. Следват Плачът Иеремиев, а после Иезекиил и Даниил, пророците на плена.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Призванието\u003c/strong> — Бог познава пророка преди раждането му и влага в устата му Своите думи (1:5-9).\u003c/li>\u003cli>\u003cstrong>Истинското покаяние\u003c/strong> — Не стените на храма те пазят, а сърцето, което се връща при Бога.\u003c/li>\u003cli>\u003cstrong>Грънчарят и глината\u003c/strong> — Както грънчарят преправя развалилия се съд, така Бог може да пресъздаде един народ и един човек (18:1-6).\u003c/li>\u003cli>\u003cstrong>Болката на пророка\u003c/strong> — Иеремия плаче за своя народ и излива пред Бога цялата си горчивина.\u003c/li>\u003cli>\u003cstrong>Новият завет\u003c/strong> — Законът, написан в сърцата, и греховете, простени (31:31-34).\u003c/li>\u003c/ul>","hristos":"\u003cp>Пророчеството за новия завет се изпълнява на Тайната вечеря, когато Спасителят казва: „тая чаша е новият завет с Моята кръв“ (Лука 22:20); Посланието до евреите го привежда цялото (Евреи 8:8-12). Иеремия предвещава и праведната Младочка на Давид, Царя, Чието име значи „Господ – наше оправдание“ (23:5-6). Плачът на Рахил (31:15) отеква отново при избиването на младенците във Витлеем (Матей 2:17-18). Но и самият живот на пророка е пророчество: отхвърлен от своите, воден „като кротко агне, водено на клане“ (11:19), плачещ над Иерусалим, както ще заплаче Господ (Лука 19:41). Не е случайно, че някои иудеи мислеха, че Иисус е Иеремия (Матей 16:14).\u003c/p>","parinti":"\u003cp>Ориген, църковен писател, е оставил поредица беседи върху Иеремия, в които показва, че Бог „изкоренява и разорява“ в душата само за да може да „съзидава и насажда“ (Иеремия 1:10). Блажени Иероним и блажени Теодорит Кирски тълкуват книгата и виждат в гоненията срещу пророка образ на Страданията Христови: агнето, водено на клане, е Спасителят, предаден от своите. Отците ценят у Иеремия и неговото пастирско сърце: той изобличава строго, но плаче за онези, които изобличава.\u003c/p>","slujbe":"\u003cp>Иеремия го чуваш най-вече през Страстната седмица. Четивото за кроткото агне, водено на клане (Иеремия 11–12), се чете на Велики четвъртък, на Първия час, и на Велики петък, на Царските часове. Сред петнадесетте старозаветни четива на Велика събота е и пророчеството за новия завет (Иеремия 31:31-34). Светия пророк Иеремия се почита на 1 май.\u003c/p>","rugaciune":"\u003cp>Господи, Ти си Грънчарят, а ние сме глината в Твоята ръка. Не ни отхвърляй, когато се развалим, а ни пресъздай по Своята воля. Напиши Твоя закон в сърцата ни, прости беззаконията ни и не помни вече греховете ни. Дай ни сълзи за самите нас и за целия Твой народ. Амин.\u003c/p>"},"q":[{"q":"Какво обещава Бог в Иеремия 31:31-34 (38:31-34 в гръцкия текст на Седемдесетте)?","o":["Нов завет, със закона, написан в сърцата, и с простени грехове.","Храм, по-голям от Соломоновия.","Победата на Иудея над Вавилон."]},{"q":"Какво казваше Иеремия на онези, които се уповаваха на храма?","o":["Че храмът няма да ги опази, ако не променят живота си.","Че храмът никога няма да бъде разрушен.","Че трябва да принасят повече жертви."]}]}},{"n":25,"slug":"plach-ieremiev","abbr":"Плач","cap":5,"s":"golemi-prorotsi","bg":{"nume":"Плач Иеремиев","scurt":"Пет скръбни песни над разрушения Иерусалим, сред които изгрява надеждата в Божията милост.","verset":{"t":"„Обърни ни към Тебе, Господи, и ще се обърнем; обнови нашите дни, както в старо време.“","r":"Плач Иеремиев 5:21"},"incepe":"Плач Иеремиев 1 · 3 · 5","p":{"autor":"\u003cp>Преданието на Църквата смята за автор светия пророк Иеремия. В гръцкия превод на Седемдесетте, древния превод на Стария Завет, който Църквата използва от самото начало, книгата започва с кратка бележка: след като Израил бил отведен в плен и Иерусалим опустял, Иеремия седнал да плаче и оплакал града с този плач. Книгата е написана малко след 586 г. пр. Хр. Има пет глави — пет скръбни песни, съставени с голямо старание.\u003c/p>","context":"\u003cp>През 586 г., след дълга обсада и страшен глад, войската на Навуходоносор влиза в Иерусалим. Храмът, построен от Соломон, е изгорен, стените са съборени, цар Седекия е ослепен и отведен в окови, а народът поема по пътя към Вавилон. За един израилтянин това не е просто поражение: храмът е мястото, където Бог живее сред народа Си. Въпросът, който гори в книгата, е: нима Господ ни е изоставил завинаги? Книгата не хвърля вината върху Вавилон; тя изповядва, че Господ е праведен и че народът е съгрешил. Следват седемдесет години плен, а после завръщането, за което разказват книгите на Ездра и Неемия.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Болката, изречена пред Бога\u003c/strong> — Болката не се крие и не се подслажда; тя се излива цялата в молитва.\u003c/li>\u003cli>\u003cstrong>Грехът има последствия\u003c/strong> — Градът падна, защото се отдалечи от Господа, и книгата го признава без заобикалки.\u003c/li>\u003cli>\u003cstrong>Милостта, която се обновява\u003c/strong> — Точно в средата на книгата изгрява надеждата: милосърдието на Господа не е пресекнало и се обновява всяка сутрин (3:22-23).\u003c/li>\u003cli>\u003cstrong>Очакването в тишина\u003c/strong> — Добре е човек търпеливо и тихо да очаква спасение от Господа (3:26).\u003c/li>\u003cli>\u003cstrong>Молитвата за обръщане\u003c/strong> — Книгата завършва с прошението: „Обърни ни към Тебе, Господи, и ще се обърнем; обнови нашите дни“ (5:21).\u003c/li>\u003c/ul>","hristos":"\u003cp>Иерусалим, който плаче самотен край пътя, пита минаващите дали има болка като неговата: „погледнете и вижте, има ли болка като моята болка“ (1:12). Църквата чува тук гласа на Христос на Кръста и плача на Богородица до Него. Човекът на страданията от трета глава, който подлага страната си на онзи, който го бие (3:30), предвещава Спасителя, когото удряха по лицето в нощта на Страданията (Матей 26:67). Стихът за помазаника Господен, уловен от враговете (4:20), първите християни го четяха на гръцки, където стои думата „Христос“ — Помазаник, и го разбраха като пророчество за Страданията. И Господ заплака над Иерусалим (Лука 19:41-44). Но милостта не е пресекнала: след Велики петък идва утрото на Възкресението.\u003c/p>","parinti":"\u003cp>Св. Иустин Философ и св. Ириней Лионски привеждат стиха от Плач Иеремиев 4:20 като свидетелство за Христос и за Неговите страдания. Блажени Теодорит Кирски тълкува книгата заедно с пророчеството на Иеремия и показва, че пророкът не оплаква просто някакви стени, а народ, който е изгубил Бога. Отците четат Плача и като плач на душата: всеки човек е свят град, който грехът опустошава, а покаянието отново изгражда.\u003c/p>","slujbe":"\u003cp>Плачът на Иеремия не се чете като четиво в православните богослужения. Не го бъркай с Похвалите (Непорочните), които се пеят на Велики петък вечерта, на утренята на Велика събота, и започват с думите „Жизнь во гробе положился еси, Христе“: те са песнопение на Църквата, което се пее заедно с Псалом 118, а не книга от Писанието. Духът обаче е същият: дълбок плач, озарен от надежда. Книгата е много подходящо четиво за Великия пост и за Страстната седмица.\u003c/p>","rugaciune":"\u003cp>Господи, Ти си праведен, а ние съгрешихме и сами опустошихме душата си. Не ни отхвърляй докрай, защото милосърдието Ти не е пресекнало и се обновява всяка сутрин. Обърни ни към Тебе, и ще се обърнем; обнови дните ни и ни научи тихо да очакваме Твоята помощ. Амин.\u003c/p>"},"q":[{"q":"Какво събитие оплаква книгата?","o":["Разрушаването на Иерусалим и на храма от вавилонците през 586 г.","Излизането на народа от Египет.","Смъртта на цар Давид."]},{"q":"Каква надежда изгрява в средата на книгата, в трета глава?","o":["Че милосърдието на Господа не е пресекнало и се обновява всяка сутрин.","Че Вавилон ще бъде завладян още същата година.","Че храмът всъщност не е изгорял."]}]}},{"n":26,"slug":"iezekiil","abbr":"Иез","cap":48,"s":"golemi-prorotsi","bg":{"nume":"Иезекиил","scurt":"Пророкът на плена: вижда славата Господня далеч от храма и възвестява ново сърце, добър Пастир и кости, които оживяват.","verset":{"t":"„Ще ви дам ново сърце и нов дух ще ви дам“","r":"Иезекиил 36:26"},"incepe":"Иезекиил 1–3 · 34 · 36–37","p":{"autor":"\u003cp>Иезекиил, син на Вузия, бил свещеник в Иерусалим. През 597 г. пр. Хр. бил отведен в плен във Вавилон заедно с цар Иехония и първенците на народа. Там, край река Ховар, в петата година на плена, Бог го призовал за пророк чрез едно потресаващо видение. Пророкувал сред пленниците повече от двадесет години. Името му означава „Бог укрепява“. Книгата има 48 глави.\u003c/p>","context":"\u003cp>Вавилонците превземат Иерусалим два пъти: през 597 г. отвеждат в плен част от народа, а през 586 г. разрушават града и храма. Иезекиил е от първата вълна. Онези, които са отведени с него, се надяват бързо да се върнат по домовете си; пророкът им казва с думи и с необичайни символични действия, че Иерусалим ще падне заради греховете си (глави 1–24). Той вижда как славата Господня напуска храма. Когато вестта за превземането стига до Вавилон, тонът се променя: оттук нататък пророкът утешава и възвестява завръщане, нов пастир, ново сърце и нов храм (глави 33–48). По същото време Иеремия пророкува в Иерусалим, а Даниил — в двора на Вавилон.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Славата Господня\u003c/strong> — Бог не е вързан за едно място: Той се явява и в земята на плена, върху колесницата, носена от херувимите.\u003c/li>\u003cli>\u003cstrong>Отговорността на всеки\u003c/strong> — Всеки отговаря за собствения си грях, и Бог не иска смъртта на грешника, а да се обърне и да бъде жив (18:23).\u003c/li>\u003cli>\u003cstrong>Стражът\u003c/strong> — Пророкът е поставен страж над народа и е длъжен да предупреждава онзи, който греши (3:17).\u003c/li>\u003cli>\u003cstrong>Новото сърце\u003c/strong> — Сам Бог изважда каменното сърце, дава сърце от плът и влага в човека Своя Дух (36:26-27).\u003c/li>\u003cli>\u003cstrong>Възкресението\u003c/strong> — Сухите кости в полето се обличат с плът и получават дихание на живот (37:1-14).\u003c/li>\u003c/ul>","hristos":"\u003cp>Чрез Иезекиил Бог обещава, че Сам ще издири изгубените овци и ще им даде един пастир (34:11-23); а Спасителят казва: „Аз съм добрият пастир“ (Иоан 10:11). Чистата вода, новото сърце и Духът, вложен в човека (36:25-27), предвещават Кръщението и Петдесетница. Видението на сухите кости (глава 37) сочи към Възкресението Христово и към общото възкресение на мъртвите. Източната порта, която остава затворена, защото Господ е влязъл през нея (44:1-2), е за Църквата образ на Пресвета Богородица, Приснодева. Реката, която извира от храма и съживява всичко, до което се докосне (глава 47), намира изпълнението си в думите на Господа за „реки от жива вода“ (Иоан 7:37-38). А името „сине човешки“, с което Бог нарича пророка, ще носи Сам Христос.\u003c/p>","parinti":"\u003cp>Св. Ириней Лионски вижда в четирите живи същества, които носят Божия престол — с лице на човек, на лъв, на телец и на орел, — образ на четирите Евангелия, чрез които Христос „бива носен“ по целия свят. Св. Григорий Двоеслов, епископ Римски, произнесъл беседи върху Иезекиил в трудни за града си дни и утешавал народа с тези видения. Блажени Иероним и блажени Теодорит Кирски тълкували книгата; Иероним, както и много други Отци, чете затворената порта като свидетелство за девството на Богородица.\u003c/p>","slujbe":"\u003cp>През Страстната седмица — в понеделник, вторник и сряда — на шестия час се чете откъс от Иезекиил. На утренята на Велика събота, която се служи на Велики петък вечерта, след шествието с Плащаницата около храма, се чете видението на сухите кости (Иезекиил 37:1-14). На вечернята в навечерието на Петдесетница чуваш обещанието за новото сърце (Иезекиил 36), а на Богородичните празници — четивото за затворената порта (Иезекиил 43–44). Светият пророк Иезекиил се почита на 21 юли.\u003c/p>","rugaciune":"\u003cp>Господи, добри Пастирю, потърси и нас, Твоите заблудени овци, и ни върни у дома. Извади от нас каменното сърце и ни дай ново сърце и Твоя Свети Дух. Вдъхни живот в нашите сухи кости, за да живеем пред Тебе, и ни удостой да видим славата Ти. Амин.\u003c/p>"},"q":[{"q":"Какво обещава Бог в Иезекиил 36:26?","o":["Че ще извади каменното сърце и ще даде ново сърце и нов дух","Че ще върне пленниците в родината още същата година","Че храмът в Иерусалим няма да бъде разрушен"]},{"q":"Кого вижда Църквата в затворената източна порта (Иезекиил 44)?","o":["Пресвета Богородица, Приснодева","Цар Навуходоносор","Пророк Иеремия"]}]}},{"n":27,"slug":"daniil","abbr":"Дан","cap":14,"s":"golemi-prorotsi","bg":{"nume":"Даниил","scurt":"Един верен младеж във вавилонския двор: огнената пещ, лъвовата яма и видението на Сина Човечески върху облаците.","verset":{"t":"„владичеството Му е владичество вечно, което няма да премине, и царството Му не ще се разруши“","r":"Даниил 7:14"},"incepe":"Даниил 1–3 · 6 · 7 · после историята на Сусана (глава 13)","p":{"autor":"\u003cp>Даниил бил младеж от знатен иудейски род, отведен във Вавилон през 605 г. пр. Хр. и възпитан в двора на цар Навуходоносор. Там служил като съветник на вавилонските царе, а после и на персийските, чак до дните на Кир. Според Преданието на Църквата той сам написал книгата през шести век пр. Хр. Първите шест глави са разкази, последните шест — видения. Библията, Синодално издание, следва тук гръцкия текст на Седемдесетте и има книгата на Даниил по-пълна от еврейския текст: в трета глава са молитвата на Азария и Песента на тримата младежи, а към същата книга принадлежат историята на Сусана (глава 13) и историята за Вил и змея (глава 14). Затова ги виждаме всички заедно в този корен; в протестантските Библии тези части липсват.\u003c/p>","context":"\u003cp>Намираме се във вавилонския плен. Народът е изгубил земята си, царя си и храма, а най-даровитите младежи се възпитават в двора, за да станат вавилонци: получават нови имена, нова храна, нови богове. Даниил и приятелите му Анания, Азария и Мисаил изучават езика и мъдростта на Вавилон, но не се отричат от Бога. Тримата са хвърлени в пещта, защото не се покланят на златния истукан; сред огъня Азария се моли, Ангел Господен прави пламъка като прохладна роса, и тримата с едни уста възпяват Бога. Даниил, още съвсем млад, спасява Сусана от двама лъжливи старци; вече възрастен, разобличава измамата на жреците на идола Вил и е хвърлен в лъвовата яма, защото не изоставя молитвата си. Междувременно Вавилон пада, през 539 г., и идват персите. Виденията показват царства, които се издигат и рухват едно след друго. След плена ще дойде завръщането, за което разказва книгата на Ездра.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Вярност в чужда земя\u003c/strong> — Можеш да живееш и да работиш сред невярващи, без да продадеш душата си.\u003c/li>\u003cli>\u003cstrong>Бог управлява историята\u003c/strong> — Царствата се сменят като годишните времена; остава само Божието царство.\u003c/li>\u003cli>\u003cstrong>Молитвата\u003c/strong> — Даниил се моли три пъти на ден, обърнат към Иерусалим, и изповядва греховете си заедно с греховете на народа (глава 9); същото прави Азария сред огъня: Ти си праведен, казва той на Бога, а ние съгрешихме.\u003c/li>\u003cli>\u003cstrong>Дързостта на изповедта\u003c/strong> — Тримата младежи не се покланят на истукана, дори Бог да не ги избави (3:17-18); Даниил доказва с малко пепел, че Вил не яде нищо.\u003c/li>\u003cli>\u003cstrong>Бог вижда скритото\u003c/strong> — Сусана предпочита да бъде осъдена невинна, отколкото да съгреши пред Господа, и Той изважда истината на бял свят.\u003c/li>\u003cli>\u003cstrong>Възкресението\u003c/strong> — Мнозина от спящите в земния прах ще се събудят — едни за вечен живот (12:2).\u003c/li>\u003c/ul>","hristos":"\u003cp>В съня на Навуходоносор един камък се откъсва от планината без човешка ръка, разбива всички царства и изпълва цялата земя (2:34-35): това е Христос, роден от Девата без мъжко участие. В пещта до тримата младежи ходи и четвърти, чийто вид е „подобен на сина Божий“ (3:92); Отците виждат тук Сина Божий, Който слиза при Своите сред огъня. А пещта, която приема младежите, без да ги изгори, е образ на Богородица, Която носи в утробата Си огъня на Божеството и не изгаря. Във видението от седма глава Синът Човечески идва върху небесните облаци и получава вечна власт (7:13-14); със същите думи Спасителят отговаря на първосвещеника в нощта на Страданията (Матей 26:64). Сусана, осъдена от старейшини с лъжливи показания, които не се съгласуват помежду си, предизобразява Христос пред синедриона (Матей 26:59-60). А Даниил, който излиза жив от запечатаната яма, докато пророк Авакум му носи храна с помощта на Ангел, предвещава Възкресението.\u003c/p>","parinti":"\u003cp>Св. Иполит Римски написал тълкувание на Даниил — едно от най-древните запазени християнски тълкувания на книга от Писанието; с него той укрепявал гонените християни на своето време. Там вижда в Сусана образ на Църквата, а в двамата старци — гонителите, които я дебнат. Блажени Иероним показва, че камъкът, откъснат от планината без ръка, е Христос, роден от Девата. Св. Иоан Златоуст често дава за пример тримата младежи: те били пленници, далеч от храма и без свещеници, и въпреки това останали верни; значи никой не може да се оправдава с обстоятелствата на живота си. Св. Роман Сладкопевец им посветил кондак.\u003c/p>","slujbe":"\u003cp>Молитвата и песента на тримата младежи са основата на седмата и осмата песен от канона на утренята: затова толкова често чуваш „Благословен еси, Господи, Боже отец наших“ — в Синодалното издание „благословен си, Господи, Боже на отците ни“ (3:26) — и призива „Всички дела Господни, благословете Господа, пейте и Го прославяйте вовеки“ (3:57). На Велика събота сутринта, на вечернята с Литургията на св. Василий Велики, последното от петнадесетте четива е Даниил 3 с тази песен. Даниил и тримата младежи се почитат в Неделята на светите праотци и в Неделята пред Рождество Христово, а празникът им е на 17 декември. Историите за Сусана и за Вил не се четат в богослуженията; светият пророк Авакум, който носи храна на Даниил, се почита на 2 декември.\u003c/p>","rugaciune":"\u003cp>Господи, Боже на отците ни, Ти, Който превърна пещта в роса и затвори устата на лъвовете, бъди с нас в изпитанията. Дай ни верността на Даниил, дързостта на тримата младежи и чистотата на Сусана, за да не се поклоним на никой идол на нашето време. Твое е царството, което няма да премине; удостой ни да го видим. Амин.\u003c/p>"},"q":[{"q":"Защо тримата младежи били хвърлени в огнената пещ?","o":["Защото не се поклонили на златния истукан на царя","Защото се опитали да избягат от Вавилон","Защото изтълкували погрешно съня на царя"]},{"q":"Какво получава Синът Човечески във видението от седма глава?","o":["Вечна власт и царство, което няма да се разруши","Ключовете на град Вавилон","Скрижалите на Закона от планината Синай"]},{"q":"Как Даниил доказал, че двамата старци лъжесвидетелстват против Сусана?","o":["Разпитал ги поотделно, и отговорите им не съвпаднали","Довел други свидетели от града","Хвърлил жребий пред народа"]}]}},{"n":28,"slug":"osia","abbr":"Ос","cap":14,"s":"malki-prorotsi","bg":{"nume":"Осия","scurt":"Пророкът, чийто наранен брак става образ на Божията любов, която не изоставя неверния Си народ.","verset":{"t":"„Защото Аз искам милост, а не жертва, и богопознание повече, нежели всесъжения.“","r":"Осия 6:6"},"incepe":"Осия 1–3 · 6 · 11 · 14","p":{"autor":"\u003cp>Осия, син Беериев, пророкувал в северното царство, Израил, наричано още Ефрем, през втората половина на осмия век пр. Хр.: от дните на цар Иеровоам Втори до малко преди падането на Самария. Книгата му, с четиринадесет глави, е първата от книгите на дванадесетте малки пророци. Те се наричат „малки“ не защото са по-маловажни, а защото текстовете им са кратки. Името му означава „спасение“.\u003c/p>","context":"\u003cp>При Иеровоам Втори северното царство преживява последните години на своето благоденствие. Но народът се покланя на Ваал и на златните телци във Ветил и в Дан, а правдата се тъпче. След смъртта на царя идват смутни години, с царе, убивани един след друг, докато Асирия наближава. През 722 г. Самария ще падне. В този час Бог иска от Осия нещо тежко: да вземе за жена невярна жена — Гомер. Децата им получават имена, които сами по себе си са пророчества, а когато жената го напуска, пророкът я откупува и я връща у дома. Така животът му става проповед. По същото време пророкуват Амос в Израил и Исаия и Михей в Иудея.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Заветът като брак\u003c/strong> — Бог е верният Жених, а народът — невестата, която Той обича.\u003c/li>\u003cli>\u003cstrong>Идолопоклонството като изневяра\u003c/strong> — Да тичаш след идолите означава да мамиш своя Жених, а не просто да нарушиш едно правило.\u003c/li>\u003cli>\u003cstrong>Богопознанието\u003c/strong> — Народът гине, защото му липсва знание (4:6): вече не познава Онзи, Който го е извел от Египет.\u003c/li>\u003cli>\u003cstrong>Милост, а не жертва\u003c/strong> — Богослужение без сърце и без милост не е угодно на Бога.\u003c/li>\u003cli>\u003cstrong>Любовта, която не се отказва\u003c/strong> — Като баща, който е учил детето си да ходи, Бог не може да изостави Своя народ (глава 11).\u003c/li>\u003c/ul>","hristos":"\u003cp>Спасителят два пъти привежда думите на Осия: „милост искам, а не жертва“ (Матей 9:13; 12:7). Словото „от Египет извиках Сина Си“ (Осия 11:1) се изпълнява, когато Божественият Младенец се връща от Египет (Матей 2:15). Обещанието, че Господ ще ни издигне в третия ден (Осия 6:2), предвещава Възкресението. Победният вик над смъртта и ада: „Де ти е, смърте, жилото? Де ти е, аде, победата?“ (Осия 13:14) апостол Павел повтаря, когато говори за възкресението (1 Коринтяни 15:55). Онези, които се наричали „не-Мой-народ“ и стават „Мой народ“ (Осия 2:23), са за апостолите езичниците, призвани в Църквата (Римляни 9:25-26; 1 Петър 2:10). А пророкът, който откупува жена си, е образ на Христос, Който откупи Църквата, Своята невеста, със Своята кръв.\u003c/p>","parinti":"\u003cp>Св. Кирил Александрийски тълкувал всичките дванадесет малки пророци. При Осия той показва, че заповедта, която пророкът получил, не е позор, а образ на Божието снизхождение: както Осия взема при себе си една паднала жена, така Христос приема върху Себе Си нашата наранена природа, за да я очисти. Блажени Теодорит Кирски и блажени Иероним също тълкували книгата. А св. Иоан Златоуст в Огласителното слово, което се чете в пасхалната нощ, възкликва с думите на пророка и на апостола: „Де ти е, смърте, жилото? Де ти е, аде, победата?“\u003c/p>","slujbe":"\u003cp>Осия обикновено не се чете като четиво в богослуженията. Но го чуваш чрез Евангелието всеки път, когато Спасителят казва „милост искам, а не жертва“, и в пасхалната нощ, в Огласителното слово на св. Иоан Златоуст. Ехото на пророчеството за третия ден звучи и в Символа на вярата: „и възкръсна в третия ден, според Писанията“. Светият пророк Осия се почита на 17 октомври.\u003c/p>","rugaciune":"\u003cp>Господи, верни Жениху на нашите души, много пъти Те изоставяхме и тичахме след своите идоли. Не се гневи на нас докрай, а ни върни при Себе Си и говори на сърцето ни. Научи ни на милостта, която желаеш, и ни дай истински да Те познаем. Изцели нашата невярност и ни възлюби даром. Амин.\u003c/p>"},"q":[{"q":"Какво показва бракът на Осия с Гомер?","o":["Верната Божия любов към нев
