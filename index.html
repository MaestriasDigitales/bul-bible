ерния Му народ","Че на пророците не било позволено да се женят","Победата на Израил над Асирия"]},{"q":"Кои думи на Осия привежда Спасителят в Евангелието?","o":["„Милост искам, а не жертва“","„Суета на суетите, всичко е суета“","„Господ е Пастир мой, от нищо не ще се нуждая“"]}]}},{"n":29,"slug":"amos","abbr":"Ам","cap":9,"s":"malki-prorotsi","bg":{"nume":"Амос","scurt":"Един пастир от Текоя е пратен да вика на преситените: Бог не приема богослужение от онези, които тъпчат бедните.","verset":{"t":"„потърсете Ме — и ще бъдете живи“","r":"Амос 5:4"},"incepe":"Амос 1–2 · 5 · 7–9","p":{"autor":"\u003cp>Амос бил пастир и берач на диви смокини от Текоя, село в Иудея на юг от Витлеем. Не бил пророк по занаят, нито син на пророк: Господ го взел от стадото и го пратил да говори на северното царство (Амос 7:14-15). Пророкувал около 760 г. пр. Хр., в дните на царете Озия Иудейски и Иеровоам Втори Израилски, „две години преди труса“ (1:1). Книгата има девет глави.\u003c/p>","context":"\u003cp>Северното царство живее тогава най-богатото си време. Заможните строят домове, украсени със слонова кост, и правят пиршества, а светилищата във Ветил и в Галгал са пълни с жертви и песни. Но бедният се продава за чифт сандали (2:6), съдиите вземат подкупи, а търговците мамят на кантара. Амос започва със съда над съседните народи, после се обръща към Иудея и, неочаквано, към самия Израил. Амасия, свещеникът от Ветил, го наклеветява пред царя и го гони. Пет видения показват наближаващия край; около четиридесет години по-късно, през 722 г., Самария пада под асирийците. И все пак книгата завършва с обещание за възстановяване.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Правда за бедния\u003c/strong> — Бог поема върху Себе Си делото на онези, които биват тъпкани.\u003c/li>\u003cli>\u003cstrong>Богослужение без правда\u003c/strong> — Господ не приема празници и песни от онези, които живеят в неправда (5:21-24).\u003c/li>\u003cli>\u003cstrong>Избраничеството е отговорност\u003c/strong> — Именно защото Израил е избран, от него се иска повече (3:2).\u003c/li>\u003cli>\u003cstrong>Денят Господен\u003c/strong> — За онези, които не се покайват, той ще бъде тъма, а не светлина (5:18).\u003c/li>\u003cli>\u003cstrong>Гладът за словото\u003c/strong> — Иде глад — не глад за хляб, а жажда за слушане думите Господни (8:11).\u003c/li>\u003c/ul>","hristos":"\u003cp>Книгата завършва с обещанието, че Бог ще възстанови „падналата скиния Давидова“ (9:11). На Апостолския събор в Иерусалим св. апостол Иаков привежда точно тези думи, за да покаже, че езичниците са призвани в Църквата на Христос, Сина Давидов (Деяния 15:15-17). Пророчеството за слънцето, което залязва по пладне (8:9), Отците четат като предвестие на тъмата при Разпятието (Матей 27:45). Гладът за словото Господне намира своя отговор в Христос, Хляба на живота (Иоан 6:35). А изобличението на преситените отеква отново от устата на Спасителя: „горко вам, богати“ (Лука 6:24), и в притчата за немилостивия богаташ и бедния Лазар (Лука 16:19-31).\u003c/p>","parinti":"\u003cp>Св. Кирил Александрийски в тълкуванието си на дванадесетте пророци показва, че възстановената „скиния Давидова“ е човешката природа, която Христос прие и възкреси, и същевременно Църквата, събрана от всички народи. Св. Ириней Лионски нарежда думите за слънцето, което залязва по пладне, сред пророчествата за Страданията. Блажени Иероним и блажени Теодорит Кирски също тълкували книгата. А св. Василий Велики и св. Иоан Златоуст говорели на богатите от своето време в същия дух като Амос: каквото е излишно в дома ти, принадлежи на гладния.\u003c/p>","slujbe":"\u003cp>Амос обикновено не се чете като четиво в богослуженията на Църквата. Но го чуваш чрез Апостола, когато се чете от Деянията словото на св. апостол Иаков за скинията Давидова, и го откриваш отново в песнопенията на Велики петък, които говорят за слънцето, помрачено при Разпятието. Светият пророк Амос се почита на 15 юни.\u003c/p>","rugaciune":"\u003cp>Господи, Ти, Който взе Амос от стадото и вложи в устата му Своето слово, събуди ни от безразличието. Не ни оставяй да Ти принасяме песни с устните и неправда с ръцете. Дай ни милостиво сърце към бедния и глад за Твоето слово. Помогни ни да Те търсим, за да бъдем живи. Амин.\u003c/p>"},"q":[{"q":"С какво се занимавал Амос, преди да бъде призован за пророк?","o":["Бил пастир и берач на диви смокини","Бил свещеник в иерусалимския храм","Бил съветник в царския двор"]},{"q":"В какво обвинява Амос жителите на северното царство?","o":["Че принасят жертви и песни, но онеправдават бедните","Че вече изобщо не принасят жертви във Ветил","Че са сключили мир с Асирия"]}]}},{"n":30,"slug":"mihey","abbr":"Мих","cap":7,"s":"malki-prorotsi","bg":{"nume":"Михей","scurt":"Пророкът от селото, който назова Витлеем — мястото, където ще се роди Месията, — и каза с малко думи какво иска Бог от човека.","verset":{"t":"„И ти, Витлееме Ефратов, малък ли си между хилядите Иудини? от тебе ще Ми излезе Оня, Който трябва да бъде Владика в Израиля“","r":"Михей 5:2"},"incepe":"Михей 4–7","p":{"autor":"\u003cp>Михей бил родом от Морасти, село в Иудея на югозапад от Иерусалим. Пророкувал в дните на царете Иоатам, Ахаз и Езекия, през втората половина на осмия век пр. Хр., като по-млад съвременник на Исаия. Исаия говорел в царския двор; Михей бил човек от селото и говорел за малките хора. Книгата му има седем глави. Името му означава „Кой е като Господа?“.\u003c/p>","context":"\u003cp>Това е времето, когато Асирия поглъща една страна след друга. През 722 г. пада Самария, столицата на северното царство, и Иудея живее със страха пред вратата. Но Михей вижда опасност, по-голяма от чуждите войски: богатите заграбват нивите и къщите на бедните (2:2), първенците съдят срещу подаръци, свещениците поучават за пари, а лъжепророците проповядват мир на всеки, който ги храни. И всички спокойно казват, че Господ е сред тях. Михей предвещава, че Сион ще бъде разоран като нива (3:12). Век по-късно старейшините на народа ще си спомнят тези думи и така пророк Иеремия ще бъде спасен от смърт, както разказва неговата книга. В книгата на Михей съдът и обещанието се редуват като вълни.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Правда за малките\u003c/strong> — Бог вижда нивата, отнета насила, и къщата на вдовицата.\u003c/li>\u003cli>\u003cstrong>Какво иска Бог\u003c/strong> — Не хиляди овни, а да постъпваш справедливо, да обичаш милосърдието и смирено да ходиш пред своя Бог (6:6-8).\u003c/li>\u003cli>\u003cstrong>Пастирят от Витлеем\u003c/strong> — От малкия град ще излезе Владиката, Чийто произход е от вечни дни (5:2-4).\u003c/li>\u003cli>\u003cstrong>Мирът между народите\u003c/strong> — Народите ще възлязат на планината Господня и ще прековат мечовете си на орала (4:1-4).\u003c/li>\u003cli>\u003cstrong>Милостта, която прощава\u003c/strong> — Бог хвърля всички наши грехове в морските дълбини (7:18-19).\u003c/li>\u003c/ul>","hristos":"\u003cp>Когато мъдреците питат къде се е родил Царят, книжниците отговарят на Ирод с пророчеството на Михей: във Витлеем Иудейски (Матей 2:5-6). Но пророкът казва повече от мястото: произходът на Онзи, Който ще се роди, е „от крайвреме, от вечни дни“ (5:2); Младенецът в яслите е вечният Син на Отца. Той ще пасе стадото с Господня сила и ще бъде нашият мир (5:4-5); апостол Павел казва същото за Христос: „Той е нашият мир“ (Ефесяни 2:14). Думите за разделението в дома (7:6) повтаря Спасителят (Матей 10:35-36). А скръбния Божи въпрос „Народе Мой! Какво ти сторих?“ (6:3) чуваме през Страстната седмица от устата на Разпнатия.\u003c/p>","parinti":"\u003cp>Св. Иустин Философ привежда пророчеството за Витлеем като доказателство, че раждането на Христос е било предречено векове по-рано. Св. Кирил Александрийски и блажени Теодорит Кирски, като тълкуват книгата, показват, че стихът говори за двете раждания на едно и също Лице: предвечното — от Отца, и във времето — във Витлеем, от Девата. А блажени Иероним, който сам живял във Витлеем, тълкувал това пророчество. Отците обичали и края на книгата, където Бог не държи гнева Си вечно, защото обича да се смилява.\u003c/p>","slujbe":"\u003cp>Михей чуваш на Рождество Христово: пророчеството за Витлеем се чете в навечерието, на Бъдни вечер — на Царските часове и сред четивата на вечернята. На Велики четвъртък вечерта, на службата с четенето на дванадесетте Евангелия, се пее песнопението „Народе Мой, какво ти сторих?“, което тръгва от Михей 6:3. Светият пророк Михей се почита на 14 август, в навечерието на Успение Богородично.\u003c/p>","rugaciune":"\u003cp>Кой Бог е като Тебе, Господи, Който прощаваш беззаконието и не държиш гнева Си вечно? Хвърли в морските дълбини всички наши грехове. Научи ни да постъпваме справедливо, да обичаме милосърдието и смирено да ходим пред Тебе. Ти, Който се роди в малкия Витлеем, бъди наш мир и ни води като добър Пастир. Амин.\u003c/p>"},"q":[{"q":"Кой град назовава Михей като мястото, откъдето ще излезе Владиката на Израил?","o":["Витлеем","Иерусалим","Назарет"]},{"q":"Какво иска Бог от човека според Михей 6:8?","o":["Да постъпва справедливо, да обича милосърдието и смирено да ходи пред Бога","Хиляди овни и реки от елей","Да построи по-голям храм"]}]}},{"n":31,"slug":"ioil","abbr":"Иоил","cap":3,"s":"malki-prorotsi","bg":{"nume":"Иоил","scurt":"Едно нашествие на скакалци става зов за покаяние и обещание, че Светият Дух ще бъде излят върху всеки човек.","verset":{"t":"„обърнете се към Мене от все сърце с пост, плач и ридание“","r":"Иоил 2:12"},"incepe":"Иоил 1 · 2:12-17 · 2:28-32 (обещанието за изливането на Светия Дух, което привеждат Деяния 2:16-21)","p":{"autor":"\u003cp>Книгата го назовава просто: Иоил, син Витуилов. Името му означава „Господ е Бог“. Не ни казва в дните на кой цар е пророкувал, и книгата не дава никаква дата; според Преданието на Църквата той е проповядвал словото Господне в Иудейското царство, в Иерусалим, и се нарежда сред древните пророци. Говори като човек, който добре познава храма, свещениците и жертвите. Църквата почита светия пророк Иоил на 19 октомври.\u003c/p>","context":"\u003cp>След Соломон Божият народ се разделя на две царства, и пророците са пратени да го зоват обратно към завета, тоест към връзката на вярност с Господа. Иоил говори в миг на голяма скръб: облаци скакалци са изяли всичко зелено, сушата е изгорила нивите, добитъкът стене, а в храма вече няма нито жито, нито вино за жертвата. Пророкът не търси виновни и не прави сметки. Той вижда в бедствието знак: иде „денят Господен“, денят, в който Бог посещава света. Затова свиква всички — от старците до кърмачетата — на пост и молитва.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Скръбта като пробуждане\u003c/strong> — Скакалците и сушата не са само щета, а камбана, която буди един заспал народ.\u003c/li>\u003cli>\u003cstrong>Покаянието от сърце\u003c/strong> — „Раздирайте сърцата си, а не дрехите си“ (Иоил 2:13): Бог не иска жестове, а истинско обръщане.\u003c/li>\u003cli>\u003cstrong>Денят Господен\u003c/strong> — Денят на съда, страшен за безразличния и спасителен за всеки, който призовава името Господне.\u003c/li>\u003cli>\u003cstrong>Божията милост\u003c/strong> — Господ е „благ и милосърден, дълготърпелив и многомилостив“, готов да върне годините, които скакалците изядоха.\u003c/li>\u003cli>\u003cstrong>Изливането на Светия Дух\u003c/strong> — Обещанието, че Духът вече няма да принадлежи само на малцина избрани, а на синовете и дъщерите, на старците и на младежите.\u003c/li>\u003c/ul>","hristos":"\u003cp>Иоил е пророкът на Петдесетница. Неговото обещание — че Бог ще излее от Своя Дух „върху всяка плът“ — се изпълни петдесет дни след Възкресението Господне, когато Светият Дух слезе над апостолите като огнени езици. Апостол Петър го казва ясно пред множеството: „това е реченото чрез пророк Иоиля“ (Деяния 2:16). Но Духът идва, защото Христос бе разпнат, възкръсна и се възнесе: Той Го изпраща от Отца (Иоан 15:26). Иоил казва още, че всеки, който призове името Господне, ще се спаси, а апостол Павел показва, че този Господ е Иисус Христос (Римляни 10:9-13). Изворът, който в края на книгата излиза от дома Господен и напоява сухата долина (3:18), е образ на благодатта, която тече от Църквата.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст, като тълкува Деянията на апостолите, обръща внимание, че апостол Петър започва първата си проповед с един пророк: онова, което хората виждат на Петдесетница, не е заблуда, а изпълнение на едно древно обещание. Св. Кирил Иерусалимски в огласителните си поучения за Светия Дух привежда Иоил като свидетел, че същият Дух, Който говори чрез пророците, слезе над апостолите. Св. Кирил Александрийски, който тълкувал всички малки пророци, чете обещанието на Иоил като изпълнено в Христос и в Църквата. А словото „раздирайте сърцата си, а не дрехите си“ остана за Отците мярка за всеки истински пост.\u003c/p>","slujbe":"\u003cp>Пророчеството за изливането на Духа се чете като паримия — тоест откъс от Стария Завет — на вечернята в навечерието на Петдесетница, заедно с Иезекиил 36. Зовът на Иоил към пост и обръщане звучи и в Сирната седмица, преди Великия пост, като подготовка за пътя на покаянието. Светия пророк Иоил ще намериш в църковния календар на 19 октомври.\u003c/p>","rugaciune":"\u003cp>Господи, Боже наш, благ и милосърден, Ти не искаш раздрани дрехи, а сърца, които се обръщат. Приеми и мене, с моя малък пост и бедната ми молитва. Върни ми годините, които разпилях далеч от Тебе, и излей и върху мене, недостойния, благодатта на Твоя Пресвет Дух, за да призовавам Твоето име и да се спася. Амин.\u003c/p>"},"q":[{"q":"Кое обещание на Иоил се изпълни на Петдесетница?","o":["Изливането на Светия Дух „върху всяка плът“","Възстановяването на иерусалимския храм","Излизането на народа от египетското робство"]},{"q":"Какво иска Господ с думите „Раздирайте сърцата си, а не дрехите си“?","o":["Истинско покаяние, от сърце","Повече жертви в храма","Празнични дрехи за деня Господен"]}]}},{"n":32,"slug":"avdiy","abbr":"Авд","cap":1,"s":"malki-prorotsi","bg":{"nume":"Авдий","scurt":"Най-кратката книга на Стария Завет: съдът над гордостта на Едом, който се зарадва на падането на брат си.","verset":{"t":"„както си ти постъпвал, тъй ще се постъпи и с тебе; каквото си вършил, ще падне върху главата ти“","r":"Авдий 1:15"},"incepe":"Авдий 1:1-21 (цялата книга е една глава)","p":{"autor":"\u003cp>За Авдий книгата не ни казва нищо друго освен името му, което означава „раб Господен“. Едно древно предание, запазено в житията на светиите, го отъждествява с Авдий, домоуправителя на цар Ахав, който скрил сто пророци от гнева на Иезавел (Трета книга Царства 18). Книгата обаче говори за падането на Иерусалим, затова обикновено се отнася към шести век пр. Хр. Църквата почита светия пророк Авдий на 19 ноември.\u003c/p>","context":"\u003cp>Едомците били потомци на Исав, брата на Иаков (Битие 25–27), тоест родствен на Израил народ. Живеели на юг от Мъртво море, в градове, издълбани високо в скалите, и се смятали за недосегаеми. Когато вавилонците разрушили Иерусалим (586 г. пр. Хр.), Едом не помогнал на брат си: гледал със злорадство, грабил и ловял бегълците, за да ги предаде на врага. Върху тази стара рана между двамата братя пада словото на Авдий. В историята на спасението книгата стои между разрушаването на Иерусалим и обещанието за завръщане от плена.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Гордостта, която мами\u003c/strong> — Който устрои гнездото си високо, сред звездите, ще бъде свален от Господа.\u003c/li>\u003cli>\u003cstrong>Грехът на безразличието\u003c/strong> — Едом не разрушил града със собствените си ръце, а стоял настрана и се радвал; и това е вина пред Бога.\u003c/li>\u003cli>\u003cstrong>Божията правда\u003c/strong> — Каквото правиш на ближния си, ще падне върху собствената ти глава.\u003c/li>\u003cli>\u003cstrong>Планината Сион\u003c/strong> — За смирените остава място на убежище и светост.\u003c/li>\u003cli>\u003cstrong>Царството Господне\u003c/strong> — Последната дума на книгата не е наказанието, а Божието царство.\u003c/li>\u003c/ul>","hristos":"\u003cp>Авдий не изрича пряко пророчество за Месията, но книгата сочи към Него със своя край: „и царството ще бъде Господне“ (Авдий 1:21). С тази вест Спасителят започва Своята проповед: „наближи царството Божие“ (Марк 1:15). Старата вражда между Исав и Иаков се показва отново при Рождество Господне: Ирод, царят, който иска да убие Младенеца, бил идумеец, тоест от рода на Едом. Но самото Евангелие казва, че множества от Идумея дошли при Иисус (Марк 3:8). В Христос съдът вече не е последната дума: и Едом е призван към спасение.\u003c/p>","parinti":"\u003cp>Авдий има малко тълкуватели, защото е много кратка книга. Блажени Иероним я тълкувал два пъти и признава, че първия път, в младостта си, бързал. Той и св. Кирил Александрийски виждат в Едом образ на гордостта и на враждата срещу Божия народ, а в планината Сион — Църквата. Древните тълкуватели, сред тях и блажени Теодорит Кирски, обръщат внимание на нещо, което лесно забравяме: Бог ще поиска сметка и за радостта ни от злото на другия, а не само за злото, което сме сторили с ръцете си.\u003c/p>","slujbe":"\u003cp>Книгата на Авдий не се чете като паримия на празниците. Срещаш я в църковния календар на 19 ноември, когато Църквата почита пророка. Но нейната тема — Бог смирява горделивите и въздига смирените — чуваш на утренята, в песента на Богородица, когато се пее „Честнейшата“: „свали силни от престоли и въздигна смирени“ (Лука 1:52).\u003c/p>","rugaciune":"\u003cp>Господи, Царю на всичко, пази ме от гордостта, която се мисли за недосегаема, и от злорадството при падането на другия. Когато брат ми е в скръб, не ме оставяй да стоя настрана. Дай ми смирено и милостиво сърце, и нека Твоето царство дойде и в моя живот. Амин.\u003c/p>"},"q":[{"q":"От кого произлизали едомците, които Авдий изобличава?","o":["От Исав, брата на Иаков","От Исмаил, сина на Авраам","От Лот, племенника на Авраам"]},{"q":"С какви думи завършва книгата на Авдий?","o":["„И царството ще бъде Господне“","„Обърнете се към Мене от все сърце“","„Праведният чрез вярата си ще бъде жив“"]}]}},{"n":33,"slug":"iona","abbr":"Иона","cap":4,"s":"malki-prorotsi","bg":{"nume":"Иона","scurt":"Пророкът, който бяга от Бога, три дни в утробата на кита и един езически град, който се покайва.","verset":{"t":"„към Господа извиках в моята скръб, — и Той ме чу“","r":"Иона 2:3"},"incepe":"Иона 1–4 (цялата книга; чете се за десет минути)","p":{"autor":"\u003cp>Иона, син Аматиев, бил родом от Гат-Хефер, село в Галилея, и пророкувал в северното царство в дните на цар Иеровоам Втори (осми век пр. Хр.), както показва Четвърта книга Царства 14:25. Според Преданието на Църквата той сам разказал, без да се щади, своето непослушание и своето изправяне. Книгата не е сбирка от проповеди, като у другите пророци, а разказ. Църквата почита светия пророк Иона на 22 септември.\u003c/p>","context":"\u003cp>Ниневия била големият град на Асирия — империята, която тогава всявала ужас по целия Изток и която няколко десетилетия по-късно щяла да отведе в плен Израилското царство. За един израилтянин ниневийците били най-страшният враг. Точно там Бог праща Иона да проповядва гибелта на града. Иона се качва на кораб и бяга на другия край на света, към Тарсис. Не от страх: той знае, че Господ е милостив, и се бои, че ще прости на враговете (Иона 4:2). Бурята, голямата риба, градът, който пости, и растението, което изсъхва, са уроците, с които Бог разширява сърцето му.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Не можеш да избягаш от Бога\u003c/strong> — Нито корабът, нито морската дълбина скриват Иона от Онзи, Който го е призовал.\u003c/li>\u003cli>\u003cstrong>Молитвата от дълбините\u003c/strong> — От утробата на кита Иона вика и бива чут; никоя яма не е толкова дълбока за молитвата.\u003c/li>\u003cli>\u003cstrong>Покаянието, което променя всичко\u003c/strong> — От царя до добитъка Ниневия пости, и Бог ѝ прощава.\u003c/li>\u003cli>\u003cstrong>Милостта без граници\u003c/strong> — Господ се грижи и за езичниците, за повече от сто и двадесет хиляди души, които не могат да различат дясната си ръка от лявата (Иона 4:11).\u003c/li>\u003cli>\u003cstrong>Тясното сърце на праведника\u003c/strong> — Иона се гневи, защото Бог е благ; книгата завършва с въпрос, отправен и към нас.\u003c/li>\u003c/ul>","hristos":"\u003cp>Тук не е нужно да гадаем: Сам Спасителят ни дава ключа. „Както Иона беше в утробата китова три дни и три нощи, тъй и Син Човеческий ще бъде в сърцето на земята три дни и три нощи“ (Матей 12:40). Иона, който слиза в дълбините и излиза жив на третия ден, е образът — предизображението — на погребението и Възкресението Христово. Иона позволява да го хвърлят в морето, за да утихне бурята и да се спасят онези на кораба; Христос доброволно се предава на смъртта за живота на света. И Господ добавя: ниневийците се покаяха от проповедта на Иона, „а ето, тук има повече от Иона“ (Матей 12:41). Простената Ниневия предвещава влизането на езичниците в Църквата.\u003c/p>","parinti":"\u003cp>Св. Иоан Златоуст често се връща към ниневийците в словата си за покаянието: за три дни един цял град бил спасен — не със стени, а с пост, сълзи и отказ от злото; затова, казва той, никой да не отчайва. Св. Кирил Иерусалимски в огласителните си поучения поставя Иона до Христос: единият бил хвърлен в утробата на кита, а Другият доброволно слязъл там, където е невидимият кит на смъртта, за да изведе навън онези, които тя е погълнала. Блажени Иероним, който тълкувал книгата стих по стих, вижда в целия път на пророка образ на Страданията и Възкресението Господни.\u003c/p>","slujbe":"\u003cp>Книгата на Иона се чете цялата веднъж в годината: на Велика събота сутринта, на вечернята с Литургията на св. Василий Велики, сред петнадесетте паримии. Молитвата на Иона от утробата на кита е шестата от деветте библейски песни, върху които е изграден канонът на утренята; затова ирмосите на шеста песен толкова често си спомнят Иона и морските дълбини. Паметта на пророка е на 22 септември.\u003c/p>","rugaciune":"\u003cp>Господи, Ти, Който чу Иона от морските дълбини, чуй и мене, когато викам в своята скръб. Всеки път, когато съм бягал от лицето Ти, върни ме обратно. Дай ми покаянието на ниневийците и широко сърце, за да се радвам на Твоята милост към всички хора, дори към онези, които са ми сторили зло. Амин.\u003c/p>"},"q":[{"q":"Какво показват, според думите на Спасителя, трите дни на Иона в утробата на кита?","o":["Неговото погребение и Възкресение в третия ден","Наказанието, което се готвело за Ниневия","Трите изкушения в пустинята"]},{"q":"Кога се чете цялата книга на Иона в храма?","o":["На Велика събота, сред петнадесетте паримии","На вечернята в навечерието на Петдесетница","На Връбница"]}]}},{"n":34,"slug":"naum","abbr":"Наум","cap":3,"s":"malki-prorotsi","bg":{"nume":"Наум","scurt":"Вестта за падането на Ниневия: Бог не оставя злото да царува вечно и утешава угнетените.","verset":{"t":"„Благ е Господ; Той е убежище в скръбен ден и познава ония, които се Нему надяват“","r":"Наум 1:7"},"incepe":"Наум 1 · после 3:1-7","p":{"autor":"\u003cp>Наум бил от Елкош, село, за което вече не знаем със сигурност къде се е намирало; затова книгата го нарича „Елкосенец“. Името му означава „утеха“. Пророкувал в Иудейското царство през седми век пр. Хр.: книгата споменава падането на египетския град Но-Амон (Тива), превзет от асирийците през 663 г., и предвещава падането на Ниневия, което стана през 612 г. Между тези две дати е отекнало неговото слово. Църквата почита светия пророк Наум на 1 декември.\u003c/p>","context":"\u003cp>Около сто години по-рано Ниневия се била покаяла от проповедта на Иона и била простена. Но следващите поколения забравили. Асирия станала империя на жестокостта: отвела в плен Израилското царство (722 г. пр. Хр.), обсадила Иерусалим, опустошавала градове и преселвала цели народи. Иудея отдавна живеела под нейния гнет и под нейните данъци. В тази нощ Наум донася вест, на която никой не смеел да се надява: Ниневия, кървавият град на грабежа, ще падне и няма да се изправи. И така стана: вавилонците и мидийците я сринаха със земята.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Дълготърпелив, но праведен\u003c/strong> — Господ бавно се гневи, но не оставя ненаказано злото, което не се покайва.\u003c/li>\u003cli>\u003cstrong>Покаянието не се наследява\u003c/strong> — Ниневия, простена във времето на Иона, пада, когато се връща към жестокостта.\u003c/li>\u003cli>\u003cstrong>Краят на тиранията\u003c/strong> — Никоя империя, построена върху кръв и лъжа, не трае вечно.\u003c/li>\u003cli>\u003cstrong>Господ — убежище\u003c/strong> — Сред бурята онези, които се надяват на Него, имат покров.\u003c/li>\u003cli>\u003cstrong>Добрата вест\u003c/strong> — По планините се виждат стъпките на онзи, който възвестява мир.\u003c/li>\u003c/ul>","hristos":"\u003cp>Наум не говори за Месията по име, но в центъра на книгата му стои едно слово, което Новият Завет поема и отвежда по-далеч: „Ето, по планините са стъпките на благовестника, който възвестява мир“ (Наум 1:15). Апостол Павел чете тук проповедта на Евангелието: „колко прекрасни са нозете на ония, които благовестят мир, които благовестят доброто!“ (Римляни 10:15). Така падането на Ниневия става образ на една по-голяма победа: Христос с Кръста и Възкресението разруши властта на дявола и на смъртта, стария тиранин на човешкия род. А името на пророка, „утеха“, сочи към Светия Дух, Утешителя, Когото Господ обещава на учениците Си (Иоан 14:16). Угнетеният вече има Изкупител.\u003c/p>","parinti":"\u003cp>Св. Кирил Александрийски, като тълкува малките пророци, вижда в разрушената Ниневия образ на властта на лукавия, която Христос сломи, а в благовестника по планините — проповедниците на Евангелието. Блажени Иероним показва, че книгата е написана за утеха на праведните: угнетените да не мислят, че Бог ги е забравил. А блажени Теодорит Кирски свързва Наум с Иона: Бог прости, когато Ниневия се покая, и съди, когато тя се върна към злото — еднакво праведен и благ и в двата случая.\u003c/p>","slujbe":"\u003cp>Книгата на Наум не се чете като паримия в богослуженията през годината. Пророка срещаш в църковния календар в началото на декември: Наум на 1 декември, Авакум на 2-ри и Софония на 3-ти — трима пророци един след друг, в Коледния пост, като вестители на Онзи, Който идва. Словото за нозете на онези, които възвестяват мир, чуваш в Апостола, от Посланието до римляни.\u003c/p>","rugaciune":"\u003cp>Господи, благ и убежище в скръбния ден, Ти познаваш онези, които се надяват на Тебе. Когато злото изглежда по-силно от доброто, утвърди вярата ми, че последната дума е Твоя. Не ме оставяй да забравя милостта, която ми показа, и да се върна към греха. Утеши всички угнетени. Амин.\u003c/p>"},"q":[{"q":"За падането на кой град пророкува Наум?","o":["На Ниневия, големия град на Асирия","На Вавилон, града на халдейците","На Иерусалим, града на Давид"]},{"q":"Какво означава името „Наум“?","o":["Утеха","Раб Господен","Господ е Бог"]}]}},{"n":35,"slug":"avakum","abbr":"Авак","cap":3,"s":"malki-prorotsi","bg":{"nume":"Авакум","scurt":"Пророкът, който пита Бога „докога?“ и получава отговор: праведният чрез вярата си ще бъде жив.","verset":{"t":"„праведният чрез вярата си ще бъде жив“","r":"Авакум 2:4"},"incepe":"Авакум 1:1-4 · 2:1-4 · 3 (молитвата на пророка)","p":{"autor":"\u003cp>За Авакум знаем малко: книгата го нарича пророк и ни оставя неговата молитва, написана като псалом, с указания как да се пее — знак, че е бил близо до богослужението в храма. Пророкувал в Иудея към края на седмия век пр. Хр., малко преди нашествието на халдейците (вавилонците). Преданието го разпознава и в пророк Авакум, който носи храна на Даниил в лъвовата яма (в историята за Вил и змея). Църквата го почита на 2 декември.\u003c/p>","context":"\u003cp>Асирия била паднала, както бил предвестил Наум, но покоят не траел дълго. В Иудея, след смъртта на благочестивия цар Иосия, се умножили неправдата и насилието, а от изток се издигала нова сила: Вавилон. Авакум не започва със слово към народа, а с въпрос към Бога: докога ще викам, и Ти няма да чуваш? Господ му отговаря, че ще издигне халдейците, за да накаже Иудея. Пророкът се смущава още повече: как да наказваш един грешен народ с друг, още по-лош? После застава на стражата си и чака. Отговорът идва: видението има своето време; горделивият ще загине, а праведният чрез вярата си ще бъде жив. Малко по-късно Иерусалим щял да падне (586 г. пр. Хр.).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Въпросът към Бога\u003c/strong> — Вярата не означава мълчание; Авакум отнася недоумението си при Господа, а не далеч от Него.\u003c/li>\u003cli>\u003cstrong>Търпението\u003c/strong> — Божието обещание идва в Неговото време, не в нашето; и да се забави, струва си да го чакаме.\u003c/li>\u003cli>\u003cstrong>Праведният живее чрез вярата\u003c/strong> — Не чрез онова, което вижда, а чрез доверието във верния Бог.\u003c/li>\u003cli>\u003cstrong>Горко на горделивия\u003c/strong> — Пет пъти „горко“ за алчността, насилието и идолопоклонството.\u003c/li>\u003cli>\u003cstrong>Радост без видима причина\u003c/strong> — Дори смоковницата да не цъфне и кошарите да са празни, пророкът се радва в Господа (Авакум 3:17-18).\u003c/li>\u003c/ul>","hristos":"\u003cp>Словото в центъра на книгата, „праведният чрез вяра ще бъде жив“, се повтаря три пъти в Новия Завет (Римляни 1:17; Галатяни 3:11; Евреи 10:38): истинският живот идва от вярата в Иисус Христос, вяра жива, която действа чрез любовта. Молитвата от трета глава е видение за идването на Бога: „Бог иде от Теман, и Светият — от планина Фаран“ (Авакум 3:3). В гръцкия текст на Седемдесетте и в църковнославянския, които звучат в богослуженията, тази планина е „осенена“ и „гъста“, и песнопенията на Църквата виждат в нея Богородица, от Която дойде въплътеният Христос. Там пророкът казва още, че Господ излиза за спасение на Своя народ (3:13). А на Великден Църквата зове Авакум да ни покаже Ангела, който възвестява Възкресението.\u003c/p>","parinti":"\u003cp>Св. Григорий Богослов започва прочутото си Слово на Пасха с Авакум: и той, заедно с пророка, застава на своята стража, за да види какво ще му бъде открито. Оттам св. Иоан Дамаскин взел в Пасхалния канон призива богоглаголивият Авакум да застане с нас на божествената стража. Св. Кирил Александрийски в тълкуванието си чете молитвата на пророка като вест за идването на Христос в плът. А блажени Августин в съчинението си „За Божия град“ вижда в същата песен Страданията и славата Господни.\u003c/p>","slujbe":"\u003cp>Молитвата на Авакум (трета глава) е четвъртата от деветте библейски песни на канона на утренята; затова ирмосите на четвърта песен толкова често започват с „Услышах, Господи…“ („Чух, Господи…“) или си спомнят пророка, който видя осенената планина. В пасхалната нощ четвъртата песен призовава Авакум да застане „на божествената стража“. Паметта му е на 2 декември, в Коледния пост.\u003c/p>","rugaciune":"\u003cp>Господи, чух вест от Тебе и се уплаших. Когато не разбирам пътищата Ти и питам „докога?“, задръж ме близо до Себе Си, на стражата на молитвата. Дай ми търпение да чакам Твоето време и вяра, за да живея чрез нея. И дори всичко да ми липсва, направи ме да се радвам в Тебе, Бога на моето спасение. Амин.\u003c/p>"},"q":[{"q":"Какъв отговор получава Авакум на своя въпрос?","o":["Праведният чрез вярата си ще бъде жив","Ниневия ще бъде простена втори път","Храмът ще бъде построен отново след три години"]},{"q":"Какво място има молитвата на Авакум (трета глава) в богослуженията на Църквата?","o":["Тя е четвъртата песен на канона на утренята","Тя е предначинателният псалом на вечернята","Тя е Апостолът на Връбница"]}]}},{"n":36,"slug":"sofonia","abbr":"Соф","cap":3,"s":"malki-prorotsi","bg":{"nume":"Софония","scurt":"Денят Господен идва като съд, но оставя след себе си един смирен народ, сред който Господ се радва.","verset":{"t":"„Господ, Бог твой, е посред тебе: Той е силен да те спаси“","r":"Софония 3:17"},"incepe":"Софония 1:1-7 · 2:1-3 · 3:9-20","p":{"autor":"\u003cp>Софония посочва родословието си до четвърто коляно: той е праправнук на Езекия — според много тълкуватели на самия благочестив цар на Иудея. Пророкувал в Иерусалим в дните на цар Иосия (640–609 г. пр. Хр.), преди голямото обновление на вярата, което извършил този цар. Името му означава „Господ закриля“. Църквата почита светия пророк Софония на 3 декември.\u003c/p>","context":"\u003cp>Преди Иосия Иудея преминала през половин век мрак, при царете Манасия и Амон: идоли в храма Господен, поклонение на звездите по покривите, клетви и в името на Господа, и в името на чужди богове, алчни първенци и лекомислени пророци. Мнозина казвали в сърцето си, че Господ не прави ни добро, ни зло (Софония 1:12). Върху това безразличие пада словото на Софония: денят Господен е близо, ден на гняв и скръб — за Иерусалим и за околните народи. Пророчеството му подготвило обновлението при Иосия (Четвърта книга Царства 22–23) и отрано предвестило вавилонския плен, който щял да дойде няколко десетилетия по-късно.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Денят Господен\u003c/strong> — Бог ще огледа Иерусалим със светило (Софония 1:12): нищо не остава скрито.\u003c/li>\u003cli>\u003cstrong>Безразличието\u003c/strong> — Най-изобличаваният грях не е явното зло, а сърцето, което вече не очаква нищо от Бога.\u003c/li>\u003cli>\u003cstrong>Потърсете Господа\u003c/strong> — Зов към смирените да търсят правдата и кротостта (Софония 2:3).\u003c/li>\u003cli>\u003cstrong>Остатъкът\u003c/strong> — Господ запазва един народ кротък и смирен, който се уповава на Неговото име (Софония 3:12).\u003c/li>\u003cli>\u003cstrong>Радостта на Бога\u003c/strong> — Книгата започва с гняв и завършва с Господа, Който се радва за Своя народ.\u003c/li>\u003c/ul>","hristos":"\u003cp>„Ликувай, дъще Сионова!“ — възкликва пророкът, защото Господ, Царят Израилев, е посред нея (Софония 3:14-15). Онова, което Софония възвестява като обещание, Евангелието показва изпълнено: Бог „посред“ Своя народ е Емануил, Синът Божий, Който стана човек. Поздравът на Ангела към Дева Мария, „радвай се, благодатна! Господ е с тебе“ (Лука 1:28), звучи като ехо на този призив. В навечерието на Връбница Църквата чете словото на Софония, когато Христос влиза в Иерусалим. Кроткият и смирен народ предвещава „бедните духом“ от блаженствата (Матей 5:3), а чистите уста, дадени на народите (Софония 3:9), предвещават призоваването на езичниците, явено на Петдесетница, когато всички езици славят Бога.\u003c/p>","parinti":"\u003cp>Св. Кирил Александрийски в тълкуванието на малките пророци чете края на книгата като вест за времето на Христос: гневът се превръща в радост, защото Сам Господ идва сред Своите и снема осъждането. Блажени Теодорит Кирски показва, че единодушното поклонение на народите, предречено от пророка, се изпълни в Църквата, събрана от всички народи. Блажени Иероним, който също тълкувал книгата, настоява на смирения остатък: обещанието не го получават мнозината и силните, а бедните пред Бога.\u003c/p>","slujbe":"\u003cp>Софония чуваш в два от най-великите дни на годината. На вечернята на Връбница, в Лазарова събота вечерта, една от паримиите е призивът „Ликувай, дъще Сионова“ (Софония 3:14-19). А на Велика събота, сред петнадесетте паримии, се чете обещанието за събирането на народите и за смирения народ (Софония 3:8-15). Пророка почитаме на 3 декември.\u003c/p>","rugaciune":"\u003cp>Господи, Боже наш, Който си посред нас, силен да спасиш, извади от сърцето ми безразличието. Научи ме да Те търся със смирение и да се уповавам на Твоето име. Очисти устните ми, за да Те възпявам заедно с целия Твой народ, и ме направи съпричастен на радостта, с която се радваш за онези, които се обръщат към Тебе. Амин.\u003c/p>"},"q":[{"q":"В дните на кой цар пророкувал Софония?","o":["На Иосия, цар на Иудея","На Иеровоам Втори, цар на Израил","На Дарий, цар на персите"]},{"q":"Кого запазва Господ като „остатък“ на Своя народ?","o":["Един народ кротък и смирен, който се уповава на Него","Първенците и богатите в Иерусалим","Най-храбрите воини на Иудея"]}]}},{"n":37,"slug":"agey","abbr":"Аг","cap":2,"s":"malki-prorotsi","bg":{"nume":"Агей","scurt":"Върнали се от плена, хората строят своите къщи и забравят храма; Агей ги зове да поставят Бога на първо място.","verset":{"t":"„Славата на тоя последен храм ще бъде по-голяма, отколкото на предишния“","r":"Агей 2:9"},"incepe":"Агей 1 · 2:1-9","p":{"autor":"\u003cp>Агей е първият пророк след вавилонския плен. Книгата му е датирана с рядка точност: четири слова, произнесени в Иерусалим в течение на четири месеца през втората година на персийския цар Дарий (520 г. пр. Хр.). Името му означава „празничен“, „роден в празник“. Книгата на Ездра го споменава заедно с пророк Захария като онези, които вдигнали народа на работа (Първа книга на Ездра 5:1; 6:14). Църквата почита светия пророк Агей на 16 декември.\u003c/p>","context":"\u003cp>През 586 г. пр. Хр. вавилонците разрушили Соломоновия храм и отвели народа в плен. След почти петдесет години персийският цар Кир позволил на иудеите да се върнат. Първите завърнали се положили основите на нов храм, но враждата на съседите и бедността ги спрели. Минали около шестнадесет години. Междувременно всеки си направил къща с дървена обшивка, а домът Господен останал развалина. „Не е дошло още време“, казвали. Агей им показва онова, което не искали да видят: сеят много, а събират малко, и заплатата им изчезва като в пробита кесия. Управителят Зоровавел, потомък на Давид, и първосвещеникът Иисус слушат; след три седмици работата започва отново. Храмът бил осветен през 515 г. пр. Хр.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Първо Бог\u003c/strong> — Когато домът Господен е на последно място, и всичко останало не върви.\u003c/li>\u003cli>\u003cstrong>Обърни сърцето си към пътищата си\u003c/strong> — Пророкът много пъти настоява: вгледайте се в онова, което ви се случва.\u003c/li>\u003cli>\u003cstrong>Не отлагай\u003c/strong> — „Не е дошло още време“ е предлогът, в който се спъва всяко добро дело.\u003c/li>\u003cli>\u003cstrong>„Аз съм с вас“\u003c/strong> — Щом народът се покорява, Господ го укрепява с обещанието, че е с него (Агей 1:13).\u003c/li>\u003cli>\u003cstrong>Последната слава\u003c/strong> — Новият храм изглежда беден, но Бог му обещава по-голяма слава и мир.\u003c/li>\u003c/ul>","hristos":"\u003cp>Старците, които били видели Соломоновия храм, скърбели, като гледали новата сграда, толкова бедна. Тогава Господ обещава: ще потреса небето и земята, ще дойдат народите, и „славата на тоя последен храм ще бъде по-голяма, отколкото на предишния“ (Агей 2:9). Повече злато той нямал. Славата му била друга: в този втори храм бил принесен четиридесетдневният Младенец Иисус и праведният Симеон Го приел на ръцете си (Лука 2:22-32); тук поучавал Господ. И Сам Той говорел „за храма на тялото Си“ (Иоан 2:21) — истинския дом на Бога сред хората. Посланието до евреите привежда потресението, предречено от Агей, и говори за непоколебимото царство (Евреи 12:26-28). А Зоровавел, когото Господ нарича „печат“, присъства в родословието на Спасителя (Матей 1:12).\u003c/p>","parinti":"\u003cp>Св. Кирил Александрийски в тълкуванието си на Агей показва, че по-голямата слава на последния храм не може да се разбира за стени, а за идването на Христос и за Църквата, в която Бог дава Своя мир. Блажени Августин казва същото в „За Божия град“: обещанието на Агей се изпълнява в дома, който се гради от живи камъни, тоест от вярващите. А блажени Иероним взема от Агей един съвет за живота на всеки: да не се грижим само за своите къщи, като оставяме пуст Божия дом в душата си.\u003c/p>","slujbe":"\u003cp>Книгата на Агей не се чете като паримия на празниците. Пророка срещаш в църковния календар на 16 декември, в Коледния пост, в дните, когато Църквата си спомня праведниците на Стария Завет, които очаквали Христос. В Неделята пред Рождество Христово Евангелието за родословието на Иисус Христос споменава и Зоровавел. А обещанието на Агей се вижда изпълнено на празника Сретение Господне (2 февруари).\u003c/p>","rugaciune":"\u003cp>Господи, Ти, Който каза на Своя народ „Аз съм с вас“, прости ми, че се грижих за своята къща и оставих пуст Твоя дом в сърцето си. Помогни ми да се вглеждам в пътищата си и да не отлагам повече. Направи ме храм на Твоята слава и ми дарувай Твоя мир. Амин.\u003c/p>"},"q":[{"q":"Към какво дело призовава Агей завърналите се от плена?","o":["Да построят отново храма Господен","Да издигнат стените на Ниневия","Да се върнат обратно във Вавилон"]},{"q":"Защо славата на последния храм била по-голяма?","o":["Защото в него влезе Христос, Господ","Защото имал повече злато от Соломоновия храм","Защото го построил цар Дарий"]}]}},{"n":38,"slug":"zaharia","abbr":"Зах","cap":14,"s":"malki-prorotsi","bg":{"nume":"Захария","scurt":"Нощни видения и ясни пророчества за кроткия Цар, Който влиза в Иерусалим, възседнал на младо осле.","verset":{"t":"„Ликувай от радост, дъще Сионова… ето, твоят Цар иде при тебе, праведен и спасяващ, кротък, възседнал на ослица и на младо осле“","r":"Захария 9:9"},"incepe":"Захария 1:1-6 · 4 · 8 · 9:9-10 · 12:10","p":{"autor":"\u003cp>Захария, син на Варахия, син на Адо, бил от свещенически род и се върнал от вавилонския плен. Започнал да пророкува в Иерусалим през 520 г. пр. Хр., два месеца след Агей, и работил заедно с него. Името му означава „Господ си спомни“. Не го бъркай със Захария от Евангелието, бащата на св. Иоан Предтеча. Църквата почита светия пророк Захария на 8 февруари; в нашия църковен календар той се нарича Захария Сърповидец.\u003c/p>","context":"\u003cp>Народът се беше върнал от плена, но Иерусалим още беше беден град, със срутени стени и с храм, който едва бе започнат. Управляваха персите; цар от рода на Давид вече нямаше. Агей накара хората да работят; Захария им даде надежда. В една-единствена нощ той вижда осем видения: конници между мирти, човек с въже за мерене, първосвещеника Иисус, от когото свалят мръсните дрехи и го обличат в чисти одежди, златен светилник между две маслини. Всички казват едно и също: Господ се върна в Иерусалим с милост. Втората част на книгата (глави 9–14) гледа по-далеч — към Царя, Който идва, и към последния ден.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Обърнете се, и Аз ще се обърна\u003c/strong> — Книгата започва с Господния призив: „обърнете се към Мене… и Аз ще се обърна към вас“ (Захария 1:3).\u003c/li>\u003cli>\u003cstrong>Не със сила\u003c/strong> — „Не с воинство и не със сила, а с Моя Дух“ (Захария 4:6): Божието дело се върши с Неговата благодат.\u003c/li>\u003cli>\u003cstrong>Очищението\u003c/strong> — Първосвещеникът получава нови одежди; грехът на народа се снема в един-единствен ден.\u003c/li>\u003cli>\u003cstrong>Истинският пост\u003c/strong> — Господ иска правда, милост и истина, а не само постни дни (глави 7–8).\u003c/li>\u003cli>\u003cstrong>Царят, Който идва\u003c/strong> — Кротък, носи мир; Пастир, Който бива поразен заради стадото Си.\u003c/li>\u003c/ul>","hristos":"\u003cp>От малките пророци Захария говори най-ясно за Страданията Господни; Евангелията го цитират непрекъснато в разказа за Страстната седмица. Царят, Който идва кротък, възседнал на осле (9:9), е Христос при Входа Господен в Иерусалим, на Цветница (Матей 21:4-5). Тридесетте сребърника, цената, хвърлена в дома Господен (11:12-13), са цената на Иудиното предателство (Матей 27:3-10). Думите за пастира, който бива поразен, и за овците, които се разпръсват (13:7), ги казва Сам Господ в нощта, когато Го хващат: „ще поразя пастира, и ще се пръснат овците на стадото“ (Матей 26:31). На Кръста се изпълнява Захария 12:10: „ще погледнат на Тогова, Когото прободоха“ (Иоан 19:37). А Мъжът, Чието име според нашия текст е Младочка (6:12) — в гръцкия превод на Седемдесетте името Му е „Изток“, — е Христос, Когото Евангелието нарича „Изток свише“ (Лука 1:78).\u003c/p>","parinti":"\u003cp>Св. Иустин Философ и Мъченик, през II век, привежда пророчествата на Захария като свидетелство, че Иисус е очакваният Месия: влизането на осле и първосвещеника Иисус, облечен в чисти одежди, в когото вижда образ на онези, които се очистват от греховете си чрез Христос. Св. Кирил Александрийски в тълкуванието си на Захария чете златния светилник като образ на Църквата, осветявана от Христос. А св. Иоан Златоуст, като тълкува Евангелието за Входа в Иерусалим, показва, че Господ дошъл на осле, за да изпълни пророчеството и да ни научи на кротост и смирение.\u003c/p>","slujbe":"\u003cp>Захария го чуваш най-вече около Великден. Пророчеството за кроткия Цар (Захария 9:9-15) е четиво на вечернята на Цветница, а думите му отекват в песнопенията на празника. На Велики петък, на Царските часове, се чете откъсът за тридесетте сребърника. На Възнесение Господне (Спасовден) едно от четивата на вечернята е видението, в което Господ застава на Елеонската планина (Захария 14). А пророческото име „Изток“ се пее при венчанието, в песента „Исаие, ликувай“, където така е наречен Христос, Емануил, роден от Девата.\u003c/p>","rugaciune":"\u003cp>Господи Иисусе Христе, кротки и смирени Царю, влез и в града на моето сърце. Свали от мене оцапаната одежда на греховете и ме облечи в Своята благодат. Научи ме, че всяко добро дело се гради не с моята сила, а с Твоя Дух. Обърни ме към Себе Си и обърни и Ти лицето Си към мене, Ти, Който си Изток свише. Амин.\u003c/p>"},"q":[{"q":"Кое пророчество на Захария се изпълни на Цветница?","o":["Царят идва кротък, възседнал на осле","Светият Дух се излива върху всяка плът","Пророкът остава три дни в утробата на кита"]},{"q":"Как се гради Божието дело според словото, което прие Захария?","o":["Не с воинство и не със сила, а с Духа Господен","С войските на персийския цар","Със златото, събрано от богатите"]}]}},{"n":39,"slug":"malahia","abbr":"Мал","cap":4,"s":"malki-prorotsi","bg":{"nume":"Малахия","scurt":"Последният пророк на Стария Завет изобличава една уморена вяра и възвестява Предтечата и Слънцето на правдата.","verset":{"t":"„Защото от слънчев изток до запад ще стане велико името Ми между народите“","r":"Малахия 1:11"},"incepe":"Малахия 1 · 3","p":{"autor":"\u003cp>Малахия означава „Моят ангел“, тоест „Моят вестител“; за живота му книгата не казва нищо. Според Преданието на Църквата той е последният от пророците на Стария Завет, „печатът на пророците“. Говорил е в Иерусалим около средата на V век пр. Хр., по времето на Ездра и Неемия, когато храмът отдавна е бил съграден отново. След него гласът на пророчеството замлъква почти четиристотин години, чак до св. Иоан Предтеча. Църквата почита светия пророк Малахия на 3 януари.\u003c/p>","context":"\u003cp>Бяха минали няколко десетилетия от Агей и Захария. Храмът стоеше, жертвите се принасяха, но обещаната от Бога слава се бавеше, и ревността беше изстинала. Свещениците принасяха на жертвеника слепи и куци животни, каквито не биха посмели да дадат дори на управителя. Мъжете напускаха жените на младостта си заради чужденки. Десятъкът вече не се даваше. А народът роптаеше: каква полза да служим на Бога? Книгата е написана като поредица от въпроси и отговори: Господ казва, че ги е възлюбил, а народът пита къде се е видяла тази любов. Малахия отговаря търпеливо на всяко възражение и затваря реда на пророците с поглед, обърнат към Онзи, Който идва.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Оспорваната Божия любов\u003c/strong> — Цялата книга тръгва от „Аз ви възлюбих“ и от студения отговор на народа.\u003c/li>\u003cli>\u003cstrong>Честта, която дължим на Бога\u003c/strong> — На Него не се принася онова, което ни е в повече, а най-доброто.\u003c/li>\u003cli>\u003cstrong>Свещеникът, вестител Господен\u003c/strong> — „Устата на свещеника трябва да пазят знание, и закона търсят от устата му“ (Малахия 2:7).\u003c/li>\u003cli>\u003cstrong>Верността в брака\u003c/strong> — Господ е свидетел между мъжа и жената на неговите младини (2:14).\u003c/li>\u003cli>\u003cstrong>Денят, който идва\u003c/strong> — Огън, който очиства едни, и Слънце на правдата за онези, които се боят от името Господне.\u003c/li>\u003c/ul>","hristos":"\u003cp>Малахия стои като мост между двата Завета. „Ето, Аз пращам Ангела Си, и той ще приготви пътя пред Мене“ (Малахия 3:1): Евангелието показва, че този вестител е св. Иоан Предтеча (Марк 1:2; Матей 11:10), а Господ, Който внезапно идва в храма Си, е Христос. Илия, когото Бог обещава да прати преди деня Господен (4:5), е образ на Иоан, който дойде „в духа и силата на Илия“ (Лука 1:17; Матей 17:10-13). „Слънцето на правдата“, с изцеление в лъчите Си (4:2; в гръцкия текст това е 3:20), е Сам Христос — така Го нарича тропарът на Рождество Христово. А чистата жертва, принасяна на всяко място между народите (1:11), е Светата Евхаристия, която се извършва на всяка Божествена литургия, от единия край на земята до другия.\u003c/p>","parinti":"\u003cp>Още от първите векове християните са чели Малахия 1:11 като пророчество за Божествената литургия. „Учението на дванадесетте апостоли“, един от най-древните християнски текстове, свързва тези думи с неделното събрание, с преломяването на хляба и с помирението с брата преди жертвата. Св. Иустин Мъченик в „Разговор с иудеина Трифон“ казва, че чистата жертва, принасяна на всяко място, е хлябът и чашата на Евхаристията. Св. Ириней Лионски потвърждава: това е жертвата, която Църквата принася по целия свят. А св. Иоан Златоуст показва, че пророкът е видял отдалеч времето, когато Бог вече няма да се прославя в един-единствен храм, а между всички народи.\u003c/p>","slujbe":"\u003cp>Думите на Малахия за Предтечата ги чуваш на празниците на св. Иоан Предтеча. „Слънцето на правдата“ го пеем в тропара на Рождество Христово: служителите на звездите се научили от звездата да се покланят на Христос, Слънцето на правдата. На всяка Божествена литургия, когато свещеникът издига Светите Дарове и казва, че Му принасяме Неговото от Неговото, за всички и за всичко, се изпълнява чистата жертва, предречена от пророка. Паметта му е на 3 януари, между Рождество Христово и Богоявление.\u003c/p>","rugaciune":"\u003cp>Господи, Ти, Който каза „Аз ви възлюбих“, прости ми за студенината и за роптанието ми. Не ме оставяй да Ти принасям само онова, което ми е в повече, а цялото си сърце. Пази верността в нашите домове и Твоите свещеници в служението им. Изгрей и над мене, Христе, Слънце на правдата, с изцеление в лъчите Си. Амин.\u003c/p>"},"q":[{"q":"Кого предвещава Малахия с „ангела“ (вестителя), който приготвя пътя Господен?","o":["Св. Иоан Предтеча","Пророк Иона","Цар Дарий"]},{"q":"Как са разбрали Светите Отци „чистата жертва“, принасяна на всяко място?","o":["Като пророчество за Светата Евхаристия","Като жертвите на животни в храма","Като десятъка, който народът носеше"]}]}},{"n":40,"slug":"tovit","abbr":"Тов","cap":14,"s":"nekanonichni","dk":true,"bg":{"nume":"Товит","scurt":"Едно вярно семейство в плена: милостиня, благословен брак и ангел, пратен за спътник.","verset":{"t":"„Добро нещо е молитва с пост, с милостиня и справедливост“","r":"Товит 12:8"},"incepe":"Товит 1–3 · 4 · 8 · 12","p":{"autor":"\u003cp>Книгата не назовава автора си. В края ангелът заповядва на Товит и на сина му да опишат в книга всичко станало (Товит 12:20), и оттам идва старото мнение, че разказът започва от тях. Товит е първата от 11-те книги, които нашата Библия, Синодалното издание, нарича „неканонични“, и с нея тази група започва и в Картата: Църквата не ги поставя наравно с каноничните, но ги чете и ги препоръчва за душевна полза. Запазени са на гръцки, в превода на Седемдесетте — древния гръцки превод на Стария Завет, който Църквата използва от апостолско време, — и липсват в протестантските Библии.\u003c/p>","context":"\u003cp>Събитията стават след 722 г. пр. Хр., когато асирийците завладяват северното царство и преселват племената на Израил (4 Царства 17). Товит, от Нефталимовото коляно, попада в плен в Ниневия. Там, сред езичници, той пази Закона, споделя хляба си с гладните и тайно погребва телата на убитите си сънародници, с опасност за живота си. Тъкмо след едно такова добро дело ослепява и обеднява. Далеч оттам, в Екбатана, в Мидия, една млада жена, Сара, също плаче за своята скръб: един демон убил един след друг седемте ѝ годеници. Двамата се молят в един и същи ден, и Бог праща ангел Рафаил. В човешки образ той придружава по пътя Товия, сина на Товит.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Вярата в плена\u003c/strong> — Можеш да останеш Божий и далеч от дома, сред хора, които не Го познават.\u003c/li>\u003cli>\u003cstrong>Милостинята\u003c/strong> — Хляб за гладния, дреха за голия, погребение за мъртвия; „милостинята избавя от смърт“ (Товит 12:9).\u003c/li>\u003cli>\u003cstrong>Изпитанието на праведния\u003c/strong> — Товит ослепява, докато върши добро, но не се отрича от Бога; скръбта не е знак, че Господ го е изоставил.\u003c/li>\u003cli>\u003cstrong>Благословеният брак\u003c/strong> — Товия и Сара започват общия си живот с молитва (глава 8).\u003c/li>\u003cli>\u003cstrong>Ангелите пазители\u003c/strong> — Рафаил води, пази и лекува, а после отдава цялата слава на Бога.\u003c/li>\u003c/ul>","hristos":"\u003cp>Книгата Товит не съдържа пророчество като тези на Исаия, но цялата е образ на Божия промисъл, който се разкрива напълно в Христос. Рафаил, чието име означава „Бог лекува“, е пратен отгоре, върви редом с човека, прогонва демона и дава светлина на слепи очи; Христос, въплътеният Син Божий, прави Сам всичко това, със Своята собствена сила (Марк 1:34; Иоан 9). Съветът на Товит — „Което е тебе омразно, недей го прави другиму“ (Товит 4:15) — Спасителят го довежда до съвършенство: „всичко, което искате да правят вам човеците, същото правете и вие тям“ (Матей 7:12). Делата на милосърдието му са онези, по които ще бъдем съдени (Матей 25:35-36). А песента му в края вижда нов Иерусалим, към който идват народите.\u003c/p>","parinti":"\u003cp>Св. Атанасий Велики в прочутото си празнично послание, където изброява книгите на Писанието, поставя Товит сред книгите, които Отците са определили да се четат от новоприходящите във вярата, които искат да се научат на благочестие; затова гърците наричат тези книги „книги за четене“. Св. Поликарп Смирненски, ученик на апостолите, напомня в посланието си думите, че милостинята избавя от смърт. А св. Киприан Картагенски, в съчинението си за добрите дела и милостинята, дава Товит за пример на родителите: най-доброто наследство, което оставяш на децата си, е страхът Божий и ръката, отворена към бедните.\u003c/p>","slujbe":"\u003cp>Книгата Товит не се чете като четиво на богослуженията на Църквата; тя е книга за четене у дома. Но я откриваш в онова, което Църквата живее: архангел Рафаил го почитаме заедно с всички небесни сили на Архангеловден, събора на св. архистратиг Михаил и другите безплътни сили (8 ноември); молитвата, постът и милостинята, които ангелът поставя заедно, са трите дела на всеки пост; а в просителната ектения непрекъснато молим от Господа ангел на мира, верен наставник и пазител на душите и телата ни.\u003c/p>","rugaciune":"\u003cp>Господи, Боже на отците ни, Ти, Който прати ангела Си да придружи Товия, прати и на пътя на моя живот ангел на мира, пазител на душата и тялото ми. Направи ръката ми щедра, а сърцето ми търпеливо в изпитанието. Благослови домовете и браковете ни и просвети очите на онези, които не виждат Твоята светлина. Амин.\u003c/p>"},"q":[{"q":"Кой придружава Товия по пътя, в човешки образ?","o":["Архангел Рафаил","Пророк Илия","Архангел Гавриил"]},{"q":"Какво означава, че Товит е „неканонична“ книга?","o":["Че Църквата я препоръчва за душевна полза, без да я поставя наравно с каноничните книги","Че се чете на всяка Божествена литургия","Че принадлежи към Новия Завет"]}]}},{"n":41,"slug":"iudit","abbr":"Иудит","cap":16,"s":"nekanonichni","dk":true,"bg":{"nume":"Иудит","scurt":"Една благочестива вдовица спасява цял народ с пост, молитва и смелост, когато първенците на града бяха изгубили надежда.","verset":{"t":"„Ти си Бог на смирените, Ти си помощник на унизени, застъпник на немощни“","r":"Иудит 9:11"},"incepe":"Иудит 8–9 · 13 · 16","p":{"autor":"\u003cp>Не знаем кой е написал книгата Иудит. Църквата я е приела без име на автор, като стар разказ за избрания народ, запазен в превода на Седемдесетте. Нашата Библия, Синодалното издание, я брои сред „неканоничните“ книги, тоест сред онези, които се четат за душевна полза: не стои на едно стъпало с каноничните, но Църквата я препоръчва на вярващите; протестантските Библии я нямат. Има 16 глави и се чете леко, като разказ за опасност, молитва и спасение.\u003c/p>","context":"\u003cp>На картата на Писанието Иудит стои до Товит и Естир: разкази за вярващи, изпитвани под властта на големите езически империи. Книгата казва, че народът току-що се бил върнал от плена и бил осветил отново храма. Цар Навуходоносор праща Олоферн, своя главен военачалник, с огромна войска, за да покори всички народи. На пътя му стои малкият град Ветилуя, който пази пътя към Иерусалим. Олоферн му спира водата. След тридесет и четири дни жажда първенците на града решават: ако за пет дни Бог не помогне, ще се предадат. Тогава се изправя Иудит, вдовица хубава и богата, но преди всичко богобоязлива, която живее в пост и молитва.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Божията сила в немощните\u003c/strong> — Победата не идва от войската, а от Господа, Който действа чрез онзи, от когото не очакваш.\u003c/li>\u003cli>\u003cstrong>Постът и молитвата\u003c/strong> — Иудит не прави нито крачка, преди да се смири с вретище и пепел и да се помоли (глава 9).\u003c/li>\u003cli>\u003cstrong>Не поставяй срокове на Бога\u003c/strong> — Тя изобличава старейшините: на Господа не се дават заповеди, от Него се чака милост (глава 8).\u003c/li>\u003cli>\u003cstrong>Смелостта на вярата\u003c/strong> — Иудит излага живота си на опасност за своя народ и за светото място.\u003c/li>\u003cli>\u003cstrong>Благодарността\u003c/strong> — След победата не се хвали със себе си, а възнася песен на прослава (глава 16).\u003c/li>\u003c/ul>","hristos":"\u003cp>Иудит не назовава Месията, но показва начина, по който Бог спасява: не с човешка сила, а чрез смирението. Олоферн, пред когото треперел целият свят, пада от ръката на една жена, поразен със собствения си меч (глава 13). Така ще бъде победен и великият враг на човека: не с войски, а с Кръста на Иисус Христос, който изглеждаше немощ и поражение. Апостол Павел го казва ясно: „Бог избра онова, що е слабо на тоя свят, за да посрами силните“ (1 Коринтяни 1:27). Много християнски тълкуватели са видели в Иудит образ на Църквата и сянка на Пресвета Богородица: смирената жена, чрез която идва избавлението и която народът нарича благословена повече от всички жени на земята (Иудит 13:18) — думи, които ни напомнят „благословена си ти между жените“ (Лука 1:42).\u003c/p>","parinti":"\u003cp>За Иудит Отците са писали малко, но са я споменавали с почит. Св. Климент Римски, в края на I век, в посланието си до коринтяните я нарича „блажената Иудит“ и я дава за пример на жена, укрепена от Божията благодат, която рискувала от любов към народа си. Св. Атанасий Велики, в празничното послание, където изброява книгите на Писанието, поставя Иудит сред книгите, които Отците са определили да се четат от новоприходящите във вярата. Св. Амвросий Медиолански, когато пише за вдовиците, я хвали за въздържанието и поста ѝ, а блажени Иероним, който превел книгата на латински, я представя като пример за чистота.\u003c/p>","slujbe":"\u003cp>Книгата Иудит не се чете на богослуженията на Църквата: от нея няма да чуеш нито една паремия (паремия е откъсът от Стария Завет, който се чете на вечернята). Можеш да я четеш у дома, като полезно четиво. Духа ѝ обаче лесно разпознаваш в живота на Църквата: преди изпитанието — пост и молитва; след избавлението — песен на благодарност. А молитвата на Иудит в глава 9 прилича на молитвите на Църквата, в които Бог е призоваван като помощ на беззащитните и надежда на безнадеждните.\u003c/p>","rugaciune":"\u003cp>Господи, Боже на смирените и помощнико на малките, Ти нямаш нужда от множество, за да спасиш. Когато страхът ме обгражда като войска, научи ме да не Ти поставям срокове, а да чакам милостта Ти с пост и молитва. Дай ми смелостта на Иудит и смирението ѝ, за да прославям след всяка победа Тебе, а не себе си. Амин.\u003c/p>"},"q":[{"q":"Какво прави Иудит, преди да тръгне към стана на Олоферн?","o":["Смирява се с пост и се моли на Бога","Събира войска от съседните градове","Праща дарове на цар Навуходоносор"]},{"q":"Защо Иудит изобличава първенците на Ветилуя?","o":["Защото поставиха на Бога срок от пет дни","Защото постиха прекалено много","Защото не искаха да плащат данък"]}]}},{"n":42,"slug":"varuh","abbr":"Вар","cap":5,"s":"nekanonichni","dk":true,"bg":{"nume":"Варух","scurt":"От вавилонския плен ученикът на Иеремия учи народа си на покаяние и възвестява, че Бог ще се яви на земята.","verset":{"t":"„Този е нашият Бог, и никой друг не ще се сравни с Него“","r":"Варух 3:36"},"incepe":"Варух 1:15–2:10 · 3:9–4:4 · 5","p":{"autor":"\u003cp>Варух, син на Нирия, бил ученик и писар на пророк Иеремия: той записал в свитъка думите на пророка и ги прочел пред народа, както разказва книгата на Иеремия. Според Преданието на Църквата той написал и тази кратка книга от пет глави, по времето на вавилонския плен. Книгата е запазена в превода на Седемдесетте. Нашата Библия, Синодалното издание, я брои сред „неканоничните“ книги, които се четат за душевна полза; протестантските Библии я нямат.\u003c/p>","context":"\u003cp>Иерусалим падна, храмът изгоря и народът беше отведен във Вавилон (586 г. пр. Хр.). На картата на Писанието Варух идва веднага след Иеремия и Плач Иеремиев и преди завръщането от плена, за което разказва Ездра. Книгата започва с вълнуваща сцена: Варух чете посланието пред пленниците, край една от реките на Вавилон; те плачат, постят и събират сребро, за да го пратят в Иерусалим за жертви. Следват три части: изповедта на народа (1:15–3:8), похвалата на Премъдростта (3:9–4:4) и утехата на Иерусалим (4:5–5:9).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Изповедта на греховете\u003c/strong> — Народът не прехвърля вината върху Бога: „у Господа, нашия Бог, е правдата, а у нас — срам по лицата“ (1:15).\u003c/li>\u003cli>\u003cstrong>Защо стигнахме до плена\u003c/strong> — Отговорът е кратък: защото си „оставил източника на премъдростта“ (3:12).\u003c/li>\u003cli>\u003cstrong>Премъдростта, Божи дар\u003c/strong> — Не се купува със злато и не я намират силните; Бог я е дал на народа Си в Закона.\u003c/li>\u003cli>\u003cstrong>Утехата\u003c/strong> — „Дерзайте, деца, викайте към Бога“ (4:21): Онзи, Който допусна скръбта, носи и радостта.\u003c/li>\u003cli>\u003cstrong>Завръщането\u003c/strong> — Сам Бог събира децата Си от запад до изток (5:5).\u003c/li>\u003c/ul>","hristos":"\u003cp>В сърцето на книгата е едно от най-ясните места в Стария Завет за Въплъщението. След като казва, че Бог е намерил всички пътища на премъдростта и я е подарил на Иаков, Варух добавя: „След това Той се яви на земята и живя между людете“ (Варух 3:38). Църквата е прочела тук възвестяване, че Синът Божий ще дойде в плът: „И Словото стана плът, и живя между нас“ (Иоан 1:14). Премъдростта, която Варух хвали, не е само учение: тя е Сам Христос, „Божия сила и Божия премъдрост“ (1 Коринтяни 1:24). А Иерусалим, който съблича траурната си дреха и се обръща към изток (Варух 4:36; 5:1), е образ на Църквата, събрана от всички народи около Спасителя.\u003c/p>","parinti":"\u003cp>Отците често са цитирали Варух 3:36-38, нерядко под името на Иеремия, защото двете книги вървели заедно. Св. Кирил Иерусалимски в своите Огласителни слова, когато изброява книгите на Писанието, брои заедно Иеремия с Варух, с Плачовете и с Посланието, а думите за Бога, Който се яви на земята, привежда като свидетелство, че Синът стана човек. По същия начин ги брои св. Атанасий Велики в празничното си послание за книгите на Писанието. Св. Ириней Лионски цитира утехата на Иерусалим (глави 4–5), когато говори за радостта на Царството Божие.\u003c/p>","slujbe":"\u003cp>Варух го чуваш веднъж в годината, в един избран момент: на Бъдни вечер, в навечерието на Рождество Христово, на вечернята, сред четивата от Стария Завет се чете Варух 3:36–4:4. Няколко часа преди Църквата да запее на утренята на Рождество „Христос се ражда — славете Го!“, пророчеството казва, че Бог се яви на земята и живя между людете. Когато го чуеш, ще знаеш откъде идва.\u003c/p>","rugaciune":"\u003cp>Господи, Боже наш, Твоя е правдата, а моя — срамът по лицето. Много пъти съм оставял източника на премъдростта и съм се озовавал пленник в чужда земя. Ти, Който се яви на земята и живя между людете, не ме оставяй далеч от Себе Си. Съблечи от мене дрехата на скръбта и ме облечи в радостта на Твоето спасение. Амин.\u003c/p>"},"q":[{"q":"Кой е бил Варух?","o":["Ученикът и писарят на пророк Иеремия","Един от вавилонските царе","Първосвещеникът, който съгради отново храма"]},{"q":"Кога се чете от книгата на Варух на богослуженията?","o":["На Бъдни вечер, на вечернята в навечерието на Рождество Христово","Всяка неделя, на Божествената литургия","В нощта на Великден"]}]}},{"n":43,"slug":"poslanie-na-ieremia","abbr":"Посл Иер","cap":1,"s":"nekanonichni","dk":true,"bg":{"nume":"Послание на Иеремия","scurt":"Едно кратко послание до онези, които отиват в плен: не се бойте от идолите на Вавилон, защото те не са богове.","verset":{"t":"„Тебе трябва да се покланяме, Владико!“","r":"Послание на Иеремия 5"},"incepe":"Послание на Иеремия (цялото, една глава) · после Иеремия 10:1-16","p":{"autor":"\u003cp>Според заглавието си и според Преданието на Църквата посланието е на пророк Иеремия, пратено до онези, които Навуходоносор щял да отведе пленници във Вавилон. Има само една глава. В превода на Седемдесетте стои до Иеремия, Плач Иеремиев и Варух. Нашата Библия, Синодалното издание, го брои сред „неканоничните“ книги, които се четат за душевна полза, и отбелязва, че е преведено от гръцки; протестантските Библии го нямат, а в католическите го намираш като последна глава от книгата на Варух.\u003c/p>","context":"\u003cp>Намираме се на прага на вавилонския плен, през VI век пр. Хр. Пророкът беше писал и друго послание до пленниците: строете къщи, садете градини, молете се за града, в който сте попаднали. Тук ги подготвя за друга опасност. Във Вавилон ще видят богове от сребро, от злато и от дърво, носени на рамена в бляскави шествия, и народите, които се боят от тях. Пленът ще бъде дълъг, а изкушението — голямо: да правиш и ти каквото правят всички. Посланието отговаря с яснота, почти с усмивка, като показва колко безсилен е идолът.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Идолът не може нищо\u003c/strong> — Не може сам да се почисти от праха, не се пази от крадците и, ако падне, не се изправя.\u003c/li>\u003cli>\u003cstrong>Припевът на посланието\u003c/strong> — Повтаря се много пъти: оттук се познава, че те не са богове; затова не се бойте от тях.\u003c/li>\u003cli>\u003cstrong>Изкушението на тълпата\u003c/strong> — Опасността не е статуята, а страхът да бъдеш различен от всички.\u003c/li>\u003cli>\u003cstrong>Поклонението от сърце\u003c/strong> — Когато видите тълпата да се покланя, кажете си в ума: „Тебе трябва да се покланяме, Владико!“\u003c/li>\u003cli>\u003cstrong>Праведният без идоли\u003c/strong> — Заключението: по-добре е човек праведен, който няма идоли.\u003c/li>\u003c/ul>","hristos":"\u003cp>Идолите имат образ, но нямат живот: те са, казва посланието, като плашило в градина, което нищо не опазва. Христос е тъкмо обратното: „образ на невидимия Бог“ (Колосяни 1:15), живият Бог, Който вижда, чува и спасява. Затова, когато благовестието стига до езичниците, апостол Павел ги хвали, че „от идолите се обърнахте към Бога, за да служите на живия и истински Бог“ (1 Солунци 1:9), а св. апостол Иоан завършва посланието си с призива: „Чеда, пазете себе си от идолите“ (1 Иоан 5:21). Днешните идоли вече не са от дърво: апостолът нарича користолюбието „идолослужение“ (Колосяни 3:5). Въпросът на посланието си остава същият: от кого се боиш и на кого се надяваш?\u003c/p>","parinti":"\u003cp>За това послание Отците са писали съвсем малко. Св. Кирил Иерусалимски и св. Атанасий Велики, когато изброяват книгите на Писанието, го броят заедно с Иеремия, Варух и Плачовете. Св. Киприан Картагенски, като тълкува молитвата „Отче наш“, привежда думите му за поклонението в ума, за да покаже, че Бог чува сърцето, а не силния глас. А св. Иоан Дамаскин, без да тълкува тази книга, изяснил едно разграничение, което ще ти трябва, когато я четеш: иконата не е идол, защото Бог стана човек и стана видим, а почитта към иконата се възнася към първообраза — към Онзи, Който е изобразен.\u003c/p>","slujbe":"\u003cp>Посланието на Иеремия не се чете на богослуженията на Църквата. Същата мисъл обаче я чуваш да се пее на празничната утреня, на полиелея: „Езическите идоли са сребро и злато, дело на човешки ръце“ (Псалом 134:15). Намираш я и в Псалом 113. Който е прочел посланието, разбира по-добре защо Църквата, когато възпява живия Бог, си спомня и за боговете, които не са богове.\u003c/p>","rugaciune":"\u003cp>Владико, Тебе трябва да се покланяме. Ти си живият Бог, Който вижда, чува и спасява. Избави ме от страха пред тълпата и от идолите, които сам си правя от нещата на този свят. Дай ми сърце, което да Ти се покланя тайно, дори когато всички около мене се покланят на някой друг. Амин.\u003c/p>"},"q":[{"q":"Какво казва посланието на пленниците за идолите на Вавилон?","o":["Че не са богове и не бива да се боят от тях","Че трябва да ги почитат, за да не се разгневи царят","Че са по-силни от Бога на Израил"]},{"q":"Какво трябва да казва в ума си вярващият, когато види тълпата да се покланя на идолите?","o":["„Тебе трябва да се покланяме, Владико!“","Ще се поклоня и аз, като всички останали","Вече няма никакъв бог"]}]}},{"n":44,"slug":"2-ezdra","abbr":"2 Езд","cap":9,"s":"nekanonichni","dk":true,"bg":{"nume":"Втора книга на Ездра","scurt":"Завръщането от плена и съграждането на храма, с разказа за тримата младежи в двора на Дарий: истината надвива всичко.","verset":{"t":"„Велика е истината и най-силна от всичко“","r":"2 Ездра 4:41"},"incepe":"2 Ездра 3–4 · 1 · 9:37-55","p":{"autor":"\u003cp>Авторът на книгата не е известен. Тя разказва отново, с любов към храма, събития, които намираш и в края на Втора книга Паралипоменон, в Първа книга на Ездра и в книгата на Неемия. В нашата Библия, Синодалното издание, тя се нарича „Втора книга на Ездра“, защото идва след Първа книга на Ездра (каноничната) и книгата на Неемия; в гръцката Библия същата книга се нарича „Първа Ездра“, а в латинската — „Трета Ездра“. Синодалното издание я брои сред „неканоничните“ книги, които се четат за душевна полза; протестантските Библии я нямат. Има девет глави и не бива да се бърка с Трета книга на Ездра — книгата на виденията, която също е в нашата Библия и има свой корен в края на тази група.\u003c/p>","context":"\u003cp>Книгата започва с празник: Пасхата, която цар Иосия извършил в Иерусалим. Следва падението: неверните царе, изгарянето на храма, пленът във Вавилон. После Бог подбужда сърцето на Кир, персийския цар, и той позволява на пленниците да се върнат. Частта, която няма да намериш никъде другаде, е в глави 3 и 4. Трима младежи от царската стража на Дарий се състезават: кое е най-силното на света? Единият казва: виното. Другият: царят. Третият, Зоровавел, казва: жените — но над всичко побеждава истината. Той печели и като награда иска да бъде съграден отново Иерусалим. Книгата завършва с Ездра, който чете Закона пред народа.\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Истината побеждава\u003c/strong> — Виното, царят и хората преминават и грешат; истината „пребъдва и остава силна винаги“ (4:38).\u003c/li>\u003cli>\u003cstrong>Бог подбужда сърцата на царете\u003c/strong> — Кир и Дарий, езичници, стигат дотам да служат на Господния замисъл.\u003c/li>\u003cli>\u003cstrong>Домът Господен\u003c/strong> — Първото, което трябва да се издигне след плена, не са стените, а жертвеникът и храмът.\u003c/li>\u003cli>\u003cstrong>Пречки и търпение\u003c/strong> — Враговете спират делото за години, но накрая то се довършва.\u003c/li>\u003cli>\u003cstrong>Завръщането към Закона\u003c/strong> — Ездра чете, народът плаче, а после е пратен да се радва и да дели с онези, които нямат.\u003c/li>\u003c/ul>","hristos":"\u003cp>Зоровавел хвали истината така, сякаш е живо лице: в нея няма пристрастие, няма неправда, нейни са силата и царството през всички векове (2 Ездра 4:39-40). Няколко века по-късно Един ще каже: „Аз съм пътят и истината и животът“ (Иоан 14:6), и ще стои вързан пред Пилат, който пита: „що е истина?“ (Иоан 18:38). Тогава истината изглеждаше победена; на третия ден тя победи. Самият Зоровавел е един от прадедите на Спасителя по плът (Матей 1:12-13). А храмът, който той издига от развалините, сочи към друг храм, за който Христос казва: „разрушете тоя храм, и в три дни ще го въздигна“ — като говори за храма на тялото Си (Иоан 2:19-21).\u003c/p>","parinti":"\u003cp>Отците са писали малко за тази книга, но словото ѝ за истината не им е убягнало. Блажени Августин в „За Божия град“ казва, че в похвалата на истината, която надвива всичко, може да се види пророчество за Христос, защото от Евангелието знаем, че Христос е Истината. Св. Киприан Картагенски в едно от посланията си привежда същото слово — истината пребъдва и остава силна довека, — за да покаже, че човешкият обичай, колкото и стар да е, не може да устои пред истината. Това е всичко, но не е малко: древните са чели разказа от двора на Дарий с мисъл, обърната към Христос.\u003c/p>","slujbe":"\u003cp>Втора книга на Ездра не се чете на богослуженията на Църквата. Четеш я у дома, като полезен разказ. Но има една страница, която ще ти се стори позната: в края Ездра изнася книгата на Закона пред целия народ, чете я от сутринта до пладне, а левитите поучават народа и обясняват прочетеното (2 Ездра 9). Прилича на онова, което преживяваш на Божествената литургия, когато се четат Апостолът и Евангелието и свещеникът ги тълкува в проповедта.\u003c/p>","rugaciune":"\u003cp>Господи, Боже на истината, Ти си по-силен от всичко. Съгради отново в мене онова, което съм оставил да се срути, и направи сърцето ми Твой дом. Когато лъжата изглежда, че побеждава, задръж ме близо до Себе Си, Ти, Който си Пътят, Истината и Животът. И ми дай радостта на онези, които се връщат у дома от плена. Амин.\u003c/p>"},"q":[{"q":"Кое според Зоровавел е най-силно от всичко?","o":["Истината","Виното","Царят"]},{"q":"Какво иска Зоровавел като награда от цар Дарий?","o":["Да бъдат съградени отново Иерусалим и храмът","Злато и сребро за себе си","Да стане цар във Вавилон"]}]}},{"n":45,"slug":"premadrost-solomonova","abbr":"Прем","cap":19,"s":"nekanonichni","dk":true,"bg":{"nume":"Премъдрост Соломонова","scurt":"Бог не е създал смъртта: душите на праведните са в Неговата ръка, и Неговата Премъдрост води човека към безсмъртие.","verset":{"t":"„А душите на праведните са в Божия ръка, и мъка няма да ги докосне“","r":"Премъдрост Соломонова 3:1"},"incepe":"Премъдрост Соломонова 1–3 · 7 · 9","p":{"autor":"\u003cp>Книгата носи името на цар Соломон и говори с неговия глас: молитвата в глава 9 е молитвата на младия цар, който иска премъдрост. Запазена е на гръцки, в превода на Седемдесетте, и някои Отци, като блажени Иероним и блажени Августин, смятат, че я е написал по-късен мъдрец, в духа на Соломон. Нашата Библия, Синодалното издание, я брои сред „неканоничните“ книги, които се четат за душевна полза; протестантските Библии я нямат.\u003c/p>","context":"\u003cp>На картата на Писанието книгата стои в края на Стария Завет, в последните векове преди идването на Спасителя. Много иудеи живеели тогава далеч от земята си, в големи градове като Александрия Египетска, заобиколени от философи, от бляскави идоли и от хора, които казвали: животът е кратък, да се наслаждаваме, докато можем, защото след смъртта няма нищо. Книгата отговаря на това изкушение. Има три части: участта на праведните и на нечестивите (глави 1–5), похвалата на Премъдростта (6–9) и делото на Премъдростта в историята, от Адам до излизането от Египет (10–19).\u003c/p>","teme":"\u003cul>\u003cli>\u003cstrong>Бог не е създал смъртта\u003c/strong> — Той създаде човека за нетление; смъртта влезе в света „по завист от дявола“ (1:13; 2:23-24).\u003c/li>\u003cli>\u003cstrong>Безсмъртието на праведните\u003c/strong> — В очите на безумните те изглеждат мъртви, но са в мир.\u003c/li>\u003cli>\u003cstrong>Премъдростта се изпросва\u003c/strong> — Не се наследява и не се купува: Соломон я получава с молитва (глава 9).\u003c/li>\u003cli>\u003cstrong>Безумието на идолите\u003c/strong> — От красотата на творенията човек е трябвало да познае техния Създател (глава 13).\u003c/li>\u003cli>\u003cstrong>Божията милост\u003c/strong> — Той обича всичко, което съществува, и изобличава хората малко по малко, за да се покаят (глава 11).\u003c/li>\u003c/ul>","hristos":"\u003cp>В глава 2 нечестивите се съвещават против праведника: той казва, че е Божие чедо, да го изпитаме с ругатни и мъчения, да го осъдим на позорна смърт и да видим дали Бог ще го избави (2:12-20). Почти същите думи се чуват в подножието на Кръста: „надяваше се на Бога, нека сега Го избави“ (Матей 27:43). После Премъдростта е наречена „отраз на вечната светлина, чисто огледало на действието на Бога и образ на благостта Му“ (7:26); Новият Завет говори по същия начин за Сина, Който е „сияние на славата“ на Отца (Евреи 1:3), а апостол Павел нарича Христос „Божия сила и Божия премъдрост“ (1 Коринтяни 1:24). А едно слово за Ноевия ковчег — „Благословено е дървото, чрез което правда се върши!“ (14:7) — християните са го чели с мисъл за дървото на Кръста.\u003c/p>","parinti":"\u003cp>Св. Атанасий Велики, в празничното си послание за книгите на Писанието, поставя Премъдрост Соломонова на първо място сред книгите, които Отците са определили да се четат от новоприходящите във вярата, които искат да се научат на словото на благочестието. Самият той, като пише против езичниците, се опира на думите ѝ, че измислянето на идоли е начало на блуд (14:12). Блажени Августин, в „За Божия град“, показва, че в заговора на нечестивите против праведника ясно е предречено Страданието Христово. Отците често са цитирали тази книга, когато говорят за Сина като Премъдрост на Отца.\u003c/p>","slujbe":"\u003cp>Тази книга ще я чуваш често. На вечернята на празниците на светиите — мъченици, светители, преподобни — паремиите от Стария Завет много пъти се вземат от Премъдрост Соломонова: за душите на праведните, които са в Божия ръка (3:1-9), за праведниците, които живеят довека (5:15–6:3), и за праведника, който, и да умре рано, ще бъде в покой (4:7-15). Когато четецът обяви четиво от Премъдрост Соломонова, ще знаеш коя книга отваря.\u003c/p>","rugaciune":"\u003cp>Боже на отците и Господи на милостта, Който си сътворил всичко със словото Си, дай ми Премъдростта, която седи до Твоя престол. Прати я от светите Си небеса, за да бъде с мене и да ме учи какво е благоугодно пред Тебе. Пази душата ми в Своята ръка, сега и в часа на моята смърт. Амин.\u003c/p>"},"q":[{"q":"Какво казва книгата за смъртта?","o":["Че Бог не е създал смъртта; тя влезе в света по завист от дявола","Че смъртта е краят на всичко","Че Бог е създал човека, за да умре"]},{"q":"Кога чуваш на богослуженията четива от Премъдрост Соломонова?","o":["На вечернята, сред паремиите на празниците на светиите","На шестия час през Великия пост","Никога не се чете на богослуженията"]}]}},{"n":46,"slug":"sirah","abbr":"Сир","cap":51,"s":"nekanonichni","dk":true,"bg":{"nume":"Премъдрост на Иисуса, син Сирахов","scurt":"Един мъдрец от Иерусалим те учи как да живееш в страх Божий у дома, на трапезата, сред приятелите и в скръбта.","verset":{"t":"„Синко, кога пристъпваш да служиш Господу Богу, приготви душата си за изкушение“","r":"Сирах 2:1"},"incepe":"Сирах 1–3 · 6 · 24 · 44","p":{"autor":"\u003cp>Това е единствената книга от Стария Завет, в която авторът сам се представя: Иисус, син Сирахов, книжник от Иерусалим, който писал на еврейски около 180 г. пр. Хр. Внукът му занесъл книгата в Египет и я превел на гръцки след 132 г.; той написал и краткия пролог. Книгата е запазена в превода на Седемдесетте. Нашата
