утрин в шестопсалмието на утренята и се пее в неделя на Божествената литургия като първи антифон: благослови и ти Господа за един конкретен дар от днешния ден."},{"n":30,"ref":"Иов 1–2","titlu":"Праведният Иов","gand":"Иов губи всичко и благославя името Господне, и думите му, „да бъде благословено името Господне“, се чуват в края на Божествената литургия."},{"n":31,"ref":"Иов 38 и 42","titlu":"Господ отговаря на Иов","gand":"Бог не обяснява на Иов страданието му, а му се явява: понякога отговорът е самото Негово присъствие."},{"n":32,"ref":"Притчи Соломонови 3 и 8–9","titlu":"„Премъдростта си съгради дом“","gand":"„Надявай се на Господа от все сърце и не се осланяй на твоя разум“ (Притчи 3:5)."},{"n":33,"ref":"Еклисиаст 3 и 12, Песен на песните 2","titlu":"Всичко си има време","gand":"Всичко има своето време, а изводът на Еклисиаста е прост: бой се от Бога и пази Неговите заповеди (Еклисиаст 12:13)."},{"n":34,"ref":"Премъдрост Соломонова 2–3","titlu":"Душите на праведните","gand":"„А душите на праведните са в Божия ръка“ (Премъдрост Соломонова 3:1): слово, което чуваш в четивата на вечернята на празниците на светиите."},{"n":35,"ref":"Премъдрост на Иисуса, син Сирахов 1–2","titlu":"Страхът Господен — начало на мъдростта","gand":"„Синко, кога пристъпваш да служиш Господу Богу, приготви душата си за изкушение“ (Сирах 2:1): изпитанието не означава изоставеност."},{"n":36,"ref":"Псалми 83, 120 и 129","titlu":"По пътя към дома Господен","gand":"„От дън душа викам към Тебе, Господи“ (Псалом 129:1): откъде викаш ти днес?"}]},{"titlu":"Етап 6 — Гласът на пророците (дни 37–43)","desc":"Пророците призовават народа да се върне и векове по-рано предвещават идването на Спасителя.","zile":[{"n":37,"ref":"Исаия 6–7","titlu":"„Свет, свет, свет“ и знамението на Девата","gand":"Песента на серафимите се чува на всяка Божествена литургия, а знамението на Девата, която ще зачене и ще роди Син, предвещава Рождество Христово."},{"n":38,"ref":"Исаия 9 и 11","titlu":"Детето на обещанието","gand":"„Защото Младенец ни се роди — Син ни се даде“ (Исаия 9:6). Пророкът Му дава имената Чуден, Съветник, Бог крепък, Отец на вечността, Княз на мира, а църковните песни, които следват текста на Седемдесетте, Го наричат и Ангел на великия съвет: кое от имената на Христос ти говори най-много?"},{"n":39,"ref":"Исаия 52–53","titlu":"Страдащият Раб Господен","gand":"Прочети бавно глава 53, сякаш стоиш в подножието на Кръста: „чрез Неговите рани ние се изцелихме“ (Исаия 53:5)."},{"n":40,"ref":"Иеремия 1 и 31","titlu":"Новият завет","gand":"Бог обещава закон, написан в сърцата, а не на каменни плочи. От това обещание получава името си Новият Завет (Евреи 8:8)."},{"n":41,"ref":"Иезекиил 36–37","titlu":"Новото сърце и сухите кости","gand":"Видението за костите, които оживяват, се чете на утренята на Велика събота, която в повечето храмове се служи в петък вечерта, с шествието с Плащаницата: какво е сухо в теб и чака Духа?"},{"n":42,"ref":"Иона 1–4","titlu":"Иона и Ниневия","gand":"Четири кратки глави: трите дни в утробата на кита са знамението на Възкресението (Матей 12:40), и книгата се чете цялата сутринта на Велика събота."},{"n":43,"ref":"Осия 6, Амос 5 и Михей 6","titlu":"„Милост искам, а не жертва“","gand":"Трима пророци, едно и също слово, което ще повтори Сам Христос (Матей 9:13): Бог иска правда, милост и смирение, не само спазени форми."}]},{"titlu":"Етап 7 — Пленът, завръщането и очакването (дни 44–51)","desc":"Във Вавилон и след завръщането в родината народът се учи да остане верен и да чака.","zile":[{"n":44,"ref":"Даниил 3, с молитвата на Азария и песента на тримата момци","titlu":"Тримата момци в пещта","gand":"Тяхната песен, „Всички дела Господни, благословете Господа“ (Даниил 3:57), звучи в осмата песен на утренята: можеш ли да благославяш Бога и сред огъня?"},{"n":45,"ref":"Даниил 6–7","titlu":"Лъвовият ров и Синът Човечески","gand":"Даниил се моли три пъти на ден, с прозорци, отворени към Иерусалим, каквото и да му струва."},{"n":46,"ref":"Псалом 136, Първа книга на Ездра 1 и Неемия 8","titlu":"От реките Вавилонски — обратно у дома","gand":"„При реките Вавилонски“ се пее на утренята в трите недели преди Великия пост. Народът плаче, когато слуша Закона, а Неемия му казва: „радостта пред Господа е подкрепа за вас“ (Неемия 8:10)."},{"n":47,"ref":"Товит 4 и 12","titlu":"Товит и ангел Рафаил","gand":"Една от 11-те неканонични книги, за милостинята, семейството и ангела, който невидимо придружава пътя на човека."},{"n":48,"ref":"Иудит 8–9 и 13","titlu":"Иудит","gand":"Една вдовица се моли и пости, а после действа смело: молитвата предхожда делото."},{"n":49,"ref":"Първа книга Макавейска 1–2","titlu":"Мататия и синовете му","gand":"Когато вярата е забранена със закон, някой трябва да каже „не“: къде ти е трудно да останеш верен?"},{"n":50,"ref":"Втора книга Макавейска 6–7","titlu":"Седемте братя и майка им","gand":"Светите седем мъченици Макавеи, които се почитат на 1 август заедно с майка си Соломония и стареца Елеазар, умират с надеждата за възкресение."},{"n":51,"ref":"Варух 3, Михей 5 и Малахия 3","titlu":"Очакването на Спасителя","gand":"От Витлеем ще излезе Онзи, Който ще пасе народа, а пред Него ще върви вестител; пророк Варух вижда отдалеч, че Бог ще се яви на земята и ще живее между хората (Варух 3:38): Старият Завет се затваря с поглед, обърнат към Христос."}]},{"titlu":"Етап 8 — Рождество Господне и началото на проповедта (дни 52–59)","desc":"Обещанията се изпълняват: Словото става плът и живее между нас.","zile":[{"n":52,"ref":"Лука 1","titlu":"Благовещение","gand":"„Ето рабинята Господня; нека ми бъде по думата ти“ (Лука 1:38): отговорът на Богородица е, както пеем на 25 март, началото на нашето спасение."},{"n":53,"ref":"Лука 2","titlu":"Рождество Христово","gand":"Пастирите тичат, Симеон Го взема на ръце, а Мариам пази всичко това в сърцето си: ти как Го посрещаш?"},{"n":54,"ref":"Иоан 1","titlu":"„В начало беше Словото“","gand":"Това е Евангелието на Божествената литургия в пасхалната нощ: Онзи, Който се роди във Витлеем, е Онзи, чрез Когото всичко е станало."},{"n":55,"ref":"Матей 3–4","titlu":"Кръщението и изкушението","gand":"На Иордан се явява Светата Троица, затова празникът се нарича Богоявление, а в пустинята Господ побеждава изкушението със словото на Писанието."},{"n":56,"ref":"Матей 5","titlu":"Блаженствата","gand":"Пеем ги в неделя на Божествената литургия като трети антифон: кое от тях чувстваш най-далеч от себе си?"},{"n":57,"ref":"Матей 6–7","titlu":"„Отче наш“","gand":"Кажи днес „Отче наш“ бавно, прошение по прошение, сякаш го чуваш за първи път."},{"n":58,"ref":"Иоан 2–3","titlu":"Сватбата в Кана и Никодим","gand":"„Защото Бог толкоз обикна света, че отдаде Своя Единороден Син“ (Иоан 3:16): прочети стиха, сякаш е казан за теб."},{"n":59,"ref":"Иоан 4","titlu":"Самарянката","gand":"Господ иска вода от жена, която всички отбягваха, и ѝ дарява живата вода. Църквата я почита като света Фотина."}]},{"titlu":"Етап 9 — Чудесата, притчите и пътят към Иерусалим (дни 60–67)","desc":"Господ изцелява, учи с притчи и подготвя учениците Си за Кръста.","zile":[{"n":60,"ref":"Марк 1–2","titlu":"Първите изцеления","gand":"Разслабления го носят при Христос четирима приятели: кого можеш да понесеш ти с молитвата си?"},{"n":61,"ref":"Марк 4–5","titlu":"Сеячът и утихналата буря","gand":"Едно и също слово пада на четири вида почва: каква почва е днес сърцето ти?"},{"n":62,"ref":"Лука 10 и 15","titlu":"Милосърдният самарянин и блудният син","gand":"Бащата тича да посрещне сина, който се връща: покаянието е пътят към дома, не наказание."},{"n":63,"ref":"Иоан 6","titlu":"Хлябът на живота","gand":"Тези думи се изпълняват на всяка Божествена литургия, в Светото Причастие."},{"n":64,"ref":"Матей 16–17","titlu":"Изповедта на Петър и Преображението","gand":"Преди Кръста Господ показва на учениците славата Си, доколкото можеха да я видят, както пеем на 6 август."},{"n":65,"ref":"Иоан 9–10","titlu":"Слепородният и Добрият Пастир","gand":"Овцете познават гласа на Пастира: как се учиш да различаваш Неговия глас от другите гласове?"},{"n":66,"ref":"Иоан 11","titlu":"Възкресяването на Лазар","gand":"„Аз съм възкресението и животът“ (Иоан 11:25): Господ плаче на гроба на приятеля Си, а после го призовава да излезе навън."},{"n":67,"ref":"Матей 25","titlu":"Страшният съд","gand":"На Съда ще бъдем питани за гладните, жадните, странниците, голите, болните и затворниците. Това е Евангелието на Месни заговезни, неделята на Страшния съд."}]},{"titlu":"Етап 10 — Страданията и Възкресението (дни 68–74)","desc":"Сърцето на Евангелието: Тайната вечеря, Кръстът и празният гроб.","zile":[{"n":68,"ref":"Захария 9 и Матей 21","titlu":"Входът в Иерусалим","gand":"Царят идва кротък, възседнал на младо осле, както го беше предвестил пророк Захария."},{"n":69,"ref":"Иоан 13–14","titlu":"Тайната вечеря","gand":"Учителят умива нозете на учениците и им оставя новата заповед на любовта."},{"n":70,"ref":"Иоан 15–17","titlu":"Лозата и пръчките","gand":"„Пребъдете в Мене, и Аз във вас“ (Иоан 15:4): молитвата на Господа в глава 17 обгръща и теб. Тези глави са първото, най-дългото от дванадесетте Евангелия, които се четат на Велики четвъртък вечерта."},{"n":71,"ref":"Матей 26","titlu":"Гетсимания","gand":"„Обаче не както Аз искам, а както Ти“ (Матей 26:39): най-трудната и най-чистата молитва."},{"n":72,"ref":"Матей 27 и Псалом 21","titlu":"Разпятието","gand":"На Кръста Господ се моли с началото на Псалом 21 (22 в протестантските Библии): прочети псалма до края и виж как завършва."},{"n":73,"ref":"Матей 28 и Иоан 20","titlu":"Възкресението","gand":"Мария Магдалина Го разпознава в мига, в който Го чува да я нарича по име."},{"n":74,"ref":"Лука 24 и Псалом 117","titlu":"Пътят към Емаус","gand":"Господ обяснява на учениците Писанията и бива познат при преломяването на хляба: „Тоя ден е Господ сътворил: да се зарадваме и да се развеселим в него“ (Псалом 117:24)."}]},{"titlu":"Етап 11 — Ражда се Църквата (дни 75–78)","desc":"Светият Дух слиза и Евангелието тръгва от Иерусалим към всички народи.","zile":[{"n":75,"ref":"Деяния 1–2","titlu":"Възнесението и Петдесетница","gand":"Първите християни постоянстваха в учението на апостолите, в общуването, в хлеболомението и в молитвите (Деяния 2:42)."},{"n":76,"ref":"Деяния 6–7","titlu":"Свети Стефан, първомъченик и архидякон","gand":"Първият мъченик умира, като се моли за онези, които го убиват, както неговият Господ."},{"n":77,"ref":"Деяния 9–10","titlu":"Савел на пътя за Дамаск","gand":"Гонителят става апостол: никой не е твърде далеч за Божията благодат."},{"n":78,"ref":"Деяния 15 и 17","titlu":"Апостолският събор и Павел в Ареопага","gand":"Църквата решава заедно, водена от Светия Дух, както ще прави винаги на съборите."}]},{"titlu":"Етап 12 — Посланията на апостолите (дни 79–87)","desc":"Апостолите учат църквите как се живее, ден след ден, новият живот в Христа.","zile":[{"n":79,"ref":"Римляни 8 и 12","titlu":"Животът по Духа","gand":"Нищо не може да ни отлъчи от любовта Божия в Христа Иисуса, нашия Господ."},{"n":80,"ref":"1 Коринтяни 13 и 15","titlu":"Любовта и възкресението","gand":"Сложи името си на мястото на думата „любов“ в глава 13 и виж докъде стигаш."},{"n":81,"ref":"Галатяни 5 и Ефесяни 4","titlu":"Плодът на Духа и новият човек","gand":"Любов, радост, мир, дълготърпение: кой плод на Духа ти липсва най-много?"},{"n":82,"ref":"Филипяни 2 и Колосяни 1","titlu":"Смирението на Христос","gand":"Онзи, Който е образ на невидимия Бог, смири Себе Си, „бидейки послушен дори до смърт, и то смърт кръстна“ (Филипяни 2:8)."},{"n":83,"ref":"1 Солунци 4–5 и 2 Тимотей 3","titlu":"„Непрестанно се молете“","gand":"Цялото Писание е боговдъхновено и полезно: след почти три месеца каква полза усети ти?"},{"n":84,"ref":"Евреи 11–12","titlu":"Облакът от свидетели","gand":"Всички праведници, които срещна по този път, сега стоят около теб като облак от свидетели."},{"n":85,"ref":"Иаков 1–2","titlu":"Вярата и делата","gand":"Вярата без дела е мъртва: какво малко дело можеш да направиш още днес?"},{"n":86,"ref":"1 Петър 1–2","titlu":"Живи камъни","gand":"Призван си да бъдеш жив камък в духовния дом на Църквата, а не зрител отстрани."},{"n":87,"ref":"1 Иоан 3–4","titlu":"„Бог е любов“","gand":"Който не люби брата си, когото е видял, не може да люби Бога, Когото не е видял."}]},{"titlu":"Етап 13 — Откровението: новото небе и новата земя (дни 88–90)","desc":"Краят на пътя не е ужас, а една небесна литургия и един град, в който Бог живее с хората.","zile":[{"n":88,"ref":"Откровение 1 и 4–5","titlu":"Престолът и Агнецът","gand":"Иоан вижда виденията на остров Патмос: цялото небе пее „Свет, свет, свет“, както във видението на Исаия и както на Божествената литургия."},{"n":89,"ref":"Откровение 7 и 19, Трета книга на Ездра 2","titlu":"Множеството в бели дрехи и сватбата на Агнеца","gand":"Множество, което никой не може да преброи, от всички народи, стои пред престола. Същото вижда и Ездра в края на втората глава от Трета книга на Ездра: на планината Сион безброй хора славят Господа с песни, а сред тях висок младеж слага венци на главите им — това е Синът Божий, Когото те са изповядали в света."},{"n":90,"ref":"Откровение 21–22","titlu":"Новото небе и новата земя","gand":"Свещеното Писание започва в една градина и завършва в един град, осветяван от Агнеца: „Амин, да, дойди, Господи Иисусе!“ (Откровение 22:20)"}]}]}},"pasi":{"bg":[{"titlu":"Утихни","min":2,"text":"Застани пред иконата, прекръсти се и дишай бавно. Остави настрана грижите на деня и кажи в себе си: „Господи, ето ме пред Тебе.“"},{"titlu":"Призови Светия Дух","min":1,"text":"Кажи бавно „Царю небесни“ или стиха: „Отвори очите ми, и ще видя чудесата на Твоя закон.“ Помоли Господ да ти отвори ума, за да разбереш това, което ще прочетеш."},{"titlu":"Чети бавно","min":3,"text":"Прочети избрания текст веднъж, без бързане, ако можеш полугласно. После го прочети още веднъж. Не бързай да свършиш: слушай го като слово, казано на теб."},{"titlu":"Спри се на една дума","min":3,"text":"Остани при стиха, който те докосна: утешава те, изобличава те или те изненадва. Повтори го няколко пъти в себе си. Попитай се какво ти показва за Бога и какво — за теб."},{"titlu":"Отговори на Бога","min":3,"text":"Сега говори ти, със свои думи: благодари, поискай прошка, поискай помощ за себе си и за близките си. Ако не ти идват думи, кажи „Господи, помилуй“ или остани в мълчание пред Него."},{"titlu":"Пази словото през деня","min":1,"text":"Избери стиха, който взимаш със себе си днес, и го кажи още веднъж. Благодари на Господа за словото, което получи, кажи „Господи Иисусе Христе, Сине Божий, помилуй ме“ и се прекръсти."}]},"md":{"bg":{"rugaciune":"\u003ch1>Малък наръчник за молитва със Светото писание\u003c/h1>\u003cp>Може би ти се е случвало и на теб: отваряш Библията, прочиташ една страница, затваряш я и не знаеш какво да правиш с прочетеното. Този наръчник ти помага да направиш следващата крачка: от четенето към молитвата. Това не е нов метод. Това е начинът, по който Църквата винаги е чела Писанието: без бързане, с внимание, изправена пред Бога.\u003c/p>\u003cp>Нужни са ти само десет до петнадесет минути, една Библия и желание да слушаш.\u003c/p>\u003ch2>Защо Църквата се моли с Писанието\u003c/h2>\u003cp>Влез на която и да е служба и се заслушай: почти всичко, което се пее и чете, идва от Свещеното Писание. Вечернята започва с Псалом 103, предначинателния, утренята — с шестопсалмието, а по устава целият Псалтир се прочита на службите всяка седмица. Псалтирът е всъщност молитвеникът на Църквата. С псалмите са се молили Давид и пророците, с тях са се молили Богородица и апостолите. Със стих от псалом на устните Си се помоли Сам Спасителят на Кръста (Псалом 21:2).\u003c/p>\u003cp>Свещеното Писание не е книга \u003cem>за\u003c/em> Бога, която учиш като учебник. То е Божието слово \u003cem>към теб\u003c/em>. А когато някой ти говори, ти му отговаряш. Четенето е слушане, молитвата е отговор. Затова Светите Отци винаги ги държат заедно: четенето храни молитвата, а молитвата отваря смисъла на прочетеното.\u003c/p>\u003cp>Тук често ще срещаш една дума: \u003cstrong>внимание\u003c/strong>. Тя означава вниманието на сърцето, не само на очите. „Да внимаваме!“ се чува в храма преди Апостола и преди Евангелието. Същия призив взимаш със себе си у дома, всеки път когато отваряш Библията.\u003c/p>\u003ch2>Как се подготвяш\u003c/h2>\u003cp>Подготовката трае две минути, но променя всичко. Няколко прости неща:\u003c/p>\u003cul>\u003cli>\u003cstrong>Мястото.\u003c/strong> Ако у дома имаш кът с икони, там е най-доброто място. Ако нямаш, избери тих ъгъл и сложи пред себе си икона на Христос или на Богородица.\u003c/li>\u003cli>\u003cstrong>Кандилото.\u003c/strong> Запали кандилото или една свещ. Светлината ѝ ти напомня, че стоиш пред Онзи, Който каза: „Аз съм светлината на света“ (Иоан 8:12).\u003c/li>\u003cli>\u003cstrong>Часът.\u003c/strong> Избери час, който може да се повтаря: сутрин, преди да започне денят, или вечер, когато домът утихне. По-добре десет минути всеки ден, отколкото един час веднъж в месеца.\u003c/li>\u003cli>\u003cstrong>Тишината.\u003c/strong> Ако четеш от телефона, изключи звуците и известията. Кажи на близките си, че имаш нужда от няколко минути.\u003c/li>\u003cli>\u003cstrong>Тялото.\u003c/strong> Започни прав, с лице към иконата. За четенето можеш да седнеш. Спокойното тяло помага на ума да се успокои.\u003c/li>\u003cli>\u003cstrong>Книгата.\u003c/strong> Използвай православна Библия с текста, който се чете в Църквата: Синодалното издание на Българската православна църква. За начало дръж близо до себе си Евангелието и Псалтира.\u003c/li>\u003c/ul>\u003cp>После се прекръсти, бавно и цялостно, и кажи \u003cstrong>началните молитви\u003c/strong>, както ги намираш във всеки молитвослов: „Слава на Тебе, Боже наш, слава на Тебе!“, „Царю небесни“, Трисветото („Светий Боже“), „Пресвета Троице“ и „Отче наш“. Ако още не ги знаеш наизуст, прочети ги от книгата. Ако имаш съвсем малко време, кажи поне „Царю небесни“ и „Отче наш“.\u003c/p>\u003ch2>Молитвата преди четенето\u003c/h2>\u003cp>Молитвата, с която Църквата призовава Светия Дух в началото на всяко добро дело, е тази:\u003c/p>\u003cblockquote>\u003cp>Царю небесни, Утешителю, Душе на Истината, Който си навсякъде и всичко изпълваш, Съкровище на благата и Подателю на живота, дойди и се всели в нас, и ни очисти от всяка сквернота, и спаси, Благий, нашите души.\u003c/p>\u003c/blockquote>\u003cp>На Божествената литургия, преди четенето на Евангелието, свещеникът казва една молитва, която започва с думите: „Човеколюбче Владико, дай да светне в сърцата ни нетленната светлина на Твоето богопознание…“. Ще я намериш цялата в Служебника и в някои молитвослови.\u003c/p>\u003cp>А ако искаш нещо съвсем кратко, вземи един стих от Псалтира:\u003c/p>\u003cblockquote>\u003cp>Отвори очите ми, и ще видя чудесата на Твоя закон. (Псалом 118:18)\u003c/p>\u003c/blockquote>\u003cp>Тоест: Господи, отвори очите ми, за да видя чудното в Твоето слово.\u003c/p>\u003ch2>Методът в шест стъпки\u003c/h2>\u003cp>Стъпките по-долу не са рецепта. Те са пътека, по която са вървели мнозина преди теб. След няколко дни няма да ти се налага да ги броиш.\u003c/p>\u003ch3>1. Утихни\u003c/h3>\u003cp>Остани една минута, без да правиш нищо. Дишай бавно. Остави грижите на деня, както оставяш палтото си на вратата. Кажи в себе си: „Господи, ето ме пред Тебе.“ Не прогонвай мислите насила: остави ги да минат и се върни към иконата.\u003c/p>\u003ch3>2. Призови Светия Дух\u003c/h3>\u003cp>Писанието е написано по вдъхновение на Светия Дух и с Неговата помощ се разбира. Кажи „Царю небесни“ или стиха от Псалом 118. Спомни си учениците по пътя към Емаус: възкръсналият Господ им отвори ума, за да разбират Писанията (Лука 24:45). Същото молиш и ти.\u003c/p>\u003ch3>3. Чети бавно\u003c/h3>\u003cp>Избери кратък текст: десет до петнадесет стиха, една притча, един псалом. Прочети го бавно, ако можеш полугласно, за да го чуят и ушите ти. После го прочети още веднъж. Не бързай да свършиш главата. Тук не печели този, който чете много, а този, който слуша добре.\u003c/p>\u003ch3>4. Спри се на една дума\u003c/h3>\u003cp>При второто четене една дума или един стих ще те спре: утешава те, изобличава те, изненадва те или просто ти остава в ума. Остани там. Повтори го няколко пъти. Попитай се: Какво ми показва тук за Бога? Какво ми показва за мен? Така е правила Богородица: „А Мариам спазваше всички тия думи, като ги слагаше в сърцето си“ (Лука 2:19).\u003c/p>\u003ch3>5. Отговори на Бога\u003c/h3>\u003cp>Сега говориш ти. Със свои думи, просто, като дете на Баща си. Ако стихът те утеши, благодари. Ако те изобличи, поискай прошка. Ако ти показа нужда, твоя или на някой друг, поискай помощ. Ако не ти идват думи, кажи „Господи, помилуй“ или остани няколко мига в мълчание. И мълчанието пред Бога е молитва.\u003c/p>\u003ch3>6. Пази словото през целия ден\u003c/h3>\u003cp>Вземи със себе си стиха, на който се спря. Запиши го на листче или в тетрадка. Казвай го наум, когато вървиш, когато чакаш, когато готвиш. Вечерта се запитай къде си го срещнал през деня. Така Писанието излиза от книгата и влиза в живота.\u003c/p>\u003ch2>Молитвата след четенето\u003c/h2>\u003cp>Завърши с благодарност. Можеш да използваш молитвата по-долу; тя не е взета от богослужебните книги, а е написана за този наръчник:\u003c/p>\u003cblockquote>\u003cp>Благодаря Ти, Господи Иисусе Христе, Боже наш, че ме удостои да чуя Твоето слово. Не допускай да се изгуби онова, което днес посея в сърцето ми. Дай ми да опазя словото Ти, да го разбера, доколкото ми е за полза, и да го изпълня в дела. По молитвите на Пречистата Ти Майка и на всички Твои светии. Амин.\u003c/p>\u003c/blockquote>\u003cp>После, ако искаш, кажи „Достойно е“, песента към Богородица, и се прекръсти.\u003c/p>\u003ch2>Как да се молиш с псалмите\u003c/h2>\u003cp>Псалмите имат нещо, което няма никоя друга книга: те ти дават самите думи на молитвата. Не четеш за някой, който се моли; молиш се ти, с гласа на Давид. Помни, че в православната Библия псалмите са номерирани по Седемдесетте, както ги пеем в храма; затова в протестантските Библии и в преводите от еврейския номерът им най-често е с едно по-голям (Псалом 50 тук е Псалом 51 там).\u003c/p>\u003cp>Ето някои псалми за най-обичайните мигове в живота:\u003c/p>\u003cul>\u003cli>\u003cstrong>Сутрин\u003c/strong> — Псалом 62 („Боже, Ти си Бог мой, Тебе търся от ранни зори“) или Псалом 3.\u003c/li>\u003cli>\u003cstrong>Вечер, преди сън\u003c/strong> — Псалом 4 и Псалом 90.\u003c/li>\u003cli>\u003cstrong>Когато те тежи грях\u003c/strong> — Псалом 50, „Помилуй ме, Боже“, псалмът на покаянието.\u003c/li>\u003cli>\u003cstrong>Когато те е страх\u003c/strong> — Псалом 26, „Господ е моя светлина и мое спасение; от кого ще се боя?“, и Псалом 90.\u003c/li>\u003cli>\u003cstrong>Когато си в скръб\u003c/strong> — Псалом 129, „От дън душа викам към Тебе, Господи“, и Псалом 142.\u003c/li>\u003cli>\u003cstrong>Когато се чувстваш сам или изгубен\u003c/strong> — Псалом 22, „Господ е Пастир мой, от нищо не ще се нуждая“.\u003c/li>\u003cli>\u003cstrong>Когато ти липсва Бог\u003c/strong> — Псалом 41 и Псалом 62.\u003c/li>\u003cli>\u003cstrong>Когато искаш да благодариш\u003c/strong> — Псалом 102, „Благославяй, душо моя, Господа“, който чуваш всяка сутрин в шестопсалмието на утренята и в неделя на Божествената литургия.\u003c/li>\u003cli>\u003cstrong>Когато се радваш на красотата на света\u003c/strong> — Псалом 103, псалмът на творението, с който започва вечернята.\u003c/li>\u003cli>\u003cstrong>Когато тръгваш на път\u003c/strong> — Псалом 120, „Подигам очи към планините, отдето ще ми помощ дойде“.\u003c/li>\u003cli>\u003cstrong>Когато искаш просто да славиш Бога\u003c/strong> — Псалом 148 и Псалом 150, хвалитните псалми на утренята.\u003c/li>\u003c/ul>\u003cp>Един съвет: не се плаши от псалмите, които говорят за врагове. Отците ги четат като молитва срещу греха и лошите помисли, а не срещу хората.\u003c/p>\u003cp>Ако искаш да четеш Псалтира поред, той е разделен на двадесет катизми. Колко да четеш на ден и в какъв ред, попитай духовника си.\u003c/p>\u003ch2>Иисусовата молитва и стихът на деня\u003c/h2>\u003cp>Православното предание има една съвсем кратка молитва, която можеш да казваш навсякъде:\u003c/p>\u003cblockquote>\u003cp>Господи Иисусе Христе, Сине Божий, помилуй мене, грешния.\u003c/p>\u003c/blockquote>\u003cp>(Жените казват: „помилуй мене, грешната“.) Тя се нарича \u003cstrong>Иисусова молитва\u003c/strong> и също е направена от Евангелието: от вика на слепия край пътя (Лука 18:38) и от въздишката на митаря (Лука 18:13). Казвай я бавно, като внимаваш в думите, няколко пъти след като завършиш четенето и после през деня, когато се сетиш. За по-дълбоко упражнение в тази молитва е нужно ръководството на духовник; но началото е в ръцете на всеки.\u003c/p>\u003cp>Заедно с нея вземи със себе си \u003cstrong>стиха на деня\u003c/strong>, онзи, на който се спря в четвъртата стъпка. Един-единствен стих, който носиш през целия ден, често прави повече от десет глави, прочетени набързо. Така започваш да разбираш призива на апостола: „Непрестанно се молете“ (1 Солунци 5:17).\u003c/p>\u003ch2>Когато не разбираш или когато умът ти бяга\u003c/h2>\u003cp>\u003cstrong>Когато не разбираш.\u003c/strong> Не се смущавай. И скопецът от Етиопия не разбирал какво чете от Исаия, докато Филип не го попитал „разбираш ли това, що четеш?“ и не му го обяснил (Деяния 8:30-35). Писанието се разбира в Църквата, не сам. Направи така: задръж онова, което си разбрал, и остави настрана, засега, онова, което не си разбрал. Прочети „корена“ на книгата в Картата на Словото, за да видиш къде се намираш. Запиши въпроса си и го задай на свещеника. Не си изграждай сам тълкувания върху трудни стихове.\u003c/p>\u003cp>\u003cstrong>Когато умът ти бяга.\u003c/strong> Случва се на всички — и на начинаещите, и на онези, които се молят от години. Не се карай на себе си и не започвай отначало раздразнен. Върни се спокойно към последната дума, която си прочел с внимание. Чети на глас. Скъси текста. Направи един поклон или се прекръсти. Колкото пъти умът ти избяга, толкова пъти го връщаш: точно това връщане е молитва.\u003c/p>\u003cp>\u003cstrong>Когато не чувстваш нищо.\u003c/strong> Молитвата не се мери с чувствата. Остани верен на своите десет минути и остави плодовете в Божиите ръце.\u003c/p>\u003cp>\u003cstrong>Когато си изпуснал ден или седмица.\u003c/strong> Не се опитвай да наваксаш и не се наказвай. Започни отново днес, от първата стъпка.\u003c/p>\u003ch2>Какво ни учат Светите Отци\u003c/h2>\u003cp>\u003cstrong>Св. Атанасий Велики\u003c/strong>, в едно писмо до свой приятел, Маркелин, показва, че Псалтирът прилича на огледало: всеки вижда в него движенията на собствената си душа и намира подходящите думи за всяко състояние. Там той отбелязва и кой псалом подхожда на скръбта, на радостта или на покаянието.\u003c/p>\u003cp>\u003cstrong>Св. Василий Велики\u003c/strong>, като тълкува Първия псалом, казва, че Псалтирът събира на едно място всичко полезно, което има в другите книги на Писанието, и че прилича на обща лечебница за душите, от която всеки взема лекарството, от което има нужда.\u003c/p>\u003cp>\u003cstrong>Св. Иоан Златоуст\u003c/strong> настойчиво молел вярващите да четат Писанието у дома. Не приемал оправданието, че това е работа на монасите: тъкмо човекът, когото задушават грижите, казвал той, има най-голяма нужда от него. Подканвал ги също да четат предварително у дома Евангелието, което ще се чете в храма.\u003c/p>\u003cp>\u003cstrong>Преп. Иоан Лествичник\u003c/strong> учи, че когато умът се разсейва в молитвата, нашата работа е да го връщаме и да го затваряме в думите на молитвата, колкото пъти е нужно, без да се отчайваме.\u003c/p>\u003ch2>Молитвата в семейството и с децата\u003c/h2>\u003cp>Господ обеща: „Защото, дето са двама или трима събрани в Мое име, там съм Аз посред тях“ (Матей 18:20). Едно семейство, което се моли заедно няколко минути на ден, живее точно това слово.\u003c/p>\u003cul>\u003cli>\u003cstrong>Нека бъде кратка.\u003c/strong> Пет минути вечер, пред иконите, стигат: кръстният знак, „Отче наш“, няколко стиха от Евангелието, една молитва за любимите хора.\u003c/li>\u003cli>\u003cstrong>Дайте на децата роля.\u003c/strong> Едното пали кандилото заедно с родителя, другото държи книгата, трето казва „Господи, помилуй“ или кратка молитва към своя ангел пазител.\u003c/li>\u003cli>\u003cstrong>Четете историята, не обяснението.\u003c/strong> Децата лесно приемат притчите и чудесата на Христос. После ги попитайте: „Кое ти хареса най-много?“\u003c/li>\u003cli>\u003cstrong>Един стих за целия дом.\u003c/strong> Изберете един стих за седмицата и го напишете на листче, на видно място. Децата го научават наизуст преди възрастните.\u003c/li>\u003cli>\u003cstrong>Неделята.\u003c/strong> Прочетете в събота вечер Евангелието на следващия ден. В храма детето ще се зарадва да го разпознае.\u003c/li>\u003cli>\u003cstrong>Без натиск.\u003c/strong> Молитвата не се дава като наказание и не се удължава отвъд силите на детето. Повече от думите децата помнят, че са виждали родителите си да се молят.\u003c/li>\u003c/ul>\u003ch2>Първите седем дни\u003c/h2>\u003cp>Ако започнеш в понеделник, седмият ден ще се падне в неделя. Всеки ден следвай шестте стъпки и се спри на стиха, който те докосне; този, който предлагаме, е само предложение.\u003c/p>\u003cul>\u003cli>\u003cstrong>Ден 1 — Псалом 22.\u003c/strong> Господ е твоят Пастир. Стих, който да носиш: „Господ е Пастир мой, от нищо не ще се нуждая.“\u003c/li>\u003cli>\u003cstrong>Ден 2 — Матей 5:1-12.\u003c/strong> Блаженствата, които пеем и в неделя на Божествената литургия. Стих: „Блажени чистите по сърце, защото те ще видят Бога.“\u003c/li>\u003cli>\u003cstrong>Ден 3 — Псалом 50.\u003c/strong> Псалмът на покаянието. Стих: „Сърце чисто създай в мене, Боже.“\u003c/li>\u003cli>\u003cstrong>Ден 4 — Лука 15:11-32.\u003c/strong> Притчата за блудния син. Погледни бащата, който тича да посрещне сина си.\u003c/li>\u003cli>\u003cstrong>Ден 5 — Иоан 15:1-11.\u003c/strong> Лозата и пръчките. Стих: „Без Мене не можете да вършите нищо.“\u003c/li>\u003cli>\u003cstrong>Ден 6 — Псалом 102.\u003c/strong> Ден на благодарност. Стих: „Благославяй, душо моя, Господа.“\u003c/li>\u003cli>\u003cstrong>Ден 7 — Неделното Евангелие.\u003c/strong> Прочети още в събота вечер зачалото, тоест откъса, който ще се чете на Божествената литургия; ще го намериш в църковния календар. После иди в храма и го чуй там, заедно с всички останали.\u003c/li>\u003c/ul>\u003cp>След тези седем дни можеш да продължиш с цяло Евангелие, по малко всеки ден. Мнозина започват от Евангелието от Марка, най-краткото.\u003c/p>\u003ch2>Една дума за края\u003c/h2>\u003cp>Този наръчник ти дава начало, а не правило. Молитвата у дома не замества службите на Църквата, изповедта и Светото Причастие; тя те подготвя за тях и ги продължава в дните на седмицата. Молитвеното ти правило — колко да четеш, какви молитви да казваш сутрин и вечер, колко поклона да правиш — се определя заедно с духовника ти, който те познава и знае какво ти подхожда. Покажи му какво си започнал и поискай благословията му.\u003c/p>\u003cp>И в деня, когато ти е трудно да отвориш книгата, спомни си думите на Петър: „Господи, при кого да отидем? Ти имаш думи за вечен живот“ (Иоан 6:68).\u003c/p>","liturghie":"\u003ch1>Божествената литургия стъпка по стъпка\u003c/h1>\u003cp>Божествената литургия е сърцето на живота на Църквата. Тя не е просто спомен за Тайната вечеря; тя е самата Вечеря Господня, на която сме поканени и ние. Хлябът и виното се претворяват, чрез действието на Светия Дух, в Тяло и Кръв Христови, и вярващите се причастяват. Предал ни я е Сам Спасителят, когато каза: „това правете за Мой спомен“ (Лука 22:19).\u003c/p>\u003cp>Православната Църква има три литургии. Литургията на \u003cstrong>св. Иоан Златоуст\u003c/strong> се служи почти във всички недели и празници през годината; нея следваме тук. Литургията на \u003cstrong>св. Василий Велики\u003c/strong>, с по-дълги молитви, се служи десет пъти в годината, най-вече в неделите на Великия пост. А \u003cstrong>Преждеосвещената литургия\u003c/strong> се служи в делничните дни на Великия пост, когато вярващите се причастяват със Светите Тайни, осветени в предходната неделя.\u003c/p>\u003cp>Как да се подготвиш? Ела навреме, не накрая. Сдобри се с онзи, с когото си се скарал (Матей 5:23-24). Прочети у дома Апостола и Евангелието на деня. А ако искаш да се причастиш, подготви се с изповед, пост и молитва, както ти определи духовникът ти.\u003c/p>\u003cp>В България литургията се служи на български, но в много храмове ще чуеш и църковнославянски: цели песнопения или само някои възгласи, например „Святий Боже, Святий Крепкий, Святий Безсмертний, помилуй нас“. Тук ги цитираме на български. Почти всеки миг от Божествената литургия идва от Свещеното Писание. Затова на всяка стъпка ще намериш и мястото ѝ в картата на 77-те книги.\u003c/p>\u003ch2>Проскомидия\u003c/h2>\u003ch3>1. Приготвянето на Светите Дарове\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Преди да започне литургията, докато в храма се чете утренята или часовете, свещеникът приготвя в олтара, на една малка маса, наречена жертвеник, хляба и виното. От просфората изрязва Агнеца, четвъртитото парче с печата ИС ХС НИ КА („Иисус Христос побеждава“), и го поставя на светия дискос. В светата чаша налива вино и вода. После изважда малки частици за Богородица, за чиновете на светиите, за живите и за починалите.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Проскомидията ни води едновременно във Витлеем и на Голгота: Христос се ражда, за да бъде принесен в жертва. Около Агнеца стои цялата Църква: Богородица, светиите, живите и починалите.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Остави навреме на пангара листчето с кръщелните имена на живите и на починалите си близки, заедно с приноса си: просфора, вино за литургия или свещи. Имената, които си написал, се поменават точно тук.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Свещеникът казва думите на пророка за Агнеца, воден на заколение: „като овца биде Той заведен на клане“ (Исаия 53:7), и си спомня прободените ребра, от които изтече кръв и вода (Иоан 19:34). Иоан Кръстител Го нарича Агнеца Божий, Който взима върху Си греха на света (Иоан 1:29). Звездицата, която се поставя над Агнеца, напомня звездата на влъхвите, която спря над мястото, където беше Младенецът (Матей 2:9).\u003c/p>\u003ch2>Литургия на оглашените (на Словото)\u003c/h2>\u003cp>Оглашени се наричали онези, които се подготвяли за Кръщението. Те можели да останат в тази част, в която се чува Божието слово.\u003c/p>\u003ch3>2. Началният възглас\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът вдига Светото Евангелие, прави с него кръстен знак над светия престол и възглася: „Благословено е Царството на Отца и Сина и Светия Дух, сега и винаги, и во веки веков!“ Певците отговарят: „Амин!“\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Литургията започва с вестта за Царството. Поканен си да вкусиш още отсега Царството Божие.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Застани прав и се прекръсти. „Амин“ означава „наистина, така да бъде“: кажи го и ти в сърцето си.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Първите думи от проповедта на Спасителя: „наближи царството Божие“ (Марк 1:15). И името на Светата Троица, както Господ го даде на апостолите (Матей 28:19).\u003c/p>\u003ch3>3. Великата ектения\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът или дяконът казва поредица от прошения, която започва с „С мир Господу да се помолим.“ На всяко прошение певците отговарят: „Господи, помилуй!“ Молим се за мира на целия свят, за Църквата, за нашия български народ, за болните и за пътуващите.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> „Ектения“ означава усърдна, протяжна молитва; тази се нарича още мирна, защото започва с мира. Църквата се моли за целия свят, а накрая се предаваме на Бога: „нека сами себе си, един другиго и целия си живот на Христа Бога да отдадем“.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> На всяко прошение си представи едно име или една нужда и отговори тихо: „Господи, помилуй!“\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Апостол Павел моли да се правят „просби, молитви, молби, благодарения за всички човеци“ (1 Тимотей 2:1-2). „Господи, помилуй“ е викът на слепия и на хананейката в Евангелието: „помилуй ме!“ (Лука 18:38; Матей 15:22).\u003c/p>\u003ch3>4. Антифоните\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Пеят се три антифона, разделени с малки ектении. В неделя в повечето храмове се пеят стихове от Псалом 102 („Благославяй, душо моя, Господа“) и от Псалом 145 („Душо моя, хвали Господа“), а като трети антифон — блаженствата. В делничните дни и на някои празници се пеят кратки стихове с припев: „По молитвите на Богородица, Спасителю, спаси нас!“ и „Сине Божий, Който възкръсна от мъртвите, спаси нас, които Ти пеем: Алилуия!“. След втория антифон се пее химнът „Единородни Сине и Слово Божие…“.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> „Антифон“ означава песен, която се пее на смени, от единия клирос към другия. Псалмите са гласът на Стария Завет, който чака Христос. Химнът „Единородни Сине“ изповядва, че Божият Син стана човек и беше разпнат за нас.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Слушай стиховете като своя молитва и, ако ги знаеш, пей тихо заедно с певците.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Псалми 102 и 145 (по номерацията на Седемдесетте, тази на православната Библия; 103 и 146 в протестантските Библии) и блаженствата (Матей 5:3-12).\u003c/p>\u003ch3>5. Малкият вход (входът с Евангелието)\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът излиза от олтара през северната врата, носейки Светото Евангелие, предшестван от свещ. Спира пред царските двери, издига Евангелието и възглася: „Премъдрост! Застанете прави!“ (на църковнославянски: „Премудрост, прости!“). Пее се: „Дойдете да се поклоним и да паднем пред Христа…“ После свещеникът влиза в олтара, а певците пеят тропарите и кондаците на деня.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> „Вход“ значи влизане. Излизането с Евангелието изобразява мига, в който Христос излезе да проповядва. Светлината, която върви пред Него, напомня св. Иоан Кръстител и пророците, които Го предвестиха.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Обърни се към Евангелието, прекръсти се и наведи глава. „Прави“ означава: стой изправен, с буден ум.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> „Дойдете, да се поклоним и да припаднем“ (Псалом 94:6). Иоан Кръстител, „светило, което гори и свети“ (Иоан 5:35).\u003c/p>\u003ch3>6. Трисвятата песен („Светий Боже“)\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Пее се три пъти: „Светий Боже, Светий Крепкий, Светий Безсмъртний, помилуй нас.“ На някои големи празници, като Великден, Петдесетница, Рождество Христово и Богоявление, вместо нея се пее: „Които в Христа се кръстихте, в Христа се облякохте. Алилуия.“\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> „Трисвята“ се нарича песента, която три пъти казва „свят“. Това е песента на ангелите, към която Църквата прибавя и нашата молба: „помилуй нас“.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Прекръсти се и се поклони при всяко повторение.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Исаия чува серафимите да викат „свет, свет, свет е Господ Саваот!“ (Исаия 6:3); същата песен звучи на небето в Откровението (Откровение 4:8). „Които в Христа се кръстихте“ са думи на апостол Павел (Галатяни 3:27).\u003c/p>\u003ch3>7. Апостолът\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> След „Да внимаваме!“ и няколко стиха от псалом (прокимена) четецът чете от средата на храма откъс от Деянията на апостолите или от посланията. Около този момент се кади храмът. Накрая се пее „Алилуия“.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Апостолите вървят пред Господа и Го възвестяват, както Той ги изпрати в градовете, където Сам щеше да отиде. Тамянът изобразява благодатта на Светия Дух.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Слушай внимателно. Ако си прочел откъса у дома, ще го разбереш по-лесно.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> От Великден до Петдесетница се четат Деянията на апостолите; през останалата част от годината — четиринадесетте послания на апостол Павел и седемте съборни послания (на Иаков, Петър, Иоан и Иуда). Откровението не се чете на Божествената литургия.\u003c/p>\u003ch3>8. Светото Евангелие\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът възглася: „Премъдрост! Прави да изслушаме Светото Евангелие! Мир на всички!“ Отговаряме: „И на твоя дух!“ Преди и след четенето се пее: „Слава Тебе, Господи, слава Тебе!“ Свещеникът или дяконът чете евангелското зачало на деня, тоест определения откъс.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Сега вече не говорят пророците или апостолите, а Сам Христос. Затова слушаме Евангелието като слово, казано днес, на теб.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Стой прав, с наведена глава; ако седиш на стасидия, стани. Следвай онова, което правят вярващите в твоя храм.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Четирите Евангелия са разпределени през годината: Иоан от Великден до Петдесетница, Матей след Петдесетница, Лука от есента (след Въздвижение на Светия Кръст) до Великия пост, Марк в съботите и неделите на Великия пост.\u003c/p>\u003ch3>9. Проповедта\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът обяснява Евангелието или Апостола на деня. В някои храмове проповедта е веднага след Евангелието, в други — по-късно, докато свещенослужителите се причастяват, или в края на литургията, за да я чуят и закъснелите.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Прочетеното слово трябва и да се „пречупи“, като хляба, за да можем да го приемем. Проповедта свързва Евангелието с живота ти.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Слушай и задръж само една мисъл, за да я отнесеш у дома.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Така постъпи Господ в синагогата в Назарет: прочете от Исаия и после обясни (Лука 4:16-21). И в книгата на Неемия (глава 8) Ездра чете Закона пред народа, а левитите го обясняват.\u003c/p>\u003ch3>10. Ектениите след Евангелието\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Следва сугубата ектения, на която отговаряме три пъти „Господи, помилуй!“, с прошения за живите и за нашия български народ; в някои дни се прибавя и ектения за починалите. После идва ектенията за оглашените, която завършва с „Вие, които сте оглашени, излезте“. В доста храмове тези ектении се казват тихо или се съкращават.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> „Сугуба“ значи удвоена, усилена: молитвата става по-настойчива. Тук, в древността, свършвала частта, в която можели да присъстват некръстените. Думите са запазени, за да ни напомнят какъв дар е Кръщението.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> На сугубата ектения поменавай наум, по име, своите близки.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Настойчивата молитва от притчата за вдовицата и несправедливия съдия (Лука 18:1-8). „Молете се един за други“ (Иаков 5:16).\u003c/p>\u003ch2>Литургия на верните (евхаристийната)\u003c/h2>\u003cp>Това е частта, в която се принася Светата Жертва. „Евхаристия“ означава благодарност, „благодаря“, което казваме на Бога.\u003c/p>\u003ch3>11. Херувимската песен и Великият вход (входът със Светите Дарове)\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Певците пеят бавно Херувимската песен, която ни призовава да оставим всяка грижа: „нека сега отложим всяка житейска грижа“. Свещеникът кади, после взема от жертвеника светия дискос и светата чаша и излиза с тях в средата на храма, като поменава митрополита, създателите на храма и всички вярващи и моли Господ Бог да ги помене в Своето царство. Влиза в олтара през царските двери и поставя Даровете на светия престол.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Великият вход изобразява пътя на Христос към доброволното Му Страдание и към погребението Му.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Наведи глава, когато минават Светите Дарове, и се прекръсти. Помоли се с думите на разбойника.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> „Спомни си за мене, Господи, кога дойдеш в царството Си!“ (Лука 23:42). Херувимите и серафимите от виденията на пророците (Исаия 6; Иезекиил 10). Погребението на Господа (Иоан 19:38-42).\u003c/p>\u003ch3>12. Целуването на мира и Символът на вярата\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> След ектения, на която отговаряме „Подай, Господи!“, свещеникът благославя: „Мир на всички!“ и призовава: „Да се възлюбим един другиго, та в единомислие да изповядваме:“ Певците отговарят: „Отца и Сина и Светия Дух, Троица единосъщна и неразделна.“ После се чува: „Дверите, дверите, с премъдрост да внимаваме!“, и се казва Символът на вярата: „Вярвам в един Бог Отец, Вседържител, Творец на небето и земята, на всичко видимо и невидимо…“ В много храмове го пеят всички заедно; в други го чете на глас четецът или един вярващ за всички.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Вярата не може да се изповяда без любов. В древността в този момент всички вярващи си давали целувката на мира; днес обикновено я разменят само свещенослужителите в олтара. Символът, формулиран от Светите Отци на първите два Вселенски събора (Никея, 325 г., и Константинопол, 381 г.), е вярата на Църквата, казана с малко думи.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Прости сега, от сърце, на онзи, който те е наранил. Кажи и ти Символа, макар и полугласно, заедно с всички. Ако още не го знаеш наизуст, научи го: твой е от Кръщението.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> „Нова заповед ви давам, да любите един другиго“ (Иоан 13:34). „Иди първом се помири с брата си“ (Матей 5:24). Символът се опира фраза по фраза на Писанието: „В начало беше Словото“ (Иоан 1:1-14); смъртта, погребението и Възкресението „според Писанията“ (1 Коринтяни 15:3-4).\u003c/p>\u003ch3>13. Началото на анафората: „Да издигнем сърцата си нагоре“\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> След призива „Да стоим добре, да стоим с благоговение, да внимаваме, за да принесем в мир светото възношение“ певците отговарят: „Милостта на мира е хвалебна жертва!“ Свещеникът благославя народа с думите „Благодатта на Господа наш Иисус Христос и любовта на Бога и Отца, и общуването със Светия Дух да бъдат с всички вас!“, а после призовава: „Да издигнем сърцата си нагоре.“ — „Издигнати са към Господа!“ — „Да благодарим на Господа!“ — „Достойно и справедливо е…“ Свещеникът чете благодарствената молитва, а певците пеят победната песен: „Свят, свят, свят е Господ Саваот…“, която завършва с „Осанна във висините!“\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> „Анафора“ значи възношение, принасяне: това е голямата благодарствена молитва, сърцето на литургията. Църквата благодари на Бога за всичко и се съединява с песента на ангелите.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Издигни ума си от земното. Благодари на Бога за нещо конкретно от изминалата седмица.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Благословията на свещеника е краят на Второто послание до коринтяни (2 Коринтяни 13:13). „Свят, свят, свят“ идва от Исаия (Исаия 6:3), а „Осанна… благословен е, Който иде в името Господне“ — от Псалом 117:26 и от Евангелието (Матей 21:9).\u003c/p>\u003ch3>14. Думите на Тайната вечеря\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът възглася на глас думите на Спасителя: „Вземете, яжте, това е Моето тяло…“, а после: „Пийте от нея всички, това е Моята кръв на Новия Завет…“ Това са думите, с които Господ даде на учениците хляба и чашата: Своето Тяло, което се преломява, и Своята Кръв на Новия Завет, която се пролива за опрощаване на греховете. Всеки път отговаряме: „Амин.“ После свещеникът издига Даровете: „Тези Твои дарове от всичко, което е Твое, принасяме на Тебе, за всички и заради всичко.“\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Намираме се в горницата на Тайната вечеря. Църквата прави онова, което ѝ заповяда Господ, и Му връща Неговите собствени дарове: Твоето, от Твоето, на Тебе принасяме.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Слушай тези думи, сякаш седиш на трапезата с апостолите. Отговори „Амин“.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Матей 26:26-28; Марк 14:22-24; Лука 22:19-20; 1 Коринтяни 11:23-26. Възгласът „Тези Твои дарове“ напомня молитвата на Давид: всичко е Твое и от Твоето Ти дадохме (1 Паралипоменон 29:14).\u003c/p>\u003ch3>15. Призоваването на Светия Дух\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Докато певците пеят „Тебе възпяваме, Тебе благославяме, на Тебе благодарим, Господи, и молим Ти се, Боже наш“, свещеникът моли Отца да изпрати Светия Дух върху нас и върху предлежащите Дарове и да ги претвори в Тяло и Кръв Христови. Мигът преминава в тишина: свещеникът се моли тихо пред светия престол.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> „Епиклеза“ означава призоваване. Това е най-святият миг на литургията: със слизането на Светия Дух хлябът и виното стават наистина Тяло и Кръв на Господа.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Коленичи или застани с дълбоко наведена глава, както е прието в твоя храм, и се моли мълчаливо.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Слизането на Светия Дух на Петдесетница (Деяния 2:1-4). Думите на ангела към Дева Мария: „Дух Светий ще слезе върху ти“ (Лука 1:35). И като предобраз — огънят, който слиза върху жертвата на пророк Илия (3 Царства 18:36-38).\u003c/p>\u003ch3>16. „Достойно е“ и поменаванията\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът поменава на глас Богородица: „Особено за Пресвятата, Пречиста, Преблагословена, славна наша Владичица Богородица и винаги дева Мария.“ Певците пеят „Достойно е наистина да те облажаваме, Богородице…“ (на големите празници вместо него се пее ирмосът на празника). После свещеникът поменава митрополита и всички, живи и починали, а ние отговаряме: „И всекиго и всички!“\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Пред Светите Тайни е събрана цялата Църква, небесната и земната. Начело стои Богородица, „по-чтима от херувимите“.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Пей и ти „Достойно е“. После поменавай наум, по име, своите живи и починали близки.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> „Ето, отсега ще ме облажават всички родове“ (Лука 1:48). „Благословена си ти между жените“ (Лука 1:42).\u003c/p>\u003ch3>17. „Отче наш“\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> След ектения свещеникът моли Бог да ни удостои с дръзновение да Го наричаме „Отче“. Казва се или се пее „Отче наш“, понякога от целия народ, понякога от един вярващ за всички. Свещеникът завършва: „Защото Твое е царството и силата, и славата…“\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Това е молитвата, която ни даде Сам Господ, единствената такава. Казваме я точно преди Светото Причастие, защото „насъщният ни хляб“ е преди всичко Христос, Хлябът на живота.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Кажи я и ти, макар и тихо. Спри се с ума си на „и прости нам дълговете ни, както и ние прощаваме на длъжниците си“.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Матей 6:9-13 и Лука 11:2-4. „Аз съм хлябът на живота“ (Иоан 6:35).\u003c/p>\u003ch3>18. „Светинята е за светите“\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът издига Агнеца и възглася: „Да внимаваме! Светинята е за светите!“ Певците отговарят: „Един е свят, единственият Господ Иисус Христос, за слава на Бога Отца. Амин.“ После свещеникът разделя Агнеца на четири части и налива в Чашата малко топла вода, наречена „теплота“.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Светите Тайни са за светите. Но нашият отговор признава, че само Един е свят: пристъпваме не защото сме достойни, а защото Той ни призовава.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Прекръсти се и се поклони. Ако ще се причастяваш, поискай наум прошка от всички.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Бог казва на народа Си да бъде свят, защото Той е свят (Левит 11:44; 1 Петър 1:16). Отговорът на певците идва от Посланието до филипяни (Филипяни 2:11). Учениците познаха Господа при преломяването на хляба (Лука 24:30-35).\u003c/p>\u003ch3>19. Светото Причастие\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Първо се причастяват свещенослужителите в олтара, докато певците пеят причастния стих, обикновено стих от псалом. После царските двери се отварят и свещеникът излиза със светата Чаша: „Със страх Божий, с вяра и любов пристъпете.“ Казва се молитвата „Вярвам, Господи, и изповядвам…“, и подготвените вярващи приемат с лъжичката Тялото и Кръвта Господни, докато се пее: „Тялото Христово приемете, от безсмъртния извор вкусете.“\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Тук стига целият път на литургията. Не приемаме символ, а Самия Христос, „за опрощаване на греховете и за вечен живот“.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Ако си се изповядал и имаш благословията на духовника си, пристъпи с ръце, скръстени на гърдите, застани така, че червената кърпа да е под брадичката ти, и кажи кръщелното си име. Не се кръсти точно до Чашата, за да не я блъснеш. Ако не се причастяваш, моли се за онези, които се причастяват.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> „Който яде Моята плът и пие Моята кръв, има живот вечен“ (Иоан 6:54). Призивът да изпитваме себе си, преди да се причастим (1 Коринтяни 11:27-29). В неделя причастният стих е Псалом 148:1: „Хвалете Господа от небесата“.\u003c/p>\u003ch3>20. Благодарността\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът благославя: „Спаси, Боже, Твоите люде и благослови наследието Си!“ Певците пеят: „Видяхме истинската светлина, приехме небесния Дух, намерихме истинската вяра…“ Свещеникът показва за последен път светата Чаша с думите „всякога, сега и винаги, и во веки веков“ и я отнася на жертвеника.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Последното явяване на Светите Тайни изобразява Възнесението на Господа на небето и обещанието Му, че остава с нас.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Прекръсти се и се поклони. Благодари на Бога, независимо дали си се причастил или не: и ти седна на Вечерята Господня.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Благословията на свещеника е стих от Псалом 27: „Спаси народа Си и благослови наследството Си“ (Псалом 27:9). Възнесението (Деяния 1:9-11). „Аз съм с вас през всички дни до свършека на света“ (Матей 28:20).\u003c/p>\u003ch3>21. Задамвонната молитва\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът казва: „С мир да излезем!“ Отговаряме: „В името Господне.“ После излиза от олтара, застава пред народа и чете на глас молитва, която започва: „Господи, Който благославяш онези, които Те благославят…“, и в която се моли и за мир на нашия български народ. Певците пеят три пъти: „Да бъде благословено името Господне отсега и до века!“\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> Името ѝ значи „молитвата зад амвона“, защото някога се е казвала оттам. Това е молитвата на изпращането: свещеникът слиза сред народа и се моли за Църквата и за света. Литургията свършва; започва твоята мисия в света.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Остани до края. Слушай молитвата като благословия за идващата седмица.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> В молитвата чуваш Посланието на Иаков: „Всяко добро даяние и всеки съвършен дар иде отгоре, слизайки от Отца на светлините“ (Иаков 1:17). „Да бъде благословено името Господне“ е Псалом 112:2 и думите на праведния Иов (Иов 1:21).\u003c/p>\u003ch3>22. Отпустът и нафората\u003c/h3>\u003cp>\u003cstrong>Какво става:\u003c/strong> Свещеникът дава последната благословия: „Благословението Господне и Неговата милост да дойдат върху вас…“, а после казва отпуста, заключителната молитва, в която поменава Богородица, светите равноапостолни Методий и Кирил, светия цар Борис-Михаил, св. Климент Охридски, св. Иван Рилски, св. Иоан Златоуст и светиите на деня. Тогава вярващите пристъпват към свещеника, целуват кръста и получават нафора.\u003c/p>\u003cp>\u003cstrong>Какво означава:\u003c/strong> „Отпуст“ значи, че ни пускат да си тръгнем, че ни изпращат. Нафората е благословеният хляб, останал от просфорите на проскомидията. Тя не е Светото Причастие, а благословия; старото ѝ име, антидор, на гръцки означава „вместо Дара“.\u003c/p>\u003cp>\u003cstrong>Какво правиш ти:\u003c/strong> Приеми нафората с благоговение, на гладно, като внимаваш да не ти паднат трохи.\u003c/p>\u003cp>\u003cstrong>Свещеното Писание:\u003c/strong> Свещеническата благословия, дадена на Аарон (Числа 6:24-26). Господ, когато се възнасяше, благослови учениците, и те се върнаха „с голяма радост“ (Лука 24:50-53).\u003c/p>\u003ch2>Как да носиш литургията със себе си през цялата седмица\u003c/h2>\u003cp>Божествената литургия не свършва на вратата на храма. Онова, което си получил, го носиш у дома, на работа, сред хората.\u003c/p>\u003cul>\u003cli>\u003cstrong>Препрочети\u003c/strong> в неделя вечер Апостола и Евангелието на деня. Избери един стих и го носи със себе си през цялата седмица.\u003c/li>\u003cli>\u003cstrong>Намери книгата в Картата.\u003c/strong> Отвори „корена“ на книгата, от която беше четивото, и виж къде се намира в историята на спасението.\u003c/li>\u003cli>\u003cstrong>Благодари.\u003c/strong> Евхаристия означава благодарност. Завършвай всеки ден с едно нещо, за което благодариш на Бога.\u003c/li>\u003cli>\u003cstrong>Давай милостиня.\u003c/strong> Онзи, Когото срещна в Чашата, те чака и в човека в нужда (Матей 25:40).\u003c/li>\u003cli>\u003cstrong>Подготви следващата неделя.\u003c/strong> В събота следобед, ако можеш, иди на вечерня и прочети Евангелието за следващия ден.\u003c/li>\u003c/ul>\u003ch2>Едно уточнение\u003c/h2>\u003cp>Редът, описан тук, е обичайният в енорийските храмове в България, но местните обичаи се различават: кога хората коленичат, кога е проповедта, кои антифони се пеят, кои ектении се казват на глас, колко се пее на църковнославянски и колко на български, как се раздава нафората. Нищо от това не бива да те смущава. Следвай реда на храма, в който се намираш, и когато не си сигурен, попитай свещеника. А подготовката за Светото Причастие — колко пост, кои молитви, колко често — я решаваш заедно с духовника си.\u003c/p>","cuvant":"\u003ch1>Предговор: как да използваш Картата на Словото\u003c/h1>\u003cp>Добре дошъл!\u003c/p>\u003cp>Може би много пъти си отварял Свещеното Писание с истинско желание. Започвал си от Битие, напредвал си добре известно време, после си се изгубвал сред закони, имена и народи и си затварял Библията с тъга. Ако ти се е случвало, запомни едно: \u003cstrong>Не си виновен ти. Никой не ти е дал карта.\u003c/strong>\u003c/p>\u003cp>Библията не е една книга, а цяла библиотека: 77 книги, писани в продължение на много векове и по много различни начини — история, закон, химн, пророчество, послание. Без нишка, която да ги свързва, е естествено да се изгубиш. От днес картата е пред теб.\u003c/p>\u003ch2>Какво е „корен“\u003c/h2>\u003cp>Всяка от 77-те книги има тук своя страница, която наричаме \u003cem>корен\u003c/em>: малкото, което ти трябва, за да видиш откъде израства книгата и накъде води. Четеш я за 5–10 минути и тя винаги има същите седем части:\u003c/p>\u003cul>\u003cli>\u003cstrong>Авторът и епохата\u003c/strong> — кой е написал книгата и кога, според Преданието на Църквата.\u003c/li>\u003cli>\u003cstrong>Историческият контекст\u003c/strong> — какво се е случвало тогава с Божия народ.\u003c/li>\u003cli>\u003cstrong>Основните теми\u003c/strong> — за какво всъщност говори книгата.\u003c/li>\u003cli>\u003cstrong>Как води към Христос\u003c/strong> — ключът, с който чете Църквата: цялото Писание води към Него.\u003c/li>\u003cli>\u003cstrong>Гласът на Светите Отци\u003c/strong> — как са разбирали книгата онези, които са я живели преди нас.\u003c/li>\u003cli>\u003cstrong>В богослуженията\u003c/strong> — къде я чуваш в храма.\u003c/li>\u003cli>\u003cstrong>Заключителната молитва\u003c/strong> — няколко думи, с които затваряш страницата в разговор с Бога.\u003c/li>\u003c/ul>\u003cp>В края на всеки корен намираш и два кратки въпроса, за да видиш какво си запомнил. Тъй като формата е винаги една и съща, след няколко корена ще се чувстваш като у дома си: знаеш къде се намираш и какво следва.\u003c/p>\u003ch2>Как да я четеш\u003c/h2>\u003cp>Най-простият път е \u003cstrong>шест корена на ден\u003c/strong>. Така за по-малко от 15 дни познаваш всичките 77 книги, от Битие до Откровение, и Свещеното Писание престава да бъде чужда земя. Ако шест ти се струват много, чети три или само един. Това не е надбягване. По-добре малко и с внимание, отколкото много и набързо.\u003c/p>\u003cp>Картата следва реда на православната Библия: Петокнижието, историческите книги, учителните книги, големите и малките пророци, 11-те неканонични книги, а след това Новия Завет — Евангелията, Деянията на апостолите, посланията на апостол Павел, съборните послания и Откровението.\u003c/p>\u003ch2>Коренът не замества Писанието\u003c/h2>\u003cp>Картата не е пътят. Коренът те подготвя за срещата със свещения текст, но не я замества. Затова дръж до себе си Библията, Синодално издание, и след всеки корен прочети поне откъса, който е предложен в началото му, за да знаеш откъде да започнеш. Там те чака самото Слово.\u003c/p>\u003ch2>С очите на Църквата\u003c/h2>\u003cp>Писанието се е родило в Църквата и в Църквата се разбира: в Божествената литургия, в молитвата, в учението на Светите Отци. Затова тук четем всяка книга с очите на Църквата, а не с мненията на момента. И когато някой откъс те смути или породи въпроси, които докосват живота ти, не ги носи сам: попитай духовния си отец или свещеника на своя храм.\u003c/p>\u003ch2>Какво още ще намериш в приложението\u003c/h2>\u003cul>\u003cli>\u003cstrong>Начало\u003c/strong> — мястото, от което тръгваш и в което се връщаш всеки ден.\u003c/li>\u003cli>\u003cstrong>Картата\u003c/strong> — 77-те книги, подредени по раздели, от Петокнижието до Откровението.\u003c/li>\u003cli>\u003cstrong>Пътят\u003c/strong> — 13-те дни, с корените за всеки ден.\u003c/li>\u003cli>\u003cstrong>Подаръци\u003c/strong> — Планът за четене за 90 дни, Малкият наръчник за молитва със Светото писание, Православният календар за разпечатване и Божествената литургия стъпка по стъпка.\u003c/li>\u003cli>\u003cstrong>Инструменти\u003c/strong> — Моят дневник, Провери знанията си, Библейски речник, Хронология на историята на спасението, „Какво да чета, когато…“ и Номерацията на псалмите.\u003c/li>\u003c/ul>\u003cp>Не е нужно да ги използваш всички още от първия ден. Започни с един корен и с отворена Библия до себе си; останалото ще дойде с времето.\u003c/p>\u003cp>Бог да просвети ума ти и да отвори сърцето ти за Своето Слово. На добър час!\u003c/p>","cele14":"\u003ch1>Защо православната Библия има 77 книги?\u003c/h1>\u003cp>Ако някога си слагал една до друга православната Библия и Библия, която ти е дал приятел от друго изповедание, сигурно си видял, че броят на книгите в тях не е еднакъв. Твоята, Библията, Синодално издание, има 77. Други имат 73 или 66. Нищо не е добавено и нищо не е премахнато тайно: разликата има стара история, която е добре да познаваш спокойно, без спорове.\u003c/p>\u003ch2>Седемдесетте — Писанието на първите християни\u003c/h2>\u003cp>Почти три века преди Рождество Христово, в египетския град Александрия, свещените книги на еврейския народ започват да се превеждат на гръцки — езика, който тогава разбира почти целият свят около Средиземно море. Преданието разказва, че над този превод са работили седемдесет (или седемдесет и двама) мъдреци. Оттам идва и името му: преводът \u003cem>на Седемдесетте\u003c/em>.\u003c/p>\u003cp>Това е Писанието, което първите християни са държали в ръцете си. Когато светите апостоли цитират Стария Завет в своите писания, най-често го правят по неговия текст. От него са чели и тълкували Светите Отци, от него са изградени богослуженията на Църквата. Затова Православната църква го е приела и го почита и до днес. За нас, българите, има и още нещо: светите братя Кирил и Методий и техните ученици превеждат Писанието на славянски език от гръцки, тоест именно от тази древна Библия. Затова Псалтирът в нашата Библия следва номерацията на Седемдесетте, а в храма — на български или на църковнославянски — чуваме Стария Завет така, както го е чела древната Църква.\u003c/p>\u003cp>В превода на Седемдесетте има и някои книги, които ги няма в еврейската Библия — писани или запазени на гръцки в последните векове преди идването на Спасителя. Оттук започва разликата в броя.\u003c/p>\u003ch2>39 канонични и 11 неканонични книги\u003c/h2>\u003cp>Старият Завет на православната Библия, така както го брои Картата, има 50 книги, разположени на две степени.\u003c/p>\u003cp>На първата степен са \u003cstrong>39-те канонични книги\u003c/strong>, от Битие до Малахия. Това са книгите, които има и еврейската Библия и които ще намериш в Библията на всеки християнин. „Канон“ означава мярка, правило: тези книги са мярката на вярата.\u003c/p>\u003cp>На втората степен са \u003cstrong>11-те неканонични книги\u003c/strong>:\u003c/p>\u003cul>\u003cli>Товит\u003c/li>\u003cli>Иудит\u003c/li>\u003cli>Варух\u003c/li>\u003cli>Послание на Иеремия\u003c/li>\u003cli>Втора книга на Ездра\u003c/li>\u003cli>Премъдрост Соломонова\u003c/li>\u003cli>Премъдрост на Иисуса, син Сирахов\u003c/li>\u003cli>Първа книга Макавейска\u003c/li>\u003cli>Втора книга Макавейска\u003c/li>\u003cli>Трета книга Макавейска\u003c/li>\u003cli>Трета книга на Ездра\u003c/li>\u003c/ul>\u003cp>Заедно с 27-те книги на Новия Завет те правят 77.\u003c/p>\u003cp>Има и няколко текста, които в някои Библии се броят отделно, а в нашата се намират вътре в друга книга: \u003cstrong>Песента на тримата младежи\u003c/strong>, \u003cstrong>Сусана\u003c/strong> и историята за \u003cstrong>Вил и змея\u003c/strong> са части от книгата на пророк Даниил, а \u003cstrong>Молитвата на Манасия\u003c/strong> е в края на Втора книга Паралипоменон. В Картата ще ги намериш в корена на книгата, към която принадлежат.\u003c/p>\u003cp>\u003cstrong>Трета книга на Ездра\u003c/strong> има своя особена история. Тя не е част от превода на Седемдесетте и не е запазена на гръцки; в славянската Библия влиза чрез стария латински превод и затова я има в българската Синодална Библия, но не и в гръцката. Ето защо броят на книгите в различните православни Библии може леко да се различава — без това да е разлика във вярата.\u003c/p>\u003ch2>Какво означава „неканонични“\u003c/h2>\u003cp>Думата може да те смути, затова нека я обясним спокойно. „Неканонични“ не значи „отхвърлени“, нито „фалшиви“. Значи само, че тези книги не стоят на една степен с каноничните — не са мярката, по която се проверява вярата. Още в първите векове Отци като св. Атанасий Велики разграничават каноничните книги от други книги, които Отците са определили да се четат за поучение от онези, които тепърва се приближават към вярата.\u003c/p>\u003cp>В православното предание това се казва така: тези книги са \u003cstrong>душеполезни\u003c/strong>, назидателни. Църквата ги чете и ги препоръчва за назидание: печата ги в своята Библия, цитира ги и ги пее в богослуженията. Но не ги поставя на една степен с каноничните: учението на вярата не се основава само на тях. Те подкрепят и осветляват онова, което изповядват каноничните книги и Свещеното Предание.\u003c/p>\u003cp>Затова те не са нито съмнителни, нито излишни книги. Те са книги на Църквата, всяка на своето място.\u003c/p>\u003ch2>Защо други Библии имат 66 или 73 книги\u003c/h2>\u003cp>\u003cstrong>Протестантските Библии имат 66 книги.\u003c/strong> През шестнайсети век Реформацията задържа за Стария Завет само книгите на еврейската Библия, тоест 39-те канонични. Останалите отначало са поставени в отделна част, под името „апокрифи“, а по-късно повечето издания ги изпускат. 39 и 27 правят 66.\u003c/p>\u003cp>\u003cstrong>Католическите Библии имат 73 книги.\u003c/strong> Отново през шестнайсети век Римокатолическата църква определя, че седем от тези книги — Товит, Иудит, Премъдрост Соломонова, Премъдрост на Иисуса, син Сирахов, Варух и първите две Макавейски книги — имат същия авторитет като останалите, и ги нарича „второканонични“. Част от разликата до 77 е просто въпрос на броене: в католическата Библия Посланието на Иеремия е последната глава на Варух. Три книги има само в православната Библия: Втора и Трета книга на Ездра и Трета книга Макавейска — както и Молитвата на Манасия.\u003c/p>\u003cp>Разликата засяга значи някои книги на Стария Завет, а не Евангелието.\u003c/p>\u003ch2>Къде ги чуваш в богослуженията\u003c/h2>\u003cp>Може никога да не си ги чел, но със сигурност си ги чувал в храма:\u003c/p>\u003cul>\u003cli>\u003cstrong>Премъдрост Соломонова\u003c/strong> — в паримиите на вечернята на празниците на светиите: „А душите на праведните са в Божия ръка“ (Премъдрост Соломонова 3:1).\u003c/li>\u003cli>\u003cstrong>Песента на тримата младежи\u003c/strong> (в книгата на Даниил) — в седмата и осмата песен на канона на утренята и на Велика събота.\u003c/li>\u003cli>\u003cstrong>Молитвата на Манасия\u003c/strong> — на Великото повечерие през Великия пост.\u003c/li>\u003cli>\u003cstrong>Макавейските книги\u003c/strong> — на 1 август, когато Църквата почита светите седем мъченици Макавеи.\u003c/li>\u003cli>\u003cstrong>Варух\u003c/strong> — в паримиите на навечерието на Рождество Христово.\u003c/li>\u003c/ul>\u003cp>Книга, която Църквата пее, не може да е чужда книга.\u003c/p>\u003ch2>Новият Завет: 27 книги, еднакви за всички\u003c/h2>\u003cp>Тук няма никаква разлика. Четирите Евангелия, Деянията на апостолите, 14-те послания на апостол Павел, седемте съборни послания и Откровението са едни и същи в православната, в католическата и в протестантската Библия.\u003c/p>\u003ch2>Как да ги четеш\u003c/h2>\u003cp>Чети ги без страх и без бързане. Започни от най-близките до всекидневния живот: Товит — за семейството и милостинята; Премъдрост Соломонова и Премъдрост на Иисуса, син Сирахов — за ясни съвети; Макавейските книги — за смелостта на вярата. Поставяй ги винаги до каноничните книги и до Евангелието, а не на тяхно място. В Картата всяка от тях има своя корен, с мястото, което заема в историята на спасението. И ако някой въпрос остане без отговор, занеси го на духовния си отец.\u003c/p>"}},"dict":{"bg":[{"t":"\u003cstrong>Ад (Шеол)\u003c/strong>","d":"В Стария Завет мястото на мъртвите (на еврейски „шеол“), където слизаха всички починали. Христос слезе в ада и съкруши вратите му; оттогава адът означава състоянието на отделеност от Бога."},{"t":"\u003cstrong>Алилуия\u003c/strong>","d":"Еврейска дума, която означава „Хвалете Господа“. Чуваш я в псалмите и на всяка Божествена литургия, преди четенето на Евангелието."},{"t":"\u003cstrong>Амин\u003c/strong>","d":"Еврейска дума, която означава „наистина“ или „така да бъде“. С нея запечатваме молитвата и показваме, че я правим своя с цялото си сърце."},{"t":"\u003cstrong>Апокалипсис (Откровение)\u003c/strong>","d":"Дума, която означава „разбулване“, „откриване“: Бог повдига завесата и показва с видения и символи Своята победа в края на историята. Така се нарича и последната книга на Свещеното Писание — Откровение на свети Иоан Богослов."},{"t":"\u003cstrong>Апостол\u003c/strong>","d":"„Пратеник“: един от дванадесетте ученици, които Христос избра, за да проповядват Евангелието по света; към тях се прибавя и апостол Павел."},{"t":"\u003cstrong>Апостол (четивото)\u003c/strong>","d":"Четивото от Деяния на светите апостоли или от посланията, което се чува на Божествената литургия преди Евангелието. „Апостол“ се нарича и богослужебната книга, от която се чете."},{"t":"\u003cstrong>Архиерей (първосвещеник)\u003c/strong>","d":"В Стария Завет първосвещеникът е единственият, който влизал веднъж в годината в Светая Светих. Посланието до евреите нарича така Христос, а днес архиерей е епископът."},{"t":"\u003cstrong>Благодат\u003c/strong>","d":"Дарът и действието на Бога в човека: Неговата сила, която прощава, изцелява и освещава, дадена не за заслуги, а от любов. Получаваме я най-вече чрез светите Тайнства."},{"t":"\u003cstrong>Боговъплъщение\u003c/strong>","d":"Тайната, чрез която Божият Син стана истински човек, като прие плът от Дева Мария, без да престане да бъде Бог. Нарича се още Въплъщение."},{"t":"\u003cstrong>Вавилонски плен\u003c/strong>","d":"Десетилетията на VI век пр. Хр., през които народът на Иуда живя в изгнание във Вавилон, след разрушаването на Иерусалим и на храма."},{"t":"\u003cstrong>Вечерня\u003c/strong>","d":"Вечерното богослужение, с което започва богослужебният ден. Открива се с Псалом 103 и на големите празници включва четивата от Стария Завет (паримиите)."},{"t":"\u003cstrong>Второ пришествие\u003c/strong>","d":"Идването на Христос в слава, в края на времената, за да съди живи и мъртви. Изповядваме го в Символа на вярата и го очакваме с надежда, а не с ужас."},{"t":"\u003cstrong>Възкресение\u003c/strong>","d":"Победата на Христос над смъртта на третия ден след Разпятието. То е основата на нашата вяра и залогът, че в края на времената ще възкръснат всички хора."},{"t":"\u003cstrong>Голгота\u003c/strong>","d":"„Лобно място“: хълмът извън стените на Иерусалим, където беше разпнат Спасителят."},{"t":"\u003cstrong>Духовник\u003c/strong>","d":"Свещеникът, при когото се изповядваш и който те води в духовния живот. Той може да ти помогне и да разбереш това, което четеш в Свещеното Писание."},{"t":"\u003cstrong>Евангелие\u003c/strong>","d":"„Блага вест“: вестта, че Бог стана човек и ни спаси. Така се наричат и четирите книги (от Матея, Марка, Лука и Иоана), които разказват живота и учението на Христос."},{"t":"\u003cstrong>Езичници (народи)\u003c/strong>","d":"Всички народи извън Израил, които не познаваха истинския Бог. Чрез Христос и езичниците са призовани към спасение."},{"t":"\u003cstrong>Жертва\u003c/strong>","d":"Дар, принасян на Бога върху жертвеника — животно, хляб или тамян — като благодарност или за прошка на греховете. Всички жертви на Стария Завет сочеха към жертвата на Христос на Кръста."},{"t":"\u003cstrong>Завет\u003c/strong>","d":"Свещен съюз, който Бог сключва с хората, с обещания и заповеди: с Ной, с Авраам, с Моисей на Синай, с Давид. Новия Завет Христос запечата със Своята Кръв; затова и двете части на Свещеното Писание се наричат Стар и Нов Завет."},{"t":"\u003cstrong>Закон\u003c/strong>","d":"Заповедите, които Бог даде чрез Моисей на планината Синай. „Закон“ се наричат и първите пет книги на Свещеното Писание — Петокнижието."},{"t":"\u003cstrong>Зачало (перикопа)\u003c/strong>","d":"Откъсът от Свещеното Писание, определен да се прочете на дадено богослужение или ден — например неделното евангелско зачало. Така са разделени Евангелието и Апостолът за четене в храма."},{"t":"\u003cstrong>Идол (кумир)\u003c/strong>","d":"Изваяно изображение или каквото и да е друго, на което човек се покланя вместо на Бога. Псалмите казват за идолите: „Имат уста, ала не говорят; имат очи, ала не виждат“ (Псалом 113:13)."},{"t":"\u003cstrong>Изкупление\u003c/strong>","d":"Освобождаването на човека от робството на греха и смъртта, за което Христос даде живота Си на Кръста като откуп."},{"t":"\u003cstrong>Канон (на Свещеното Писание)\u003c/strong>","d":"Списъкът на книгите, които Църквата признава за боговдъхновени. Думата означава „мярка“, „правило за измерване“."},{"t":"\u003cstrong>Канон на утренята\u003c/strong>","d":"Поредица от песнопения на утринното богослужение, изградена върху деветте библейски песни: на Моисей, на Анна, на Иона, на тримата отроци, на Богородица и останалите."},{"t":"\u003cstrong>Катизма\u003c/strong>","d":"Една от 20-те части, на които е разделен Псалтирът за четене в богослуженията. За една седмица се прочитат и 20-те."},{"t":"\u003cstrong>Книжник\u003c/strong>","d":"Учен, който преписвал, изучавал и тълкувал Моисеевия закон. В Евангелията книжниците често се появяват редом с фарисеите."},{"t":"\u003cstrong>Ковчег на Завета\u003c/strong>","d":"Дървеният ковчег, обкован със злато, в който се пазеха скрижалите на Закона. Той беше знак за Божието присъствие сред народа, а Църквата вижда в него предобраз на Богородица."},{"t":"\u003cstrong>Левит\u003c/strong>","d":"Мъж от Левиевото коляно, определено да служи в скинията, а после в храма. Свещениците бяха левитите от рода на Аарон."},{"t":"\u003cstrong>Манна\u003c/strong>","d":"Хлябът, който Бог даде от небето на народа през четиридесетте години в пустинята. Христос го сочи като предобраз на Самия Себе Си — Хляба на живота (Иоан 6)."},{"t":"\u003cstrong>Месия (Христос)\u003c/strong>","d":"„Помазаникът“: Царят и Избавителят, обещан от пророците. „Месия“ е еврейската дума, „Христос“ — гръцката; и двете казват едно и също за Иисус."},{"t":"\u003cstrong>Митар\u003c/strong>","d":"Събирач на данъци в служба на римската власт, презиран от народа като несправедлив и грешник. Христос призовава и митарите — като Матей и Закхей."},{"t":"\u003cstrong>Нафора\u003c/strong>","d":"Благословеният хляб, който свещеникът раздава в края на Божествената литургия, от просфората, от която е изваден Агнецът. Взимат я всички, и тези, които не са се причастили — „вместо Дара“ — като благословение за вкъщи."},{"t":"\u003cstrong>Неканонични книги\u003c/strong>","d":"11-те книги на Стария Завет, запазени в Септуагинта и в славянската Библия (Товит, Иудит, Премъдрост на Иисуса, син Сирахов, Макавейските и други), които Православната църква чете като полезни за душата, без да ги поставя на едно стъпало с каноничните. Няма ги в протестантските Библии."},{"t":"\u003cstrong>Осанна\u003c/strong>","d":"Еврейски възглас, който означава „спаси ни, молим Те“ и станал възглас на прослава. С него множеството посрещна Христос при влизането Му в Иерусалим, и го пеем на всяка Божествена литургия."},{"t":"\u003cstrong>Паримия\u003c/strong>","d":"Четиво от Стария Завет, определено за вечернята, най-вече в навечерието на големите празници и през Великия пост (например четиво из книгата на пророк Исаия). Показва как празникът е бил предвъзвестен."},{"t":"\u003cstrong>Пасха (Великден)\u003c/strong>","d":"„Преминаване“. В Стария Завет — празникът на излизането от египетското робство, с жертвата на агнето; в Новия — Възкресението на Христос, преминаването от смъртта към живота."},{"t":"\u003cstrong>Патриарх\u003c/strong>","d":"Праотец на избрания народ: Авраам, Исаак, Иаков и дванадесетте му синове. Днес същото име носи предстоятелят на една православна църква — като Българския патриарх."},{"t":"\u003cstrong>Петдесетница\u003c/strong>","d":"Празникът петдесет дни след Пасха. В Стария Завет беше празникът на жътвата; в Новия е денят на слизането на Светия Дух. На следващия ден празнуваме Духовден — деня на Светия Дух."},{"t":"\u003cstrong>Повечерие\u003c/strong>","d":"Богослужението след вечерята, молитвата преди сън. Великото повечерие се извършва през Великия пост и включва молитвата на цар Манасия."},{"t":"\u003cstrong>Покаяние\u003c/strong>","d":"Връщането на човека към Бога: скръб за греха и промяна на ума и на живота. Запечатва се в Тайнството Изповед."},{"t":"\u003cstrong>Послание\u003c/strong>","d":"Писмо, изпратено от апостол до
